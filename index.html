function calcularTiempoMuerto(){
  const selPl = document.getElementById('an_planta');
  if(!selPl) return;
  let planta = selPl.value;
  if(STATE.rol === 'tecnico') planta = STATE.plantaHoy || planta;
  const mes = document.getElementById('an_mes').value;
  const cont = document.getElementById('an_tiempo');
  let filas = todasLasFilas();
  if(planta) filas = filas.filter(f=>f.planta===planta);
  if(mes) filas = filas.filter(f=>f.mes===mes);

  if(filas.length === 0){ cont.innerHTML = '<div class="empty">Sin datos para este filtro.</div>'; return; }

  /* Lo que resultó ser ajeno a mantenimiento se cuenta aparte, no como tiempo muerto de la máquina */
  const ajenas = filas.filter(f => f.causaExterna);
  filas = filas.filter(f => !f.causaExterna);
  const minAjenas = ajenas.reduce((a,f)=>a+(f.minutosParo||0),0);
  const porCausa = {};
  ajenas.forEach(f => {
    const k = f.causaExterna;
    porCausa[k] ??= { minutos:0, veces:0 };
    porCausa[k].minutos += (f.minutosParo||0);
    porCausa[k].veces++;
  });
  const bloqueAjenas = ajenas.length === 0 ? '' : `
    <div style="background:#fff7e6;border:1px solid #f0c674;border-radius:9px;padding:12px;margin-bottom:14px;">
      <div style="font-size:13.5px;font-weight:800;color:#a16d07;">
        ⚠️ Fuera de mantenimiento: ${formatoDuracion(minAjenas)} en ${ajenas.length} atención(es)
      </div>
      <div style="font-size:11.5px;color:var(--muted);margin:4px 0 8px;">
        El técnico acudió, pero la causa no era de la máquina. Este tiempo NO se suma al tiempo muerto de mantenimiento.
      </div>
      ${Object.entries(porCausa).sort((a,b)=>b[1].minutos-a[1].minutos).map(([k,v])=>`
        <div style="display:flex;justify-content:space-between;font-size:12.5px;padding:3px 0;">
          <span>${escapeHtml(etiquetaCausa(k))}</span>
          <span><b>${formatoDuracion(v.minutos)}</b> <span style="color:var(--muted);">· ${v.veces} vez/veces</span></span>
        </div>`).join('')}
    </div>`;

  if(filas.length === 0){
    cont.innerHTML = bloqueAjenas + '<div class="empty">Todo el tiempo del periodo resultó ajeno a mantenimiento.</div>';
    return;
  }

  /* Agrupar: Planta > UBT > Máquina */
  const arbol = {};
  filas.forEach(f=>{
    const min = f.minutosParo||0;
    arbol[f.planta] ??= { minutos:0, paros:0, ubts:{} };
    arbol[f.planta].minutos += min; arbol[f.planta].paros++;
    arbol[f.planta].ubts[f.ubtNo] ??= { minutos:0, paros:0, maquinas:{} };
    arbol[f.planta].ubts[f.ubtNo].minutos += min; arbol[f.planta].ubts[f.ubtNo].paros++;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina] ??= { minutos:0, paros:0 };
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].minutos += min;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].paros++;
  });

  const totalMin = filas.reduce((a,f)=>a+(f.minutosParo||0),0);
  const plantasOrd = Object.entries(arbol).sort((a,b)=>b[1].minutos-a[1].minutos);
  const maxPlanta = plantasOrd[0][1].minutos || 1;

  const barra = (min, max, color) => `<div style="background:#e8eaed;border-radius:20px;height:8px;overflow:hidden;margin-top:3px;">
      <div style="background:${color};height:100%;width:${(min/max*100).toFixed(1)}%;"></div></div>`;

  cont.innerHTML = bloqueAjenas + `
    <div style="background:#f3f6f9;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13.5px;">
      Tiempo muerto <b>de mantenimiento</b>: <b>${formatoDuracion(totalMin)}</b> (${totalMin} min) en <b>${filas.length}</b> intervención(es)
    </div>
    ${plantasOrd.map(([pl, dPl])=>{
      const ubtsOrd = Object.entries(dPl.ubts).sort((a,b)=>b[1].minutos-a[1].minutos);
      const maxUbt = ubtsOrd[0][1].minutos || 1;
      return `<details style="margin-bottom:10px;">
        <summary style="cursor:pointer;padding:10px 12px;background:#2f3742;color:#fff;border-radius:8px;font-weight:700;font-size:13.5px;">
          🏭 ${escapeHtml(pl)} — ${formatoDuracion(dPl.minutos)} (${dPl.minutos} min) · ${dPl.paros} paro/s <span style="opacity:.6;font-weight:400;">▾</span>
        </summary>
        ${barra(dPl.minutos, maxPlanta, '#a13636')}
        <div style="padding:10px 0 0 12px;">
          ${ubtsOrd.map(([ub, dUb])=>{
            const maqOrd = Object.entries(dUb.maquinas).sort((a,b)=>b[1].minutos-a[1].minutos);
            const maxMaq = maqOrd[0][1].minutos || 1;
            return `<details style="margin-bottom:8px;">
              <summary style="cursor:pointer;padding:7px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:13px;">
                📍 UBT ${escapeHtml(ub)} — ${formatoDuracion(dUb.minutos)} (${dUb.minutos} min) · ${dUb.paros} paro/s <span style="opacity:.5;font-weight:400;">▾</span>
              </summary>
              ${barra(dUb.minutos, maxUbt, '#c77700')}
              <div style="padding:8px 0 0 12px;">
                ${maqOrd.map(([mq, dMq], i)=>`
                  <div style="margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;">
                      <span>⚙️ ${escapeHtml(mq)}</span>
                      <span style="font-weight:700;">${formatoDuracion(dMq.minutos)} <span style="font-weight:400;color:var(--muted);">(${dMq.minutos} min · ${dMq.paros} paro/s)</span></span>
                    </div>
                    ${barra(dMq.minutos, maxMaq, i===0?'#a13636':'#0f3d5c')}
                  </div>`).join('')}
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>`;
    }).join('')}`;
}

function calcularFallasFrecuentes(){
  const cont = document.getElementById('an_frecuentes');
  if(!cont) return;
  let filas = todasLasFilas();
  /* El técnico solo ve las fallas de su planta */
  if(STATE.rol === 'tecnico' && STATE.plantaHoy) filas = filas.filter(f=>f.planta===STATE.plantaHoy);
  filas = filas.filter(f => !f.causaExterna);   /* lo ajeno no es falla de la máquina */
  const porMaquina = {};
  filas.forEach(f=>{
    const clave = `${f.maquina} · UBT ${f.ubtNo}`;
    porMaquina[clave] ??= [];
    porMaquina[clave].push(f);
  });

  const recurrentes = [];
  Object.entries(porMaquina).forEach(([maq, fs])=>{
    const grupos = {};
    fs.forEach(f=>{
      const palabras = (f.sintomas||'').toLowerCase().split(/\s+/).filter(w=>w.length>4);
      palabras.forEach(w=>{ grupos[w] ??= new Set(); grupos[w].add(f.id); });
    });
    Object.entries(grupos).forEach(([palabra, ids])=>{
      if(ids.size >= 2) recurrentes.push({ maquina:maq, palabra, veces:ids.size });
    });
  });

  recurrentes.sort((a,b)=>b.veces-a.veces);
  const top = recurrentes.slice(0,15);
  cont.innerHTML = top.length === 0
    ? '<div class="empty">Aún no hay suficientes datos para detectar patrones.</div>'
    : `<p style="font-size:12.5px;color:var(--muted);">Palabras que se repiten en fallas de la misma máquina — posible causa raíz.</p>` +
      top.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f2;font-size:13px;">
          <span>${escapeHtml(r.maquina)} → "<b>${escapeHtml(r.palabra)}</b>"</span>
          <span style="font-weight:700;color:${r.veces>=4?'#a13636':'#c77700'};">${r.veces}×</span>
        </div>`).join('');
}

function descargarCSV(nombre, filas){
  const csv = filas.map(f => f.map(c => {
    const v = (c===null||c===undefined) ? '' : String(c);
    return /[",\n;]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  showToast('Archivo descargado ✓');
}

async function exportarCSV(tipo){
  if(tipo === 'registros'){
    const filas = [['Fecha','Planta','UBT','Maquina','Mes','Anio','Gafete','Tecnico','Hora Inicio','Hora Final','Minutos Paro','Sintomas','Acciones','Material','No. Parte','Causa fuera de mantto','Detalle causa','Firma Auditor','Firma APQP']];
    todasLasFilas().forEach(f=>filas.push([
      f.fecha||'', f.planta||'', f.ubtNo||'', f.maquina||'', f.mes||'', f.anio||'',
      f.gafete||'', f.tecnico||'', f.horaInicio||'', f.horaFinal||'', f.minutosParo||0,
      f.sintomas||'', f.acciones||'', f.material||'', f.numeroParte||'',
      f.causaExterna?etiquetaCausa(f.causaExterna):'', f.causaExternaNota||'',
      f.firmaAuditorNombre||'', f.firmaAPQPNombre||''
    ]));
    descargarCSV('correctivos-registros-'+todayISO()+'.csv', filas);
  }
  else if(tipo === 'tiempo'){
    const porMaquina = {};
    todasLasFilas().forEach(f=>{
      const clave = `${f.planta}|${f.ubtNo}|${f.maquina}`;
      porMaquina[clave] ??= { minutos:0, paros:0, ajenos:0, parosAjenos:0 };
      if(f.causaExterna){
        porMaquina[clave].ajenos += (f.minutosParo||0);
        porMaquina[clave].parosAjenos++;
      } else {
        porMaquina[clave].minutos += (f.minutosParo||0);
        porMaquina[clave].paros++;
      }
    });
    const filas = [['Planta','UBT','Maquina','Minutos Mantto','Horas Mantto','Paros Mantto','Promedio Minutos','Minutos fuera de Mantto','Atenciones fuera de Mantto']];
    Object.entries(porMaquina).sort((a,b)=>b[1].minutos-a[1].minutos).forEach(([k,v])=>{
      const [pl,ub,mq] = k.split('|');
      filas.push([pl,ub,mq,v.minutos,(v.minutos/60).toFixed(2),v.paros,
                  v.paros?(v.minutos/v.paros).toFixed(1):0, v.ajenos, v.parosAjenos]);
    });
    descargarCSV('tiempo-muerto-'+todayISO()+'.csv', filas);
  }
  else if(tipo === 'reportes'){
    const reps = await listReportes();
    const filas = [['Fecha','Tipo','Urgencia','Estado','Planta','UBT','Maquina','Tecnico','Descripcion','No. Parte','Respuesta','Atendido por']];
    reps.forEach(r=>filas.push([
      new Date(r.creado_en).toLocaleString('es-MX'), r.tipo, r.urgencia, r.estado,
      r.planta, r.ubt_no, r.maquina||'', r.tecnico, r.descripcion, r.numero_parte||'',
      r.respuesta||'', r.atendido_por||''
    ]));
    descargarCSV('reportes-supervisor-'+todayISO()+'.csv', filas);
  }
}

function agruparReportesPorUbt(reportes, esSupervisor){
  const porPlanta = {};
  reportes.forEach(r=>{
    porPlanta[r.planta] ??= {};
    (porPlanta[r.planta][r.ubt_no] ??= []).push(r);
  });
  return Object.keys(porPlanta).sort().map(pl=>{
    const ubts = porPlanta[pl];
    const totalPl = Object.values(ubts).reduce((a,v)=>a+v.length,0);
    return `<details open style="margin-bottom:10px;">
      <summary style="cursor:pointer;padding:9px 12px;background:#2f3742;color:#fff;border-radius:8px;font-weight:700;font-size:13px;">🏭 ${escapeHtml(pl)} (${totalPl})</summary>
      <div style="padding:10px 0 0 12px;">
        ${Object.keys(ubts).sort().map(ub=>{
          const abiertos = ubts[ub].filter(r=>r.estado!=='cerrado').length;
          return `<details open style="margin-bottom:8px;">
            <summary style="cursor:pointer;padding:7px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:12.5px;">

            <div style="padding-top:8px;">${ubts[ub].map(r=>tarjetaReporte(r,esSupervisor)).join('')}</div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

}

async function enviarReporte(){
  const desc = document.getElementById('rp_desc').value.trim();
  if(!desc){ showToast('⚠️ Describe la situación'); return; }
  const r = {
    id: uid(),
    tipo: document.getElementById('rp_tipo').value,
    planta: STATE.plantaHoy,
    ubt_no: document.getElementById('rp_ubt').value,
    maquina: document.getElementById('rp_maquina').value,
    tecnico: STATE.nombre,
    gafete: STATE.usuario?.gafete || '',
    descripcion: desc,
    numero_parte: document.getElementById('rp_parte').value.trim(),
    foto: fotoTemp || '',
    urgencia: document.getElementById('rp_urgencia').value,
    estado: 'abierto',
    creado_en: ahoraISO(),
    actualizado_en: ahoraISO()
  };
  try{ await saveReporte(r); }
  catch(err){ showToast('⚠️ No se pudo enviar: '+(err.message||err)); return; }

  if(r.numero_parte) registrarRefaccion(r.numero_parte, '');

  /* Notificar a todos los supervisores */
  const usuarios = await listUsuarios();
  const supervisores = usuarios.filter(u=>u.rol==='supervisor' && !u.bloqueado).map(u=>slug(u.nombre));
  const etiquetaUrg = r.urgencia==='critica' ? '🔴 CRÍTICO — ' : (r.urgencia==='alta' ? '🟠 ' : '');
  enviarNotificacion(
    supervisores,
    `${etiquetaUrg}${ICONO_TIPO[r.tipo]} Reporte de ${STATE.nombre}`,
    `${STATE.nombre} reportó ${r.tipo==='refaccion'?'una refacción crítica':'una falla'} en UBT ${r.ubt_no} (${r.maquina}) de ${r.planta}: ${desc.slice(0,90)}`
  );

  fotoTemp = null;
  document.getElementById('rp_desc').value = '';
  document.getElementById('rp_parte').value = '';
  const pf = document.getElementById('prev_foto_rp'); if(pf) pf.innerHTML='';
  const ff = document.getElementById('rp_foto'); if(ff) ff.value='';
  showToast('📤 Reporte enviado al Supervisor ✓');
  cargarMisReportes();
}

async function cerrarReporte(id){
  const resp = document.getElementById('resp_'+id).value.trim();
  const todos = await listReportes();
  const r = todos.find(x=>x.id===id);
  if(!r) return;
  r.estado = 'cerrado';
  r.respuesta = resp || 'Atendido.';
  r.atendido_por = STATE.nombre;
  r.actualizado_en = ahoraISO();
  await saveReporte(r);
  enviarNotificacion([slug(r.tecnico)], '✓ Tu reporte fue atendido', `${STATE.nombre} respondió a tu reporte de UBT ${r.ubt_no}: ${(resp||'Atendido.').slice(0,90)}`);
  showToast('Reporte cerrado ✓');
  render();
}

async function listReportes(filtro){

    return await sbFetch(q) || [];

    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify(r)
  });
}

/* ---------- Utilidades de tiempo ---------- */
function minutosEntre(hi, hf){
  if(!hi || !hf) return 0;
  const [h1,m1] = hi.split(':').map(Number);
  const [h2,m2] = hf.split(':').map(Number);
  let min = (h2*60+m2) - (h1*60+m1);
  if(min < 0) min += 24*60; /* cruzó medianoche */
  return min;
}
function formatoDuracion(min){
  if(min === 0) return 'menos de 1 min';
  if(min === null || min === undefined || isNaN(min)) return '—';
  const h = Math.floor(min/60), m = min%60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

/* ---------- Compresión de fotos ---------- */
function comprimirImagen(file, maxLado=1000, calidad=0.7){
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        if(w > h && w > maxLado){ h = h*maxLado/w; w = maxLado; }
        else if(h > maxLado){ w = w*maxLado/h; h = maxLado; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(file);
  });
}

const VAPID_PUBLIC_KEY = 'BHO00CHONm3Uf0MIaOVAI9SxsAyMd_0hctC7TqKTl5Vpn4Jh1IHBZbHX4PM1fAV2uPr9ZdsmsIW_MaeDBkxmsSg';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

function pushDisponible(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function activarNotificaciones(silencioso){
  if(!pushDisponible()){
    if(!silencioso) showToast('⚠️ Este dispositivo no soporta notificaciones push');
    return false;
  }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){
      if(!silencioso) showToast('⚠️ No diste permiso para notificaciones');
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sbFetch('suscripciones?on_conflict=endpoint', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify({
        usuario_slug: slug(STATE.nombre),
        rol: STATE.rol,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth
      })
    });
    if(!silencioso) showToast('🔔 Notificaciones activadas ✓');
    return true;
  }catch(err){
    console.warn('Error activando notificaciones:', err);
    if(!silencioso) showToast('⚠️ No se pudo activar: ' + (err.message||err));
    return false;
  }
}

async function enviarNotificacion(destinatarios, titulo, cuerpo){
  if(!destinatarios || destinatarios.length===0) return;
  try{
    await fetch(SUPABASE_URL + '/functions/v1/enviar-notificacion', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ destinatarios, titulo, cuerpo, ignorarJornada: !!STATE.modoPruebas })
    });
  }catch(err){ console.warn('No se pudo enviar la notificación:', err); }
}

  try{
    localStorage.setItem(CLAVE_BORRADOR, JSON.stringify({ hoja: sheetActivaKey, datos, ts: Date.now() }));
  }catch(e){ /* si no hay espacio (fotos grandes), simplemente no se guarda */ }

function leerBorradorLocal(){
  try{
    const g = JSON.parse(localStorage.getItem(CLAVE_BORRADOR) || 'null');
    if(!g) return null;
    if(g.hoja !== sheetActivaKey) return null;
    if(Date.now() - g.ts > 12*60*60*1000){ borrarBorradorLocal(); return null; }  /* más de 12 h: se descarta */
    return g.datos;
  }catch(e){ return null; }
}

function ocultarSplash(){
  const sp = document.getElementById('splash');
  if(!sp || sp.classList.contains('oculto')) return;
  sp.classList.add('oculto');
  setTimeout(()=>{ if(sp && sp.parentNode) sp.parentNode.removeChild(sp); }, 600);
}

function iniciarSplash(){
  const sp = document.getElementById('splash');
  if(!sp) return;
  /* Solo en el arranque de verdad: al navegar dentro de la app no se repite */
  let yaVisto = false;
  try{ yaVisto = sessionStorage.getItem('splash_visto') === '1'; }catch(e){}
  if(yaVisto){ sp.parentNode.removeChild(sp); return; }
  try{ sessionStorage.setItem('splash_visto','1'); }catch(e){}

  const cont = document.getElementById('sp_logo');
  if(cont) cont.innerHTML = logoSim();
  sp.addEventListener('click', ocultarSplash);      /* tocar para saltarla */
  setTimeout(ocultarSplash, 3200);
  /* Candado: pase lo que pase, la pantalla nunca deja la app bloqueada */
  setTimeout(ocultarSplash, 5000);
  window.addEventListener('load', ()=>setTimeout(ocultarSplash, 2600));
}

/* ---------- Init ---------- */
(function init(){
  iniciarSplash();
  pintarConexion();
  const p = getParams();
  if(p.ver === 'ubt' && p.planta && p.ubt){
    STATE.modoVerUbt = { planta: p.planta, ubt: p.ubt };
  } else if(p.rol && ROLES[p.rol]){
    if(p.nombre){
      STATE.rol = p.rol; STATE.nombre = p.nombre;
    } else {
      STATE.rolPrefijado = p.rol;
    }
  }
  pintarVersion();
  render();
  setTimeout(()=>revisarVersionNueva(false), 4000);
})();
</script>
