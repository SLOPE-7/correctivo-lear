<style>
  :root{
    --ink:#1a1a1a; --line:#2b2b2b; --paper:#ffffff; --shell:#f0f2f4;
    --accent:#8a1f1f; --accent2:#0f3d5c; --muted:#6b7280; --green:#1a7a3c; --amber:#a16d07;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--shell);color:var(--ink);}
  body.login-bg{background:linear-gradient(160deg,#1f2933 0%,#2b2b2b 45%,#4a1f1f 100%);background-attachment:fixed;min-height:100vh;}
  body.login-bg .card{background:#ffffffef;backdrop-filter:blur(6px);}
  .login-hero{text-align:center;padding:26px 10px 6px;color:#fff;}
  .login-hero .logo{font-size:44px;}
  .login-hero h1{margin:8px 0 2px;font-size:20px;font-weight:800;letter-spacing:.5px;}
  .login-hero p{margin:0;font-size:12.5px;opacity:.7;}
  .topbar{background:linear-gradient(135deg,#2b2b2b,#3a3f45);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0003;}
  .tb-left{display:flex;align-items:center;gap:10px;}
  .tb-logo{font-size:22px;background:var(--accent);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .tb-title{font-size:14px;font-weight:800;letter-spacing:.3px;}
  .tb-sub{font-size:11px;opacity:.75;margin-top:1px;}
  .tb-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .tb-btn{background:#ffffff18;border:1px solid #ffffff22;color:#fff;padding:7px 11px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;transition:.15s;}
  .tb-btn:hover{background:#ffffff30;transform:translateY(-1px);}
  .tb-btn span{font-size:9.5px;opacity:.85;}
  .tb-btn.on{background:#1a7a3c44;border-color:#1a7a3c88;}
  .tb-btn.salir{background:#a1363644;border-color:#a1363688;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px #00000012,0 4px 12px #00000008;border:1px solid #e8eaed;}
  h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{padding:11px;border:1px solid #d4d8dc;border-radius:8px;font-size:14px;font-family:inherit;transition:.15s;background:#fbfcfd;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px #0f3d5c1a;}
  .field textarea{min-height:60px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:13px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.15s;box-shadow:0 2px 6px #8a1f1f33;}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn.secondary{background:var(--accent2);box-shadow:0 2px 6px #0f3d5c33;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.ghost{background:#eef0f2;color:#333;box-shadow:none;}
  .btn.ghost:hover{background:#e2e5e8;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px #00000014;transition:.18s;}
  .role-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px #00000022;}
  .role-card .emoji{font-size:28px;}
  .role-card .name{font-weight:700;margin-top:6px;font-size:14px;}
  .role-card.rc-tecnico{background:#f2c94c;color:#1a1a1a;}
  .role-card.rc-auditor{background:#ffffff;color:#1a1a1a;border-color:#ccc;}
  .role-card.rc-apqp{background:#a13636;color:#fff;}
  .role-card.rc-supervisor{background:#8a8f98;color:#fff;}
  .role-card.rc-admin{background:#1a1a1a;color:#fff;}
  .planta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-width:480px;}
  .planta-card{background:#fff;border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;border:2px solid #e2e5e8;box-shadow:0 2px 6px #00000010;font-weight:700;font-size:12.5px;transition:.15s;}
  .planta-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 5px 14px #00000018;}
  .ubt-cols{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .ubt-col{display:flex;flex-direction:column;gap:8px;min-width:110px;}
  .ubt-col-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
  .ubt-btn{border:none;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 2px 5px #00000018;}
  .ubt-btn:hover{filter:brightness(1.15);transform:translateX(3px);}
  .ubt-btn.p1{background:#1a7a3c;color:#fff;}
  .ubt-btn.p2{background:#1a1a1a;color:#fff;}
  .ubt-btn.p3{background:#0f3d5c;color:#fff;}
  .ubt-btn.p4{background:#e0b400;color:#1a1a1a;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filters select, .filters input{padding:7px 9px;border:1px solid #ccd1d6;border-radius:6px;font-size:13px;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 4px 16px #0004;max-width:90%;text-align:center;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
  .qr-box{text-align:center;border:1px solid #e2e5e8;border-radius:8px;padding:12px;}
  .qr-box .label{font-size:12px;font-weight:700;margin-top:6px;}
  .ubt-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:12px;}
  .ubt-check-grid label{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#f5f6f7;padding:6px 8px;border-radius:5px;}
  .notif{background:#fff7e6;border:1px solid #f0c674;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .notif b{color:var(--amber);}
  table.admin-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  table.admin-tbl th, table.admin-tbl td{border:1px solid #e2e5e8;padding:6px 8px;text-align:left;}
  table.admin-tbl th{background:#f5f6f7;}
  .badge-est{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .badge-est.act{background:#e3f6e8;color:#1a7a3c;}
  .badge-est.bloq{background:#fde8e8;color:#a13636;}
  .cola-bar{position:sticky;top:64px;z-index:9;background:#0f3d5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;box-shadow:0 2px 8px #0003;}
  .cola-bar .btn{width:auto;}
  .pass-inline{display:flex;gap:6px;margin-top:6px;}
  .pass-inline input{padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12px;flex:1;}
  .pass-inline button{padding:6px 10px;border:none;border-radius:5px;background:var(--accent2);color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
  .edit-panel{background:#fef8ec;border:1px solid #f0c674;border-radius:8px;padding:12px;margin-top:8px;}
  .planta-block{border:1px solid #e2e5e8;border-radius:8px;padding:12px;margin-bottom:12px;}
  .planta-block h3{margin:0 0 8px;font-size:13.5px;}
  .ubt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .ubt-row input{flex:1;padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12.5px;}
  .ubt-row button{padding:5px 9px;border:none;border-radius:5px;background:#e2e5e8;cursor:pointer;font-size:12px;}

  .sheet-print-wrap{margin-bottom:16px;}
  .sheet-page{border:1px solid #333;padding:14px;background:#fff;font-size:11px;overflow-x:auto;}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:8px;}
  .sheet-brand{font-size:16px;font-weight:800;color:var(--accent);}
  .sheet-brand small{display:block;font-size:8px;color:var(--muted);font-weight:600;}
  .sheet-title{font-size:12px;font-weight:800;}
  .sheet-monthyear{font-size:13px;font-weight:800;text-align:right;}
  .chk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 12px;font-size:9.5px;margin-bottom:8px;}
  .chk-grid span{display:flex;justify-content:space-between;padding:1px 0;}
  .chk-grid .on::after{content:'☑'; margin-left:4px;}
  .chk-grid .off::after{content:'☐'; margin-left:4px;}
  .sheet-meta{font-size:10.5px;margin-bottom:8px;display:flex;gap:16px;flex-wrap:wrap;}
  .sheet-meta b{font-weight:700;}
  table.sheet-table{width:100%;border-collapse:collapse;min-width:950px;}
  table.sheet-table th, table.sheet-table td{border:1px solid #333;padding:4px;font-size:9px;text-align:center;vertical-align:middle;}
  table.sheet-table th{background:#f2f2f2;font-weight:700;}
  table.sheet-table td.left{text-align:left;}
  .firma-ok{color:var(--green);font-weight:700;}
  .firma-btn, .edit-btn{background:var(--accent2);color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:9px;cursor:pointer;font-weight:700;}
  .edit-btn{background:#555;margin-top:2px;}
  .no-print{}
  @media print{
    .no-print{display:none !important;}
    body.printing-single .wrap > *:not(.print-target){display:none !important;}
  }
</style>

<body>
<div id="app"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- Configuración fija ---------- */
const MAQ_COR = ["Prueba Eléctrica","Pre-Eléctrica","Dimensiones","Sistema de Navegación","Encintadoras","Rotary","Impresoras","Tableros de Clip","Canaleta","Torques","Mesa de Amarre","Expansor de Grommet"];
const checklistGroups = [
  ["Prueba Eléctrica","Pre-Eléctrica","Sistema de Navegación"],
  ["Encintadoras","Rotary","Impresoras"],
  ["Dimensiones","Tableros de Clip","Canaleta"],
  ["Torques","Mesa de Amarre","Expansor de Grommet"],
  ["Otros"]
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MAX_FILAS_POR_HOJA = 7;

const PLANTA_NOMBRES = ["Planta 1","Planta 2","Planta 3","Partes de Servicio"];
const DEFAULT_PLANTAS = {
  "Planta 1": ["501-1","501-2","502-1","502-2","503-1","503-2","504-1","505-1","506-1","507-1","508-1"],
  "Planta 2": ["601-1","601-2","602-1","602-2","602-3","603-1","603-2","604-1","604-2","604-3","605-1","605-1.0","605-1.1","605-1.2","606-1","606-1B","606-2","606-3","606-4","607-1","607-2","607-3","608-1","608-2","608-3","609-1","609-2","609-4","609-5","611-1","611-2","611-3","612-1","612-2","612-3"],
  "Planta 3": ["701-1","701-2","702-1","702-2","702-3","703-1"],
  "Partes de Servicio": ["520"]
};

const ROLES = {
  tecnico:   {label:"Técnico de Mantenimiento", emoji:"🔧"},
  auditor:   {label:"Auditor de Calidad", emoji:"🧾"},
  apqp:      {label:"APQP", emoji:"✅"},
  supervisor:{label:"Supervisor de Mantenimiento", emoji:"👁️"},
  admin:     {label:"Administrador", emoji:"⚙️"},
};
const DEFAULT_CODES = { tecnico:"Mantto", auditor:"Calidad", apqp:"APQP", supervisor:"SupMantto", admin:"8102vgreal" };

function slug(s){ return (s||'').toString().toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLabel(){ return new Date().toLocaleString('es-MX'); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function sheetKey(planta,ubt,maquina,mes,anio,pagina){ return `sheet:${slug(planta)}--${slug(ubt)}--${slug(maquina)}--${slug(mes)}--${slug(anio)}--p${pagina}`; }

/* ---------- Conexión a Supabase ---------- */
const SUPABASE_URL = 'https://pddugjlydcggotamstav.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n0METrGffoJXnnbBPBJ1AA_pjIz69I9';

async function sbFetch(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const txt = await res.text();
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function getConfig(){
  try{
    const r = await sbFetch('config?clave=eq.accesscodes&select=valor');
    return (r && r[0]) ? r[0].valor : { ...DEFAULT_CODES };
  }catch(e){ console.warn(e); return { ...DEFAULT_CODES }; }
}
async function saveConfig(cfg){
  await sbFetch('config?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'accesscodes', valor: cfg, actualizado_en: new Date().toISOString() })
  });
}
async function getPlantasConfig(){
  try{
    const r = await sbFetch('config?clave=eq.plantas&select=valor');
    return (r && r[0]) ? r[0].valor : JSON.parse(JSON.stringify(DEFAULT_PLANTAS));
  }catch(e){ console.warn(e); return JSON.parse(JSON.stringify(DEFAULT_PLANTAS)); }
}
async function savePlantasConfig(cfg){
  await sbFetch('config?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'plantas', valor: cfg, actualizado_en: new Date().toISOString() })
  });
}
function ubtsDeLaPlanta(plantasCfg, planta){
  if(planta==='Partes de Servicio'){
    const union = [...(plantasCfg["Planta 1"]||[]), ...(plantasCfg["Planta 2"]||[]), ...(plantasCfg["Planta 3"]||[]), ...(plantasCfg["Partes de Servicio"]||[])];
    return [...new Set(union)];
  }
  return plantasCfg[planta] || [];
}
function origenDeUbt(plantasCfg, ubt){
  if((plantasCfg["Planta 1"]||[]).includes(ubt)) return "Planta 1";
  if((plantasCfg["Planta 2"]||[]).includes(ubt)) return "Planta 2";
  if((plantasCfg["Planta 3"]||[]).includes(ubt)) return "Planta 3";
  return "Partes de Servicio";
}
function renderUbtColumnas(ubts){
  if(STATE.plantaHoy !== 'Partes de Servicio'){
    const clase = claseOrigen(STATE.plantaHoy);
    return `<div class="ubt-cols"><div class="ubt-col">
      ${ubts.map(u=>`<button class="ubt-btn ${clase}" onclick="elegirUbt('${u.replace(/'/g,"\\'")}')">${u}</button>`).join('')}
    </div></div>`;
  }
  const grupos = { 'Planta 1':[], 'Planta 2':[], 'Planta 3':[], 'Partes de Servicio':[] };
  ubts.forEach(u => grupos[origenDeUbt(STATE.plantasCfg,u)].push(u));
  return `<div class="ubt-cols">
    ${Object.entries(grupos).filter(([,arr])=>arr.length).map(([nombre,arr])=>`
      <div class="ubt-col">
        <div class="ubt-col-title">${nombre}</div>
        ${arr.map(u=>`<button class="ubt-btn ${claseOrigen(nombre)}" onclick="elegirUbt('${u.replace(/'/g,"\\'")}')">${u}</button>`).join('')}
      </div>`).join('')}
  </div>`;
}
function claseOrigen(nombre){
  return nombre==='Planta 1'?'p1':nombre==='Planta 2'?'p2':nombre==='Planta 3'?'p3':'p4';
}
function todasLasUbts(plantasCfg){
  const union = [];
  PLANTA_NOMBRES.forEach(p => union.push(...(plantasCfg[p]||[])));
  return [...new Set(union)];
}


/* Lee el campo ubts_por_planta soportando el formato viejo (plano) y el nuevo (con __ubts) */
function desempacarExtra(extra){
  const e = extra || {};
  if(Object.prototype.hasOwnProperty.call(e, '__ubts')){
    return { ubtsPorPlanta: e.__ubts || {}, bloqueado: !!e.__bloqueado };
  }
  const limpio = { ...e };
  delete limpio.__bloqueado;
  return { ubtsPorPlanta: limpio, bloqueado: !!e.__bloqueado };
}

async function getUsuario(nombre){
  try{
    const r = await sbFetch('usuarios?nombre_slug=eq.'+encodeURIComponent(slug(nombre))+'&select=*');
    if(!r || !r[0]) return null;
    const u = r[0];
    return { nombre: u.nombre, rol: u.rol, gafete: u.gafete, ...desempacarExtra(u.ubts_por_planta) };
  }catch(e){ console.warn(e); return null; }
}
async function saveUsuario(u){
  await sbFetch('usuarios?on_conflict=nombre_slug', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({
      nombre_slug: slug(u.nombre), nombre: u.nombre, rol: u.rol,
      gafete: u.gafete, ubts_por_planta: { __ubts: u.ubtsPorPlanta || {}, __bloqueado: !!u.bloqueado }
    })
  });
}
async function deleteUsuario(nombre){
  await sbFetch('usuarios?nombre_slug=eq.'+encodeURIComponent(slug(nombre)), { method:'DELETE', prefer:'return=minimal' });
}
async function listUsuarios(){
  try{
    const r = await sbFetch('usuarios?select=*&order=nombre.asc');
    return (r||[]).map(u=>({ nombre:u.nombre, rol:u.rol, gafete:u.gafete, ...desempacarExtra(u.ubts_por_planta) }));
  }catch(e){ console.warn(e); return []; }
}
async function getSheet(key){
  try{
    const r = await sbFetch('hojas?clave=eq.'+encodeURIComponent(key)+'&select=*');
    if(!r || !r[0]) return null;
    const h = r[0];
    return { key:h.clave, planta:h.planta, ubtNo:h.ubt_no, maquina:h.maquina, mes:h.mes, anio:h.anio, pagina:h.pagina, filas:h.filas||[] };
  }catch(e){ console.warn(e); return null; }
}
async function saveSheet(key, sheet){
  await sbFetch('hojas?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({
      clave: key, planta: sheet.planta, ubt_no: sheet.ubtNo, maquina: sheet.maquina,
      mes: sheet.mes, anio: sheet.anio, pagina: sheet.pagina||1,
      filas: sheet.filas||[], actualizado_en: new Date().toISOString()
    })
  });
}
async function listSheets(){
  try{
    const r = await sbFetch('hojas?select=*');
    return (r||[]).map(h=>({ key:h.clave, planta:h.planta, ubtNo:h.ubt_no, maquina:h.maquina, mes:h.mes, anio:h.anio, pagina:h.pagina, filas:h.filas||[] }));
  }catch(e){ console.warn(e); return []; }
}

/* ---------- Estado global ---------- */
let STATE = { rol:'', nombre:'', usuario:null, codes:null, plantasCfg:null, editandoUbts:false, plantaHoy:null, ubtElegida:null };

function showToast(msg){
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t); setTimeout(()=>t.remove(), 2200);
}
function getParams(){
  const p = new URLSearchParams(window.location.search);
  return { rol: p.get('rol') || '', nombre: p.get('nombre') || '' };
}

/* ---------- Render raíz ---------- */
async function render(){
  const app = document.getElementById('app');
  if(!STATE.codes) STATE.codes = await getConfig();
  if(!STATE.plantasCfg) STATE.plantasCfg = await getPlantasConfig();
  if(!STATE.rol){ document.body.classList.add('login-bg'); app.innerHTML = renderRolePicker(); return; }
  document.body.classList.remove('login-bg');

  if(STATE.rol==='admin'){
    if(!STATE.adminOk){ app.innerHTML = renderTopbar() + renderAdminLogin(); return; }
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderAdmin()}</div>`;
    setTimeout(()=>{ renderQRCodes(); cargarInfoHistorial(); }, 50);
    return;
  }

  if(STATE.nombre && !STATE.usuario){
    STATE.usuario = await getUsuario(STATE.nombre);
    if(STATE.usuario && STATE.usuario.bloqueado){
      app.innerHTML = `<div class="wrap"><div class="card" style="text-align:center;">
        <h2 style="justify-content:center;">🚫 Acceso bloqueado</h2>
        <p style="font-size:14px;color:var(--muted);">Tu usuario fue bloqueado por el administrador.<br>Contacta a tu supervisor si crees que es un error.</p>
        <button class="btn ghost" onclick="cambiarRol()">Volver al inicio</button>
      </div></div>`;
      return;
    }
    if(STATE.usuario && pushDisponible() && Notification.permission === 'granted'){
      activarNotificaciones(true);
    }
  }
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';
  if(STATE.nombre && !STATE.usuario){
    app.innerHTML = renderTopbar() + renderGafeteSetup();
    return;
  }

  if(STATE.viendoTodo){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderVerCorrectivos()}</div>`;
    setTimeout(filtrarVerTodo, 50);
    return;
  }

  const rolesConPlanta = ['tecnico','auditor','apqp'];
  if(rolesConPlanta.includes(STATE.rol) && !STATE.plantaHoy){
    app.innerHTML = renderTopbar() + renderPlantaPicker();
    return;
  }

  if(esAuditorTipo && STATE.plantaHoy){
    const asignadas = (STATE.usuario.ubtsPorPlanta && STATE.usuario.ubtsPorPlanta[STATE.plantaHoy]) || [];
    if(asignadas.length===0 || STATE.editandoUbts){
      app.innerHTML = renderTopbar() + renderUbtsPlantaSetup();
      return;
    }
  }

  let body = '';
  try{
    if(STATE.rol==='tecnico') body = await renderTecnico();
    else if(STATE.rol==='auditor') body = await renderAuditor();
    else if(STATE.rol==='apqp') body = await renderApqp();
    else if(STATE.rol==='supervisor') body = await renderSupervisor();
  }catch(err){
    body = `<div class="card"><h2>⚠️ Error</h2><p style="font-size:13px;color:var(--muted);">${escapeHtml(err.message||String(err))}</p></div>`;
  }
  app.innerHTML = renderTopbar() + renderBarraCola() + `<div class="wrap">${body}</div>`;
  if(STATE.rol==='supervisor') setTimeout(filtrarSupervisor, 50);
}

/* ---------- Cola de impresión por UBT ---------- */
let colaImpresion = [];

function enCola(key){ return colaImpresion.some(s=>s.key===key); }

async function toggleCola(key){
  if(enCola(key)){
    colaImpresion = colaImpresion.filter(s=>s.key!==key);
    showToast('Quitado de la cola');
  } else {
    const sheet = await getSheet(key);
    if(sheet){ sheet.key = key; colaImpresion.push(sheet); showToast('➕ Agregado a la cola ('+colaImpresion.length+')'); }
  }
  render();
}

async function agregarUbtACola(planta, ubt){
  const todas = await listSheets();
  const delUbt = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
  let nuevos = 0;
  delUbt.forEach(s=>{ if(!enCola(s.key)){ colaImpresion.push(s); nuevos++; } });
  showToast(nuevos>0 ? `➕ ${nuevos} hoja(s) de UBT ${ubt} agregadas` : 'Ya estaban todas en la cola');
  render();
}

function limpiarCola(){ colaImpresion = []; showToast('Cola vaciada'); render(); }

function imprimirCola(){
  if(colaImpresion.length===0){ showToast('⚠️ La cola está vacía'); return; }

  /* Nombre según el contenido de la cola */
  const ubts = [...new Set(colaImpresion.map(s=>s.ubtNo))];
  const maqs = [...new Set(colaImpresion.map(s=>s.maquina))];
  const p = colaImpresion[0];
  let titulo;
  if(ubts.length === 1 && maqs.length === 1){
    titulo = `Correctivo-${maqs[0]}-${ubts[0]}-${p.mes}-${p.anio}`;
  } else if(ubts.length === 1){
    titulo = `Correctivo-${ubts[0]}-${p.mes}-${p.anio}`;
  } else {
    titulo = `Correctivo-Varios UBT-${p.mes}-${p.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const hojas = colaImpresion.map(s=>renderSheetVisual(s,{role:'lectura'})).join('<div style="page-break-after:always;"></div>');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana emergente'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>${estilos}
    <style>body{background:#fff;margin:0;padding:10px;} .no-print{display:none !important;}
    @page{size:letter landscape;margin:8mm;}
    table.sheet-table{min-width:0 !important;width:100% !important;}
    .sheet-page{border:none;page-break-inside:avoid;}</style></head><body>${hojas}</body></html>`);
  ventana.document.close(); ventana.focus();
  setTimeout(()=>ventana.print(), 500);
}

function renderBarraCola(){
  if(colaImpresion.length===0) return '';
  return `<div class="cola-bar no-print">
    <span>🖨️ <b>${colaImpresion.length}</b> hoja(s) en cola</span>
    <div>
      <button class="btn small secondary" onclick="imprimirCola()">Imprimir cola</button>
      <button class="btn small ghost" onclick="limpiarCola()">Vaciar</button>
    </div>
  </div>`;
}

async function entrarGuardado(){
  const g = JSON.parse(localStorage.getItem('correctivo_usuario_guardado') || 'null');

  STATE.usuario = await getUsuario(g.nombre);

    STATE.usuario = { nombre:g.nombre, rol:g.rol, gafete:g.gafete||'—', ubtsPorPlanta:{}, bloqueado:false };

function elegirRol(rol){
  if(rol==='admin'){ STATE.rol = rol; STATE.nombre=''; STATE.adminOk=false; render(); return; }
  rolSeleccionadoTemp = rol;
  document.getElementById('nombre_form_title').textContent = ROLES[rol].emoji + ' Acceso — ' + ROLES[rol].label;
  document.getElementById('gafete_wrap').style.display = (rol==='supervisor') ? 'none' : 'flex';

async function confirmarAcceso(){
  const nombre = document.getElementById('nombre_input').value.trim();
  const gafete = document.getElementById('gafete_login').value.trim();
  const codigo = document.getElementById('codigo_input').value;
  const recordar = document.getElementById('recordar_chk').checked;
  const esSupervisor = rolSeleccionadoTemp === 'supervisor';

  if(!nombre){ document.getElementById('nombre_input').style.borderColor='red'; return; }
  if(!esSupervisor && !gafete){ document.getElementById('gafete_login').style.borderColor='red'; showToast('⚠️ Escribe tu No. de Gafete'); return; }
  if(codigo !== STATE.codes[rolSeleccionadoTemp]){ document.getElementById('codigo_error').style.display='block'; return; }

  STATE.rol = rolSeleccionadoTemp; STATE.nombre = nombre;

  const existente = await getUsuario(nombre);
  if(existente && existente.bloqueado){ STATE.usuario = existente; render(); return; }

  if(existente){
    /* Ya estaba registrado: conservamos sus UBTs y solo actualizamos lo básico */
    STATE.usuario = {
      ...existente,
      rol: STATE.rol,
      gafete: esSupervisor ? '—' : (gafete || existente.gafete)
    };
  } else {
    STATE.usuario = { nombre, gafete: esSupervisor ? '—' : gafete, rol: STATE.rol, ubtsPorPlanta: {}, bloqueado:false };
  }
  try{ await saveUsuario(STATE.usuario); }catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  if(recordar){
    localStorage.setItem('correctivo_usuario_guardado', JSON.stringify({nombre, rol:STATE.rol, gafete: STATE.usuario.gafete}));
  }
  await activarNotificaciones(true);
  render();
}

async function abrirPaginaAutomatica(planta,ubt,maquina,mes,anio){
  let pagina = 1;
  while(true){
    const key = sheetKey(planta,ubt,maquina,mes,anio,pagina);
    let sheet = await getSheet(key);
    if(!sheet){ sheet = { planta, ubtNo:ubt, maquina, mes, anio, pagina, filas: [] }; await saveSheet(key, sheet); }
    if((sheet.filas||[]).length < MAX_FILAS_POR_HOJA){
      sheetActivaKey = key;
      sheetActivaParams = {planta,ubt,maquina,mes,anio,pagina};
      return;
    }
    pagina++;
  }
}

  const maquina = document.getElementById('s_maquina').value;
  const mes = document.getElementById('s_mes').value;
  const anio = document.getElementById('s_anio').value.trim();
  await abrirPaginaAutomatica(STATE.plantaHoy, STATE.ubtElegida, maquina, mes, anio);
  render();
}
async function siguientePagina(){
  const p = sheetActivaParams;
  await abrirPaginaAutomatica(p.planta,p.ubt,p.maquina,p.mes,p.anio);
  render();
}

async function agregarFila(){
  const sintomas = document.getElementById('f_sintomas').value.trim();
  if(!sintomas){ showToast('⚠️ Escribe los Síntomas/Fallas'); return; }
  const sheet = await getSheet(sheetActivaKey);
  if((sheet.filas||[]).length >= MAX_FILAS_POR_HOJA){ showToast('⚠️ Esta hoja ya está llena'); render(); return; }
  const solicitarApqp = document.getElementById('f_solicitar_apqp').checked;
  const fila = {
    id: uid(),
    fecha: document.getElementById('f_fecha').value,
    horaInicio: document.getElementById('f_hi').value,
    horaFinal: document.getElementById('f_hf').value,
    gafete: document.getElementById('f_gafete').value.trim(),
    sintomas, acciones: document.getElementById('f_acciones').value.trim(),
    material: document.getElementById('f_material').value.trim(),
    seMovioModulo: document.getElementById('f_movio').checked,
    seVerificoModulo: document.getElementById('f_verifico').checked,
    tecnico: STATE.nombre,
    firmaAuditorNombre:'', firmaAuditorFecha:'',
    firmaAPQPNombre:'', firmaAPQPFecha:'',
    estadoAuditor: 'pendiente',
    estadoAPQP: solicitarApqp ? 'pendiente' : 'no_aplica',
    creadoEn: new Date().toISOString()
  };
  sheet.filas.push(fila);
  try{ await saveSheet(sheetActivaKey, sheet); }
  catch(err){ showToast('⚠️ No se pudo guardar: ' + (err.message||String(err))); return; }

  /* Notificar al auditor de calidad asignado a este UBT */
  const auditores = await destinatariosPara('auditor', sheet.planta, sheet.ubtNo);
  enviarNotificacion(
    auditores,
    '🔧 Reparación pendiente de tu firma',
    `${STATE.nombre} realizó una reparación en UBT ${sheet.ubtNo} (${sheet.maquina}). Necesita tu firma como Auditor de Calidad.`
  );

  /* Si se solicitó APQP, notificar también al APQP asignado */
  if(solicitarApqp){
    const apqps = await destinatariosPara('apqp', sheet.planta, sheet.ubtNo);
    enviarNotificacion(
      apqps,
      '✅ Firma de APQP solicitada',
      `${STATE.nombre} solicitó tu firma en UBT ${sheet.ubtNo} (${sheet.maquina}).`
    );
  }

  showToast('Registro guardado y notificado ✓');
  /* Regresa a la ventana de todas las UBT de la planta */
  sheetActivaKey = null;
  STATE.ubtElegida = null;
  render();
}

let sheetsCacheVerTodo = [];
async function renderVerCorrectivos(){
  const todas = await listSheets();
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';

  if(esAuditorTipo){
    /* Auditor y APQP: solo las hojas de los UBT que tienen asignados (en cualquier planta) */

    sheetsCacheVerTodo = todas.filter(s => (asignados[s.planta]||[]).includes(s.ubtNo));
  } else {
    sheetsCacheVerTodo = todas;
  }

  const plantaDefault = STATE.rol!=='supervisor' ? (STATE.plantaHoy||'') : '';
  const ubtDefault = STATE.rol!=='supervisor' ? (STATE.ubtElegida||'') : '';

  const misUbtsTxt = esAuditorTipo
    ? Object.entries(asignadosResumen()).map(([pl,v])=>`${pl}: ${v.join(', ')}`).join(' · ')
    : '';

  return `<div class="card"><h2>👁️ Ver correctivos — solo lectura</h2>
    ${esAuditorTipo ? `<p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Solo se muestran tus líneas asignadas${misUbtsTxt?(' → '+escapeHtml(misUbtsTxt)):''}.</p>` : ''}
    <div class="filters">
      <input id="vt_filtro_planta" placeholder="Filtrar por planta" value="${escapeHtml(plantaDefault)}" oninput="filtrarVerTodo()" autocomplete="off" autocorrect="off" spellcheck="false" name="vt_pl_x">
      <input id="vt_filtro_ubt" placeholder="Filtrar por UBT" value="${escapeHtml(ubtDefault)}" oninput="filtrarVerTodo()" autocomplete="off" autocorrect="off" spellcheck="false" name="vt_ubt_x">
    </div>
    <button class="btn ghost small" style="margin-bottom:10px;" onclick="limpiarFiltrosVt()">✖ Limpiar filtros</button>
    <div id="vt_lista"></div>
  </div>`;
}

function asignadosResumen(){
  const a = STATE.usuario?.ubtsPorPlanta || {};
  const out = {};
  Object.entries(a).forEach(([p,v])=>{ if(v && v.length) out[p]=v; });
  return out;
}
function filtrarVerTodo(){
  const pEl = document.getElementById('vt_filtro_planta'), uEl = document.getElementById('vt_filtro_ubt');
  if(!pEl) return;
  const planta = pEl.value.toLowerCase(), ubt = uEl.value.toLowerCase();
  const filtradas = sheetsCacheVerTodo.filter(s => (!planta || (s.planta||'').toLowerCase().includes(planta)) && (!ubt || (s.ubtNo||'').toLowerCase().includes(ubt)));
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';
  const vacio = esAuditorTipo
    ? '<div class="empty">No hay correctivos registrados en tus líneas asignadas.</div>'
    : '<div class="empty">Sin hojas.</div>';
  document.getElementById('vt_lista').innerHTML = filtradas.length===0 ? vacio : renderAgrupadoPorPlantaUbtMaquina(filtradas, STATE.rol);
}

function renderAgrupadoPorPlantaUbtMaquina(sheets, viewerRole){
  const puedeImprimir = viewerRole==='tecnico' || viewerRole==='supervisor';
  const porPlanta = {};
  sheets.forEach(s=>{
    (porPlanta[s.planta||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'][s.maquina||'—'] ??= []).push(s);
  });
  return Object.keys(porPlanta).sort().map(planta=>{
    const ubts = porPlanta[planta];
    const totalPlanta = Object.values(ubts).reduce((a,m)=>a+Object.values(m).reduce((b,arr)=>b+arr.length,0),0);
    return `<details style="margin-bottom:8px;">
      <summary style="cursor:pointer;font-weight:700;padding:8px 10px;background:#2f3742;color:#fff;border-radius:6px;">📍 ${escapeHtml(planta)} (${totalPlanta} hoja${totalPlanta!==1?'s':''})</summary>
      <div style="padding:10px 0 0 14px;">
        ${Object.keys(ubts).sort().map(ubt=>{
          const maquinas = ubts[ubt];
          const totalUbt = Object.values(maquinas).reduce((a,arr)=>a+arr.length,0);
          return `<details style="margin-bottom:6px;">
            <summary style="cursor:pointer;font-weight:600;padding:6px 10px;background:#eef1f4;border-radius:6px;">UBT ${escapeHtml(ubt)} (${totalUbt})</summary>
            ${puedeImprimir ? `<div style="padding:8px 0 0 14px;"><button class="btn small secondary no-print" onclick="agregarUbtACola('${planta.replace(/'/g,"\\'")}','${ubt.replace(/'/g,"\\'")}')">🖨️ Agregar todo el UBT ${escapeHtml(ubt)} a la cola</button></div>` : ''}
            <div style="padding:8px 0 0 14px;">
              ${Object.keys(maquinas).sort().map(maq=>`
                <details style="margin-bottom:6px;">
                  <summary style="cursor:pointer;font-size:13px;padding:5px 10px;background:#f7f8f9;border-radius:6px;">⚙️ ${escapeHtml(maq)} (${maquinas[maq].length})</summary>
                  <div style="padding-top:8px;">${maquinas[maq].map(s=> puedeImprimir ? renderSheetPrintWrap(s,{role:'lectura'}) : `<div class="sheet-print-wrap">${renderSheetVisual(s,{role:'lectura'})}</div>`).join('')}</div>
                </details>`).join('')}
            </div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

/* ---------- Imprimir una hoja individual ---------- */
function imprimirHoja(elId, sheetKey){
  const target = document.getElementById(elId);
  if(!target){ showToast('⚠️ No se encontró la hoja'); return; }
  const contenido = target.querySelector('.sheet-page');
  if(!contenido){ showToast('⚠️ No se encontró el formato'); return; }

  const s = colaImpresion.find(x=>x.key===sheetKey) || target.__sheet;
  let titulo = 'Correctivo';
  if(target.dataset.maquina){
    titulo = `Correctivo-${target.dataset.maquina}-${target.dataset.ubt}-${target.dataset.mes}-${target.dataset.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${titulo}</title>${estilos}
    <style>
      body{background:#fff;margin:0;padding:10px;}
      .no-print{display:none !important;}
      @page{size:letter landscape;margin:8mm;}
      table.sheet-table{min-width:0 !important;width:100% !important;}
      .sheet-page{border:none;}
    </style></head><body>${contenido.outerHTML}</body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>{ ventana.print(); }, 400);
}
function renderSheetPrintWrap(sheet, opts){
  const wrapId = 'sw_' + sheet.key.replace(/[^a-z0-9]/gi,'');
  const yaEsta = enCola(sheet.key);
  return `<div class="sheet-print-wrap" id="${wrapId}"
      data-maquina="${escapeHtml(sheet.maquina)}" data-ubt="${escapeHtml(sheet.ubtNo)}"
      data-mes="${escapeHtml(sheet.mes)}" data-anio="${escapeHtml(sheet.anio)}">
    ${renderSheetVisual(sheet, opts)}
    <div class="no-print" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn ghost small" onclick="imprimirHoja('${wrapId}','${sheet.key}')">🖨️ Imprimir esta hoja</button>
      <button class="btn ${yaEsta?'ghost':'secondary'} small" onclick="toggleCola('${sheet.key}')">${yaEsta?'✓ En cola (quitar)':'➕ Agregar a cola'}</button>
    </div>
  </div>`;
}

/* ---------- Render visual de la hoja ---------- */
function renderSheetVisual(sheet, opts){
  if(!sheet) return '<div class="empty">Hoja no encontrada.</div>';
  const filas = sheet.filas || [];
  const rowMajor = [0,1,2].map(r => checklistGroups.map(col => col[r] || null));
  const flat = rowMajor.flat();
  const chkHtml = flat.map(item=>{
    if(item===null) return `<span></span>`;
    if(item==='Otros') return `<span>Otros ☐ ____</span>`;
    return `<span class="${item===sheet.maquina?'on':'off'}">${item}</span>`;
  }).join('');
  const filasHtml = filas.length===0 ? `<tr><td colspan="13" style="color:#999;">Sin registros todavía</td></tr>` :
    filas.map(f=>{
      const auditorCell = f.estadoAuditor==='firmado' ? `<span class="firma-ok">${escapeHtml(f.firmaAuditorNombre)}</span>`
        : (opts.role==='auditor' ? `<button class="firma-btn" onclick="firmarAuditor('${sheet.key}','${f.id}')">Firmar</button>` : 'Pendiente');
      let apqpCell = 'N/A';
      if(f.estadoAPQP==='firmado') apqpCell = `<span class="firma-ok">${escapeHtml(f.firmaAPQPNombre)}</span>`;
      else if(f.estadoAPQP==='pendiente') apqpCell = (opts.role==='apqp' ? `<button class="firma-btn" onclick="firmarApqp('${sheet.key}','${f.id}')">Firmar</button>` : 'Pendiente');
      return `<tr>
        <td>${f.fecha||''}</td><td>${escapeHtml(f.gafete)}</td><td>${f.horaInicio||''}</td><td>${f.horaFinal||''}</td>
        <td class="left">${escapeHtml(f.sintomas)}</td><td class="left">${escapeHtml(f.acciones)}</td><td class="left">${escapeHtml(f.material)}</td>
        <td>${escapeHtml(f.tecnico)}</td><td>${auditorCell}</td><td>${f.seMovioModulo?'Sí':'No'}</td><td>${f.seVerificoModulo?'Sí':'No'}</td><td>${apqpCell}</td>
        <td class="no-print">
          <button class="edit-btn" onclick="pedirClaveEditar('${sheet.key}','${f.id}')">✏️ Editar</button>
          <div class="pass-inline" id="editpass_${f.id}" style="display:none;">
            <input type="password" id="editpass_input_${f.id}" placeholder="Clave admin">
            <button onclick="validarClaveEditar('${f.id}')">OK</button>
          </div>
          <div class="edit-panel" id="editpanel_${f.id}" style="display:none;"></div>
        </td>
      </tr>`;
    }).join('');
  return `<div class="sheet-page">
      <div class="sheet-head">
        <div class="sheet-brand">LEAR<small>CORPORATION</small></div>
        <div class="sheet-title">FORMATO DE VALIDACIÓN DE MANTENIMIENTO</div>
        <div class="sheet-monthyear">${(sheet.mes||'').toUpperCase()}<br>${sheet.anio||''}</div>
      </div>
      <div class="chk-grid">${chkHtml}</div>
      <div class="sheet-meta"><span><b>Planta:</b> ${escapeHtml(sheet.planta)}</span><span><b>Estación No.:</b> ${escapeHtml(sheet.maquina)}</span><span><b>UBT No.:</b> ${escapeHtml(sheet.ubtNo)}</span><span><b>Página:</b> ${sheet.pagina||1}</span></div>
      <div style="overflow-x:auto;"><table class="sheet-table"><thead><tr>
          <th>Fecha</th><th>No. Gafete</th><th>Hora Inicio</th><th>Hora Final</th><th>Síntomas/Fallas</th>
          <th>Acciones Correctivas</th><th>Material</th><th>Técnico</th><th>Auditor de Calidad</th>
          <th>Se movió módulo</th><th>Se verificó cuadrante</th><th>APQP</th><th class="no-print">Editar</th>
        </tr></thead><tbody>${filasHtml}</tbody></table></div>
    </div>`;
}

function toggleVerCodigo(inputId, btn){
  const el = document.getElementById(inputId);
  if(el.type === 'password'){ el.type = 'text'; btn.textContent = '🙈'; }
  else { el.type = 'password'; btn.textContent = '👁️'; }
}

async function toggleBloqueoUsuario(nombre, estaBloqueado){
  const u = await getUsuario(nombre);
  if(!u) return;
  u.bloqueado = !estaBloqueado;
  await saveUsuario(u);
  showToast(u.bloqueado ? '🔒 Usuario bloqueado' : '🔓 Usuario desbloqueado');
  render();
}

async function toggleEditUsuario(uid, nombre){
  const btn = document.getElementById('au_editbtn_'+uid);
  const nombreEl = document.getElementById('au_nombre_'+uid);
  const rolEl = document.getElementById('au_rol_'+uid);
  const gafeteEl = document.getElementById('au_gafete_'+uid);
  const editing = btn.textContent.includes('Guardar');
  if(!editing){
    nombreEl.disabled = false; rolEl.disabled = false; gafeteEl.disabled = false;
    btn.textContent = '💾 Guardar';
  } else {
    const nuevoNombre = nombreEl.value.trim();
    const nuevoRol = rolEl.value;
    const nuevoGafete = gafeteEl.value.trim();
    const usuarioViejo = await getUsuario(nombre);
    const actualizado = { ...usuarioViejo, nombre: nuevoNombre, rol: nuevoRol, gafete: nuevoGafete };
    if(slug(nuevoNombre) !== slug(nombre)){
      await deleteUsuario(nombre);
    }
    await saveUsuario(actualizado);
    showToast('Usuario actualizado ✓');
    render();
  }
}
function confirmarBorrarUsuario(btn, nombre){
  if(btn.dataset.confirm==='1'){ eliminarUsuario(nombre); return; }
  btn.dataset.confirm = '1';
  btn.textContent = '¿Seguro? Toca de nuevo';
  setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑 Borrar'; }, 3000);
}
async function eliminarUsuario(nombre){
  await deleteUsuario(nombre);
  showToast('Usuario eliminado ✓');
  render();
}

async function guardarCodigos(){
  const nuevos = {};
  Object.keys(ROLES).forEach(k=>{ const el = document.getElementById('code_'+k); if(el) nuevos[k] = el.value; });
  STATE.codes = nuevos;
  await saveConfig(nuevos);
  showToast('Códigos actualizados ✓');
}
function renderPlantaListEditor(planta){
  const arr = STATE.plantasCfgDraft[planta] || [];
  const key = slug(planta);
  return arr.map((u,i)=>`
    <div class="ubt-row" data-idx="${i}">
      <input class="ubt-row-input" data-planta="${escapeHtml(planta)}" data-idx="${i}" value="${escapeHtml(u)}">
      <button type="button" onclick="moverUbtPlanta('${planta.replace(/'/g,"\\'")}',${i},-1)">↑</button>
      <button type="button" onclick="moverUbtPlanta('${planta.replace(/'/g,"\\'")}',${i},1)">↓</button>
      <button type="button" onclick="quitarUbtPlanta('${planta.replace(/'/g,"\\'")}',${i})">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--muted);">Sin UBTs todavía.</div>';
}
function syncPlantaFromDOM(planta){
  const key = slug(planta);
  const inputs = document.querySelectorAll(`#plantalist_${key} .ubt-row-input`);
  STATE.plantasCfgDraft[planta] = [...inputs].map(i=>i.value.trim());
}
function refrescarPlantaEditor(planta){
  document.getElementById('plantalist_'+slug(planta)).innerHTML = renderPlantaListEditor(planta);
}
function agregarUbtPlanta(planta){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].push('');
  refrescarPlantaEditor(planta);
}
function quitarUbtPlanta(planta, idx){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].splice(idx,1);
  refrescarPlantaEditor(planta);
}
function moverUbtPlanta(planta, idx, dir){
  syncPlantaFromDOM(planta);
  const arr = STATE.plantasCfgDraft[planta];
  const j = idx+dir;
  if(j<0 || j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  refrescarPlantaEditor(planta);
}
async function guardarPlantas(){
  const nuevo = {};
  PLANTA_NOMBRES.forEach(p=>{ syncPlantaFromDOM(p); nuevo[p] = STATE.plantasCfgDraft[p].filter(Boolean); });
  STATE.plantasCfg = nuevo;
  STATE.plantasCfgDraft = JSON.parse(JSON.stringify(nuevo));
  await savePlantasConfig(nuevo);
  showToast('UBTs actualizados ✓');
  render();
}
async function renderQRCodes(){
  const baseInput = document.getElementById('base_url'), output = document.getElementById('qr_output');
  if(!baseInput || !output) return;
  const base = baseInput.value.trim();
  output.innerHTML = '';
  if(!base){ output.innerHTML = '<div class="empty">Pega arriba la URL publicada del artifact para generar los QR.</div>'; return; }
  const usuarios = await listUsuarios();
  if(usuarios.length===0){ output.innerHTML = '<div class="empty">Todavía nadie se ha registrado.</div>'; return; }
  usuarios.forEach(u=>{
    const url = base + `?rol=${encodeURIComponent(u.rol)}&nombre=${encodeURIComponent(u.nombre)}`;
    const box = document.createElement('div'); box.className='qr-box';
    const qrDiv = document.createElement('div'); box.appendChild(qrDiv);
    const label = document.createElement('div'); label.className='label';
    label.textContent = `${ROLES[u.rol]?.emoji||''} ${u.nombre} (${ROLES[u.rol]?.label||u.rol})`;
    box.appendChild(label); output.appendChild(box);
    new QRCode(qrDiv, { text: url, width: 130, height: 130 });
  });
}


async function cargarInfoHistorial(){
  const el = document.getElementById('hist_info');
  if(!el) return;
  try{
    const hojas = await listSheets();
    const totalFilas = hojas.reduce((a,h)=>a+((h.filas||[]).length),0);
    const plantas = [...new Set(hojas.map(h=>h.planta))];
    el.innerHTML = `<b>${hojas.length}</b> hoja(s) · <b>${totalFilas}</b> registro(s) · Plantas: ${plantas.join(', ')||'—'}`;
  }catch(e){ el.textContent = 'No se pudo leer el historial.'; }
}

async function descargarRespaldo(){
  showToast('Preparando respaldo...');
  const hojas = await listSheets();
  const usuarios = await listUsuarios();
  const data = { fecha:new Date().toISOString(), hojas, usuarios, plantas:STATE.plantasCfg };
  const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'respaldo-correctivos-' + todayISO() + '.json';
  a.click();
  showToast('Respaldo descargado ✓');
}

async function borrarHistorial(btn){
  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = '⚠️ Toca de nuevo para BORRAR TODO';
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑️ Borrar TODO el historial de hojas'; }, 5000);
    return;
  }
  btn.textContent = 'Borrando...';
  try{
    await sbFetch('hojas?clave=not.is.null', { method:'DELETE', prefer:'return=minimal' });
    const quedan = await listSheets();
    if(quedan.length === 0){
      colaImpresion = [];
      showToast('✓ Historial borrado en TODOS los dispositivos');
    } else {
      showToast('⚠️ Quedaron ' + quedan.length + ' hoja(s) sin borrar');
    }
  }catch(err){ showToast('⚠️ '+(err.message||err)); }
  btn.dataset.confirm='';
  render();
}

/* Primera letra en mayúscula automáticamente */
document.addEventListener('input', e => {
  const t = e.target;
  if(!(t instanceof HTMLInputElement) && !(t instanceof HTMLTextAreaElement)) return;
  if(t.type === 'password' || t.type === 'number' || t.type === 'date' || t.type === 'time') return;
  if(t.dataset.noCap === '1') return;
  const v = t.value;
  if(v.length > 0 && v[0] !== v[0].toUpperCase()){
    const pos = t.selectionStart;
    t.value = v[0].toUpperCase() + v.slice(1);
    try{ t.setSelectionRange(pos, pos); }catch(e){}
  }
});

function ajustarHoraFinal(){
  const hi = document.getElementById('f_hi');
  const hf = document.getElementById('f_hf');
  if(!hi || !hf || !hi.value) return;
  const [h,m] = hi.value.split(':').map(Number);
  const d = new Date(2000,0,1,h,m+1);
  const minimo = String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
  hf.min = minimo;
  if(hf.value && hf.value < minimo) hf.value = minimo;
}

const VAPID_PUBLIC_KEY = 'BHO00CHONm3Uf0MIaOVAI9SxsAyMd_0hctC7TqKTl5Vpn4Jh1IHBZbHX4PM1fAV2uPr9ZdsmsIW_MaeDBkxmsSg';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

function pushDisponible(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function activarNotificaciones(silencioso){
  if(!pushDisponible()){
    if(!silencioso) showToast('⚠️ Este dispositivo no soporta notificaciones push');
    return false;
  }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){
      if(!silencioso) showToast('⚠️ No diste permiso para notificaciones');
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sbFetch('suscripciones?on_conflict=endpoint', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify({
        usuario_slug: slug(STATE.nombre),
        rol: STATE.rol,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth
      })
    });
    if(!silencioso) showToast('🔔 Notificaciones activadas ✓');
    return true;
  }catch(err){
    console.warn('Error activando notificaciones:', err);
    if(!silencioso) showToast('⚠️ No se pudo activar: ' + (err.message||err));
    return false;
  }
}

async function enviarNotificacion(destinatarios, titulo, cuerpo){
  if(!destinatarios || destinatarios.length===0) return;
  try{
    await fetch(SUPABASE_URL + '/functions/v1/enviar-notificacion', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ destinatarios, titulo, cuerpo })
    });
  }catch(err){ console.warn('No se pudo enviar la notificación:', err); }
}

/* Busca qué auditores/APQP tienen asignado este UBT en esta planta */
async function destinatariosPara(rolBuscado, planta, ubt){
  const usuarios = await listUsuarios();
  return usuarios
    .filter(u => u.rol===rolBuscado && ((u.ubtsPorPlanta||{})[planta]||[]).includes(ubt))
    .map(u => slug(u.nombre));
}
