<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sistema de Correctivo — Lear</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a1f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
  :root{
    --ink:#1a1a1a; --line:#2b2b2b; --paper:#ffffff; --shell:#f0f2f4;
    --accent:#8a1f1f; --accent2:#0f3d5c; --muted:#6b7280; --green:#1a7a3c; --amber:#a16d07;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--shell);color:var(--ink);}
  body.login-bg{background:linear-gradient(160deg,#1f2933 0%,#2b2b2b 45%,#4a1f1f 100%);background-attachment:fixed;min-height:100vh;}
  body.login-bg .card{background:#ffffffef;backdrop-filter:blur(6px);}
  .login-hero{text-align:center;padding:26px 10px 6px;color:#fff;}
  .login-hero .logo{font-size:44px;}
  .login-hero h1{margin:8px 0 2px;font-size:20px;font-weight:800;letter-spacing:.5px;}
  .login-hero p{margin:0;font-size:12.5px;opacity:.7;}
  .topbar{background:linear-gradient(135deg,#2b2b2b,#3a3f45);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0003;}
  .tb-left{display:flex;align-items:center;gap:10px;}
  .tb-logo{font-size:22px;background:var(--accent);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .tb-title{font-size:14px;font-weight:800;letter-spacing:.3px;}
  .tb-sub{font-size:11px;opacity:.75;margin-top:1px;}
  .tb-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .tb-btn{background:#ffffff18;border:1px solid #ffffff22;color:#fff;padding:7px 11px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;transition:.15s;}
  .tb-btn:hover{background:#ffffff30;transform:translateY(-1px);}
  .tb-btn span{font-size:9.5px;opacity:.85;}
  .tb-btn.on{background:#1a7a3c44;border-color:#1a7a3c88;}
  .tb-btn.salir{background:#a1363644;border-color:#a1363688;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px #00000012,0 4px 12px #00000008;border:1px solid #e8eaed;}
  h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{padding:11px;border:1px solid #d4d8dc;border-radius:8px;font-size:14px;font-family:inherit;transition:.15s;background:#fbfcfd;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px #0f3d5c1a;}
  .field textarea{min-height:60px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:13px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.15s;box-shadow:0 2px 6px #8a1f1f33;}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn.secondary{background:var(--accent2);box-shadow:0 2px 6px #0f3d5c33;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.ghost{background:#eef0f2;color:#333;box-shadow:none;}
  .btn.ghost:hover{background:#e2e5e8;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px #00000014;transition:.18s;}
  .role-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px #00000022;}
  .role-card .emoji{font-size:28px;}
  .role-card .name{font-weight:700;margin-top:6px;font-size:14px;}
  .role-card.rc-tecnico{background:#f2c94c;color:#1a1a1a;}
  .role-card.rc-auditor{background:#ffffff;color:#1a1a1a;border-color:#ccc;}
  .role-card.rc-apqp{background:#a13636;color:#fff;}
  .role-card.rc-supervisor{background:#8a8f98;color:#fff;}
  .role-card.rc-produccion{background:#1a7a3c;color:#fff;}
  .role-card.rc-admin{background:#1a1a1a;color:#fff;}
  .planta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-width:480px;}
  .planta-card{background:#fff;border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;border:2px solid #e2e5e8;box-shadow:0 2px 6px #00000010;font-weight:700;font-size:12.5px;transition:.15s;}
  .planta-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 5px 14px #00000018;}
  .ubt-cols{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .ubt-col{display:flex;flex-direction:column;gap:8px;min-width:110px;}
  .ubt-col-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
  .ubt-btn{border:none;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 2px 5px #00000018;}
  .ubt-btn:hover{filter:brightness(1.15);transform:translateX(3px);}
  .ubt-btn.p1{background:#1a7a3c;color:#fff;}
  .ubt-btn.p2{background:#1a1a1a;color:#fff;}
  .ubt-btn.p3{background:#0f3d5c;color:#fff;}
  .ubt-btn.p4{background:#e0b400;color:#1a1a1a;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filters select, .filters input{padding:7px 9px;border:1px solid #ccd1d6;border-radius:6px;font-size:13px;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 4px 16px #0004;max-width:90%;text-align:center;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
  .qr-box{text-align:center;border:1px solid #e2e5e8;border-radius:8px;padding:12px;}
  .qr-box .label{font-size:12px;font-weight:700;margin-top:6px;}
  .ubt-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:12px;}
  .ubt-check-grid label{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#f5f6f7;padding:6px 8px;border-radius:5px;}
  .notif{background:#fff7e6;border:1px solid #f0c674;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .notif b{color:var(--amber);}
  table.admin-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  table.admin-tbl th, table.admin-tbl td{border:1px solid #e2e5e8;padding:6px 8px;text-align:left;}
  table.admin-tbl th{background:#f5f6f7;}
  .badge-est{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .badge-est.act{background:#e3f6e8;color:#1a7a3c;}
  .badge-est.bloq{background:#fde8e8;color:#a13636;}
  .cola-bar{position:sticky;top:64px;z-index:9;background:#0f3d5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;box-shadow:0 2px 8px #0003;}
  .cola-bar .btn{width:auto;}
  .pass-inline{display:flex;gap:6px;margin-top:6px;}
  .pass-inline input{padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12px;flex:1;}
  .pass-inline button{padding:6px 10px;border:none;border-radius:5px;background:var(--accent2);color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
  .edit-panel{background:#fef8ec;border:1px solid #f0c674;border-radius:8px;padding:12px;margin-top:8px;}
  .planta-block{border:1px solid #e2e5e8;border-radius:8px;padding:12px;margin-bottom:12px;}
  .planta-block h3{margin:0 0 8px;font-size:13.5px;}
  .ubt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .ubt-row input{flex:1;padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12.5px;}
  .ubt-row button{padding:5px 9px;border:none;border-radius:5px;background:#e2e5e8;cursor:pointer;font-size:12px;}

  /* --- Pantalla principal (menu de mosaicos) --- */
  .menu-hero{background:linear-gradient(135deg,#2b2b2b,#3a3f45);color:#fff;border-radius:14px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 2px 10px #0000001f;}
  .menu-hero .mh-kick{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .menu-hero .mh-name{font-size:20px;font-weight:800;margin-top:2px;}
  .menu-hero .mh-sub{font-size:12.5px;opacity:.82;margin-top:4px;}
  .menu-hero .mh-est{margin-top:12px;background:#ffffff1a;border:1px solid #ffffff26;border-radius:10px;padding:10px 12px;font-size:13px;}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .menu-tile{background:#fff;border:1px solid #e2e5e8;border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px #00000012;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:120px;font-family:inherit;color:var(--ink);width:100%;}
  .menu-tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px #00000022;}
  .menu-tile:active{transform:translateY(0);}
  .menu-tile .ico{font-size:34px;line-height:1;}
  .menu-tile .txt{font-weight:800;font-size:14.5px;line-height:1.15;}
  .menu-tile .sub{font-size:11px;color:var(--muted);line-height:1.2;}
  .menu-tile.wide{grid-column:span 2;}
  .menu-tile.rojo{background:linear-gradient(135deg,#8a1f1f,#a13636);color:#fff;border:none;}
  .menu-tile.verde{background:linear-gradient(135deg,#1a7a3c,#146030);color:#fff;border:none;}
  .menu-tile.ambar{background:linear-gradient(135deg,#e8c02a,#c77700);color:#1a1a1a;border:none;}
  .menu-tile.azul{background:linear-gradient(135deg,#0f3d5c,#18567f);color:#fff;border:none;}
  .menu-tile.gris{background:#40454b;color:#fff;border:none;}
  .menu-tile.salida{background:#fdecec;border-color:#f0c0c0;color:#a13636;}
  .menu-tile.rojo .sub,.menu-tile.verde .sub,.menu-tile.azul .sub,.menu-tile.gris .sub{color:#ffffffc4;}
  .menu-tile.ambar .sub{color:#1a1a1ab0;}
  @media(max-width:560px){ .menu-grid{grid-template-columns:1fr 1fr;} }
  /* --- Linea de estado de solicitud --- */
  .paso{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:13px;}
  .paso .bolita{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .paso.ok .bolita{background:#1a7a3c;color:#fff;}
  .paso.no .bolita{background:#e2e5e8;color:#8a9099;}
  .paso.no{color:var(--muted);}
  .badge-est.esp{background:#fff4d6;color:#a16d07;}
  .badge-est.fin{background:#e8eff5;color:#0f3d5c;}
  .dato-fijo{padding:11px;border:1px dashed #c9ced4;border-radius:8px;background:#f5f7f9;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .dato-fijo .lock{font-size:12px;opacity:.55;font-weight:600;}

  .sheet-print-wrap{margin-bottom:16px;}
  .sheet-page{border:1px solid #333;padding:14px;background:#fff;font-size:11px;overflow-x:auto;}
  .sheet-head{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:2px solid #333;padding-bottom:6px;margin-bottom:8px;}
  .sheet-brand{font-size:16px;font-weight:800;color:var(--accent);}
  .sheet-brand small{display:block;font-size:8px;color:var(--muted);font-weight:600;}
  .sheet-title{font-size:12px;font-weight:800;}
  .sheet-monthyear{font-size:13px;font-weight:800;text-align:right;}
  .chk-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px 12px;font-size:9.5px;margin-bottom:8px;}
  .chk-grid span{display:flex;justify-content:space-between;padding:1px 0;}
  .chk-grid .on::after{content:'☑'; margin-left:4px;}
  .chk-grid .off::after{content:'☐'; margin-left:4px;}
  .sheet-meta{font-size:10.5px;margin-bottom:8px;display:flex;gap:16px;flex-wrap:wrap;}
  .sheet-meta b{font-weight:700;}
  table.sheet-table{width:100%;border-collapse:collapse;min-width:950px;}
  table.sheet-table th, table.sheet-table td{border:1px solid #333;padding:4px;font-size:9px;text-align:center;vertical-align:middle;}
  table.sheet-table th{background:#f2f2f2;font-weight:700;}
  table.sheet-table td.left{text-align:left;}
  .firma-ok{color:var(--green);font-weight:700;}
  .firma-btn, .edit-btn{background:var(--accent2);color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:9px;cursor:pointer;font-weight:700;}
  .edit-btn{background:#555;margin-top:2px;}
  .pie-marca{text-align:center;font-size:10.5px;color:#9aa1a9;opacity:.65;padding:14px 10px 20px;letter-spacing:.3px;user-select:none;}
  .pie-marca b{font-weight:700;color:#8a9099;}
  .no-print{}
  @media print{
    .no-print{display:none !important;}
    body.printing-single .wrap > *:not(.print-target){display:none !important;}
  }
</style>

<body>
<div id="app"></div>
<div class="pie-marca no-print">Creado por <b>KAL7</b>, Claude · <span id="pie_version"></span></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- Configuración fija ---------- */
const MAQ_COR = ["Prueba Eléctrica","Pre-Eléctrica","Dimensiones","Sistema de Navegación","Encintadoras","Rotary","Impresoras","Tableros de Clip","Canaleta","Torques","Mesa de Amarre","Expansor de Grommet"];
const checklistGroups = [
  ["Prueba Eléctrica","Pre-Eléctrica","Sistema de Navegación"],
  ["Encintadoras","Rotary","Impresoras"],
  ["Dimensiones","Tableros de Clip","Canaleta"],
  ["Torques","Mesa de Amarre","Expansor de Grommet"],
  ["Otros"]
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MAX_FILAS_POR_HOJA = 7;

/* ---------- Versión de la aplicación ----------
   Sube el número en cada mejora:
   1.0.0 = versión base
   1.1.0 = UBT/máquina fijas para operador, pantalla principal de mosaicos, estado del foco
   1.2.0 = tiempo muerto por planta del técnico (colapsado), botón volver a inicio, marca de agua  */
const APP_VERSION = '1.2.0';

const PLANTA_NOMBRES = ["Planta 1","Planta 2","Planta 3","Partes de Servicio"];
const DEFAULT_PLANTAS = {
  "Planta 1": ["501-1","501-2","502-1","502-2","503-1","503-2","504-1","505-1","506-1","507-1","508-1"],
  "Planta 2": ["601-1","601-2","602-1","602-2","602-3","603-1","603-2","604-1","604-2","604-3","605-1","605-1.0","605-1.1","605-1.2","606-1","606-1B","606-2","606-3","606-4","607-1","607-2","607-3","608-1","608-2","608-3","609-1","609-2","609-4","609-5","611-1","611-2","611-3","612-1","612-2","612-3"],
  "Planta 3": ["701-1","701-2","702-1","702-2","702-3","703-1"],
  "Partes de Servicio": ["520"]
};

const ROLES = {
  tecnico:   {label:"Técnico de Mantenimiento", emoji:"🔧"},
  auditor:   {label:"Auditor de Calidad", emoji:"🧾"},
  apqp:      {label:"APQP", emoji:"✅"},
  supervisor:{label:"Supervisor de Mantenimiento", emoji:"👁️"},
  produccion:{label:"Producción", emoji:"🏭"},
  admin:     {label:"Administrador", emoji:"⚙️"},
};
const SUBROLES_PROD = {
  supervisor_prod: { label:'Supervisor de Producción', emoji:'👔', multiUbt:true,  puedeLlenarTpm:false },
  lider:           { label:'Líder de Línea',           emoji:'📋', multiUbt:true,  puedeLlenarTpm:true  },
  multifuncional:  { label:'Multifuncional',           emoji:'🔀', multiUbt:true,  puedeLlenarTpm:false },
  operador:        { label:'Operador',                 emoji:'🧑‍🏭', multiUbt:false, puedeLlenarTpm:true  }
};

const TPM_ACTIVIDADES = [
  { id:'a1', sub:'Suciedad en Módulos',   texto:'Asegure que los módulos estén libres de suciedad y desperdicios. Use la pistola de aire y una brocha.' },
  { id:'a2', sub:'Validación de Pines',   texto:'Verifique que estén completos los pines en cada módulo de la mesa. Registre si encuentra faltantes.' },
  { id:'a3', sub:'Presión Neumática',     texto:'Verifique que la presión de operación esté entre 5 y 7 bares.' },
  { id:'a4', sub:'Revisión de Tornillería',texto:'Revise que la tornillería de la mesa esté ajustada y completa.' },
  { id:'a5', sub:'Limpieza de Mesa',      texto:'Realizar limpieza de mesa en general.' },
  { id:'a6', sub:'Limpieza de Impresora', texto:'Con un trapo realizar limpieza de impresora de etiquetas.' },
  { id:'a7', sub:'Limpieza de Monitor',   texto:'Realizar limpieza de monitor y/o Dynalab de la mesa, utilizando un trapo.' },
  { id:'a8', sub:'Apagado de Equipo',     texto:'Asegúrate de apagar tu equipo si tu línea no trabaja el siguiente turno.' }
];

const EXTRAS_FOCO = ['Pull System','Tablero de Construcción','Socar elevadores','Revisión de fixturas','Carritos de Pull','Resorte en fingers'];
function maquinasParaFoco(){ return [...MAQ_COR, ...EXTRAS_FOCO]; }

const DIAS_SEMANA = ['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
function diaHoy(){ return DIAS_SEMANA[new Date().getDay()]; }

const DEFAULT_TURNOS = {
  TA: { nombre:'Turno A', inicio:'06:00', fin:'14:50',
        extras:[ {etiqueta:'14:50 a 17:00', inicio:'14:50', fin:'17:00'},
                 {etiqueta:'14:50 a 18:00', inicio:'14:50', fin:'18:00'} ] },
  TB: { nombre:'Turno B', inicio:'14:50', fin:'23:15',
        extras:[ {etiqueta:'11:15 a 23:15 (entrada anticipada)', inicio:'11:15', fin:'23:15'},
                 {etiqueta:'16:00 a 23:15', inicio:'16:00', fin:'23:15'},
                 {etiqueta:'18:00 a 06:00', inicio:'18:00', fin:'06:00'} ] },
  TC: { nombre:'Turno C', inicio:'23:15', fin:'06:00',
        extras:[ {etiqueta:'18:00 a 06:00', inicio:'18:00', fin:'06:00'} ] }
};

function minDelDia(hhmm){ const [h,m]=(hhmm||'00:00').split(':').map(Number); return h*60+m; }
function ahoraMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

/* ¿La hora está dentro del rango? Soporta rangos que cruzan medianoche */
function dentroDeRango(minAhora, inicio, fin){
  const i = minDelDia(inicio), f = minDelDia(fin);
  return (i <= f) ? (minAhora >= i && minAhora < f) : (minAhora >= i || minAhora < f);
}

/* Detecta el turno según una hora dada */
function turnoDeHora(hhmm){
  const m = minDelDia(hhmm);
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  for(const [k,t] of Object.entries(T)){
    if(dentroDeRango(m, t.inicio, t.fin)) return k;
  }
  return 'TA';
}

/* ¿El usuario está dentro de su jornada ahora mismo? */
function enJornada(usuario){
  if(!usuario || !usuario.turno) return true;
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario.turno];
  if(!t) return true;
  const m = ahoraMin();
  if(dentroDeRango(m, t.inicio, t.fin)) return true;
  /* Jornada extendida vigente */
  if(usuario.extraInicio && usuario.extraFin && dentroDeRango(m, usuario.extraInicio, usuario.extraFin)) return true;
  return false;
}

/* Minutos que faltan para que termine la jornada */
function minutosParaFinJornada(usuario){
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario?.turno];
  if(!t) return null;
  let fin = minDelDia(t.fin);
  if(usuario.extraFin && dentroDeRango(ahoraMin(), usuario.extraInicio||t.inicio, usuario.extraFin)) fin = minDelDia(usuario.extraFin);
  let dif = fin - ahoraMin();
  if(dif < -720) dif += 1440;
  return dif;

function ubtsDeLaPlanta(plantasCfg, planta){
  if(planta==='Partes de Servicio'){
    const union = [...(plantasCfg["Planta 1"]||[]), ...(plantasCfg["Planta 2"]||[]), ...(plantasCfg["Planta 3"]||[]), ...(plantasCfg["Partes de Servicio"]||[])];
    return [...new Set(union)];
  }
  return plantasCfg[planta] || [];
}
function origenDeUbt(plantasCfg, ubt){
  if((plantasCfg["Planta 1"]||[]).includes(ubt)) return "Planta 1";
  if((plantasCfg["Planta 2"]||[]).includes(ubt)) return "Planta 2";
  if((plantasCfg["Planta 3"]||[]).includes(ubt)) return "Planta 3";
  return "Partes de Servicio";
}

    </div></div>`;
  }
  const grupos = { 'Planta 1':[], 'Planta 2':[], 'Planta 3':[], 'Partes de Servicio':[] };
  ubts.forEach(u => grupos[origenDeUbt(STATE.plantasCfg,u)].push(u));

}

/* Lee el campo ubts_por_planta soportando el formato viejo (plano) y el nuevo (con __ubts) */
function desempacarExtra(extra){
  const e = extra || {};
  if(Object.prototype.hasOwnProperty.call(e, '__ubts')){
    return { ubtsPorPlanta: e.__ubts || {}, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '', subrol: e.__subrol || '', maquina: e.__maquina || '' };
  }
  const limpio = { ...e };
  delete limpio.__bloqueado; delete limpio.__firma; delete limpio.__modoFirma; delete limpio.__turno; delete limpio.__extraInicio; delete limpio.__extraFin; delete limpio.__subrol; delete limpio.__maquina;
  return { ubtsPorPlanta: limpio, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '', subrol: e.__subrol || '', maquina: e.__maquina || '' };
}

/* ---------- Render raíz ---------- */
async function render(){

  if(!STATE.turnosCfg) STATE.turnosCfg = await getTurnosConfig();
  if(STATE.modoPruebas === undefined) STATE.modoPruebas = await getModoPruebas();

  /* Modo público: ver todos los correctivos de una UBT (acceso por QR) */
  if(STATE.modoVerUbt){
    document.body.classList.remove('login-bg');
    app.innerHTML = await renderVistaUbtPublica();
    return;
  }

  if(!STATE.rol){
    document.body.classList.add('login-bg');
    app.innerHTML = renderRolePicker();
    if(STATE.rolPrefijado){
      const r = STATE.rolPrefijado; STATE.rolPrefijado = null;
      setTimeout(()=>elegirRol(r), 60);
    }
    return;
  }
  document.body.classList.remove('login-bg');

  if(STATE.rol==='admin'){
    if(!STATE.adminOk){ app.innerHTML = renderTopbar() + renderAdminLogin(); return; }
    if(STATE.vista === 'menu'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${renderMenuInicio()}</div>`;
      return;
    }
    if(STATE.vista === 'analisis'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAnalisis()}</div>`;
      setTimeout(()=>{ calcularTiempoMuerto(); calcularFallasFrecuentes(); cargarRefaccionesAnalisis(); }, 60);
      return;
    }
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAdmin()}</div>`;
    setTimeout(()=>{ cargarInfoHistorial(); actualizarUbtsQR(); actualizarUbtsBorrado(); cambiarAlcanceBorrado(); cargarCatalogoPartes(); actualizarUbtsFocoTest(); cargarFocosAdmin(); }, 50);
    return;
  }

  if(STATE.nombre && !STATE.usuario){
    STATE.usuario = await getUsuario(STATE.nombre);
    if(STATE.usuario && STATE.usuario.bloqueado){
      app.innerHTML = `<div class="wrap"><div class="card" style="text-align:center;">
        <h2 style="justify-content:center;">🚫 Acceso bloqueado</h2>
        <p style="font-size:14px;color:var(--muted);">Tu usuario fue bloqueado por el administrador.<br>Contacta a tu supervisor si crees que es un error.</p>
        <button class="btn ghost" onclick="cambiarRol()">Volver al inicio</button>
      </div></div>`;
      return;
    }
    if(STATE.usuario && pushDisponible() && Notification.permission === 'granted'){
      activarNotificaciones(true);
    }
  }
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';
  if(STATE.nombre && !STATE.usuario){
    app.innerHTML = renderTopbar() + renderGafeteSetup();
    return;
  }

  /* El operador siempre trae fija su UBT asignada (no la puede cambiar) */
  if(STATE.rol==='produccion' && STATE.plantaHoy && STATE.usuario){
    const subA = STATE.usuario.subrol || 'operador';
    if(!SUBROLES_PROD[subA]?.multiUbt){
      const asig = (STATE.usuario.ubtsPorPlanta||{})[STATE.plantaHoy] || [];
      if(asig.length && !STATE.ubtElegida) STATE.ubtElegida = asig[0];
    }
  }

  /* Pantalla principal de mosaicos */
  if(STATE.vista === 'menu'){
    STATE.viendoTodo = false; STATE.editandoUbts = false;
    const necesitaPlanta = ['tecnico','auditor','apqp','produccion'].includes(STATE.rol);
    const listoProd = STATE.rol!=='produccion' || ((STATE.usuario?.ubtsPorPlanta||{})[STATE.plantaHoy]||[]).length>0;
    if((!necesitaPlanta || STATE.plantaHoy) && listoProd){
      app.innerHTML = renderTopbar() + `<div class="wrap">${renderMenuInicio()}</div>`;
      if(STATE.rol==='produccion') setTimeout(cargarEstadoMenu, 80);
      return;
    }
  }

  if(STATE.viendoTodo){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderVerCorrectivos()}</div>`;
    setTimeout(()=>{ limpiarAutorelleno(['vt_filtro_ubt'], [ubtEsperado()]); filtrarVerTodo(); }, 60);
    return;
  }

  if(STATE.vista === 'analisis' && ['tecnico','supervisor','admin'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAnalisis()}</div>`;
    setTimeout(()=>{ calcularTiempoMuerto(); calcularFallasFrecuentes(); cargarRefaccionesAnalisis(); }, 50);

    return;
  }

    app.innerHTML = renderTopbar() + renderPlantaPicker();

  }

  if(STATE.rol==='produccion' && STATE.plantaHoy){

    const multi = SUBROLES_PROD[sub]?.multiUbt;

function guardarBorradorRegistro(){
  const ids = ['f_fecha','f_hi','f_hf','f_gafete','f_sintomas','f_acciones','f_material','f_parte','f_parte_desc','f_turno'];
  const chk = ['f_movio','f_verifico','f_solicitar_apqp','f_extra'];
  const b = {};
  let hayAlgo = false;
  ids.forEach(id=>{ const el=document.getElementById(id); if(el){ b[id]=el.value; if(['f_sintomas','f_acciones','f_material'].includes(id) && el.value.trim()) hayAlgo=true; } });

function restaurarBorradorRegistro(){
  const b = STATE.borradorRegistro;
  if(!b) return;
  Object.entries(b).forEach(([id,val])=>{

    const el = document.getElementById(id);
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!val; else el.value = val;
  });
  if(b.__foto){
    fotoTemp = b.__foto;
    const c = document.getElementById('prev_foto');
    if(c) c.innerHTML = `<img src="${b.__foto}" style="max-width:200px;border-radius:8px;border:1px solid #ddd;">

/* ---------- Cola de impresión por UBT ---------- */
let colaImpresion = [];

function enCola(key){ return colaImpresion.some(s=>s.key===key); }

async function toggleCola(key){
  if(enCola(key)){
    colaImpresion = colaImpresion.filter(s=>s.key!==key);
    showToast('Quitado de la cola');
  } else {
    const sheet = await getSheet(key);
    if(sheet){ sheet.key = key; colaImpresion.push(sheet); showToast('➕ Agregado a la cola ('+colaImpresion.length+')'); }
  }
  render();
}

async function agregarUbtACola(planta, ubt){
  const todas = await listSheets();
  const delUbt = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
  let nuevos = 0;
  delUbt.forEach(s=>{ if(!enCola(s.key)){ colaImpresion.push(s); nuevos++; } });
  showToast(nuevos>0 ? `➕ ${nuevos} hoja(s) de UBT ${ubt} agregadas` : 'Ya estaban todas en la cola');
  render();
}

function limpiarCola(){ colaImpresion = []; showToast('Cola vaciada'); render(); }

function imprimirCola(){
  if(colaImpresion.length===0){ showToast('⚠️ La cola está vacía'); return; }

  /* Nombre según el contenido de la cola */
  const ubts = [...new Set(colaImpresion.map(s=>s.ubtNo))];
  const maqs = [...new Set(colaImpresion.map(s=>s.maquina))];
  const p = colaImpresion[0];
  let titulo;
  if(ubts.length === 1 && maqs.length === 1){
    titulo = `Correctivo-${maqs[0]}-${ubts[0]}-${p.mes}-${p.anio}`;
  } else if(ubts.length === 1){
    titulo = `Correctivo-${ubts[0]}-${p.mes}-${p.anio}`;
  } else {
    titulo = `Correctivo-Varios UBT-${p.mes}-${p.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const hojas = colaImpresion.map(s=>renderSheetVisual(s,{role:'lectura'})).join('<div style="page-break-after:always;"></div>');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana emergente'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>${estilos}
    <style>body{background:#fff;margin:0;padding:10px;} .no-print{display:none !important;}
    @page{size:letter landscape;margin:8mm;}
    table.sheet-table{min-width:0 !important;width:100% !important;}
    .sheet-page{border:none;page-break-inside:avoid;}</style></head><body>${hojas}</body></html>`);
  ventana.document.close(); ventana.focus();
  setTimeout(()=>ventana.print(), 500);
}

async function confirmarAcceso(){
  const nombre = document.getElementById('nombre_input').value.trim();
  const gafete = document.getElementById('gafete_login').value.trim();
  const turnoSel = document.getElementById('turno_login').value;
  const subrolSel = document.getElementById('subrol_login')?.value || '';
  const codigo = document.getElementById('codigo_input').value;
  const recordar = document.getElementById('recordar_chk').checked;
  const esSupervisor = rolSeleccionadoTemp === 'supervisor';

  if(!nombre){ document.getElementById('nombre_input').style.borderColor='red'; return; }
  if(!esSupervisor && !gafete){ document.getElementById('gafete_login').style.borderColor='red'; showToast('⚠️ Escribe tu No. de Gafete'); return; }
  if(codigo !== STATE.codes[rolSeleccionadoTemp]){ document.getElementById('codigo_error').style.display='block'; return; }

  STATE.rol = rolSeleccionadoTemp; STATE.nombre = nombre;

  const existente = await getUsuario(nombre);
  if(existente && existente.bloqueado){ STATE.usuario = existente; render(); return; }

  if(existente){
    /* Ya estaba registrado: conservamos sus UBTs y solo actualizamos lo básico */
    STATE.usuario = {
      ...existente,
      rol: STATE.rol,
      gafete: esSupervisor ? '—' : (gafete || existente.gafete),
      turno: turnoSel, extraInicio:'', extraFin:'',
      subrol: rolSeleccionadoTemp==='produccion' ? subrolSel : ''
    };
  } else {
    STATE.usuario = { nombre, gafete: esSupervisor ? '—' : gafete, rol: STATE.rol, ubtsPorPlanta: {}, bloqueado:false, turno: turnoSel, extraInicio:'', extraFin:'', subrol: rolSeleccionadoTemp==='produccion' ? subrolSel : '' };
  }
  try{ await saveUsuario(STATE.usuario); }catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  if(recordar){
    localStorage.setItem('correctivo_usuario_guardado', JSON.stringify({nombre, rol:STATE.rol, gafete: STATE.usuario.gafete, turno: turnoSel}));
  }
  await activarNotificaciones(true);
  STATE.vista = 'menu';
  render();
}

async function abrirPaginaAutomatica(planta,ubt,maquina,mes,anio){
  let pagina = 1;
  while(true){
    const key = sheetKey(planta,ubt,maquina,mes,anio,pagina);
    let sheet = await getSheet(key);
    if(!sheet){ sheet = { planta, ubtNo:ubt, maquina, mes, anio, pagina, filas: [] }; await saveSheet(key, sheet); }
    if((sheet.filas||[]).length < MAX_FILAS_POR_HOJA){
      sheetActivaKey = key;
      sheetActivaParams = {planta,ubt,maquina,mes,anio,pagina};
      return;
    }
    pagina++;
  }
}
async function abrirHoja(){
  const maquina = document.getElementById('s_maquina').value;
  const mes = document.getElementById('s_mes').value;
  const anio = document.getElementById('s_anio').value.trim();
  await abrirPaginaAutomatica(STATE.plantaHoy, STATE.ubtElegida, maquina, mes, anio);
  render();
}
async function siguientePagina(){
  const p = sheetActivaParams;
  await abrirPaginaAutomatica(p.planta,p.ubt,p.maquina,p.mes,p.anio);
  render();
}

async function agregarFila(){
  const sintomas = document.getElementById('f_sintomas').value.trim();
  if(!sintomas){ showToast('⚠️ Escribe los Síntomas/Fallas'); return; }
  const sheet = await getSheet(sheetActivaKey);
  if((sheet.filas||[]).length >= MAX_FILAS_POR_HOJA){ showToast('⚠️ Esta hoja ya está llena'); render(); return; }
  if(!validarTiempos()){ showToast('⚠️ Revisa las horas antes de guardar'); return; }
  const solicitarApqp = document.getElementById('f_solicitar_apqp').checked;
  const hi = document.getElementById('f_hi').value;
  const hf = document.getElementById('f_hf').value;
  const numeroParte = document.getElementById('f_parte').value.trim();
  const parteDesc = document.getElementById('f_parte_desc').value.trim();
  const fila = {
    id: uid(),
    fecha: document.getElementById('f_fecha').value,
    horaInicio: hi,
    horaFinal: hf,
    minutosParo: minutosEntre(hi, hf),
    turno: document.getElementById('f_turno').value,
    tiempoExtra: document.getElementById('f_extra').checked,
    registradoEn: new Date().toISOString(),
    numeroParte, parteDesc,
    foto: fotoTemp || '',
    gafete: document.getElementById('f_gafete').value.trim(),
    sintomas, acciones: document.getElementById('f_acciones').value.trim(),
    material: document.getElementById('f_material').value.trim(),
    seMovioModulo: document.getElementById('f_movio').checked,
    seVerificoModulo: document.getElementById('f_verifico').checked,
    tecnico: STATE.nombre,
    firmaTecnicoImg: (STATE.usuario?.modoFirma==='dibujo' && STATE.usuario?.firma) ? STATE.usuario.firma : '',
    firmaAuditorNombre:'', firmaAuditorFecha:'',
    firmaAPQPNombre:'', firmaAPQPFecha:'',
    estadoAuditor: 'pendiente',
    estadoAPQP: solicitarApqp ? 'pendiente' : 'no_aplica',
    creadoEn: new Date().toISOString()
  };
  sheet.filas.push(fila);
  try{ await saveSheet(sheetActivaKey, sheet); }
  catch(err){ showToast('⚠️ No se pudo guardar: ' + (err.message||String(err))); return; }
  if(numeroParte) registrarRefaccion(numeroParte, parteDesc);
  fotoTemp = null; cacheHojasFallas = null;

  /* Notificar al auditor de calidad asignado a este UBT */
  const auditores = await destinatariosPara('auditor', sheet.planta, sheet.ubtNo);
  enviarNotificacion(
    auditores,
    '🔧 Reparación pendiente de tu firma',
    `${STATE.nombre} realizó una reparación en UBT ${sheet.ubtNo} (${sheet.maquina}). Necesita tu firma como Auditor de Calidad.`
  );

  /* Si se solicitó APQP, notificar también al APQP asignado */
  if(solicitarApqp){
    const apqps = await destinatariosPara('apqp', sheet.planta, sheet.ubtNo);
    enviarNotificacion(
      apqps,
      '✅ Firma de APQP solicitada',
      `${STATE.nombre} solicitó tu firma en UBT ${sheet.ubtNo} (${sheet.maquina}).`
    );
  }

  showToast('Registro guardado y notificado ✓');
  /* Regresa a la ventana de todas las UBT de la planta */
  sheetActivaKey = null;
  STATE.ubtElegida = null;
  render();
}

async function guardarUbtsProd(multi){
  const sel = [...document.querySelectorAll('.ubt-chk:checked')].map(c=>c.value);
  if(sel.length===0){ showToast('⚠️ Selecciona al menos una UBT'); return; }
  if(!multi && sel.length>1){ showToast('⚠️ Como Operador solo puedes elegir una'); return; }
  if(!STATE.usuario.ubtsPorPlanta) STATE.usuario.ubtsPorPlanta = {};
  STATE.usuario.ubtsPorPlanta[STATE.plantaHoy] = sel;
  if(!multi) STATE.ubtElegida = sel[0];
  await saveUsuario(STATE.usuario);
  STATE.editandoUbts = false;
  showToast('Guardado ✓');
  render();
}

    <h2 style="justify-content:center;">💡 Foco de Mantenimiento</h2>
    <p style="font-size:13px;color:var(--muted);margin-top:-8px;">Solicita ayuda de un técnico para tu línea.</p>
    <button onclick="abrirVista('foco')" style="background:${miaRecibida?'#1a7a3c':(miasAbiertas.length?'#e0b400':'#f0f2f4')};border:3px solid ${miaRecibida?'#146030':(miasAbiertas.length?'#c77700':'#d4d8dc')};border-radius:50%;width:120px;height:120px;font-size:52px;cursor:pointer;transition:.2s;box-shadow:${miasAbiertas.length?(miaRecibida?'0 0 26px #1a7a3c88':'0 0 26px #e0b40088'):'none'};">${miaRecibida?'🔧':'💡'}</button>
    ${miasAbiertas.length ? `
      <div style="margin-top:12px;display:inline-block;text-align:left;background:${miaRecibida?'#f4faf5':'#fffdf5'};border:1px solid ${miaRecibida?'#cfe3d4':'#f0c674'};border-radius:10px;padding:11px 14px;font-size:13px;max-width:420px;">
        ${miaRecibida ? `<b style="color:#1a7a3c;">✓ Tu solicitud fue recibida</b><br>Técnico <b>${escapeHtml(miaRecibida.atendido_por||'')}</b> · UBT ${escapeHtml(miaRecibida.ubt_no)} · ${escapeHtml(miaRecibida.maquina)}`
          : `<b style="color:#a16d07;">● Enviada, aún sin recibir</b><br>Hace ${minutosDesde(miaEsperando.creado_en)} min · UBT ${escapeHtml(miaEsperando.ubt_no)} · ${escapeHtml(miaEsperando.maquina)}`}
        <div style="margin-top:7px;"><button class="btn ghost small" onclick="abrirVista('foco')">Ver detalle</button></div>
      </div>`
      : `<div style="margin-top:12px;font-size:13.5px;font-weight:700;color:${misPend.length?'#c77700':'var(--muted)'};">
        ${misPend.length ? `${misPend.length} solicitud(es) activa(s) en tu planta` : 'Toca el foco para solicitar mantenimiento'}
      </div>`}
  </div>`;
}

function misUbtsProd(){
  const a = STATE.usuario?.ubtsPorPlanta || {};
  return a[STATE.plantaHoy] || [];
}

async function guardarMaquinaOperador(){
  STATE.usuario.maquina = document.getElementById('prod_maquina').value;
  await saveUsuario(STATE.usuario);
  showToast('Máquina guardada ✓');
  render();
}

/* ---------- TPM ---------- */
async function cargarZonaTpm(){
  const zona = document.getElementById('tpm_zona');
  if(!zona) return;
  const sub = STATE.usuario?.subrol || 'operador';
  const puedeLlenar = SUBROLES_PROD[sub]?.puedeLlenarTpm;

  if(sub === 'operador'){
    const reg = await getTpmHoy(STATE.plantaHoy, STATE.ubtElegida, STATE.usuario.maquina, STATE.usuario.turno);
    zona.innerHTML = renderFormularioTpm(reg, STATE.ubtElegida, STATE.usuario.maquina, true);
    return;
  }

  /* Supervisor, Líder y Multifuncional: ven el estado de todas sus UBT */
  const ubts = misUbtsProd();
  const regs = await listTpmDelDia(STATE.plantaHoy, ubts);
  const porUbt = {};
  regs.forEach(r => (porUbt[r.ubt_no] ??= []).push(r));

  zona.innerHTML = `
    <p style="font-size:12.5px;color:var(--muted);">Estado del TPM de hoy en tus líneas${puedeLlenar?' — como Líder puedes llenarlo en caso de ausencia.':' (solo lectura).'}</p>
    ${ubts.length===0 ? '<div class="empty">No tienes UBT asignadas.</div>' :
      ubts.map(ub=>{
        const lista = porUbt[ub]||[];
        return `<details style="margin-bottom:8px;">
          <summary style="cursor:pointer;padding:8px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:13px;">
            📍 UBT ${escapeHtml(ub)} — ${lista.filter(x=>x.completo).length}/${lista.length} completado(s)
          </summary>
          <div style="padding:10px 0 0 12px;">
            ${lista.length===0 ? '<div class="empty">Sin TPM registrado hoy en esta línea.</div>' :
              lista.map(r=>`<div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f2;font-size:13px;flex-wrap:wrap;gap:6px;">
                <span>⚙️ ${escapeHtml(r.maquina)} <span style="color:var(--muted);font-size:11.5px;">(${escapeHtml(r.operador)})</span></span>
                <span>${r.completo?'<span class="badge-est act">✓ Completo</span>':'<span class="badge-est bloq">● Incompleto</span>'}</span>
              </div>`).join('')}
            ${puedeLlenar?`<button class="btn small secondary" style="margin-top:10px;" onclick="abrirTpmSuplencia('${ub.replace(/'/g,"\\\\'")}')">✍️ Llenar TPM por ausencia</button>`:''}
          </div>
        </details>`;
      }).join('')}`;
}

function renderFormularioTpm(reg, ubt, maquina, esPropio){
  const dia = diaHoy();
  const marcas = (reg && reg.actividades) ? reg.actividades : {};
  const yaCompleto = reg && reg.completo;

  if(yaCompleto){
    return `<div style="background:#e8f4ea;border-radius:10px;padding:16px;text-align:center;">
      <div style="font-size:34px;">✅</div>
      <div style="font-weight:800;font-size:15px;margin-top:6px;">TPM de hoy completado</div>
      <div style="font-size:12.5px;color:var(--muted);margin-top:4px;">
        ${escapeHtml(maquina)} · ${dia} · Llenado por ${escapeHtml(reg.llenado_por||reg.operador)}
      </div>
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">Solo se puede llenar una vez al día.</div>
    </div>`;
  }

  return `
    <div style="background:#fff7e6;border-left:4px solid #e0b400;border-radius:8px;padding:10px;margin-bottom:14px;font-size:12.5px;">
      Marca cada actividad conforme la completes. Solo se puede marcar el día de hoy (<b>${dia}</b>).
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-bottom:10px;">⚙️ ${escapeHtml(maquina)} · UBT ${escapeHtml(ubt)}</div>
    ${TPM_ACTIVIDADES.map(a=>`
      <label style="display:flex;gap:10px;align-items:flex-start;padding:11px;border:1px solid #e2e5e8;border-radius:9px;margin-bottom:8px;cursor:pointer;background:${marcas[a.id]?'#e8f4ea':'#fff'};">
        <input type="checkbox" class="tpm-chk" data-act="${a.id}" ${marcas[a.id]?'checked':''} onchange="this.closest('label').style.background=this.checked?'#e8f4ea':'#fff';actualizarProgresoTpm();" style="margin-top:2px;width:20px;height:20px;">
        <span>
          <b style="font-size:13.5px;">${a.sub}</b>
          <div style="font-size:12px;color:var(--muted);margin-top:2px;">${a.texto}</div>
        </span>
      </label>`).join('')}
    <div id="tpm_progreso" style="font-size:13px;font-weight:700;margin:12px 0;text-align:center;"></div>
    <button class="btn" onclick="guardarTpm('${ubt.replace(/'/g,"\\'")}','${maquina.replace(/'/g,"\\'")}')">✓ Finalizar TPM y notificar al Auditor</button>`;
}

function actualizarProgresoTpm(){
  const chks = [...document.querySelectorAll('.tpm-chk')];
  const hechas = chks.filter(c=>c.checked).length;
  const el = document.getElementById('tpm_progreso');
  if(el) el.innerHTML = `${hechas} de ${chks.length} actividades completadas` +
    (hechas===chks.length ? ' <span style="color:#1a7a3c;">✓ Listo para finalizar</span>' : '');
}

async function guardarTpm(ubt, maquina, operadorNombre){
  const chks = [...document.querySelectorAll('.tpm-chk')];
  const actividades = {};
  chks.forEach(c=>{ actividades[c.dataset.act] = c.checked; });
  const todas = chks.every(c=>c.checked);
  if(!todas && !confirm('No marcaste todas las actividades. ¿Guardar de todos modos como incompleto?')) return;

  const esSuplencia = !!operadorNombre;
  const reg = {
    id: uid(),
    fecha: todayISO(),
    planta: STATE.plantaHoy,
    ubt_no: ubt,
    maquina: maquina,
    turno: STATE.usuario.turno,
    operador: esSuplencia ? operadorNombre : STATE.nombre,
    gafete: STATE.usuario?.gafete || '',
    llenado_por: STATE.nombre,
    rol_llenado: STATE.usuario?.subrol || '',
    actividades,
    completo: todas,
    creado_en: new Date().toISOString()
  };
  try{ await saveTpm(reg); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  /* Notificar al auditor de la misma línea y turno */
  const usuarios = await listUsuarios();
  const auditores = usuarios.filter(u =>
    u.rol==='auditor' && !u.bloqueado &&
    ((u.ubtsPorPlanta||{})[STATE.plantaHoy]||[]).includes(ubt) &&
    (!u.turno || u.turno === STATE.usuario.turno)
  ).map(u=>slug(u.nombre));

  enviarNotificacion(
    auditores,
    '📋 TPM diario realizado',
    `El Operador ${reg.operador} de la UBT ${ubt} realizó el TPM diario en la máquina ${maquina}.${esSuplencia?` (Llenado por ${STATE.nombre} por ausencia)`:''}`
  );

  showToast('✓ TPM registrado y auditor notificado');
  render();
}

let tpmSuplenciaUbt = null;
function abrirTpmSuplencia(ubt){
  tpmSuplenciaUbt = ubt;
  STATE.vista = 'tpm_suplencia';
  render();
}

function renderTpmSuplencia(){
  return `
  <div class="card"><button class="btn ghost small" onclick="STATE.vista=null;render();">← Volver</button></div>
  <div class="card">
    <h2>✍️ Llenar TPM por ausencia — UBT ${escapeHtml(tpmSuplenciaUbt)}</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Quedará registrado que tú lo llenaste en lugar del operador.</p>
    <div class="row2">
      <div class="field"><label>Máquina</label><select id="sup_maquina">${MAQ_COR.map(m=>`<option>${m}</option>`).join('')}</select></div>
      <div class="field"><label>Nombre del operador ausente</label><input id="sup_operador" placeholder="Nombre del operador"></div>
    </div>
    <div id="sup_form"></div>
    <button class="btn secondary" onclick="prepararTpmSuplencia()">Continuar al checklist</button>
  </div>`;
}

function prepararTpmSuplencia(){
  const maq = document.getElementById('sup_maquina').value;
  const op = document.getElementById('sup_operador').value.trim();
  if(!op){ showToast('⚠️ Escribe el nombre del operador ausente'); return; }
  const cont = document.getElementById('sup_form');
  cont.innerHTML = `<div style="margin-top:14px;">${renderFormularioTpm(null, tpmSuplenciaUbt, maq, false)}</div>`;
  cont.querySelector('button.btn').setAttribute('onclick', `guardarTpm('${tpmSuplenciaUbt.replace(/'/g,"\\'")}','${maq.replace(/'/g,"\\'")}','${op.replace(/'/g,"\\'")}')`);
  actualizarProgresoTpm();
}

/* ---------- Foco de mantenimiento ---------- */
function esOperadorProd(){
  const sub = STATE.usuario?.subrol || 'operador';
  return STATE.rol==='produccion' && sub==='operador';
}

async function renderFoco(){
  const todas = await listSolicitudesRecientes(STATE.plantaHoy);
  const activas = todas.filter(x=>x.estado!=='terminada');
  const mias = todas.filter(x=>slug(x.solicitante)===slug(STATE.nombre));
  const miasAbiertas = mias.filter(x=>x.estado!=='terminada');
  const soloOperador = esOperadorProd();
  const ubtsDisp = soloOperador ? [STATE.ubtElegida] : misUbtsProd();
  const maqFija = STATE.usuario?.maquina || '';

  if(soloOperador && !maqFija){
    return `
    <div class="card"><button class="btn ghost small" onclick="irInicio()">← Volver</button></div>
    <div class="card">
      <h2>⚙️ Falta configurar tu máquina</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:-8px;">Antes de solicitar mantenimiento debes elegir en qué máquina trabajas. Solo se pide una vez.</p>
      <div class="field"><select id="prod_maquina">${MAQ_COR.map(m=>`<option>${escapeHtml(m)}</option>`).join('')}</select></div>
      <button class="btn" onclick="guardarMaquinaOperador()">Guardar y continuar</button>
    </div>`;
  }

  const bloqueSolicitar = soloOperador ? `
    <div class="row2">
      <div class="field"><label>UBT</label>
        <div class="dato-fijo">📍 ${escapeHtml(STATE.ubtElegida||'')} <span class="lock">· fija</span></div>
        <input type="hidden" id="fo_ubt" value="${escapeHtml(STATE.ubtElegida||'')}">
      </div>
      <div class="field"><label>Máquina</label>
        <div class="dato-fijo">⚙️ ${escapeHtml(maqFija)} <span class="lock">· fija</span></div>
        <input type="hidden" id="fo_maquina" value="${escapeHtml(maqFija)}">
      </div>
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin:-4px 0 12px;">Tu línea y tu máquina ya están asignadas. Si necesitas cambiarlas, avisa a tu líder o supervisor.</p>
  ` : `
    <div class="row2">
      <div class="field"><label>UBT</label><select id="fo_ubt">${ubtsDisp.map(u=>`<option>${escapeHtml(u)}</option>`).join('')}</select></div>
      <div class="field"><label>Máquina o elemento</label><select id="fo_maquina">${maquinasParaFoco().map(m=>`<option>${escapeHtml(m)}</option>`).join('')}</select></div>
    </div>`;

  return `
  <div class="card"><button class="btn ghost small" onclick="irInicio()">← Volver</button></div>

  <div class="card" id="zona_mis_solicitudes">${renderMisSolicitudes(mias)}</div>

  <div class="card">
    <h2>💡 Solicitar Mantenimiento</h2>
    ${miasAbiertas.length ? `<div style="background:#fff7e6;border:1px solid #f0c674;border-radius:8px;padding:9px 11px;font-size:12.5px;margin-bottom:12px;">Ya tienes ${miasAbiertas.length} solicitud(es) abierta(s). Envía otra solo si es una falla distinta.</div>` : ''}
    ${bloqueSolicitar}
    <div class="field"><label>Nota (opcional)</label><textarea id="fo_nota" placeholder="Describe brevemente qué ocurre..."></textarea></div>
    <button class="btn" style="background:#e0b400;color:#1a1a1a;" onclick="encenderFoco()">💡 Encender foco y solicitar mantenimiento</button>
  </div>

  <div class="card" id="zona_activas">${renderActivasPlanta(activas)}</div>`;
}

function renderMisSolicitudes(mias){
  const abiertas = mias.filter(x=>x.estado!=='terminada');
  const cerradas = mias.filter(x=>x.estado==='terminada').slice(0,3);
  return `<h2>📨 Mis solicitudes</h2>
    ${abiertas.length===0 ? '<div class="empty">No tienes solicitudes abiertas.<br>Si tu línea necesita un técnico, enciende el foco abajo.</div>'
      : abiertas.map(tarjetaMiSolicitud).join('')}
    ${cerradas.length ? `<div style="font-size:12px;color:var(--muted);margin-top:6px;">Terminadas hoy: ${cerradas.map(s=>escapeHtml(s.maquina)+' ('+escapeHtml(s.terminado_por||s.atendido_por||'')+')').join(' · ')}</div>` : ''}`;
}

function renderActivasPlanta(activas){
  return `<h2>🔆 Solicitudes activas en ${escapeHtml(STATE.plantaHoy)} (${activas.length})</h2>
    ${activas.length===0 ? '<div class="empty">Sin solicitudes activas.</div>' :
      activas.map(s=>tarjetaSolicitud(s,false)).join('')}`;
}

/* Tarjeta con la linea de estado, para que el solicitante sepa si ya la recibieron */
function tarjetaMiSolicitud(s){
  const min = minutosDesde(s.creado_en);
  const recibida = s.estado==='atendida' || s.estado==='terminada';
  const terminada = s.estado==='terminada';
  const tarde = !recibida && min >= 10;
  const color = terminada ? '#0f3d5c' : (recibida ? '#1a7a3c' : (tarde ? '#a13636' : '#a16d07'));
  const fondo = terminada ? '#eef4f8' : (recibida ? '#f4faf5' : (tarde ? '#fdf1f1' : '#fffdf5'));
  const borde = terminada ? '#bcd4e4' : (recibida ? '#cfe3d4' : (tarde ? '#e9b7b7' : '#f0c674'));
  const paso = (ok,txt)=>`<div class="paso ${ok?'ok':'no'}"><span class="bolita">${ok?'✓':'•'}</span><span>${txt}</span></div>`;
  return `
  <div style="border:1px solid ${borde};border-left:5px solid ${color};background:${fondo};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
      <b style="font-size:14.5px;">${terminada?'🏁':(recibida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b>
      <span class="badge-est ${terminada?'fin':(recibida?'act':'esp')}">${terminada?'Terminada':(recibida?'Recibida':'Esperando técnico')}</span>
    </div>
    ${s.nota?`<div style="font-size:12.5px;color:var(--muted);margin-top:5px;">${escapeHtml(s.nota)}</div>`:''}
    <div style="margin-top:10px;border-top:1px dashed ${borde};padding-top:6px;">
      ${paso(true, `Enviada · hace ${min} min`)}
      ${paso(recibida, recibida
          ? `Recibida por <b>${escapeHtml(s.atendido_por||'un técnico')}</b>${s.atendido_en?` · hace ${minutosDesde(s.atendido_en)} min`:''}`
          : (tarde ? `<b style="color:#a13636;">Todavía nadie la recibe (${min} min)</b> — se les está recordando` : 'Aún no la recibe ningún técnico'))}
      ${paso(terminada, terminada
          ? `Trabajo terminado por <b>${escapeHtml(s.terminado_por||s.atendido_por||'')}</b>`
          : 'Trabajo sin terminar')}
    </div>
    ${!recibida ? `<button class="btn ghost small" style="margin-top:10px;" onclick="cancelarMiFoco('${s.id}')">✖ Ya no la necesito</button>` : ''}
  </div>`;
}

/* Auto refresco del estado mientras el operador está en la pantalla del foco */
let intervaloFoco = null;
function iniciarAutoRefrescoFoco(){
  pararAutoRefrescoFoco();
  intervaloFoco = setInterval(refrescarFoco, 20000);
}
function pararAutoRefrescoFoco(){
  if(intervaloFoco){ clearInterval(intervaloFoco); intervaloFoco = null; }
}
async function refrescarFoco(){
  const z1 = document.getElementById('zona_mis_solicitudes');
  const z2 = document.getElementById('zona_activas');
  if(!z1 && !z2){ pararAutoRefrescoFoco(); return; }
  if(STATE.vista !== 'foco'){ pararAutoRefrescoFoco(); return; }
  const todas = await listSolicitudesRecientes(STATE.plantaHoy);
  if(z1) z1.innerHTML = renderMisSolicitudes(todas.filter(x=>slug(x.solicitante)===slug(STATE.nombre)));
  if(z2) z2.innerHTML = renderActivasPlanta(todas.filter(x=>x.estado!=='terminada'));
}

async function cancelarMiFoco(id){
  if(!confirm('¿Cancelar esta solicitud de mantenimiento?')) return;
  try{
    await sbFetch('solicitudes?id=eq.'+encodeURIComponent(id), { method:'DELETE', prefer:'return=minimal' });
    showToast('Solicitud cancelada');
  }catch(e){ showToast('⚠️ No se pudo cancelar'); }
  refrescarFoco();
}

function minutosDesde(iso){
  return Math.max(0, Math.floor((Date.now() - new Date(iso).getTime())/60000));
}

function tarjetaSolicitud(s, esTecnico){
  const min = minutosDesde(s.creado_en);
  const terminada = s.estado === 'terminada';
  const atendida = s.estado === 'atendida';
  const color = terminada ? '#0f3d5c' : (atendida ? '#1a7a3c' : '#e0b400');
  const fondo = terminada ? '#eef4f8' : (atendida ? '#f4faf5' : '#fffdf5');
  const borde = terminada ? '#bcd4e4' : (atendida ? '#cfe3d4' : '#f0c674');
  const etiqueta = terminada ? ('Terminada por '+escapeHtml(s.terminado_por||s.atendido_por||''))
                 : (atendida ? ('Recibida por '+escapeHtml(s.atendido_por||'')) : ('Sin recibir · hace '+min+' min'));
  return `
  <div style="border:1px solid ${borde};background:${fondo};border-left:5px solid ${color};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <b style="font-size:14px;">${terminada?'🏁':(atendida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b>
      <span class="badge-est ${terminada?'fin':(atendida?'act':'esp')}">${etiqueta}</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">
      Solicitó: <b>${escapeHtml(s.solicitante)}</b>${s.rol_solicitante?(' ('+escapeHtml(SUBROLES_PROD[s.rol_solicitante]?.label||s.rol_solicitante)+')'):''} · ${escapeHtml(s.planta)} · Turno ${escapeHtml(s.turno||'')}
    </div>
    ${s.nota?`<div style="font-size:13px;margin-top:8px;">${escapeHtml(s.nota)}</div>`:''}
    ${esTecnico && !atendida && !terminada ? `<button class="btn small" style="margin-top:10px;background:#e0b400;color:#1a1a1a;" onclick="atenderFoco('${s.id}')">💡 Recibir esta solicitud</button>` : ''}
    ${esTecnico && atendida ? `<button class="btn small secondary" style="margin-top:10px;" onclick="terminarFoco('${s.id}')">🏁 Marcar trabajo terminado</button>` : ''}
  </div>`;
}

async function encenderFoco(){
  const ubt = document.getElementById('fo_ubt').value;
  const maquina = document.getElementById('fo_maquina').value;
  const nota = document.getElementById('fo_nota').value.trim();

  const sol = {
    id: uid(),
    planta: STATE.plantaHoy,
    ubt_no: ubt,
    maquina,
    solicitante: STATE.nombre,
    rol_solicitante: STATE.usuario?.subrol || '',
    gafete: STATE.usuario?.gafete || '',
    turno: STATE.usuario?.turno || '',
    nota,
    estado: 'pendiente',
    creado_en: new Date().toISOString(),
    ultimo_recordatorio: new Date().toISOString()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(
    tecnicos,
    '💡 Solicitud de mantenimiento',
    `Se solicitó mantenimiento en la UBT ${ubt} en la máquina ${maquina}, por ${STATE.nombre}.`
  );

  showToast('💡 Foco encendido — técnicos notificados');
  render();
}

async function atenderFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'atendida'){ showToast('Esta solicitud ya fue atendida'); render(); return; }

  s.estado = 'atendida';
  s.atendido_por = STATE.nombre;
  s.atendido_en = new Date().toISOString();
  await saveSolicitud(s);

  /* Avisar a quien solicitó */
  enviarNotificacion([slug(s.solicitante)], '🔧 Tu solicitud fue recibida',
    `El Técnico ${STATE.nombre} recibió tu solicitud de la UBT ${s.ubt_no} (${s.maquina}) y va en camino.`);

  /* Avisar a los demás técnicos */
  const usuarios = await listUsuarios();
  const otros = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado && slug(u.nombre)!==slug(STATE.nombre)).map(u=>slug(u.nombre));
  enviarNotificacion(otros, '💡 Solicitud tomada',
    `Tu compañero ${STATE.nombre} atenderá la solicitud de la UBT ${s.ubt_no}.`);

  showToast('✓ Solicitud recibida — se avisó al solicitante');
  render();
}

async function terminarFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'terminada'){ showToast('Ya estaba marcada como terminada'); render(); return; }

  s.estado = 'terminada';
  /* Solo se mandan estas columnas si existen en la tabla */
  if('terminado_por' in s) s.terminado_por = STATE.nombre;
  if('terminado_en' in s) s.terminado_en = new Date().toISOString();
  try{ await saveSolicitud(s); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  enviarNotificacion([slug(s.solicitante)], '🏁 Trabajo terminado',
    `${STATE.nombre} terminó el trabajo en la UBT ${s.ubt_no} (${s.maquina}). El foco se apagó.`);

  showToast('🏁 Solicitud terminada');
  render();
}

/* ---------- Recordatorios automáticos ---------- */
let intervaloRecordatorios = null;

function iniciarRecordatorios(){
  if(intervaloRecordatorios) clearInterval(intervaloRecordatorios);
  if(!['tecnico','supervisor','produccion'].includes(STATE.rol)) return;
  revisarRecordatorios();
  intervaloRecordatorios = setInterval(revisarRecordatorios, 60000);
}

async function revisarRecordatorios(){
  try{
    const pendientes = await listSolicitudes(true);
    const ahora = Date.now();
    for(const s of pendientes){
      const ultimo = new Date(s.ultimo_recordatorio || s.creado_en).getTime();
      if(ahora - ultimo >= 5*60*1000){
        const min = minutosDesde(s.creado_en);
        const usuarios = await listUsuarios();
        const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
        enviarNotificacion(tecnicos, '💡 Solicitud SIN ATENDER',
          `Se solicitó mantenimiento en la UBT ${s.ubt_no} en la máquina ${s.maquina}, por ${s.solicitante}. Se solicitó hace ${min} minutos.`);
        s.ultimo_recordatorio = new Date().toISOString();
        await saveSolicitud(s);
      }
    }
  }catch(e){ console.warn(e); }
}

function renderAgrupadoPorPlantaUbtMaquina(sheets, viewerRole){

/* ---------- Imprimir una hoja individual ---------- */
function imprimirHoja(elId, sheetKey){
  const target = document.getElementById(elId);
  if(!target){ showToast('⚠️ No se encontró la hoja'); return; }
  const contenido = target.querySelector('.sheet-page');
  if(!contenido){ showToast('⚠️ No se encontró el formato'); return; }

  const s = colaImpresion.find(x=>x.key===sheetKey) || target.__sheet;
  let titulo = 'Correctivo';
  if(target.dataset.maquina){
    titulo = `Correctivo-${target.dataset.maquina}-${target.dataset.ubt}-${target.dataset.mes}-${target.dataset.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${titulo}</title>${estilos}
    <style>
      body{background:#fff;margin:0;padding:10px;}
      .no-print{display:none !important;}
      @page{size:letter landscape;margin:8mm;}
      table.sheet-table{min-width:0 !important;width:100% !important;}
      .sheet-page{border:none;}
    </style></head><body>${contenido.outerHTML}</body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>{ ventana.print(); }, 400);
}

async function toggleBloqueoUsuario(nombre, estaBloqueado){
  const u = await getUsuario(nombre);
  if(!u) return;
  u.bloqueado = !estaBloqueado;
  await saveUsuario(u);
  showToast(u.bloqueado ? '🔒 Usuario bloqueado' : '🔓 Usuario desbloqueado');
  render();
}

async function toggleEditUsuario(uid, nombre){
  const btn = document.getElementById('au_editbtn_'+uid);
  const nombreEl = document.getElementById('au_nombre_'+uid);
  const rolEl = document.getElementById('au_rol_'+uid);
  const gafeteEl = document.getElementById('au_gafete_'+uid);
  const editing = btn.textContent.includes('Guardar');
  if(!editing){
    nombreEl.disabled = false; rolEl.disabled = false; gafeteEl.disabled = false;
    rolEl.style.display = 'inline-block';
    btn.textContent = '💾 Guardar';
  } else {
    const nuevoNombre = nombreEl.value.trim();
    const nuevoRol = rolEl.value;
    const nuevoGafete = gafeteEl.value.trim();
    const usuarioViejo = await getUsuario(nombre);
    const actualizado = { ...usuarioViejo, nombre: nuevoNombre, rol: nuevoRol, gafete: nuevoGafete };
    if(slug(nuevoNombre) !== slug(nombre)){
      await deleteUsuario(nombre);
    }
    await saveUsuario(actualizado);
    showToast('Usuario actualizado ✓');
    render();
  }
}
function confirmarBorrarUsuario(btn, nombre){
  if(btn.dataset.confirm==='1'){ eliminarUsuario(nombre); return; }
  btn.dataset.confirm = '1';
  btn.textContent = '¿Seguro? Toca de nuevo';
  setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑 Borrar'; }, 3000);
}
async function eliminarUsuario(nombre){
  await deleteUsuario(nombre);
  showToast('Usuario eliminado ✓');
  render();
}

async function encenderFocoPrueba(){
  const sol = {
    id: uid(),
    planta: document.getElementById('tf_planta').value,
    ubt_no: document.getElementById('tf_ubt').value,
    maquina: document.getElementById('tf_maquina').value,
    solicitante: document.getElementById('tf_nombre').value.trim() || 'Prueba Admin',
    rol_solicitante: 'operador',
    gafete: '000000',
    turno: 'TA',
    nota: '(Solicitud de prueba generada desde Administrador)',
    estado: 'pendiente',
    creado_en: new Date().toISOString(),
    ultimo_recordatorio: new Date().toISOString()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(tecnicos, '💡 Solicitud de mantenimiento (PRUEBA)',
    `Se solicitó mantenimiento en la UBT ${sol.ubt_no} en la máquina ${sol.maquina}, por ${sol.solicitante}.`);

  showToast(`💡 Foco de prueba encendido — ${tecnicos.length} técnico(s) notificados`);
  cargarFocosAdmin();
}

  const cont = document.getElementById('tf_lista');

        <button class="btn ghost small" style="margin-left:8px;color:#a13636;" onclick="borrarSolicitud('${s.id}')">✖ Borrar</button>
      </div>`).join('');

async function cargarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  const info = document.getElementById('cat_info');
  if(!ta) return;
  const refs = await listRefacciones();
  ta.value = refs.map(r=>r.descripcion ? `${r.numero_parte}, ${r.descripcion}` : r.numero_parte).join('\n');
  if(info) info.textContent = `${refs.length} número(s) de parte en el catálogo.`;
}

async function guardarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  if(!ta) return;
  const lineas = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lineas.length === 0){ showToast('⚠️ El catálogo está vacío'); return; }
  showToast(`Guardando ${lineas.length} número(s)...`);
  let ok = 0;
  for(const linea of lineas){
    const partes = linea.split(',');
    const numero = partes[0].trim();
    const desc = partes.slice(1).join(',').trim();
    if(!numero) continue;
    try{
      await sbFetch('refacciones?on_conflict=numero_parte', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body: JSON.stringify({ numero_parte:numero, descripcion:desc, ultima_vez:new Date().toISOString() })
      });
      ok++;
    }catch(e){ console.warn(e); }
  }
  showToast(`✓ ${ok} número(s) de parte guardados`);
  cargarCatalogoPartes();
}

async function exportarCatalogoPartes(){
  const refs = await listRefacciones();
  const filas = [['No. de Parte','Descripcion','Veces usada','Ultima vez']];
  refs.forEach(r=>filas.push([r.numero_parte, r.descripcion||'', r.veces_usada||0, r.ultima_vez?new Date(r.ultima_vez).toLocaleDateString('es-MX'):'']));
  descargarCSV('catalogo-refacciones-'+todayISO()+'.csv', filas);
}

async function guardarTurnos(){

  Object.keys(nuevo).forEach(k=>{
    const i = document.getElementById('tur_'+k+'_ini'), f = document.getElementById('tur_'+k+'_fin');
    if(i) nuevo[k].inicio = i.value;
    if(f) nuevo[k].fin = f.value;
  });
  STATE.turnosCfg = nuevo;
  await saveTurnosConfig(nuevo);
  showToast('Horarios actualizados ✓');
}

async function guardarCodigos(){
  const nuevos = {};
  let vacios = [];
  Object.keys(ROLES).forEach(k=>{
    const el = document.getElementById('code_'+k);
    if(el){
      const val = el.value.trim();
      if(!val){ vacios.push(ROLES[k].label); nuevos[k] = DEFAULT_CODES[k] || ''; }
      else nuevos[k] = val;
    }
  });
  if(vacios.length){ showToast('⚠️ Se usó el código por defecto para: ' + vacios.join(', ')); }
  STATE.codes = nuevos;
  await saveConfig(nuevos);
  showToast('Códigos actualizados ✓');
}

function cajaQR(contenedor, url, titulo, subtitulo, color){
  const box = document.createElement('div');

  const qrDiv = document.createElement('div');
  box.appendChild(qrDiv);
  const label = document.createElement('div');
  label.className = 'label';

async function borrarSeleccionCorrectivos(){
  const alcance = document.getElementById('bs_alcance').value;
  const planta = document.getElementById('bs_planta').value;
  const ubt = document.getElementById('bs_ubt').value;
  const maquina = document.getElementById('bs_maquina').value;
  const btn = document.getElementById('bs_btn');

  const todas = await listSheets();
  let objetivo = [];
  let desc = '';
  if(alcance === 'planta'){
    objetivo = todas.filter(s=>s.planta===planta);
    desc = `todos los correctivos de ${planta}`;
  } else if(alcance === 'ubt'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
    desc = `los correctivos de UBT ${ubt} (${planta})`;
  } else if(alcance === 'maquina'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt && s.maquina===maquina);
    desc = `los correctivos de ${maquina} en UBT ${ubt} (${planta})`;
  }

  if(objetivo.length === 0){ showToast('No hay hojas que coincidan'); return; }

  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = `⚠️ Toca de nuevo para borrar ${objetivo.length} hoja(s) — ${desc}`;
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑️ Borrar la selección'; }, 6000);
    return;
  }

  btn.textContent = 'Borrando...';
  let ok=0;
  for(const s of objetivo){
    try{
      await sbFetch('hojas?clave=eq.'+encodeURIComponent(s.key), { method:'DELETE', prefer:'return=minimal' });
      ok++;
    }catch(e){ console.warn(e); }
  }
  colaImpresion = [];
  btn.dataset.confirm='';
  showToast(`✓ ${ok} hoja(s) borradas — ${desc}`);
  render();
}

document.addEventListener('input', e => {
  const t = e.target;
  if(!(t instanceof HTMLInputElement) && !(t instanceof HTMLTextAreaElement)) return;
  if(t.type === 'password' || t.type === 'number' || t.type === 'date' || t.type === 'time') return;
  if(t.dataset.noCap === '1') return;
  const v = t.value;
  if(v.length > 0 && v[0] !== v[0].toUpperCase()){
    const pos = t.selectionStart;
    t.value = v[0].toUpperCase() + v.slice(1);
    try{ t.setSelectionRange(pos, pos); }catch(e){}
  }
});

/* ---------- Validación de tiempos ---------- */
function validarTiempos(){
  const fEl=document.getElementById('f_fecha'), hiEl=document.getElementById('f_hi'), hfEl=document.getElementById('f_hf');
  const aviso=document.getElementById('aviso_tiempo');
  if(!fEl||!hiEl||!hfEl||!aviso) return true;

  const hoy = todayISO();
  const ahora = new Date();
  const horaAhora = String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0');

  const mostrar=(txt,tipo)=>{
    aviso.style.display='block';
    aviso.innerHTML=txt;
    aviso.style.background = tipo==='error' ? '#fde8e8' : '#fff7e6';
    aviso.style.color = tipo==='error' ? '#a13636' : '#8a6d1f';
    aviso.style.borderLeft = '4px solid ' + (tipo==='error' ? '#a13636' : '#e0b400');
  };

  if(fEl.value > hoy){ fEl.value = hoy; mostrar('⚠️ No se pueden registrar fechas futuras. Se ajustó a hoy.','error'); return false; }

  /* Si es hoy, avisar (sin modificar) cuando la hora es futura */
  let hayFutura = false;
  if(fEl.value === hoy){
    if(hiEl.value && hiEl.value > horaAhora) hayFutura = true;
    if(hfEl.value && hfEl.value > horaAhora) hayFutura = true;
  }
  if(hayFutura) mostrar('⚠️ Estás registrando una hora futura. Verifica que sea correcta.','warn');

  const tEl = document.getElementById('f_turno');
  if(tEl && hiEl.value && !tEl.dataset.manual) tEl.value = turnoDeHora(hiEl.value);

  if(hiEl.value && hfEl.value){
    const min = minutosEntre(hiEl.value, hfEl.value);
    if(min === 0){ mostrar('⚠️ La hora final debe ser distinta a la de inicio.','error'); return false; }
    if(min > 480){ mostrar(`⏱️ Duración registrada: <b>${formatoDuracion(min)}</b>. Es bastante larga — verifica que sea correcta.`,'warn'); return true; }
    mostrar(`⏱️ Tiempo muerto: <b>${formatoDuracion(min)}</b>`,'warn');
    return true;
  }
  aviso.style.display='none';
  return true;
}

  const txt = txtEl.value.trim().toLowerCase();
  if(txt.length < 5){ cont.style.display='none'; return; }

  if(!cacheHojasFallas) cacheHojasFallas = await listSheets();
  const sheet = await getSheet(sheetActivaKey);
  if(!sheet) return;

  const palabras = txt.split(/\s+/).filter(w=>w.length>3);
  const coincidencias = [];
  cacheHojasFallas
    .filter(h => h.planta===sheet.planta && h.ubtNo===sheet.ubtNo && h.maquina===sheet.maquina)
    .forEach(h => (h.filas||[]).forEach(f=>{
      const sint = (f.sintomas||'').toLowerCase();
      const aciertos = palabras.filter(w=>sint.includes(w)).length;
      if(aciertos >= 1 && aciertos/palabras.length >= 0.4) coincidencias.push({...f, mes:h.mes, anio:h.anio, aciertos});
    }));

  if(coincidencias.length === 0){ cont.style.display='none'; return; }
  coincidencias.sort((a,b)=>b.aciertos-a.aciertos);
  const top = coincidencias.slice(0,4);
  cont.style.display='block';
  cont.innerHTML = `<b>🔁 Falla recurrente detectada</b> — esta máquina ya tuvo ${coincidencias.length} falla(s) parecida(s):<br>` +
    top.map(f=>`• <b>${f.fecha||''}</b>: ${escapeHtml((f.sintomas||'').slice(0,90))}${(f.sintomas||'').length>90?'…':''}<br><span style="color:#6b7280;">→ ${escapeHtml((f.acciones||'—').slice(0,90))}</span>`).join('<br>') +
    `<br><span style="color:#8a6d1f;">Considera revisar la causa raíz, no solo el síntoma.</span>`;
}

function iniciarCanvasFirma(){
  firmaCanvas = document.getElementById('firma_canvas');
  if(!firmaCanvas) return;
  firmaCtx = firmaCanvas.getContext('2d');
  firmaCtx.lineWidth = 2.5; firmaCtx.lineCap = 'round'; firmaCtx.strokeStyle = '#111';

  const pos = e => {
    const r = firmaCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(firmaCanvas.width/r.width), y:(p.clientY-r.top)*(firmaCanvas.height/r.height) };
  };
  const empezar = e => { e.preventDefault(); dibujando=true; const {x,y}=pos(e); firmaCtx.beginPath(); firmaCtx.moveTo(x,y); };
  const mover = e => { if(!dibujando) return; e.preventDefault(); const {x,y}=pos(e); firmaCtx.lineTo(x,y); firmaCtx.stroke(); };
  const parar = () => { dibujando=false; };

  ['mousedown','touchstart'].forEach(ev=>firmaCanvas.addEventListener(ev, empezar));
  ['mousemove','touchmove'].forEach(ev=>firmaCanvas.addEventListener(ev, mover));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>firmaCanvas.addEventListener(ev, parar));
}

function limpiarFirma(){ if(firmaCtx && firmaCanvas) firmaCtx.clearRect(0,0,firmaCanvas.width,firmaCanvas.height); }

async function guardarFirma(){

  STATE.usuario.firma = firmaCanvas.toDataURL('image/png');

function todasLasFilas(){
  const out = [];
  (cacheAnalisis||[]).forEach(h => (h.filas||[]).forEach(f => {
    const min = (typeof f.minutosParo === 'number' && f.minutosParo > 0)
      ? f.minutosParo
      : minutosEntre(f.horaInicio, f.horaFinal);
    out.push({...f, minutosParo: min, planta:h.planta, ubtNo:h.ubtNo, maquina:h.maquina, mes:h.mes, anio:h.anio});
  }));
  return out;
}

    (f.sintomas||'').toLowerCase().includes(q) ||
    (f.acciones||'').toLowerCase().includes(q) ||
    (f.material||'').toLowerCase().includes(q) ||
    (f.tecnico||'').toLowerCase().includes(q) ||
    (f.numeroParte||'').toLowerCase().includes(q) ||
    (f.maquina||'').toLowerCase().includes(q) ||

function calcularTiempoMuerto(){
  const selPl = document.getElementById('an_planta');
  if(!selPl) return;
  let planta = selPl.value;
  if(STATE.rol === 'tecnico') planta = STATE.plantaHoy || planta;
  const mes = document.getElementById('an_mes').value;
  const cont = document.getElementById('an_tiempo');
  let filas = todasLasFilas();
  if(planta) filas = filas.filter(f=>f.planta===planta);
  if(mes) filas = filas.filter(f=>f.mes===mes);

  if(filas.length === 0){ cont.innerHTML = '<div class="empty">Sin datos para este filtro.</div>'; return; }

  /* Agrupar: Planta > UBT > Máquina */
  const arbol = {};
  filas.forEach(f=>{
    const min = f.minutosParo||0;
    arbol[f.planta] ??= { minutos:0, paros:0, ubts:{} };
    arbol[f.planta].minutos += min; arbol[f.planta].paros++;
    arbol[f.planta].ubts[f.ubtNo] ??= { minutos:0, paros:0, maquinas:{} };
    arbol[f.planta].ubts[f.ubtNo].minutos += min; arbol[f.planta].ubts[f.ubtNo].paros++;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina] ??= { minutos:0, paros:0 };
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].minutos += min;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].paros++;
  });

  const totalMin = filas.reduce((a,f)=>a+(f.minutosParo||0),0);
  const plantasOrd = Object.entries(arbol).sort((a,b)=>b[1].minutos-a[1].minutos);
  const maxPlanta = plantasOrd[0][1].minutos || 1;

  const barra = (min, max, color) => `<div style="background:#e8eaed;border-radius:20px;height:8px;overflow:hidden;margin-top:3px;">
      <div style="background:${color};height:100%;width:${(min/max*100).toFixed(1)}%;"></div></div>`;

  cont.innerHTML = `
    <div style="background:#f3f6f9;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13.5px;">
      Total de paro: <b>${formatoDuracion(totalMin)}</b> (${totalMin} min) en <b>${filas.length}</b> intervención(es)
    </div>
    ${plantasOrd.map(([pl, dPl])=>{
      const ubtsOrd = Object.entries(dPl.ubts).sort((a,b)=>b[1].minutos-a[1].minutos);
      const maxUbt = ubtsOrd[0][1].minutos || 1;
      return `<details style="margin-bottom:10px;">
        <summary style="cursor:pointer;padding:10px 12px;background:#2f3742;color:#fff;border-radius:8px;font-weight:700;font-size:13.5px;">
          🏭 ${escapeHtml(pl)} — ${formatoDuracion(dPl.minutos)} (${dPl.minutos} min) · ${dPl.paros} paro/s <span style="opacity:.6;font-weight:400;">▾</span>
        </summary>
        ${barra(dPl.minutos, maxPlanta, '#a13636')}
        <div style="padding:10px 0 0 12px;">
          ${ubtsOrd.map(([ub, dUb])=>{
            const maqOrd = Object.entries(dUb.maquinas).sort((a,b)=>b[1].minutos-a[1].minutos);
            const maxMaq = maqOrd[0][1].minutos || 1;
            return `<details style="margin-bottom:8px;">
              <summary style="cursor:pointer;padding:7px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:13px;">
                📍 UBT ${escapeHtml(ub)} — ${formatoDuracion(dUb.minutos)} (${dUb.minutos} min) · ${dUb.paros} paro/s <span style="opacity:.5;font-weight:400;">▾</span>
              </summary>
              ${barra(dUb.minutos, maxUbt, '#c77700')}
              <div style="padding:8px 0 0 12px;">
                ${maqOrd.map(([mq, dMq], i)=>`
                  <div style="margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;">
                      <span>⚙️ ${escapeHtml(mq)}</span>
                      <span style="font-weight:700;">${formatoDuracion(dMq.minutos)} <span style="font-weight:400;color:var(--muted);">(${dMq.minutos} min · ${dMq.paros} paro/s)</span></span>
                    </div>
                    ${barra(dMq.minutos, maxMaq, i===0?'#a13636':'#0f3d5c')}
                  </div>`).join('')}
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>`;
    }).join('')}`;
}

function calcularFallasFrecuentes(){
  const cont = document.getElementById('an_frecuentes');
  if(!cont) return;
  let filas = todasLasFilas();
  /* El técnico solo ve las fallas de su planta */
  if(STATE.rol === 'tecnico' && STATE.plantaHoy) filas = filas.filter(f=>f.planta===STATE.plantaHoy);
  const porMaquina = {};
  filas.forEach(f=>{
    const clave = `${f.maquina} · UBT ${f.ubtNo}`;
    porMaquina[clave] ??= [];
    porMaquina[clave].push(f);
  });

  const recurrentes = [];
  Object.entries(porMaquina).forEach(([maq, fs])=>{
    const grupos = {};
    fs.forEach(f=>{
      const palabras = (f.sintomas||'').toLowerCase().split(/\s+/).filter(w=>w.length>4);
      palabras.forEach(w=>{ grupos[w] ??= new Set(); grupos[w].add(f.id); });
    });
    Object.entries(grupos).forEach(([palabra, ids])=>{
      if(ids.size >= 2) recurrentes.push({ maquina:maq, palabra, veces:ids.size });
    });
  });

  recurrentes.sort((a,b)=>b.veces-a.veces);
  const top = recurrentes.slice(0,15);
  cont.innerHTML = top.length === 0
    ? '<div class="empty">Aún no hay suficientes datos para detectar patrones.</div>'
    : `<p style="font-size:12.5px;color:var(--muted);">Palabras que se repiten en fallas de la misma máquina — posible causa raíz.</p>` +
      top.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f2;font-size:13px;">
          <span>${escapeHtml(r.maquina)} → "<b>${escapeHtml(r.palabra)}</b>"</span>
          <span style="font-weight:700;color:${r.veces>=4?'#a13636':'#c77700'};">${r.veces}×</span>
        </div>`).join('');
}
