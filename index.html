<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>Sistema de Correctivo — Lear</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#8a1f1f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Correctivo">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  :root{
    --ink:#1a1a1a; --line:#2b2b2b; --paper:#ffffff; --shell:#f0f2f4;
    --accent:#8a1f1f; --accent2:#0f3d5c; --muted:#6b7280; --green:#1a7a3c; --amber:#a16d07;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--shell);color:var(--ink);}
  body.login-bg{background:linear-gradient(160deg,#1f2933 0%,#2b2b2b 45%,#4a1f1f 100%);background-attachment:fixed;min-height:100vh;}
  body.login-bg .card{background:#ffffffef;backdrop-filter:blur(6px);}
  .login-hero{text-align:center;padding:26px 10px 6px;color:#fff;}
  .login-hero .logo{font-size:44px;}
  .login-hero h1{margin:8px 0 2px;font-size:20px;font-weight:800;letter-spacing:.5px;}
  .login-hero p{margin:0;font-size:12.5px;opacity:.7;}
  .topbar{background:linear-gradient(135deg,#2b2b2b,#3a3f45);color:#fff;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:10;box-shadow:0 2px 8px #0003;}
  .tb-left{display:flex;align-items:center;gap:10px;}
  .tb-logo{font-size:22px;background:var(--accent);width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;}
  .tb-title{font-size:14px;font-weight:800;letter-spacing:.3px;}
  .tb-sub{font-size:11px;opacity:.75;margin-top:1px;}
  .tb-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .tb-btn{background:#ffffff18;border:1px solid #ffffff22;color:#fff;padding:7px 11px;border-radius:8px;font-size:11.5px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:52px;transition:.15s;}
  .tb-btn:hover{background:#ffffff30;transform:translateY(-1px);}
  .tb-btn span{font-size:9.5px;opacity:.85;}
  .tb-btn.on{background:#1a7a3c44;border-color:#1a7a3c88;}
  .tb-btn.salir{background:#a1363644;border-color:#a1363688;}
  .wrap{max-width:1000px;margin:0 auto;padding:16px;}
  .card{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 3px #00000012,0 4px 12px #00000008;border:1px solid #e8eaed;}
  h2{font-size:16px;margin:0 0 14px;display:flex;align-items:center;gap:8px;}
  .field{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;}
  .field label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;}
  .field input, .field select, .field textarea{padding:11px;border:1px solid #d4d8dc;border-radius:8px;font-size:14px;font-family:inherit;transition:.15s;background:#fbfcfd;}
  .field input:focus, .field select:focus, .field textarea:focus{outline:none;border-color:var(--accent2);background:#fff;box-shadow:0 0 0 3px #0f3d5c1a;}
  .field textarea{min-height:60px;resize:vertical;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
  .btn{background:var(--accent);color:#fff;border:none;padding:13px 18px;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer;width:100%;transition:.15s;box-shadow:0 2px 6px #8a1f1f33;}
  .btn:hover{filter:brightness(1.08);transform:translateY(-1px);}
  .btn.secondary{background:var(--accent2);box-shadow:0 2px 6px #0f3d5c33;}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.ghost{background:#eef0f2;color:#333;box-shadow:none;}
  .btn.ghost:hover{background:#e2e5e8;}
  .checkline{display:flex;align-items:center;gap:8px;font-size:14px;margin-bottom:10px;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .role-card{border-radius:12px;padding:22px 16px;text-align:center;cursor:pointer;border:2px solid transparent;box-shadow:0 2px 8px #00000014;transition:.18s;}
  .role-card:hover{transform:translateY(-3px);box-shadow:0 6px 18px #00000022;}
  .role-card .emoji{font-size:28px;}
  .role-card .name{font-weight:700;margin-top:6px;font-size:14px;}
  .role-card.rc-tecnico{background:#f2c94c;color:#1a1a1a;}
  .role-card.rc-auditor{background:#ffffff;color:#1a1a1a;border-color:#ccc;}
  .role-card.rc-apqp{background:#a13636;color:#fff;}
  .role-card.rc-supervisor{background:#8a8f98;color:#fff;}
  .role-card.rc-produccion{background:#1a7a3c;color:#fff;}
  .role-card.rc-admin{background:#1a1a1a;color:#fff;}
  .planta-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px;max-width:480px;}
  .planta-card{background:#fff;border-radius:10px;padding:14px 8px;text-align:center;cursor:pointer;border:2px solid #e2e5e8;box-shadow:0 2px 6px #00000010;font-weight:700;font-size:12.5px;transition:.15s;}
  .planta-card:hover{border-color:var(--accent2);transform:translateY(-2px);box-shadow:0 5px 14px #00000018;}
  .ubt-cols{display:flex;gap:18px;flex-wrap:wrap;align-items:flex-start;}
  .ubt-col{display:flex;flex-direction:column;gap:8px;min-width:110px;}
  .ubt-col-title{font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;margin-bottom:2px;}
  .ubt-btn{border:none;padding:11px 14px;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer;text-align:left;transition:.15s;box-shadow:0 2px 5px #00000018;}
  .ubt-btn:hover{filter:brightness(1.15);transform:translateX(3px);}
  .ubt-btn.p1{background:#1a7a3c;color:#fff;}
  .ubt-btn.p2{background:#1a1a1a;color:#fff;}
  .ubt-btn.p3{background:#0f3d5c;color:#fff;}
  .ubt-btn.p4{background:#e0b400;color:#1a1a1a;}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .filters select, .filters input{padding:7px 9px;border:1px solid #ccd1d6;border-radius:6px;font-size:13px;}
  .empty{text-align:center;color:var(--muted);padding:30px;font-size:13px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;z-index:50;box-shadow:0 4px 16px #0004;max-width:90%;text-align:center;}
  .qr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;}
  .qr-box{text-align:center;border:1px solid #e2e5e8;border-radius:8px;padding:12px;}
  .qr-box .label{font-size:12px;font-weight:700;margin-top:6px;}
  .ubt-check-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:6px;margin-bottom:12px;}
  .ubt-check-grid label{display:flex;align-items:center;gap:5px;font-size:12.5px;background:#f5f6f7;padding:6px 8px;border-radius:5px;}
  .notif{background:#fff7e6;border:1px solid #f0c674;border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;}
  .notif b{color:var(--amber);}
  table.admin-tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px;}
  table.admin-tbl th, table.admin-tbl td{border:1px solid #e2e5e8;padding:6px 8px;text-align:left;}
  table.admin-tbl th{background:#f5f6f7;}
  .badge-est{display:inline-block;padding:3px 8px;border-radius:20px;font-size:10.5px;font-weight:700;white-space:nowrap;}
  .badge-est.act{background:#e3f6e8;color:#1a7a3c;}
  .badge-est.bloq{background:#fde8e8;color:#a13636;}
  .cola-bar{position:sticky;top:64px;z-index:9;background:#0f3d5c;color:#fff;padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;box-shadow:0 2px 8px #0003;}
  .cola-bar .btn{width:auto;}
  .pass-inline{display:flex;gap:6px;margin-top:6px;}
  .pass-inline input{padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12px;flex:1;}
  .pass-inline button{padding:6px 10px;border:none;border-radius:5px;background:var(--accent2);color:#fff;font-size:12px;font-weight:700;cursor:pointer;}
  .edit-panel{background:#fef8ec;border:1px solid #f0c674;border-radius:8px;padding:12px;margin-top:8px;}
  .planta-block{border:1px solid #e2e5e8;border-radius:8px;padding:12px;margin-bottom:12px;}
  .planta-block h3{margin:0 0 8px;font-size:13.5px;}
  .ubt-row{display:flex;gap:6px;align-items:center;margin-bottom:6px;}
  .ubt-row input{flex:1;padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;font-size:12.5px;}
  .ubt-row button{padding:5px 9px;border:none;border-radius:5px;background:#e2e5e8;cursor:pointer;font-size:12px;}

  /* --- Pantalla principal (menu de mosaicos) --- */
  .menu-hero{background:linear-gradient(135deg,#2b2b2b,#3a3f45);color:#fff;border-radius:14px;padding:18px 18px 16px;margin-bottom:14px;box-shadow:0 2px 10px #0000001f;}
  .menu-hero .mh-kick{font-size:11px;opacity:.65;text-transform:uppercase;letter-spacing:.6px;font-weight:700;}
  .menu-hero .mh-name{font-size:20px;font-weight:800;margin-top:2px;}
  .menu-hero .mh-sub{font-size:12.5px;opacity:.82;margin-top:4px;}
  .menu-hero .mh-est{margin-top:12px;background:#ffffff1a;border:1px solid #ffffff26;border-radius:10px;padding:10px 12px;font-size:13px;}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .menu-tile{background:#fff;border:1px solid #e2e5e8;border-radius:14px;padding:18px 10px;text-align:center;cursor:pointer;box-shadow:0 2px 8px #00000012;transition:.15s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;min-height:120px;font-family:inherit;color:var(--ink);width:100%;}
  .menu-tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px #00000022;}
  .menu-tile:active{transform:translateY(0);}
  .menu-tile .ico{font-size:34px;line-height:1;}
  .menu-tile .txt{font-weight:800;font-size:14.5px;line-height:1.15;}
  .menu-tile .sub{font-size:11px;color:var(--muted);line-height:1.2;}
  .menu-tile.wide{grid-column:span 2;}
  .menu-tile.rojo{background:linear-gradient(135deg,#8a1f1f,#a13636);color:#fff;border:none;}
  .menu-tile.verde{background:linear-gradient(135deg,#1a7a3c,#146030);color:#fff;border:none;}
  .menu-tile.ambar{background:linear-gradient(135deg,#e8c02a,#c77700);color:#1a1a1a;border:none;}
  .menu-tile.azul{background:linear-gradient(135deg,#0f3d5c,#18567f);color:#fff;border:none;}
  .menu-tile.gris{background:#40454b;color:#fff;border:none;}
  .menu-tile.salida{background:#fdecec;border-color:#f0c0c0;color:#a13636;}
  .menu-tile.rojo .sub,.menu-tile.verde .sub,.menu-tile.azul .sub,.menu-tile.gris .sub{color:#ffffffc4;}
  .menu-tile.ambar .sub{color:#1a1a1ab0;}
  @media(max-width:560px){ .menu-grid{grid-template-columns:1fr 1fr;} }
  /* --- Linea de estado de solicitud --- */
  .paso{display:flex;align-items:flex-start;gap:9px;padding:7px 0;font-size:13px;}
  .paso .bolita{width:20px;height:20px;border-radius:50%;flex:0 0 20px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;}
  .paso.ok .bolita{background:#1a7a3c;color:#fff;}
  .paso.no .bolita{background:#e2e5e8;color:#8a9099;}
  .paso.no{color:var(--muted);}
  .badge-est.esp{background:#fff4d6;color:#a16d07;}
  .badge-est.fin{background:#e8eff5;color:#0f3d5c;}
  .dato-fijo{padding:11px;border:1px dashed #c9ced4;border-radius:8px;background:#f5f7f9;font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px;}
  .dato-fijo .lock{font-size:12px;opacity:.55;font-weight:600;}

  .sheet-print-wrap{margin-bottom:16px;}
  /* --- Hoja de correctivo: copia del formato de papel (carta horizontal) --- */
  .sheet-scroll{overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;padding-bottom:8px;max-width:100%;}
  .sheet-scroll::-webkit-scrollbar{height:9px;}
  .sheet-scroll::-webkit-scrollbar-thumb{background:#c3c9cf;border-radius:5px;}
  .card > .sheet-scroll, .sheet-print-wrap > .sheet-scroll{margin:0 -2px;}
  .sheet-page{border:1px solid #333;padding:16px 18px;background:#fff;font-family:Calibri,'Segoe UI',Arial,sans-serif;color:#000;width:1056px;min-height:816px;margin:0;box-shadow:0 2px 10px rgba(0,0,0,.10);}
  .sheet-head{display:grid;grid-template-columns:210px 1fr 120px;align-items:flex-start;gap:8px;margin-bottom:2px;}
  .sheet-brand{padding-top:2px;}
  .lear-logo{width:180px;height:auto;display:block;}
  .sheet-title{font-size:12.5px;font-weight:800;text-align:center;padding-top:8px;}
  .sheet-monthyear{font-size:15px;font-weight:800;text-align:right;line-height:1.15;}
  table.chk-tabla{border-collapse:collapse;margin:6px 0 4px;font-size:10px;width:100%;table-layout:fixed;}
  table.chk-tabla td{border:none;padding:1px 2px;white-space:nowrap;vertical-align:middle;}
  table.chk-tabla td.chk-txt{width:11%;}
  table.chk-tabla td.chk-cas{width:4%;text-align:center;}
  .chk-box{display:inline-block;width:24px;height:12px;border:1px solid #333;vertical-align:middle;}
  .chk-box.on{background:#333;}
  .chk-linea{display:inline-block;border-bottom:1px solid #333;width:78px;height:10px;vertical-align:middle;}
  .sheet-meta{font-size:10.5px;margin:6px 0 8px;display:flex;gap:26px;flex-wrap:wrap;align-items:baseline;}
  .sheet-meta b{font-weight:700;}
  .sheet-meta u{min-width:120px;display:inline-block;}
  table.sheet-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.sheet-table th, table.sheet-table td{border:1px solid #000;padding:3px;font-size:8.5px;text-align:center;vertical-align:middle;word-break:break-word;}
  table.sheet-table th{background:#fff;font-weight:800;font-size:8.5px;line-height:1.15;}
  table.sheet-table th.azul{color:#0f38b0;font-size:7.5px;}
  table.sheet-table td.left{text-align:left;font-size:8.5px;line-height:1.25;}
  table.sheet-table tbody tr{height:52px;}
  .col-fecha{width:5.5%;} .col-gafete{width:5.5%;} .col-hora{width:4.5%;}
  .col-sint{width:17%;} .col-acc{width:17%;} .col-mat{width:12.5%;}
  .col-firma{width:8%;} .col-si{width:5.5%;} .col-apqp{width:6.5%;}
  /* Con la columna Editar (solo pantalla) todo se encoge un poco */
  .con-editar .col-fecha{width:5%;} .con-editar .col-gafete{width:5%;} .con-editar .col-hora{width:4%;}
  .con-editar .col-sint{width:16%;} .con-editar .col-acc{width:16%;} .con-editar .col-mat{width:11.5%;}
  .con-editar .col-firma{width:7.5%;} .con-editar .col-si{width:5%;} .con-editar .col-apqp{width:6%;}
  .col-edit{width:6.5%;}
  .sheet-pie{margin-top:8px;display:grid;grid-template-columns:1fr 130px;gap:8px;font-size:8px;line-height:1.3;}
  .sheet-pie b{font-weight:800;}
  .sheet-cod{text-align:right;font-size:8px;}
  .firma-ok{color:var(--green);font-weight:700;}
  .firma-btn, .edit-btn{background:var(--accent2);color:#fff;border:none;padding:4px 8px;border-radius:4px;font-size:9px;cursor:pointer;font-weight:700;}
  .edit-btn{background:#555;margin-top:2px;}
  .pie-marca{text-align:center;font-size:10.5px;color:#9aa1a9;opacity:.65;padding:14px 10px 20px;letter-spacing:.3px;user-select:none;}
  .pie-marca b{font-weight:700;color:#8a9099;}
  /* --- Hoja TPM (formato de piso) --- */
  .ref-sug{border:1px solid #d9dde1;border-radius:9px;margin-top:6px;max-height:230px;overflow-y:auto;background:#fff;}
  .ref-op{display:flex;align-items:baseline;gap:8px;padding:8px 10px;cursor:pointer;border-bottom:1px solid #f0f2f4;font-size:12.5px;}
  .ref-op:last-child{border-bottom:none;}
  .ref-op:hover{background:#eef4f8;}
  .ref-op b{flex:none;}
  .ref-op span{flex:1;color:var(--muted);font-size:11.5px;min-width:0;word-break:break-word;}
  .ref-op small{flex:none;color:#0f3d5c;font-weight:700;font-size:11px;}
  .ref-vacio{padding:9px 10px;font-size:12px;color:var(--muted);}
  .ref-chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;}
  .ref-chip{background:#eef4f8;border:1px solid #cfe0ea;border-radius:14px;padding:4px 6px 4px 11px;font-size:11.5px;display:inline-flex;align-items:center;gap:6px;}
  .ref-chip button{background:#0f3d5c;color:#fff;border:none;border-radius:50%;width:17px;height:17px;line-height:1;cursor:pointer;font-size:10px;}
  .ref-item{display:flex;gap:12px;align-items:flex-start;padding:11px 12px;border:1px solid #e2e5e8;border-radius:10px;margin-bottom:8px;background:#fff;}
  .ref-veces{flex:none;width:52px;text-align:center;background:#eef4f8;border-radius:8px;padding:7px 4px;}
  .ref-veces b{display:block;font-size:19px;line-height:1;color:#0f3d5c;}
  .ref-veces span{font-size:10px;color:var(--muted);}
  .ref-datos{flex:1;min-width:0;}
  .ref-parte{font-weight:800;font-size:13.5px;word-break:break-word;}
  .ref-desc{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.35;word-break:break-word;}
  .ref-fecha{font-size:11px;color:#9aa1a9;margin-top:4px;}
  .tpm-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  .tpm-hoja{background:#fff;border:1px solid #333;padding:14px 16px;font-family:Calibri,'Segoe UI',Arial,sans-serif;color:#000;width:816px;min-height:1056px;margin:0;box-shadow:0 2px 10px rgba(0,0,0,.10);}
  .tpm-rev{text-align:right;font-size:9px;margin-bottom:10px;}
  .tpm-cabecera{display:grid;grid-template-columns:1fr 2fr 1fr;align-items:end;gap:8px;}
  .tpm-planta{font-size:12px;font-weight:800;}
  .tpm-titulo{text-align:center;font-size:14px;font-weight:800;line-height:1.25;}
  .tpm-titulo span{font-size:13px;}
  .tpm-ubic{font-size:10.5px;margin-top:6px;display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;}
  .tpm-ubic u{font-weight:800;font-size:11.5px;}
  .tpm-mes{margin-left:auto;}
  .tpm-instr{font-size:8.5px;margin:6px 0 4px;line-height:1.35;}
  .tpm-herr{text-align:center;margin-top:2px;}
  table.tpm-table{width:100%;border-collapse:collapse;table-layout:fixed;}
  table.tpm-table th, table.tpm-table td{border:1px solid #333;font-size:8px;text-align:center;vertical-align:middle;padding:1px;}
  table.tpm-table th{background:#f2f2f2;font-weight:700;}
  .tpm-sub{width:74px;font-size:8.5px;font-weight:600;}
  .tpm-ayuda{width:96px;}
  .tpm-ayuda img{max-width:90px;max-height:66px;display:block;margin:3px auto;}
  .tpm-sinfoto{font-size:18px;opacity:.25;}
  .tpm-act{width:172px;font-size:8px;line-height:1.3;padding:4px 5px !important;}
  .tpm-turno{width:22px;font-weight:700;}
  .tpm-sem{font-size:8px;}
  .tpm-dia{width:17px;font-size:7.5px;}
  .tpm-cel{height:37px;font-size:11px;font-weight:800;color:#146030;}
  .tpm-guion{color:#b6bcc2;font-weight:400;}
  .tpm-vacio{background:#f7f8f9;}
  .tpm-hoy{background:#fff8dc;}
  .tpm-chk-cel{width:13px;height:13px;margin:0;cursor:pointer;}
  .tpm-nota{font-size:8.5px;margin-top:5px;}
  .tpm-nota b{font-weight:800;}
  .tpm-coment{font-size:8.5px;margin-top:10px;}
  .tpm-coment-txt{border-bottom:1px solid #333;min-height:15px;padding:1px 3px;font-size:9px;white-space:pre-wrap;}
  .tpm-linea{border-bottom:1px solid #333;height:15px;margin-top:2px;}
  .tpm-firmas{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:26px;}
  .tpm-firma{text-align:center;}

function minDelDia(hhmm){ const [h,m]=(hhmm||'00:00').split(':').map(Number); return h*60+m; }
function ahoraMin(){ const d=ahora(); return d.getHours()*60+d.getMinutes(); }

/* ¿La hora está dentro del rango? Soporta rangos que cruzan medianoche */
function dentroDeRango(minAhora, inicio, fin){
  const i = minDelDia(inicio), f = minDelDia(fin);
  return (i <= f) ? (minAhora >= i && minAhora < f) : (minAhora >= i || minAhora < f);
}

/* Detecta el turno según una hora dada */
function turnoDeHora(hhmm){
  const m = minDelDia(hhmm);
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  for(const [k,t] of Object.entries(T)){
    if(dentroDeRango(m, t.inicio, t.fin)) return k;
  }
  return 'TA';
}

/* ¿El usuario está dentro de su jornada ahora mismo? */
function enJornada(usuario){
  if(!usuario || !usuario.turno) return true;
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario.turno];
  if(!t) return true;
  const m = ahoraMin();
  if(dentroDeRango(m, t.inicio, t.fin)) return true;
  /* Jornada extendida vigente */
  if(usuario.extraInicio && usuario.extraFin && dentroDeRango(m, usuario.extraInicio, usuario.extraFin)) return true;
  return false;
}

/* Minutos que faltan para que termine la jornada */
function minutosParaFinJornada(usuario){
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario?.turno];
  if(!t) return null;
  let fin = minDelDia(t.fin);
  if(usuario.extraFin && dentroDeRango(ahoraMin(), usuario.extraInicio||t.inicio, usuario.extraFin)) fin = minDelDia(usuario.extraFin);
  let dif = fin - ahoraMin();
  if(dif < -720) dif += 1440;
  return dif;
}

/* ---------- Actualización de la app ----------

async function actualizarApp(){
  showToast('🔄 Bajando la versión nueva...');
  try{
    if('caches' in window){
      const llaves = await caches.keys();
      await Promise.all(llaves.map(k => caches.delete(k)));
    }
    localStorage.removeItem('ultima_revision_version');
  }catch(e){ console.warn(e); }
  /* Se conservan los parámetros del enlace (por ejemplo los del QR de una UBT)
     y se agrega uno nuevo que obliga a GitHub a mandar el archivo otra vez */
  const p = new URLSearchParams(location.search);
  p.delete('chk'); p.set('v', String(Date.now()));
  location.replace(location.pathname + '?' + p.toString());
}

/* Compara la versión que corre en este equipo contra la del servidor */
async function revisarVersionNueva(forzar){
  try{
    const ultima = Number(localStorage.getItem('ultima_revision_version') || 0);
    if(!forzar && Date.now() - ultima < 60*60*1000) return;   /* máximo una vez por hora */
    localStorage.setItem('ultima_revision_version', String(Date.now()));
    const r = await fetch(location.pathname + '?chk=' + Date.now(), { cache:'no-store' });
    if(!r.ok) return;
    const txt = await r.text();
    const m = txt.match(/APP_VERSION\s*=\s*'([^']+)'/);
    if(m && m[1] !== APP_VERSION) mostrarBarraVersion(m[1]);
  }catch(e){ /* sin conexión: no pasa nada */ }
}

function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
/* ---------- Reloj sincronizado con el servidor ----------
   Cada equipo tiene su propia hora y algunos están mal ajustados. Eso hacía que
   los tiempos de espera y de reparación no cuadraran entre celulares. Aquí se toma
   la hora que manda el servidor en cada respuesta y se corrige la diferencia. */
let DESFASE_RELOJ = 0;
function sincronizarReloj(res){
  try{
    const h = res && res.headers && res.headers.get('Date');
    if(!h) return;
    const t = Date.parse(h);
    if(t) DESFASE_RELOJ = t - Date.now();
  }catch(e){}
}

try{ FECHA_PRUEBA = localStorage.getItem('fecha_prueba') || ''; }catch(e){}
function ahora(){
  const d = new Date(Date.now() + DESFASE_RELOJ);
  if(FECHA_PRUEBA){
    const p = FECHA_PRUEBA.split('-').map(Number);
    if(p.length===3 && !isNaN(p[0])) d.setFullYear(p[0], p[1]-1, p[2]);
  }
  return d;
}
function ponerFechaPrueba(valor){
  FECHA_PRUEBA = valor || '';
  try{
    if(FECHA_PRUEBA) localStorage.setItem('fecha_prueba', FECHA_PRUEBA);
    else localStorage.removeItem('fecha_prueba');
  }catch(e){}
  showToast(FECHA_PRUEBA ? ('Fecha simulada: ' + FECHA_PRUEBA) : 'Fecha simulada quitada');
  render();
}

}
function ahoraMs(){ return Date.now() + DESFASE_RELOJ; }

function relojDesfasado(){ return Math.abs(DESFASE_RELOJ) > 5*60*1000; }

/* Fecha local: con toISOString, después de las 18:00 en México ya marcaba el día siguiente */
function todayISO(){ const d=ahora(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function escapeHtml(s){ const d=document.createElement('div'); d.textContent=(s===0?'0':(s||'')); return d.innerHTML.replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

/* ---------- Conexión a Supabase ---------- */
const SUPABASE_URL = 'https://pddugjlydcggotamstav.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n0METrGffoJXnnbBPBJ1AA_pjIz69I9';

async function sbFetch(path, options={}){
  if(typeof navigator !== 'undefined' && navigator.onLine === false){
    throw new Error('Sin conexión a internet. Revisa el WiFi y vuelve a intentar.');
  }
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers||{})
    }
  });
  sincronizarReloj(res);
  if(!res.ok){
    const txt = await res.text();
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

/* Lee el campo ubts_por_planta soportando el formato viejo (plano) y el nuevo (con __ubts) */
function desempacarExtra(extra){
  const e = extra || {};
  if(Object.prototype.hasOwnProperty.call(e, '__ubts')){
    return { ubtsPorPlanta: e.__ubts || {}, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '', subrol: e.__subrol || '', maquina: e.__maquina || '' };
  }
  const limpio = { ...e };
  delete limpio.__bloqueado; delete limpio.__firma; delete limpio.__modoFirma; delete limpio.__turno; delete limpio.__extraInicio; delete limpio.__extraFin; delete limpio.__subrol; delete limpio.__maquina;
  return { ubtsPorPlanta: limpio, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '', subrol: e.__subrol || '', maquina: e.__maquina || '' };
}

async function getUsuario(nombre){
  try{
    const r = await sbFetch('usuarios?nombre_slug=eq.'+encodeURIComponent(slug(nombre))+'&select=*');
    if(!r || !r[0]) return null;
    const u = r[0];
    return { nombre: u.nombre, rol: u.rol, gafete: u.gafete, ...desempacarExtra(u.ubts_por_planta) };
  }catch(e){ console.warn(e); return null; }
}
async function saveUsuario(u){
  await sbFetch('usuarios?on_conflict=nombre_slug', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({
      nombre_slug: slug(u.nombre), nombre: u.nombre, rol: u.rol,
      gafete: u.gafete, ubts_por_planta: { __ubts: u.ubtsPorPlanta || {}, __bloqueado: !!u.bloqueado, __firma: u.firma || '', __modoFirma: u.modoFirma || 'nombre', __turno: u.turno || '', __extraInicio: u.extraInicio || '', __extraFin: u.extraFin || '', __subrol: u.subrol || '', __maquina: u.maquina || '' }
    })
  });
}
async function deleteUsuario(nombre){
  await sbFetch('usuarios?nombre_slug=eq.'+encodeURIComponent(slug(nombre)), { method:'DELETE', prefer:'return=minimal' });
}
async function listUsuarios(){
  try{
    const r = await sbFetch('usuarios?select=*&order=nombre.asc');
    return (r||[]).map(u=>({ nombre:u.nombre, rol:u.rol, gafete:u.gafete, ...desempacarExtra(u.ubts_por_planta) }));
  }catch(e){ console.warn(e); return []; }
}
async function getSheet(key){
  try{
    const r = await sbFetch('hojas?clave=eq.'+encodeURIComponent(key)+'&select=*');
    if(!r || !r[0]) return null;
    const h = r[0];
    return { key:h.clave, planta:h.planta, ubtNo:h.ubt_no, maquina:h.maquina, mes:h.mes, anio:h.anio, pagina:h.pagina, filas:h.filas||[] };
  }catch(e){ console.warn(e); return null; }
}
async function saveSheet(key, sheet){
  await sbFetch('hojas?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({
      clave: key, planta: sheet.planta, ubt_no: sheet.ubtNo, maquina: sheet.maquina,
      mes: sheet.mes, anio: sheet.anio, pagina: sheet.pagina||1,
      filas: sheet.filas||[], actualizado_en: ahoraISO()
    })
  });
}
/* Trae las hojas. Si se le pasa {planta, ubts}, el filtrado lo hace el servidor:
   así el auditor ya no descarga TODAS las hojas de todas las plantas con sus fotos. */
async function listSheets(filtro){
  try{
    let q = 'hojas?select=*';
    if(filtro && filtro.planta) q += '&planta=eq.' + encodeURIComponent(filtro.planta);
    if(filtro && filtro.ubts && filtro.ubts.length){
      q += '&ubt_no=in.(' + filtro.ubts.map(u=>'"'+String(u).replace(/"/g,'')+'"').join(',') + ')';
    }
    const r = await sbFetch(q);
    return (r||[]).map(h=>({ key:h.clave, planta:h.planta, ubtNo:h.ubt_no, maquina:h.maquina, mes:h.mes, anio:h.anio, pagina:h.pagina, filas:h.filas||[] }));
  }catch(e){ console.warn(e); return []; }
}

/* ---------- Estado global ---------- */
let STATE = { rol:'', nombre:'', usuario:null, codes:null, plantasCfg:null, editandoUbts:false, plantaHoy:null, ubtElegida:null };

function showToast(msg){
  const previos = document.querySelectorAll('.toast');
  /* Nunca más de 3 avisos a la vez y se apilan hacia arriba, no encimados */
  if(previos.length >= 3) previos[0].remove();
  const t = document.createElement('div'); t.className='toast'; t.textContent=msg;
  document.body.appendChild(t);
  reacomodarToasts();
  setTimeout(()=>{ t.remove(); reacomodarToasts(); }, 2600);
}
function reacomodarToasts(){
  [...document.querySelectorAll('.toast')].reverse().forEach((el,i)=>{
    el.style.bottom = (20 + i*52) + 'px';
  });
}
function getParams(){
  const p = new URLSearchParams(window.location.search);
  return {
    rol: p.get('rol') || '',
    nombre: p.get('nombre') || '',
    ver: p.get('ver') || '',
    planta: p.get('planta') || '',
    ubt: p.get('ubt') || ''
  };
}

/* ---------- Render raíz ---------- */
async function render(){
  const app = document.getElementById('app');
  if(!STATE.codes) STATE.codes = await getConfig();
  if(!STATE.plantasCfg) STATE.plantasCfg = await getPlantasConfig();
  if(!STATE.turnosCfg) STATE.turnosCfg = await getTurnosConfig();
  if(STATE.modoPruebas === undefined) STATE.modoPruebas = await getModoPruebas();

  /* Modo público: ver todos los correctivos de una UBT (acceso por QR) */
  if(STATE.modoVerUbt){
    document.body.classList.remove('login-bg');
    app.innerHTML = await renderVistaUbtPublica();
    return;
  }

  if(!STATE.rol){
    document.body.classList.add('login-bg');
    app.innerHTML = renderRolePicker();
    if(STATE.rolPrefijado){
      const r = STATE.rolPrefijado; STATE.rolPrefijado = null;
      setTimeout(()=>elegirRol(r), 60);
    }
    return;
  }
  document.body.classList.remove('login-bg');

  if(STATE.rol==='admin'){
    if(!STATE.adminOk){ app.innerHTML = renderTopbar() + renderAdminLogin(); return; }
    if(STATE.vista === 'menu'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${renderMenuInicio()}</div>`;
      return;
    }
    if(STATE.vista === 'analisis'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAnalisis()}</div>`;
      setTimeout(()=>{ calcularTiempoMuerto(); calcularFallasFrecuentes(); cargarRefaccionesAnalisis(); }, 60);
      return;
    }
    if(STATE.vista === 'tpm'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderVistaTpm({embed:true})}</div>`;
      return;
    }
    if(STATE.vista === 'tpm_imgs'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${renderImagenesTpm()}</div>`;
      return;
    }
    if(STATE.vista === 'historial'){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderHistorialFocos()}</div>`;
      return;
    }
    if(STATE.viendoTodo){
      app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderVerCorrectivos()}</div>`;
      setTimeout(()=>{ limpiarAutorelleno(['vt_filtro_ubt'], [ubtEsperado()]); filtrarVerTodo(); }, 60);
      return;
    }
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAdmin()}</div>`;
    setTimeout(()=>{ cargarInfoHistorial(); actualizarUbtsQR(); actualizarUbtsBorrado(); cambiarAlcanceBorrado(); cargarCatalogoPartes(); actualizarUbtsFocoTest(); cargarFocosAdmin(); }, 50);
    return;
  }

  if(STATE.nombre && !STATE.usuario){
    STATE.usuario = await getUsuario(STATE.nombre);
    if(STATE.usuario && pushDisponible() && Notification.permission === 'granted'){
      activarNotificaciones(true);
    }
  }
  /* El bloqueo se revisa SIEMPRE (también al entrar con el atajo de usuario guardado) */
  if(STATE.usuario && STATE.usuario.bloqueado){
    app.innerHTML = `<div class="wrap"><div class="card" style="text-align:center;">
      <h2 style="justify-content:center;">🚫 Acceso bloqueado</h2>
      <p style="font-size:14px;color:var(--muted);">Tu usuario fue bloqueado por el administrador.<br>Contacta a tu supervisor si crees que es un error.</p>
      <button class="btn ghost" onclick="cambiarRol()">Volver al inicio</button>
    </div></div>`;
    return;
  }
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';
  if(STATE.nombre && !STATE.usuario){
    app.innerHTML = renderTopbar() + renderGafeteSetup();
    return;
  }

  /* El operador siempre trae fija su UBT asignada (no la puede cambiar) */
  if(STATE.rol==='produccion' && STATE.plantaHoy && STATE.usuario){
    const subA = STATE.usuario.subrol || 'operador';
    if(!SUBROLES_PROD[subA]?.multiUbt){
      const asig = (STATE.usuario.ubtsPorPlanta||{})[STATE.plantaHoy] || [];
      if(asig.length && !STATE.ubtElegida) STATE.ubtElegida = asig[0];
    }
  }

  /* Pantalla principal de mosaicos */
  if(STATE.vista === 'menu'){
    STATE.viendoTodo = false; STATE.editandoUbts = false;
    const necesitaPlanta = ['tecnico','auditor','apqp','produccion'].includes(STATE.rol);
    const listoProd = STATE.rol!=='produccion' || ((STATE.usuario?.ubtsPorPlanta||{})[STATE.plantaHoy]||[]).length>0;
    if((!necesitaPlanta || STATE.plantaHoy) && listoProd){
      app.innerHTML = renderTopbar() + `<div class="wrap">${renderMenuInicio()}</div>`;
      if(STATE.rol==='produccion') setTimeout(cargarEstadoMenu, 80);
      return;
    }
  }

  if(STATE.viendoTodo){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderVerCorrectivos()}</div>`;
    setTimeout(()=>{ limpiarAutorelleno(['vt_filtro_ubt'], [ubtEsperado()]); filtrarVerTodo(); }, 60);
    return;
  }

  if(STATE.vista === 'analisis' && ['tecnico','supervisor','admin'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderAnalisis()}</div>`;
    setTimeout(()=>{ calcularTiempoMuerto(); calcularFallasFrecuentes(); cargarRefaccionesAnalisis(); }, 50);
    return;
  }
  if(STATE.vista === 'reportar' && STATE.rol==='tecnico'){
    if(!STATE.plantaHoy){
      app.innerHTML = renderTopbar() + `<div class="wrap"><div class="card">
        <h2>📢 Reportar al Supervisor</h2>
        <p style="font-size:13.5px;">Primero elige en qué planta estás trabajando.</p>
        <div class="planta-grid">${PLANTA_NOMBRES.map(p=>`<div class="planta-card" onclick="elegirPlantaHoy('${p.replace(/'/g,"\\'")}')">${p}</div>`).join('')}</div>
      </div></div>`;
      return;
    }
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${renderReportarFalla()}</div>`;
    setTimeout(()=>{ cargarMisReportes(); cargarListaPartesRp(); }, 50);
    return;
  }
  if(STATE.vista === 'foco' && ['produccion'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderFoco()}</div>`;
    iniciarAutoRefrescoFoco();
    return;
  }
  if(STATE.vista === 'tpm_imgs' && ['admin','supervisor'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${renderImagenesTpm()}</div>`;
    return;
  }
  if(STATE.vista === 'tpm' && ['produccion','auditor','supervisor','tecnico','apqp','admin'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderVistaTpm()}</div>`;
    return;
  }
  if(STATE.vista === 'solicitudes' && STATE.rol==='tecnico'){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderSolicitudesTecnico()}</div>`;
    return;
  }
  if(STATE.vista === 'historial' && puedeVerHistorialFocos()){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderHistorialFocos()}</div>`;
    return;
  }
  if(STATE.vista === 'firma' && STATE.usuario){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${renderRegistroFirma()}</div>`;
    setTimeout(iniciarCanvasFirma, 60);
    return;
  }
  if(STATE.vista === 'buzon' && STATE.rol==='supervisor'){
    app.innerHTML = renderTopbar() + `<div class="wrap">${barraInicio()}${await renderBuzonSupervisor()}</div>`;
    return;
  }

  const rolesConPlanta = ['tecnico','auditor','apqp','produccion'];
  if(rolesConPlanta.includes(STATE.rol) && !STATE.plantaHoy){
    app.innerHTML = renderTopbar() + renderPlantaPicker();
    return;
  }

  if(STATE.rol==='produccion' && STATE.plantaHoy){
    const sub = STATE.usuario?.subrol || 'operador';
    const multi = SUBROLES_PROD[sub]?.multiUbt;
    const asignadas = (STATE.usuario.ubtsPorPlanta||{})[STATE.plantaHoy] || [];
    if(asignadas.length===0 || STATE.editandoUbts){
      app.innerHTML = renderTopbar() + renderUbtsProdSetup(multi);
      return;
    }
    if(!multi) STATE.ubtElegida = asignadas[0];
  }

  if(esAuditorTipo && STATE.plantaHoy){
    const asignadas = (STATE.usuario.ubtsPorPlanta && STATE.usuario.ubtsPorPlanta[STATE.plantaHoy]) || [];
    if(asignadas.length===0 || STATE.editandoUbts){
      app.innerHTML = renderTopbar() + renderUbtsPlantaSetup();
      return;
    }
  }

  let body = '';
  try{
    if(STATE.rol==='tecnico') body = await renderTecnico();
    else if(STATE.rol==='auditor') body = await renderAuditor();
    else if(STATE.rol==='apqp') body = await renderApqp();
    else if(STATE.rol==='supervisor') body = await renderSupervisor();
    else if(STATE.rol==='produccion') body = await renderProduccion();
  }catch(err){
    body = `<div class="card"><h2>⚠️ Error</h2><p style="font-size:13px;color:var(--muted);">${escapeHtml(err.message||String(err))}</p></div>`;
  }
  app.innerHTML = renderTopbar() + renderBarraCola() + `<div class="wrap"><div id="banner_jornada" class="no-print" style="display:none;border-radius:10px;padding:14px;margin-bottom:14px;"></div>${avisoEntradaAnticipada()}${barraInicio()}${body}</div>`;
  setTimeout(iniciarVigilanciaJornada, 100);
  setTimeout(iniciarRecordatorios, 200);
  if(STATE.rol==='produccion') setTimeout(cargarZonaTpm, 120);
  if(STATE.rol==='supervisor') setTimeout(()=>{ limpiarAutorelleno(['filtro_planta','filtro_ubt']); filtrarSupervisor(); }, 60);
  if(STATE.rol==='tecnico' && sheetActivaKey) setTimeout(()=>{ cargarListaPartes(); restaurarBorradorRegistro(); iniciarAutoBorrador(); }, 60);
}

function editarUbts(){ STATE.editandoUbts = true; STATE.vista = null; render(); }
function cambiarPlanta(){ STATE.plantaHoy = null; STATE.ubtElegida = null; sheetActivaKey = null; render(); }
function verCorrectivos(){ STATE.viendoTodo = true; STATE.vista = null; render(); }
/* Barra fija para regresar a la pantalla principal desde cualquier vista */
function barraInicio(){
  return `<div class="card no-print" style="padding:10px 12px;margin-bottom:12px;"><button class="btn ghost small" onclick="irInicio()">🏠 Pantalla principal</button></div>`;
}
function volverDeVerTodo(){ STATE.viendoTodo = false; render(); }
function guardarBorradorRegistro(){
  const ids = ['f_fecha','f_hi','f_hf','f_gafete','f_sintomas','f_acciones','f_material','f_turno'];
  const chk = ['f_movio','f_verifico','f_solicitar_apqp','f_extra'];
  const b = {};
  let hayAlgo = false;
  ids.forEach(id=>{ const el=document.getElementById(id); if(el){ b[id]=el.value; if(['f_sintomas','f_acciones','f_material'].includes(id) && el.value.trim()) hayAlgo=true; } });
  chk.forEach(id=>{ const el=document.getElementById(id); if(el) b[id]=el.checked; });
  if(hayAlgo){
    STATE.borradorRegistro = b;
    /* La copia del dispositivo va sin la foto: ocupa mucho y llena el almacenamiento */
    const sinFoto = { ...b }; delete sinFoto.__foto;
    guardarBorradorLocal(sinFoto);
  }
}
function restaurarBorradorRegistro(){
  const b = STATE.borradorRegistro || leerBorradorLocal();
  if(!b) return;
  Object.entries(b).forEach(([id,val])=>{
    if(id.startsWith('__')) return;
    const el = document.getElementById(id);
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!val; else el.value = val;
  });
  validarTiempos();
  showToast('✓ Se recuperó lo que tenías escrito');
  STATE.borradorRegistro = null;
  borrarBorradorLocal();
}

function abrirVista(v){
  if(v==='reportar' && document.getElementById('f_sintomas')) guardarBorradorRegistro();
  pararAutoRefrescoFoco();
  STATE.vista = (STATE.vista===v) ? null : v;
  STATE.viendoTodo=false;
  render();
}
function irInicio(){
  STATE.vista = 'menu';
  STATE.viendoTodo = false; STATE.editandoUbts = false;
  sheetActivaKey = null; sheetActivaParams = null;
  if(STATE.rol !== 'produccion') STATE.ubtElegida = null;
  pararAutoRefrescoFoco();

}

  STATE.vista = null;
  STATE.viendoTodo = false; STATE.editandoUbts = false;

}
function saludoHora(){
  const h = ahora().getHours();

  if(h < 19) return 'Buenas tardes';
  return 'Buenas noches';
}

/* ---------- Pantalla principal: mosaicos grandes ---------- */
function renderMenuInicio(){
  const rol = STATE.rol;
  const sub = STATE.usuario?.subrol || '';
  const infoSub = SUBROLES_PROD[sub];
  const esOperador = rol==='produccion' && (sub==='operador' || !sub);
  const esAuditorTipo = rol==='auditor' || rol==='apqp';
  const t = [];

/* ---------- Cola de impresión por UBT ---------- */
let colaImpresion = [];

function enCola(key){ return colaImpresion.some(s=>s.key===key); }

async function toggleCola(key){
  if(enCola(key)){
    colaImpresion = colaImpresion.filter(s=>s.key!==key);
    showToast('Quitado de la cola');
  } else {
    const sheet = await getSheet(key);
    if(sheet){ sheet.key = key; colaImpresion.push(sheet); showToast('➕ Agregado a la cola ('+colaImpresion.length+')'); }
  }
  render();
}

async function agregarUbtACola(planta, ubt){
  const todas = await listSheets({planta, ubts:[ubt]});
  const delUbt = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
  let nuevos = 0;
  delUbt.forEach(s=>{ if(!enCola(s.key)){ colaImpresion.push(s); nuevos++; } });
  showToast(nuevos>0 ? `➕ ${nuevos} hoja(s) de UBT ${ubt} agregadas` : 'Ya estaban todas en la cola');
  render();
}

function limpiarCola(){ colaImpresion = []; showToast('Cola vaciada'); render(); }

function imprimirCola(){
  if(colaImpresion.length===0){ showToast('⚠️ La cola está vacía'); return; }

  /* Nombre según el contenido de la cola */
  const ubts = [...new Set(colaImpresion.map(s=>s.ubtNo))];
  const maqs = [...new Set(colaImpresion.map(s=>s.maquina))];
  const p = colaImpresion[0];
  let titulo;
  if(ubts.length === 1 && maqs.length === 1){
    titulo = `Correctivo-${maqs[0]}-${ubts[0]}-${p.mes}-${p.anio}`;
  } else if(ubts.length === 1){
    titulo = `Correctivo-${ubts[0]}-${p.mes}-${p.anio}`;
  } else {
    titulo = `Correctivo-Varios UBT-${p.mes}-${p.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const hojas = colaImpresion.map(s=>renderSheetVisual(s,{role:'lectura', publico:true})).join('<div style="page-break-after:always;"></div>');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana emergente'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>${estilos}
    <style>body{background:#fff;margin:0;padding:0;} .no-print{display:none !important;}
    @page{size:letter landscape;margin:6mm;}
    html,body{width:100%;margin:0;padding:0;}
    .sheet-page{border:none;box-shadow:none;width:100%;min-height:0;margin:0;padding:0;
                page-break-inside:avoid;transform:none;}
    .lear-logo{width:150px;}
    table.sheet-table tbody tr{height:58px;}</style></head><body>${hojas}</body></html>`);
  ventana.document.close(); ventana.focus();
  setTimeout(()=>ventana.print(), 500);
}

  const g = JSON.parse(localStorage.getItem('correctivo_usuario_guardado') || 'null');
  if(!g) return;
  STATE.rol = g.rol; STATE.nombre = g.nombre;
  STATE.usuario = await getUsuario(g.nombre);

  if(STATE.usuario && STATE.usuario.bloqueado){ STATE.vista = null; render(); return; }

    STATE.usuario = { nombre:g.nombre, rol:g.rol, gafete:g.gafete||'—', ubtsPorPlanta:{}, bloqueado:false };

  document.getElementById('nombre_form_title').textContent = ROLES[rol].emoji + ' Acceso — ' + ROLES[rol].label;

async function confirmarAcceso(){
  const nombre = document.getElementById('nombre_input').value.trim();
  const gafete = document.getElementById('gafete_login').value.trim();
  const turnoSel = document.getElementById('turno_login').value;
  const subrolSel = document.getElementById('subrol_login')?.value || '';
  const codigo = document.getElementById('codigo_input').value;
  const recordar = document.getElementById('recordar_chk').checked;
  const esSupervisor = rolSeleccionadoTemp === 'supervisor';

  if(!nombre){ document.getElementById('nombre_input').style.borderColor='red'; return; }
  if(!esSupervisor && !gafete){ document.getElementById('gafete_login').style.borderColor='red'; showToast('⚠️ Escribe tu No. de Gafete'); return; }
  if(codigo !== STATE.codes[rolSeleccionadoTemp]){ document.getElementById('codigo_error').style.display='block'; return; }

  STATE.rol = rolSeleccionadoTemp; STATE.nombre = nombre;

  const existente = await getUsuario(nombre);
  if(existente && existente.bloqueado){ STATE.usuario = existente; render(); return; }

  if(existente){
    /* Ya estaba registrado: conservamos sus UBTs y solo actualizamos lo básico */
    STATE.usuario = {
      ...existente,
      rol: STATE.rol,
      gafete: esSupervisor ? '—' : (gafete || existente.gafete),
      turno: turnoSel, extraInicio:'', extraFin:'',
      subrol: rolSeleccionadoTemp==='produccion' ? subrolSel : ''
    };
  } else {
    STATE.usuario = { nombre, gafete: esSupervisor ? '—' : gafete, rol: STATE.rol, ubtsPorPlanta: {}, bloqueado:false, turno: turnoSel, extraInicio:'', extraFin:'', subrol: rolSeleccionadoTemp==='produccion' ? subrolSel : '' };
  }
  try{ await saveUsuario(STATE.usuario); }catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  if(recordar){
    localStorage.setItem('correctivo_usuario_guardado', JSON.stringify({nombre, rol:STATE.rol, gafete: STATE.usuario.gafete, turno: turnoSel}));
  }
  await activarNotificaciones(true);
  STATE.vista = 'menu';
  render();
}

async function abrirPaginaAutomatica(planta,ubt,maquina,mes,anio){
  let pagina = 1;
  const MAX_PAGINAS = 60;   /* candado de seguridad: nunca un ciclo infinito */
  while(pagina <= MAX_PAGINAS){
    const key = sheetKey(planta,ubt,maquina,mes,anio,pagina);
    let sheet = await getSheet(key);
    if(!sheet){ sheet = { planta, ubtNo:ubt, maquina, mes, anio, pagina, filas: [] }; await saveSheet(key, sheet); }
    if((sheet.filas||[]).length < MAX_FILAS_POR_HOJA){
      sheetActivaKey = key;
      sheetActivaParams = {planta,ubt,maquina,mes,anio,pagina};
      return;
    }
    pagina++;
  }
  showToast('⚠️ Demasiadas páginas en esta máquina. Avisa al administrador.');
}
async function abrirHoja(){
  const maquina = document.getElementById('s_maquina').value;
  const mes = document.getElementById('s_mes').value;
  const anio = document.getElementById('s_anio').value.trim();
  await abrirPaginaAutomatica(STATE.plantaHoy, STATE.ubtElegida, maquina, mes, anio);
  render();
}
async function siguientePagina(){
  const p = sheetActivaParams;
  await abrirPaginaAutomatica(p.planta,p.ubt,p.maquina,p.mes,p.anio);
  render();
}

let guardandoFila = false;
async function agregarFila(){
  if(guardandoFila) return;                       /* evita registros duplicados por doble toque */
  const sintomas = document.getElementById('f_sintomas').value.trim();
  if(!sintomas){ showToast('⚠️ Escribe los Síntomas/Fallas'); return; }
  if(!validarTiempos()){ showToast('⚠️ Revisa las horas antes de guardar'); return; }

  const btn = document.getElementById('btn_guardar_fila');
  guardandoFila = true;
  if(btn){ btn.disabled = true; btn.textContent = 'Guardando...'; btn.style.opacity = '.6'; }
  const liberar = ()=>{ guardandoFila = false; if(btn){ btn.disabled=false; btn.textContent='Guardar registro y notificar'; btn.style.opacity='1'; } };

  const sheet = await getSheet(sheetActivaKey);
  if(!sheet){ liberar(); showToast('⚠️ La hoja ya no existe'); sheetActivaKey=null; render(); return; }
  if((sheet.filas||[]).length >= MAX_FILAS_POR_HOJA){ liberar(); showToast('⚠️ Esta hoja ya está llena'); render(); return; }
  const solicitarApqp = document.getElementById('f_solicitar_apqp').checked;
  const hi = document.getElementById('f_hi').value;
  const hf = document.getElementById('f_hf').value;
  const numeroParte = refaccionesElegidas.map(r=>r.numero_parte).join(', ');
  const parteDesc = refaccionesElegidas.map(r=>r.descripcion||'').filter(Boolean).join(' · ');
  const fila = {
    id: uid(),
    fecha: document.getElementById('f_fecha').value,
    horaInicio: hi,
    horaFinal: hf,
    minutosParo: minutosEntre(hi, hf),
    turno: document.getElementById('f_turno').value,
    tiempoExtra: document.getElementById('f_extra').checked,
    registradoEn: ahoraISO(),
    numeroParte, parteDesc,
    gafete: document.getElementById('f_gafete').value.trim(),
    sintomas, acciones: document.getElementById('f_acciones').value.trim(),
    material: document.getElementById('f_material').value.trim(),
    seMovioModulo: document.getElementById('f_movio').checked,
    seVerificoModulo: document.getElementById('f_verifico').checked,
    tecnico: STATE.nombre,
    firmaTecnicoImg: (STATE.usuario?.modoFirma==='dibujo' && STATE.usuario?.firma) ? STATE.usuario.firma : '',
    firmaAuditorNombre:'', firmaAuditorFecha:'',
    firmaAPQPNombre:'', firmaAPQPFecha:'',
    estadoAuditor: 'pendiente',
    estadoAPQP: solicitarApqp ? 'pendiente' : 'no_aplica',
    creadoEn: ahoraISO()
  };
  sheet.filas.push(fila);
  try{ await saveSheet(sheetActivaKey, sheet); }
  catch(err){ liberar(); showToast('⚠️ No se pudo guardar: ' + (err.message||String(err))); return; }
  liberar();
  /* Cada refacción usada suma una vez en el catálogo */
  for(const r of refaccionesElegidas) registrarRefaccion(r.numero_parte, r.descripcion||'');
  refaccionesElegidas = [];
  cacheHojasFallas = null;
  STATE.borradorRegistro = null; borrarBorradorLocal();

  /* Notificar al auditor de calidad asignado a este UBT */
  const auditores = await destinatariosPara('auditor', sheet.planta, sheet.ubtNo);
  enviarNotificacion(
    auditores,
    '🔧 Reparación pendiente de tu firma',
    `${STATE.nombre} realizó una reparación en UBT ${sheet.ubtNo} (${sheet.maquina}). Necesita tu firma como Auditor de Calidad.`
  );

  /* Si se solicitó APQP, notificar también al APQP asignado */
  if(solicitarApqp){
    const apqps = await destinatariosPara('apqp', sheet.planta, sheet.ubtNo);
    enviarNotificacion(
      apqps,
      '✅ Firma de APQP solicitada',
      `${STATE.nombre} solicitó tu firma en UBT ${sheet.ubtNo} (${sheet.maquina}).`
    );
  }

  showToast('Registro guardado y notificado ✓');
  /* Regresa a la ventana de todas las UBT de la planta */
  sheetActivaKey = null;
  STATE.ubtElegida = null;
  render();
}

async function renderAuditor(){

  return `

    <p style="font-size:13px;color:var(--muted);margin-top:-8px;">Solicita ayuda de un técnico para tu línea.</p>
    <button onclick="abrirVista('foco')" style="background:${miaRecibida?'#1a7a3c':(miasAbiertas.length?'#e0b400':'#f0f2f4')};border:3px solid ${miaRecibida?'#146030':(miasAbiertas.length?'#c77700':'#d4d8dc')};border-radius:50%;width:120px;height:120px;font-size:52px;cursor:pointer;transition:.2s;box-shadow:${miasAbiertas.length?(miaRecibida?'0 0 26px #1a7a3c88':'0 0 26px #e0b40088'):'none'};">${miaRecibida?'🔧':'💡'}</button>
    ${miasAbiertas.length ? `
      <div style="margin-top:12px;display:inline-block;text-align:left;background:${miaRecibida?'#f4faf5':'#fffdf5'};border:1px solid ${miaRecibida?'#cfe3d4':'#f0c674'};border-radius:10px;padding:11px 14px;font-size:13px;max-width:420px;">
        ${miaRecibida ? `<b style="color:#1a7a3c;">✓ Tu solicitud fue recibida</b><br>Técnico <b>${escapeHtml(miaRecibida.atendido_por||'')}</b> · UBT ${escapeHtml(miaRecibida.ubt_no)} · ${escapeHtml(miaRecibida.maquina)}`
          : `<b style="color:#a16d07;">● Enviada, aún sin recibir</b><br>Hace ${minutosDesde(miaEsperando.creado_en)} min · UBT ${escapeHtml(miaEsperando.ubt_no)} · ${escapeHtml(miaEsperando.maquina)}`}
        <div style="margin-top:7px;"><button class="btn ghost small" onclick="abrirVista('foco')">Ver detalle</button></div>

/* ---------- TPM (formato mensual estilo hoja de piso) ---------- */
/* El TPM solo aplica a estas máquinas */
const MAQ_TPM = ["Prueba Eléctrica","Pre-Eléctrica","Sistema de Navegación","Torques"];
function esMaquinaTpm(m){ return MAQ_TPM.includes(m); }

/* El formato imprime turnos A y B; si el usuario es de turno C se agrega su fila */
function letraTurno(t){ return String(t||'TA').replace('T','').toUpperCase(); }
function fechaLocalISO(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
/* Acomoda los días hábiles del mes en semanas de L a V, como el formato de papel */
function mapaMesTpm(anio, mesIdx){
  const totalDias = new Date(anio, mesIdx+1, 0).getDate();
  const semanas = [];
  let sem = 0, iniciado = false;
  for(let d=1; d<=totalDias; d++){
    const f = new Date(anio, mesIdx, d);
    const wd = (f.getDay()+6)%7;          /* 0 = lunes ... 6 = domingo */
    if(wd > 4) continue;                  /* el formato solo tiene L a V */
    if(wd === 0 && iniciado) sem++;       /* cada lunes empieza otra semana */
    iniciado = true;
    if(!semanas[sem]) semanas[sem] = [null,null,null,null,null];
    semanas[sem][wd] = fechaLocalISO(f);
  }
  while(semanas.length < 5) semanas.push([null,null,null,null,null]);
  for(let i=0;i<semanas.length;i++) if(!semanas[i]) semanas[i]=[null,null,null,null,null];
  return semanas;
}

/* ---------- Datos del mes ---------- */
async function getTpmMes(planta, ubt, maquina, anio, mesIdx){
  const desde = fechaLocalISO(new Date(anio, mesIdx, 1));
  const hasta = fechaLocalISO(new Date(anio, mesIdx+1, 0));
  try{
    const q = `tpm_registros?fecha=gte.${desde}&fecha=lte.${hasta}` +
      `&planta=eq.${encodeURIComponent(planta)}&ubt_no=eq.${encodeURIComponent(ubt)}` +
      `&maquina=eq.${encodeURIComponent(maquina)}&select=*`;
    return await sbFetch(q) || [];
  }catch(e){ console.warn(e); return []; }
}

/* ---------- Firmas del mes (se guardan en la tabla config) ---------- */
function claveFirmasTpm(planta, ubt, maquina, anio, mesIdx){
  return `tpmfirma:${slug(planta)}--${slug(ubt)}--${slug(maquina)}--${anio}-${String(mesIdx+1).padStart(2,'0')}`;
}
async function getFirmasTpm(clave){
  try{
    const r = await sbFetch('config?clave=eq.'+encodeURIComponent(clave)+'&select=valor');
    return (r && r[0]) ? (r[0].valor||{}) : {};
  }catch(e){ return {}; }
}
async function saveFirmasTpm(clave, valor){
  await sbFetch('config?on_conflict=clave', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave, valor, actualizado_en:ahoraISO() })
  });
}

let tpmCtx = null;        /* { planta, ubt, maquina, anio, mes, marcas, firmas, regs } */
let tpmLlenado = null;    /* { turno:'A', operador:'Nombre' } quién está marcando */
let tGuardaTpm = null;

function puedeImprimirTpm(){ return ['tecnico','supervisor','admin'].includes(STATE.rol); }

function tpmPuedeLlenar(){

  const sub = STATE.usuario?.subrol || 'operador';

/* ---------- Vista de la hoja TPM ---------- */
async function renderVistaTpm(opts){
  opts = opts || {};
  const planta = STATE.tpmSel?.planta || STATE.plantaHoy || '';
  const esOperador = esOperadorProd();

  /* UBTs y máquinas disponibles según el rol */
  let ubtsDisp;
  if(esOperador){
    ubtsDisp = [STATE.ubtElegida].filter(Boolean);
  } else if(STATE.rol === 'produccion' || STATE.rol === 'auditor' || STATE.rol === 'apqp'){
    /* Líder, Supervisor de Producción, Multifuncional, Auditor y APQP: sus líneas asignadas */
    ubtsDisp = (STATE.usuario?.ubtsPorPlanta||{})[planta] || [];
  } else {
    /* Mantenimiento, Supervisor de Mantenimiento y Admin: todas las líneas de la planta */
    ubtsDisp = ubtsDeLaPlanta(STATE.plantasCfg || {}, planta);
  }

  const volver = opts.embed ? '' : `<div class="card no-print"><button class="btn ghost small" onclick="irInicio()">← Volver</button></div>`;

  /* Admin, Mantenimiento y Supervisor pueden ver cualquier planta: primero la eligen */
  if(!planta){
    return `${volver}<div class="card">
      <h2>🗓️ Hoja TPM</h2>
      <p style="font-size:13.5px;">Elige la planta que quieres revisar.</p>
      <div class="planta-grid">${PLANTA_NOMBRES.map(p=>`<div class="planta-card" onclick="elegirPlantaTpm('${escArg(p)}')">${escapeHtml(p)}</div>`).join('')}</div>
    </div>`;
  }

  if(ubtsDisp.length === 0){
    return `${volver}<div class="card"><h2>📋 TPM</h2><div class="empty">No tienes UBT asignadas en ${escapeHtml(planta||'')}.</div></div>`;
  }

  const sel = STATE.tpmSel || {};
  if(!ubtsDisp.includes(sel.ubt)) sel.ubt = ubtsDisp[0];
  const maqOperador = STATE.usuario?.maquina || '';
  if(esOperador) sel.maquina = maqOperador;
  if(!MAQ_TPM.includes(sel.maquina)) sel.maquina = esOperador ? maqOperador : MAQ_TPM[0];
  if(sel.mes === undefined || sel.mes === null) sel.mes = ahora().getMonth();
  if(!sel.anio) sel.anio = ahora().getFullYear();
  STATE.tpmSel = sel;

  /* El operador solo hace TPM si su máquina es de las que lo llevan */
  if(esOperador && !esMaquinaTpm(maqOperador)){
    return `${volver}
      <div class="card">
        <h2>📋 TPM diario</h2>
        <div style="background:#eef4f8;border-left:4px solid #0f3d5c;border-radius:8px;padding:12px;font-size:13.5px;">
          Tu máquina (<b>${escapeHtml(maqOperador||'sin asignar')}</b>) no lleva TPM autónomo.<br>
          El TPM solo aplica para: ${MAQ_TPM.join(', ')}.
        </div>
      </div>`;
  }

  const regs = await getTpmMes(planta, sel.ubt, sel.maquina, sel.anio, sel.mes);
  const marcas = {};
  regs.forEach(r => { marcas[`${r.fecha}|${letraTurno(r.turno)}`] = r; });
  const claveF = claveFirmasTpm(planta, sel.ubt, sel.maquina, sel.anio, sel.mes);
  const guardado = await getFirmasTpm(claveF);
  const imgs = await getImagenesTpm(sel.maquina);
  tpmCtx = { planta, ubt:sel.ubt, maquina:sel.maquina, anio:sel.anio, mes:sel.mes,
             marcas, firmas:guardado, comentarios: guardado.comentarios || '', imgs, claveF };

  /* Quién marca hoy */
  if(!tpmLlenado){
    tpmLlenado = { turno: letraTurno(STATE.usuario?.turno), operador: esOperador ? STATE.nombre : '' };
  }
  if(esOperador){ tpmLlenado.turno = letraTurno(STATE.usuario?.turno); tpmLlenado.operador = STATE.nombre; }

  const selectorMes = `
    <div class="card no-print">
      <div class="filters" style="margin-bottom:0;">
        ${esOperador ? '' : `<select id="tpm_ubt" onchange="cambiarTpmSel()">${ubtsDisp.map(u=>`<option ${u===sel.ubt?'selected':''}>${escapeHtml(u)}</option>`).join('')}</select>
        <select id="tpm_maquina" onchange="cambiarTpmSel()">${MAQ_TPM.map(m=>`<option ${m===sel.maquina?'selected':''}>${escapeHtml(m)}</option>`).join('')}</select>`}
        <select id="tpm_mes" onchange="cambiarTpmSel()">${MESES.map((m,i)=>`<option value="${i}" ${i===sel.mes?'selected':''}>${m}</option>`).join('')}</select>
        <select id="tpm_anio" onchange="cambiarTpmSel()">${[sel.anio-1, sel.anio, sel.anio+1].map(a=>`<option ${a===sel.anio?'selected':''}>${a}</option>`).join('')}</select>
        ${verTodasLasPlantasTpm()?`<button class="btn small ghost" onclick="cambiarPlantaTpm()">🏭 ${escapeHtml(planta)}</button>`:''}
        ${puedeImprimirTpm()?`<button class="btn small secondary" onclick="imprimirTpm()">🖨️ Imprimir</button>`:''}
      </div>
    </div>`;

  const barraLlenado = tpmPuedeLlenar() ? renderBarraLlenadoTpm(esOperador) : '';

  const cajaComentarios = tpmPuedeLlenar() ? `
    <div class="card no-print">
      <h2>📝 Comentarios de la hoja</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Anota aquí cualquier condición anormal de la máquina. Se imprime junto con la hoja.</p>
      <textarea id="tpm_coment_input" rows="3" placeholder="Escribe aquí...">${escapeHtml(tpmCtx.comentarios||'')}</textarea>
      <button class="btn small secondary" onclick="guardarComentariosTpm()">Guardar comentarios</button>
      <span id="tpm_coment_estado" style="font-size:12.5px;color:var(--muted);margin-left:8px;"></span>
    </div>` : '';

  return `
  ${volver}
  ${selectorMes}
  ${barraLlenado}
  <div class="tpm-scroll"><div id="tpm_hoja">${renderHojaTpm()}</div></div>
  ${cajaComentarios}`;
}

function renderBarraLlenadoTpm(esOperador){
  const hoy = ahora();
  const nombreDia = DIAS_SEMANA[hoy.getDay()];
  const finDeSemana = hoy.getDay()===0 || hoy.getDay()===6;
  if(finDeSemana){
    return `<div class="card no-print" style="background:#eef1f4;">
      <div style="font-size:13px;">📅 Hoy es <b>${nombreDia}</b>. El formato solo tiene columnas de lunes a viernes, así que hoy no hay casilla que marcar.</div>
    </div>`;
  }
  return `<div class="card no-print" style="background:#fff7e6;border-color:#f0c674;">
    <div style="font-size:13px;margin-bottom:8px;">
      ✍️ Estás marcando la columna de <b>hoy ${nombreDia} ${hoy.getDate()}</b>.
      Los demás días quedan bloqueados: cada día solo se puede llenar el que corresponde.
    </div>
    ${esOperador ? `<div style="font-size:12.5px;color:var(--muted);">Turno <b>${tpmLlenado.turno}</b> · Operador <b>${escapeHtml(STATE.nombre)}</b></div>` : `
      <div class="row2">
        <div class="field"><label>Turno que estás llenando</label>
          <select id="tpm_turno_llenado" onchange="cambiarTurnoLlenado()">
            ${['A','B','C'].map(l=>`<option ${l===tpmLlenado.turno?'selected':''}>${l}</option>`).join('')}
          </select>
        </div>
        <div class="field"><label>Operador (si llenas por ausencia)</label>
          <input id="tpm_operador_llenado" value="${escapeHtml(tpmLlenado.operador||'')}" placeholder="Nombre del operador" onchange="cambiarTurnoLlenado()">
        </div>
      </div>`}
    <div id="tpm_estado_guardado" style="font-size:12.5px;color:var(--muted);margin-bottom:10px;"></div>
    <button class="btn" id="btn_terminar_tpm" onclick="terminarTpmDelDia()">🏁 Terminar TPM de hoy y notificar</button>
    <div style="font-size:11.5px;color:var(--muted);margin-top:6px;">Se avisa al <b>Líder</b> y al <b>Auditor</b> de esta UBT y de tu mismo turno.</div>
  </div>`;
}

/* ---------- La hoja tal cual el formato de papel ---------- */
function renderHojaTpm(){
  const c = tpmCtx;
  if(!c) return '';
  const semanas = mapaMesTpm(c.anio, c.mes);
  const hoy = todayISO();
  const puedeLlenar = tpmPuedeLlenar();
  const letraEdit = tpmLlenado ? tpmLlenado.turno : '';

  /* Turnos que se muestran: A y B como el formato, más C si hay datos o si el usuario es de turno C */
  const letras = ['A','B'];
  const hayC = Object.keys(c.marcas).some(k=>k.endsWith('|C')) || letraTurno(STATE.usuario?.turno)==='C';
  if(hayC) letras.push('C');

  const encabezadoSemanas = semanas.map((_,i)=>`<th colspan="5" class="tpm-sem">Semana ${i+1}</th>`).join('');
  const encabezadoDias = semanas.map(()=>['L','M','M','J','V'].map(d=>`<th class="tpm-dia">${d}</th>`).join('')).join('');

  const cuerpo = TPM_ACTIVIDADES.map(a=>{
    return letras.map((letra,idx)=>{
      const celdas = semanas.map(sem => sem.map(fecha=>{
        /* Día que no existe en el mes (semana que empezó antes o terminó después) */
        if(!fecha) return `<td class="tpm-cel tpm-vacio"><span class="tpm-guion">–</span></td>`;
        const reg = c.marcas[`${fecha}|${letra}`];
        const marcado = !!(reg && reg.actividades && reg.actividades[a.id]);
        const esHoy = fecha === hoy;
        const editable = puedeLlenar && esHoy && letra === letraEdit;
        if(editable){
          return `<td class="tpm-cel tpm-hoy"><input type="checkbox" class="tpm-chk-cel" data-act="${a.id}" ${marcado?'checked':''} onchange="marcarCeldaTpm()"></td>`;
        }
        if(marcado) return `<td class="tpm-cel ${esHoy?'tpm-hoy':''}">✔</td>`;
        /* Día que ya pasó y nadie lo llenó: queda con guion, como en el papel */
        if(fecha < hoy) return `<td class="tpm-cel"><span class="tpm-guion">–</span></td>`;
        return `<td class="tpm-cel ${esHoy?'tpm-hoy':''}"></td>`;
      }).join('')).join('');
      if(idx === 0){
        return `<tr>
          <td class="tpm-sub" rowspan="${letras.length}">${a.sub}</td>
          <td class="tpm-ayuda" rowspan="${letras.length}">${(c.imgs&&c.imgs[a.id])?`<img src="${c.imgs[a.id]}" alt="">`:'<span class="tpm-sinfoto">📷</span>'}</td>
          <td class="tpm-act" rowspan="${letras.length}">${a.texto}</td>
          <td class="tpm-turno">${letra}</td>${celdas}
        </tr>`;
      }
      return `<tr><td class="tpm-turno">${letra}</td>${celdas}</tr>`;
    }).join('');
  }).join('');

  return `
  <div class="tpm-hoja">
    <div class="tpm-rev">Revision 1 (3/24/15)</div>
    <div class="tpm-cabecera">
      <div class="tpm-planta"><u>${escapeHtml(c.planta||'')}</u></div>
      <div class="tpm-titulo">
        MANTENIMIENTO PRODUCTIVO TOTAL<br>
        <span>TPM Autónomo ${escapeHtml(c.maquina)}</span>
      </div>
      <div></div>
    </div>
    <div class="tpm-ubic">
      <b>Ubicacion de la Maquina:</b> <u>UBT - ${escapeHtml(c.ubt)}</u> &nbsp;&nbsp; <u>${escapeHtml((c.maquina||'').toUpperCase())}</u>
      <span class="tpm-mes"><b>MES: ${MESES[c.mes].toUpperCase()} ${c.anio}</b></span>
    </div>
    <div class="tpm-instr">
      <b>Instrucciones:</b> Realizar las actividades que se listan en este formato y marcar con ( ✔ ) correspondiente tan pronto se complete la actividad descrita, esta tarea debe completarse en menos de <b>5 minutos</b>.
      <div class="tpm-herr">Herramientas / materiales requeridas: Brochas de cerdas naturales, franela o toallas de taller, aceite lubricante Neumatico.</div>
    </div>
    <table class="tpm-table">
      <thead>
        <tr>
          <th rowspan="2" class="tpm-sub">Sub-Ensamble</th>
          <th rowspan="2" class="tpm-ayuda">Ayuda Visual</th>
          <th rowspan="2" class="tpm-act">Actividad</th>
          <th rowspan="2" class="tpm-turno">Turno</th>
          ${encabezadoSemanas}
        </tr>
        <tr>${encabezadoDias}</tr>
      </thead>
      <tbody>${cuerpo}</tbody>
    </table>
    <div class="tpm-nota"><b>Nota:</b> Cualquier condicion anormal reportala a tu Lider de Grupo o a tu Supervisor.</div>
    <div class="tpm-nota">Usar el reverso de este formato para reportar condiciones anormales de la maquina.</div>

/* ¿Este usuario puede firmar este espacio? */
function puedeFirmarTpm(campo){
  const c = tpmCtx;
  if(!c) return false;
  const letra = campo.slice(-1);
  const miLetra = letraTurno(STATE.usuario?.turno);
  const misUbts = (STATE.usuario?.ubtsPorPlanta||{})[c.planta] || [];
  const asignado = misUbts.includes(c.ubt);
  if(campo.startsWith('auditor')){
    return STATE.rol==='auditor' && asignado && letra===miLetra;
  }
  const sub = STATE.usuario?.subrol || '';
  return STATE.rol==='produccion' && sub==='lider' && asignado && letra===miLetra;
}

function bloqueFirmaTpm(campo, etiqueta){
  const f = (tpmCtx.firmas||{})[campo];
  let contenido;
  if(f && f.nombre){
    contenido = `${f.img?`<img class="tpm-firma-img" src="${f.img}" alt="">`:''}
      <div class="tpm-firma-nom">${escapeHtml(f.nombre)}</div>
      <div class="tpm-firma-fec">${escapeHtml(f.fecha||'')}</div>`;
  } else if(puedeFirmarTpm(campo)){
    contenido = `<button class="btn small secondary no-print" onclick="firmarTpm('${campo}')">✍️ Firmar</button>`;
  } else {
    contenido = `<div class="tpm-firma-nom">&nbsp;</div>`;
  }
  return `<div class="tpm-firma"><div class="tpm-firma-cont">${contenido}</div><div class="tpm-firma-linea"></div><div class="tpm-firma-tit">${etiqueta}</div></div>`;
}

async function firmarTpm(campo){
  if(!puedeFirmarTpm(campo)){ showToast('⚠️ Este espacio no te corresponde'); return; }
  const c = tpmCtx;
  const firmas = await getFirmasTpm(c.claveF);
  if(firmas[campo] && firmas[campo].nombre){ showToast('Ese espacio ya está firmado'); render(); return; }
  firmas[campo] = {
    nombre: STATE.nombre,
    gafete: STATE.usuario?.gafete || '',
    fecha: nowLabel(),
    img: (STATE.usuario?.modoFirma==='dibujo' && STATE.usuario?.firma) ? STATE.usuario.firma : ''
  };
  try{ await saveFirmasTpm(c.claveF, firmas); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }
  showToast('Firmado ✓');
  render();
}

async function guardarTpmDeHoy(){
  const c = tpmCtx;
  if(!c) return;
  const est = document.getElementById('tpm_estado_guardado');
  const fecha = todayISO();
  const letra = tpmLlenado.turno;
  const chks = [...document.querySelectorAll('.tpm-chk-cel')];
  if(chks.length === 0) return;

  const actividades = {};
  chks.forEach(ch => { actividades[ch.dataset.act] = ch.checked; });
  const completo = TPM_ACTIVIDADES.every(a => actividades[a.id]);

  const previo = c.marcas[`${fecha}|${letra}`];
  const eraCompleto = !!(previo && previo.completo);

  const reg = {
    id: previo?.id || uid(),                 /* se reutiliza la fila del día: no se duplican registros */
    fecha,
    planta: c.planta,
    ubt_no: c.ubt,
    maquina: c.maquina,
    turno: 'T' + letra,
    operador: tpmLlenado.operador || STATE.nombre,
    gafete: STATE.usuario?.gafete || '',
    llenado_por: STATE.nombre,
    rol_llenado: STATE.usuario?.subrol || '',
    actividades,
    completo,
    creado_en: previo?.creado_en || ahoraISO()
  };

  try{ await saveTpm(reg); }
  catch(err){ if(est) est.textContent = '⚠️ No se guardó: ' + (err.message||err); return; }

  c.marcas[`${fecha}|${letra}`] = reg;
  const hechas = TPM_ACTIVIDADES.filter(a=>actividades[a.id]).length;
  if(est) est.innerHTML = `✓ Guardado — ${hechas} de ${TPM_ACTIVIDADES.length} actividades marcadas` +
    (completo ? ' <b style="color:#1a7a3c;">· TPM del día completo</b>' : '');

  const btn = document.getElementById('btn_terminar_tpm');
  if(btn){
    btn.disabled = !completo;
    btn.style.opacity = completo ? '1' : '.5';
  }
}

/* El operador cierra el TPM del día a propósito, con este botón */
async function terminarTpmDelDia(){
  const c = tpmCtx;
  if(!c) return;
  const fecha = todayISO();
  const letra = tpmLlenado.turno;
  const reg = c.marcas[`${fecha}|${letra}`];
  if(!reg){ showToast('⚠️ Primero marca las actividades'); return; }
  const hechas = TPM_ACTIVIDADES.filter(a => reg.actividades && reg.actividades[a.id]).length;
  if(hechas < TPM_ACTIVIDADES.length){
    showToast(`⚠️ Faltan ${TPM_ACTIVIDADES.length - hechas} actividades por marcar`);
    return;
  }
  if(reg.avisado){ showToast('Ya se había avisado hoy'); return; }
  const btn = document.getElementById('btn_terminar_tpm');
  if(btn){ btn.disabled = true; btn.textContent = 'Enviando aviso...'; }
  const enviados = await avisarTpmCompleto(reg);
  reg.avisado = true;
  try{ await saveTpm(reg); }catch(e){ console.warn(e); }
  showToast(enviados > 0 ? `✓ TPM terminado — se avisó a ${enviados} persona(s)` : '✓ TPM terminado (nadie asignado a esta línea y turno)');
  render();
}

async function avisarTpmCompleto(reg){
  try{
    const usuarios = await listUsuarios();
    const destino = usuarios.filter(u =>
      !u.bloqueado &&
      (u.rol==='auditor' || (u.rol==='produccion' && u.subrol==='lider')) &&
      ((u.ubtsPorPlanta||{})[reg.planta]||[]).includes(reg.ubt_no) &&
      (!u.turno || letraTurno(u.turno) === letraTurno(reg.turno))
    ).map(u=>slug(u.nombre));
    if(destino.length === 0) return 0;
    enviarNotificacion(destino, '📋 TPM diario terminado',
      `${reg.operador} terminó el TPM de la UBT ${reg.ubt_no} (${reg.maquina}), turno ${letraTurno(reg.turno)}. Falta tu firma en la hoja del mes.`);
    return destino.length;
  }catch(e){ console.warn(e); return 0; }
}
