/* Tarjeta con la linea de estado, para que el solicitante sepa si ya la recibieron */
function tarjetaMiSolicitud(s){
  const min = minutosDesde(s.creado_en);
  const espera = minutosEntreISO(s.creado_en, s.atendido_en);
  const reparacion = minutosEntreISO(s.atendido_en, s.terminado_en);
  const recibida = s.estado==='atendida' || s.estado==='terminada';
  const terminada = s.estado==='terminada';
  const tarde = !recibida && min >= 10;
  const color = terminada ? '#0f3d5c' : (recibida ? '#1a7a3c' : (tarde ? '#a13636' : '#a16d07'));
  const fondo = terminada ? '#eef4f8' : (recibida ? '#f4faf5' : (tarde ? '#fdf1f1' : '#fffdf5'));
  const borde = terminada ? '#bcd4e4' : (recibida ? '#cfe3d4' : (tarde ? '#e9b7b7' : '#f0c674'));
  const paso = (ok,txt)=>`<div class="paso ${ok?'ok':'no'}"><span class="bolita">${ok?'✓':'•'}</span><span>${txt}</span></div>`;
  return `
  <div style="border:1px solid ${borde};border-left:5px solid ${color};background:${fondo};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
      <b style="font-size:14.5px;">${terminada?'🏁':(recibida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b>
      <span class="badge-est ${terminada?'fin':(recibida?'act':'esp')}">${terminada?'Terminada':(recibida?'Recibida':'Esperando técnico')}</span>
    </div>
    ${s.nota?`<div style="font-size:12.5px;color:var(--muted);margin-top:5px;">${escapeHtml(s.nota)}</div>`:''}
    <div style="margin-top:10px;border-top:1px dashed ${borde};padding-top:6px;">
      ${paso(true, `Enviada · ${soloHora(s.creado_en)}`)}
      ${paso(recibida, recibida
          ? `Recibida por <b>${escapeHtml(s.atendido_por||'un técnico')}</b> · ${soloHora(s.atendido_en)}${espera!==null?` <span style="color:#a16d07;">(esperó ${formatoDuracion(espera)})</span>`:''}`
          : (tarde ? `<b style="color:#a13636;">Todavía nadie la recibe (${min} min)</b> — se les está recordando` : 'Aún no la recibe ningún técnico'))}
      ${paso(terminada, terminada
          ? `Trabajo terminado por <b>${escapeHtml(s.terminado_por||s.atendido_por||'')}</b> · ${soloHora(s.terminado_en)}${reparacion!==null?` <span style="color:#0f3d5c;">(reparación ${formatoDuracion(reparacion)})</span>`:''}`
          : 'Trabajo sin terminar')}
    </div>
    ${!recibida ? `<button class="btn ghost small" style="margin-top:10px;" onclick="cancelarMiFoco('${s.id}')">✖ Ya no la necesito</button>` : ''}
  </div>`;
}

/* Auto refresco del estado mientras el operador está en la pantalla del foco */
let intervaloFoco = null;
function iniciarAutoRefrescoFoco(){
  pararAutoRefrescoFoco();
  intervaloFoco = setInterval(refrescarFoco, 20000);
}
function pararAutoRefrescoFoco(){
  if(intervaloFoco){ clearInterval(intervaloFoco); intervaloFoco = null; }
}
async function refrescarFoco(){
  const z1 = document.getElementById('zona_mis_solicitudes');
  const z2 = document.getElementById('zona_activas');
  if(!z1 && !z2){ pararAutoRefrescoFoco(); return; }
  if(STATE.vista !== 'foco'){ pararAutoRefrescoFoco(); return; }
  const todas = await listSolicitudesRecientes(STATE.plantaHoy);
  if(z1) z1.innerHTML = renderMisSolicitudes(todas.filter(x=>slug(x.solicitante)===slug(STATE.nombre)));
  if(z2) z2.innerHTML = renderActivasPlanta(todas.filter(x=>x.estado!=='terminada'));
}

async function cancelarMiFoco(id){
  if(!confirm('¿Cancelar esta solicitud de mantenimiento?')) return;
  try{
    await sbFetch('solicitudes?id=eq.'+encodeURIComponent(id), { method:'DELETE', prefer:'return=minimal' });
    showToast('Solicitud cancelada');
  }catch(e){ showToast('⚠️ No se pudo cancelar'); }
  refrescarFoco();
}

function minutosDesde(iso){
  return Math.max(0, Math.floor((ahoraMs() - new Date(iso).getTime())/60000));
}
/* Si dos equipos tienen la hora un poco distinta puede salir negativo:
   en ese caso se toma como 0, no como "sin dato". */
function minutosEntreISO(a, b){
  if(!a || !b) return null;
  const d = Math.round((new Date(b).getTime() - new Date(a).getTime())/60000);
  if(d < 0) return (d > -180) ? 0 : null;   /* diferencias chicas = reloj desfasado */
  return d;
}
function horaCorta(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('es-MX', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function soloHora(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}
function puedeVerHistorialFocos(){
  return ['tecnico','supervisor','admin','produccion'].includes(STATE.rol);
}

function tarjetaSolicitud(s, esTecnico){
  const min = minutosDesde(s.creado_en);
  const terminada = s.estado === 'terminada';
  const atendida = s.estado === 'atendida';
  const color = terminada ? '#0f3d5c' : (atendida ? '#1a7a3c' : '#e0b400');
  const fondo = terminada ? '#eef4f8' : (atendida ? '#f4faf5' : '#fffdf5');
  const borde = terminada ? '#bcd4e4' : (atendida ? '#cfe3d4' : '#f0c674');
  const etiqueta = terminada ? ('Terminada por '+escapeHtml(s.terminado_por||s.atendido_por||''))
                 : (atendida ? ('Recibida por '+escapeHtml(s.atendido_por||'')) : ('Sin recibir · hace '+min+' min'));
  return `
  <div style="border:1px solid ${borde};background:${fondo};border-left:5px solid ${color};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <b style="font-size:14px;">${terminada?'🏁':(atendida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b>
      <span class="badge-est ${terminada?'fin':(atendida?'act':'esp')}">${etiqueta}</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">
      Solicitó: <b>${escapeHtml(s.solicitante)}</b>${s.rol_solicitante?(' ('+escapeHtml(SUBROLES_PROD[s.rol_solicitante]?.label||s.rol_solicitante)+')'):''} · ${escapeHtml(s.planta)} · Turno ${escapeHtml(s.turno||'')}
    </div>
    ${s.nota?`<div style="font-size:13px;margin-top:8px;">${escapeHtml(s.nota)}</div>`:''}
    ${esTecnico && !atendida && !terminada ? `<button class="btn small" style="margin-top:10px;background:#e0b400;color:#1a1a1a;" onclick="atenderFoco('${s.id}')">💡 Recibir esta solicitud</button>` : ''}
    ${esTecnico && atendida ? `<button class="btn small secondary" style="margin-top:10px;" onclick="terminarFoco('${s.id}')">🏁 Marcar trabajo terminado</button>` : ''}
  </div>`;
}

async function encenderFoco(){
  const ubt = document.getElementById('fo_ubt').value;
  const maquina = document.getElementById('fo_maquina').value;
  const nota = document.getElementById('fo_nota').value.trim();

  const sol = {
    id: uid(),
    planta: STATE.plantaHoy,
    ubt_no: ubt,
    maquina,
    solicitante: STATE.nombre,
    rol_solicitante: STATE.usuario?.subrol || '',
    gafete: STATE.usuario?.gafete || '',
    turno: STATE.usuario?.turno || '',
    nota,
    estado: 'pendiente',
    creado_en: ahoraISO(),
    ultimo_recordatorio: ahoraISO()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(
    tecnicos,
    '💡 Solicitud de mantenimiento',
    `Se solicitó mantenimiento en la UBT ${ubt} en la máquina ${maquina}, por ${STATE.nombre}.`
  );

  showToast('💡 Foco encendido — técnicos notificados');
  render();
}

async function atenderFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'atendida'){ showToast('Esta solicitud ya fue atendida'); render(); return; }

  s.estado = 'atendida';
  s.atendido_por = STATE.nombre;
  s.atendido_en = ahoraISO();
  await saveSolicitud(s);

  /* Avisar a quien solicitó */
  enviarNotificacion([slug(s.solicitante)], '🔧 Tu solicitud fue recibida',
    `El Técnico ${STATE.nombre} recibió tu solicitud de la UBT ${s.ubt_no} (${s.maquina}) y va en camino.`);

  /* Avisar a los demás técnicos */
  const usuarios = await listUsuarios();
  const otros = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado && slug(u.nombre)!==slug(STATE.nombre)).map(u=>slug(u.nombre));
  enviarNotificacion(otros, '💡 Solicitud tomada',
    `Tu compañero ${STATE.nombre} atenderá la solicitud de la UBT ${s.ubt_no}.`);

  showToast('✓ Solicitud recibida — se avisó al solicitante');
  render();
}

async function terminarFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'terminada'){ showToast('Ya estaba marcada como terminada'); render(); return; }

  s.estado = 'terminada';
  /* Solo se mandan estas columnas si existen en la tabla */
  if('terminado_por' in s) s.terminado_por = STATE.nombre;
  if('terminado_en' in s) s.terminado_en = ahoraISO();
  try{ await saveSolicitud(s); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  enviarNotificacion([slug(s.solicitante)], '🏁 Trabajo terminado',
    `${STATE.nombre} terminó el trabajo en la UBT ${s.ubt_no} (${s.maquina}). El foco se apagó.`);

  showToast('🏁 Solicitud terminada');
  render();
}

/* ---------- Recordatorios automáticos ---------- */
let intervaloRecordatorios = null;

function iniciarRecordatorios(){
  if(intervaloRecordatorios) clearInterval(intervaloRecordatorios);
  /* Solo el técnico vigila los recordatorios: si lo hacen todos los roles,
     cada dispositivo abierto manda su propia notificación y se duplican. */
  if(STATE.rol !== 'tecnico') return;
  revisarRecordatorios();
  intervaloRecordatorios = setInterval(revisarRecordatorios, 60000);
}

/* Intenta "apartar" el recordatorio: solo actualiza si nadie más lo hizo ya.
   Si otro dispositivo se adelantó, la respuesta viene vacía y no se notifica. */
async function reclamarRecordatorio(id, corteISO){
  try{
    const r = await sbFetch(`solicitudes?id=eq.${encodeURIComponent(id)}&ultimo_recordatorio=lt.${encodeURIComponent(corteISO)}`, {
      method:'PATCH', prefer:'return=representation',
      body: JSON.stringify({ ultimo_recordatorio: ahoraISO() })
    });
    return Array.isArray(r) && r.length > 0;
  }catch(e){ console.warn(e); return false; }
}

async function revisarRecordatorios(){
  try{
    const pendientes = await listSolicitudes(true);
    if(pendientes.length === 0) return;
    const corteISO = new Date(Date.now() - 5*60*1000).toISOString();
    const vencidas = pendientes.filter(s => new Date(s.ultimo_recordatorio || s.creado_en).getTime() <= Date.parse(corteISO));
    if(vencidas.length === 0) return;

    const usuarios = await listUsuarios();          /* una sola vez, no dentro del ciclo */
    const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
    if(tecnicos.length === 0) return;

    for(const s of vencidas){
      const apartado = await reclamarRecordatorio(s.id, corteISO);
      if(!apartado) continue;
      const min = minutosDesde(s.creado_en);
      enviarNotificacion(tecnicos, '💡 Solicitud SIN ATENDER',
        `Se solicitó mantenimiento en la UBT ${s.ubt_no} en la máquina ${s.maquina}, por ${s.solicitante}. Se solicitó hace ${min} minutos.`);
    }
  }catch(e){ console.warn(e); }
}

let sheetsCacheVerTodo = [];
async function renderVerCorrectivos(){
  const todas = await listSheets();
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';

  if(esAuditorTipo){
    /* Auditor y APQP: solo las hojas de los UBT que tienen asignados (en cualquier planta) */
    const asignados = STATE.usuario?.ubtsPorPlanta || {};
    sheetsCacheVerTodo = todas.filter(s => (asignados[s.planta]||[]).includes(s.ubtNo));
  } else {
    sheetsCacheVerTodo = todas;
  }

  const plantaDefault = STATE.rol!=='supervisor' ? (STATE.plantaHoy||'') : '';
  const ubtDefault = STATE.rol!=='supervisor' ? (STATE.ubtElegida||'') : '';

  const misUbtsTxt = esAuditorTipo
    ? Object.entries(asignadosResumen()).map(([pl,v])=>`${pl}: ${v.join(', ')}`).join(' · ')
    : '';

  return `<div class="card"><h2>👁️ Ver correctivos y TPM — solo lectura</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Abre una planta y una UBT: ahí están sus hojas de correctivo y los botones para ver la hoja de TPM de cada máquina.</p>
    ${esAuditorTipo ? `<p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Solo se muestran tus líneas asignadas${misUbtsTxt?(' → '+escapeHtml(misUbtsTxt)):''}.</p>` : ''}
    <div class="filters">
      <input id="vt_filtro_planta" placeholder="Filtrar por planta" value="${escapeHtml(plantaDefault)}" oninput="filtrarVerTodo()" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" name="zzv_pl">
      <input id="vt_filtro_ubt" placeholder="Filtrar por UBT" value="${escapeHtml(ubtDefault)}" oninput="filtrarVerTodo()" autocomplete="off" readonly onfocus="this.removeAttribute('readonly')" name="zzv_ubt">
    </div>
    <button class="btn ghost small" style="margin-bottom:10px;" onclick="limpiarFiltrosVt()">✖ Limpiar filtros</button>
    <div id="vt_lista"></div>
  </div>`;
}

function asignadosResumen(){
  const a = STATE.usuario?.ubtsPorPlanta || {};
  const out = {};
  Object.entries(a).forEach(([p,v])=>{ if(v && v.length) out[p]=v; });
  return out;
}
function filtrarVerTodo(){
  const pEl = document.getElementById('vt_filtro_planta'), uEl = document.getElementById('vt_filtro_ubt');
  if(!pEl) return;
  const planta = pEl.value.toLowerCase(), ubt = uEl.value.toLowerCase();
  const filtradas = sheetsCacheVerTodo.filter(s => (!planta || (s.planta||'').toLowerCase().includes(planta)) && (!ubt || (s.ubtNo||'').toLowerCase().includes(ubt)));
  const esAuditorTipo = STATE.rol==='auditor' || STATE.rol==='apqp';
  const vacio = esAuditorTipo
    ? '<div class="empty">No hay correctivos registrados en tus líneas asignadas.</div>'
    : '<div class="empty">Sin hojas.</div>';
  document.getElementById('vt_lista').innerHTML = filtradas.length===0 ? vacio : renderAgrupadoPorPlantaUbtMaquina(filtradas, STATE.rol);
}

function renderAgrupadoPorPlantaUbtMaquina(sheets, viewerRole){
  const puedeImprimir = viewerRole==='tecnico' || viewerRole==='supervisor';
  const porPlanta = {};
  sheets.forEach(s=>{
    (porPlanta[s.planta||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'][s.maquina||'—'] ??= []).push(s);
  });
  return Object.keys(porPlanta).sort().map(planta=>{
    const ubts = porPlanta[planta];
    const totalPlanta = Object.values(ubts).reduce((a,m)=>a+Object.values(m).reduce((b,arr)=>b+arr.length,0),0);
    return `<details style="margin-bottom:8px;">
      <summary style="cursor:pointer;font-weight:700;padding:8px 10px;background:#2f3742;color:#fff;border-radius:6px;">📍 ${escapeHtml(planta)} (${totalPlanta} hoja${totalPlanta!==1?'s':''})</summary>
      <div style="padding:10px 0 0 14px;">
        ${Object.keys(ubts).sort().map(ubt=>{
          const maquinas = ubts[ubt];
          const totalUbt = Object.values(maquinas).reduce((a,arr)=>a+arr.length,0);
          return `<details style="margin-bottom:6px;">
            <summary style="cursor:pointer;font-weight:600;padding:6px 10px;background:#eef1f4;border-radius:6px;">UBT ${escapeHtml(ubt)} (${totalUbt})</summary>
            ${puedeImprimir ? `<div style="padding:8px 0 0 14px;"><button class="btn small secondary no-print" onclick="agregarUbtACola('${escArg(planta)}','${escArg(ubt)}')">🖨️ Agregar todo el UBT ${escapeHtml(ubt)} a la cola</button></div>` : ''}
            <div class="no-print" style="padding:8px 0 0 14px;">
              <div style="font-size:12px;color:var(--muted);margin-bottom:4px;">📋 Hojas de TPM de esta UBT:</div>
              <div style="display:flex;gap:6px;flex-wrap:wrap;">
                ${MAQ_TPM.map(m=>`<button class="btn small ghost" onclick="abrirTpmDe('${escArg(planta)}','${escArg(ubt)}','${escArg(m)}')">${escapeHtml(m)}</button>`).join('')}
              </div>
            </div>
            <div style="padding:8px 0 0 14px;">
              ${Object.keys(maquinas).sort().map(maq=>`
                <details style="margin-bottom:6px;">
                  <summary style="cursor:pointer;font-size:13px;padding:5px 10px;background:#f7f8f9;border-radius:6px;">⚙️ ${escapeHtml(maq)} (${maquinas[maq].length})</summary>
                  <div style="padding-top:8px;">${maquinas[maq].map(s=> puedeImprimir ? renderSheetPrintWrap(s,{role:'lectura'}) : `<div class="sheet-print-wrap"><div class="sheet-scroll">${renderSheetVisual(s,{role:'lectura'})}</div></div>`).join('')}</div>
                </details>`).join('')}
            </div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

/* ---------- Imprimir una hoja individual ---------- */
function imprimirHoja(elId, sheetKey){
  const target = document.getElementById(elId);
  if(!target){ showToast('⚠️ No se encontró la hoja'); return; }
  const contenido = target.querySelector('.sheet-page');
  if(!contenido){ showToast('⚠️ No se encontró el formato'); return; }

  const s = colaImpresion.find(x=>x.key===sheetKey) || target.__sheet;
  let titulo = 'Correctivo';
  if(target.dataset.maquina){
    titulo = `Correctivo-${target.dataset.maquina}-${target.dataset.ubt}-${target.dataset.mes}-${target.dataset.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${titulo}</title>${estilos}
    <style>
      body{background:#fff;margin:0;padding:10px;}
      .no-print{display:none !important;}
      @page{size:letter landscape;margin:6mm;}
      html,body{width:100%;margin:0;padding:0;}
      .sheet-page{border:none;box-shadow:none;width:100%;min-height:0;margin:0;padding:0;transform:none;}
      .lear-logo{width:150px;}
      table.sheet-table tbody tr{height:58px;}
    </style></head><body>${contenido.outerHTML}</body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>{ ventana.print(); }, 400);
}
function renderSheetPrintWrap(sheet, opts){
  const wrapId = 'sw_' + sheet.key.replace(/[^a-z0-9]/gi,'');
  const yaEsta = enCola(sheet.key);
  return `<div class="sheet-print-wrap" id="${wrapId}"
      data-maquina="${escapeHtml(sheet.maquina)}" data-ubt="${escapeHtml(sheet.ubtNo)}"
      data-mes="${escapeHtml(sheet.mes)}" data-anio="${escapeHtml(sheet.anio)}">
    <div class="sheet-scroll">${renderSheetVisual(sheet, opts)}</div>

}

/* ---------- Render visual de la hoja ---------- */
function renderSheetVisual(sheet, opts){
  if(!sheet) return '<div class="empty">Hoja no encontrada.</div>';
  opts = opts || {};
  /* En la vista pública (QR pegado en la línea) no se muestra el botón de editar */
  const permiteEditar = !opts.publico;
  const filas = sheet.filas || [];

  /* Casillas de máquina, en el mismo acomodo que el papel: 4 columnas de 3 renglones */
  const gruposMaquinas = checklistGroups.filter(g => g[0] !== 'Otros');
  const chkHtml = [0,1,2].map(r => {
    let tds = '';
    gruposMaquinas.forEach((col, ci) => {
      const item = col[r] || null;
      const on = item && item === sheet.maquina;
      if(ci === 0){
        /* Primera columna: el texto va a la izquierda y la casilla a la derecha */
        tds += `<td class="chk-txt">${item?escapeHtml(item):''}</td><td class="chk-cas">${item?`<span class="chk-box ${on?'on':''}"></span>`:''}</td>`;
      } else {
        tds += `<td class="chk-cas">${item?`<span class="chk-box ${on?'on':''}"></span>`:''}</td><td class="chk-txt">${item?escapeHtml(item):''}</td>`;
      }
    });
    tds += r===0
      ? `<td class="chk-cas"><span class="chk-box"></span></td><td class="chk-txt">Otros <span class="chk-linea"></span></td>`
      : `<td class="chk-cas"></td><td class="chk-txt"></td>`;
    return `<tr>${tds}</tr>`;
  }).join('');

  const filaVacia = `<tr>${'<td></td>'.repeat(permiteEditar?13:12)}</tr>`;

  const filasHtml = filas.map(f=>{
    const auditorCell = f.estadoAuditor==='firmado'
      ? (f.firmaAuditorImg ? `<img src="${f.firmaAuditorImg}" style="max-width:70px;max-height:26px;"><br><span style="font-size:7px;">${escapeHtml(f.firmaAuditorNombre)}</span>` : `<span class="firma-ok">${escapeHtml(f.firmaAuditorNombre)}</span>`)
      : (opts.role==='auditor' ? `<button class="firma-btn no-print" onclick="firmarAuditor('${sheet.key}','${f.id}')">Firmar</button>` : '');
    let apqpCell = '';
    if(f.estadoAPQP==='firmado') apqpCell = f.firmaAPQPImg ? `<img src="${f.firmaAPQPImg}" style="max-width:70px;max-height:26px;"><br><span style="font-size:7px;">${escapeHtml(f.firmaAPQPNombre)}</span>` : `<span class="firma-ok">${escapeHtml(f.firmaAPQPNombre)}</span>`;
    else if(f.estadoAPQP==='pendiente') apqpCell = (opts.role==='apqp' ? `<button class="firma-btn no-print" onclick="firmarApqp('${sheet.key}','${f.id}')">Firmar</button>` : 'Pendiente');
    return `<tr>
      <td>${escapeHtml(f.fecha||'')}</td>
      <td>${escapeHtml(f.gafete)}</td>
      <td>${escapeHtml(f.horaInicio||'')}</td>
      <td>${escapeHtml(f.horaFinal||'')}</td>
      <td class="left">${escapeHtml(f.sintomas)}${f.foto?`<br><span class="no-print" style="cursor:pointer;font-size:7.5px;color:#0f3d5c;" onclick="verFoto('${f.id}')">📷 Ver foto</span><img id="foto_${f.id}" src="${f.foto}" style="display:none;max-width:120px;margin-top:4px;border-radius:4px;">`:''}</td>
      <td class="left">${escapeHtml(f.acciones)}</td>
      <td class="left">${escapeHtml(f.material)}${f.numeroParte?`<br><span style="font-size:7.5px;"><b>P/N:</b> ${escapeHtml(f.numeroParte)}</span>`:''}</td>
      <td>${f.firmaTecnicoImg?`<img src="${f.firmaTecnicoImg}" style="max-width:70px;max-height:26px;"><br><span style="font-size:7px;">${escapeHtml(f.tecnico)}</span>`:escapeHtml(f.tecnico)}</td>
      <td>${auditorCell}</td>
      <td>${f.seMovioModulo?'Sí':'No'}</td>
      <td>${f.seVerificoModulo?'Sí':'No'}</td>
      <td>${apqpCell}</td>
      ${permiteEditar ? `<td class="no-print">
        <button class="edit-btn" onclick="pedirClaveEditar('${sheet.key}','${f.id}')">✏️ Editar</button>
        <div class="pass-inline" id="editpass_${f.id}" style="display:none;">
          <input type="password" id="editpass_input_${f.id}" placeholder="Clave admin">
          <button onclick="validarClaveEditar('${f.id}')">OK</button>
        </div>
        <div class="edit-panel" id="editpanel_${f.id}" style="display:none;"></div>
      </td>` : ''}
    </tr>`;
  }).join('');

  /* La hoja siempre muestra sus 9 renglones, aunque estén vacíos, igual que el papel */
  const faltantes = Math.max(0, MAX_FILAS_POR_HOJA - filas.length);

  return `<div class="sheet-page">
      <div class="sheet-head">
        <div class="sheet-brand">
          <svg viewBox="0 0 300 84" class="lear-logo" xmlns="http://www.w3.org/2000/svg">
            <ellipse cx="30" cy="26" rx="29" ry="24" fill="#e2001a"/>
            <text x="30" y="39" font-family="Arial Black,Arial,sans-serif" font-size="34" font-weight="900" fill="#fff" text-anchor="middle">L</text>
            <text x="68" y="41" font-family="Arial Black,Arial,sans-serif" font-size="36" font-weight="900" fill="#111">LEAR</text>
            <text x="70" y="58" font-family="Arial,sans-serif" font-size="12.5" font-weight="700" fill="#111" letter-spacing="5.2">CORPORATION</text>
            <line x1="2" y1="66" x2="298" y2="66" stroke="#111" stroke-width="1.6"/>

          </svg>
        </div>
        <div class="sheet-title">FORMATO DE VALIDACION DE MANTENIMIENTO</div>
        <div class="sheet-monthyear">${escapeHtml((sheet.mes||'').toUpperCase())}<br>${escapeHtml(String(sheet.anio||''))}</div>
      </div>
      <table class="chk-tabla"><tbody>${chkHtml}</tbody></table>
      <div class="sheet-meta">
        <span><b>No. Código</b> <u>R59C0</u></span>
        <span><b>Estación No.</b> <u>${escapeHtml(sheet.maquina||'')}</u></span>
        <span><b>UBT No.</b> <u>${escapeHtml(sheet.ubtNo)}</u></span>
        <span style="margin-left:auto;font-size:9.5px;color:#555;">${escapeHtml(sheet.planta||'')} · Hoja ${sheet.pagina||1}</span>
      </div>
      <table class="sheet-table ${permiteEditar?'con-editar':''}">
        <colgroup>
          <col class="col-fecha"><col class="col-gafete"><col class="col-hora"><col class="col-hora">

        <thead><tr>

          <th>SINTOMAS/FALLAS</th><th>ACCIONES CORRECTIVAS</th><th>MATERIAL UTILIZADO<br>EN MODIFICACION</th>
          <th>FIRMA<br>TECNICO DE<br>MTTO.</th><th>FIRMA DE<br>AUDITOR DE<br>CALIDAD</th>

          <span style="color:#0f38b0;"><b>NOTA:</b> En caso de que el mantenimiento de la P.E. requiera que se retiren módulos, debe asegurarse de dejarlo en su cuadrante correspondiente. Y que sea verificado por el departamento de APQP.</span>
        </div>
        <div class="sheet-cod">CPFO500-1085<br>Rev.28/5/07</div>
      </div>

function toggleVerCodigo(inputId, btn){

  else { el.type = 'password'; btn.textContent = '👁️'; }
}

async function toggleBloqueoUsuario(nombre, estaBloqueado){
  const u = await getUsuario(nombre);
  if(!u) return;
  u.bloqueado = !estaBloqueado;
  await saveUsuario(u);
  showToast(u.bloqueado ? '🔒 Usuario bloqueado' : '🔓 Usuario desbloqueado');
  render();
}

async function toggleEditUsuario(uid, nombre){
  const btn = document.getElementById('au_editbtn_'+uid);
  const nombreEl = document.getElementById('au_nombre_'+uid);
  const rolEl = document.getElementById('au_rol_'+uid);
  const gafeteEl = document.getElementById('au_gafete_'+uid);
  const editing = btn.textContent.includes('Guardar');
  if(!editing){
    nombreEl.disabled = false; rolEl.disabled = false; gafeteEl.disabled = false;
    rolEl.style.display = 'inline-block';
    btn.textContent = '💾 Guardar';
  } else {
    const nuevoNombre = nombreEl.value.trim();
    const nuevoRol = rolEl.value;
    const nuevoGafete = gafeteEl.value.trim();
    const usuarioViejo = await getUsuario(nombre);
    const actualizado = { ...usuarioViejo, nombre: nuevoNombre, rol: nuevoRol, gafete: nuevoGafete };
    if(slug(nuevoNombre) !== slug(nombre)){
      await deleteUsuario(nombre);
    }
    await saveUsuario(actualizado);
    showToast('Usuario actualizado ✓');
    render();
  }
}
function confirmarBorrarUsuario(btn, nombre){
  if(btn.dataset.confirm==='1'){ eliminarUsuario(nombre); return; }
  btn.dataset.confirm = '1';
  btn.textContent = '¿Seguro? Toca de nuevo';
  setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑 Borrar'; }, 3000);
}
async function eliminarUsuario(nombre){
  await deleteUsuario(nombre);
  showToast('Usuario eliminado ✓');
  render();
}

async function encenderFocoPrueba(){
  const sol = {
    id: uid(),
    planta: document.getElementById('tf_planta').value,
    ubt_no: document.getElementById('tf_ubt').value,
    maquina: document.getElementById('tf_maquina').value,
    solicitante: document.getElementById('tf_nombre').value.trim() || 'Prueba Admin',
    rol_solicitante: 'operador',
    gafete: '000000',
    turno: 'TA',
    nota: '(Solicitud de prueba generada desde Administrador)',
    estado: 'pendiente',
    creado_en: ahoraISO(),
    ultimo_recordatorio: ahoraISO()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(tecnicos, '💡 Solicitud de mantenimiento (PRUEBA)',
    `Se solicitó mantenimiento en la UBT ${sol.ubt_no} en la máquina ${sol.maquina}, por ${sol.solicitante}.`);

  showToast(`💡 Foco de prueba encendido — ${tecnicos.length} técnico(s) notificados`);
  cargarFocosAdmin();
}

async function cargarFocosAdmin(){
  const cont = document.getElementById('tf_lista');

  const todas = await listSolicitudes(false);
  const pend = todas.filter(s=>s.estado==='pendiente');

    ? '<div class="empty">Sin solicitudes activas.</div>'
    : pend.map(s=>`<div style="border:1px solid #f0c674;border-radius:8px;padding:10px;margin-bottom:8px;font-size:12.5px;">
        <b>💡 UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b> — ${escapeHtml(s.planta)}<br>
        <span style="color:var(--muted);">Por ${escapeHtml(s.solicitante)} · hace ${minutosDesde(s.creado_en)} min</span>
        <button class="btn ghost small" style="margin-left:8px;color:#a13636;" onclick="borrarSolicitud('${s.id}')">✖ Borrar</button>
      </div>`).join('');
}

async function cargarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  const info = document.getElementById('cat_info');
  if(!ta) return;
  const refs = await listRefacciones();
  ta.value = refs.map(r=>r.descripcion ? `${r.numero_parte}, ${r.descripcion}` : r.numero_parte).join('\n');
  if(info) info.textContent = `${refs.length} número(s) de parte en el catálogo.`;
}

async function guardarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  if(!ta) return;
  const lineas = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lineas.length === 0){ showToast('⚠️ El catálogo está vacío'); return; }
  showToast(`Guardando ${lineas.length} número(s)...`);
  let ok = 0;
  for(const linea of lineas){
    const partes = linea.split(',');
    const numero = partes[0].trim();
    const desc = partes.slice(1).join(',').trim();
    if(!numero) continue;
    try{
      await sbFetch('refacciones?on_conflict=numero_parte', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body: JSON.stringify({ numero_parte:numero, descripcion:desc, ultima_vez:ahoraISO() })
      });
      ok++;
    }catch(e){ console.warn(e); }
  }
  showToast(`✓ ${ok} número(s) de parte guardados`);
  cargarCatalogoPartes();
}

async function exportarCatalogoPartes(){
  const refs = await listRefacciones();
  const filas = [['No. de Parte','Descripcion','Veces usada','Ultima vez']];
  refs.forEach(r=>filas.push([r.numero_parte, r.descripcion||'', r.veces_usada||0, r.ultima_vez?new Date(r.ultima_vez).toLocaleDateString('es-MX'):'']));
  descargarCSV('catalogo-refacciones-'+todayISO()+'.csv', filas);
}

  STATE.modoPruebas = nuevo;
  showToast(nuevo ? '🧪 Jornadas apagadas — modo pruebas' : '✅ Jornadas activas — modo producción');
  render();
}

async function guardarTurnos(){
  const nuevo = JSON.parse(JSON.stringify(STATE.turnosCfg || DEFAULT_TURNOS));
  Object.keys(nuevo).forEach(k=>{
    const i = document.getElementById('tur_'+k+'_ini'), f = document.getElementById('tur_'+k+'_fin');
    if(i) nuevo[k].inicio = i.value;
    if(f) nuevo[k].fin = f.value;
  });
  STATE.turnosCfg = nuevo;
  await saveTurnosConfig(nuevo);
  showToast('Horarios actualizados ✓');
}

async function guardarCodigos(){
  const nuevos = {};
  let vacios = [];
  Object.keys(ROLES).forEach(k=>{
    const el = document.getElementById('code_'+k);
    if(el){
      const val = el.value.trim();
      if(!val){ vacios.push(ROLES[k].label); nuevos[k] = DEFAULT_CODES[k] || ''; }
      else nuevos[k] = val;
    }
  });
  if(vacios.length){ showToast('⚠️ Se usó el código por defecto para: ' + vacios.join(', ')); }
  STATE.codes = nuevos;
  await saveConfig(nuevos);
  showToast('Códigos actualizados ✓');
}

      <button type="button" onclick="moverUbtPlanta('${planta.replace(/'/g,"\\'")}',${i},1)">↓</button>
      <button type="button" onclick="quitarUbtPlanta('${planta.replace(/'/g,"\\'")}',${i})">✕</button>

function syncPlantaFromDOM(planta){
  const key = slug(planta);

function agregarUbtPlanta(planta){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].push('');
  refrescarPlantaEditor(planta);
}
function quitarUbtPlanta(planta, idx){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].splice(idx,1);

}
function moverUbtPlanta(planta, idx, dir){
  syncPlantaFromDOM(planta);
  const arr = STATE.plantasCfgDraft[planta];
  const j = idx+dir;
  if(j<0 || j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  refrescarPlantaEditor(planta);
}
async function guardarPlantas(){

}
function cajaQR(contenedor, url, titulo, subtitulo, color){
  const box = document.createElement('div');
  box.className = 'qr-box';
  if(color) box.style.borderTop = '4px solid ' + color;
  const qrDiv = document.createElement('div');
  box.appendChild(qrDiv);
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `${titulo}${subtitulo?`<br><span style="font-weight:400;font-size:10.5px;color:#6b7280;">${subtitulo}</span>`:''}`;
  box.appendChild(label);
  const btn = document.createElement('button');
  btn.className = 'btn ghost small';
  btn.style.marginTop = '6px';
  btn.textContent = '🖨️ Imprimir';
  btn.onclick = () => imprimirQR(qrDiv, titulo, subtitulo);
  box.appendChild(btn);
  contenedor.appendChild(box);
  new QRCode(qrDiv, { text: url, width: 150, height: 150 });
}

  if(!confirm('¿Importar este respaldo?\n\nLas hojas y usuarios del archivo se agregarán o sobrescribirán los actuales con la misma clave.')){

    for(const h of (data.hojas||[])){

    for(const u of (data.usuarios||[])){

async function borrarSeleccionCorrectivos(){
  const alcance = document.getElementById('bs_alcance').value;
  const planta = document.getElementById('bs_planta').value;
  const ubt = document.getElementById('bs_ubt').value;
  const maquina = document.getElementById('bs_maquina').value;
  const btn = document.getElementById('bs_btn');

  const todas = await listSheets();
  let objetivo = [];
  let desc = '';
  if(alcance === 'planta'){
    objetivo = todas.filter(s=>s.planta===planta);
    desc = `todos los correctivos de ${planta}`;
  } else if(alcance === 'ubt'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
    desc = `los correctivos de UBT ${ubt} (${planta})`;
  } else if(alcance === 'maquina'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt && s.maquina===maquina);
    desc = `los correctivos de ${maquina} en UBT ${ubt} (${planta})`;
  }

  if(objetivo.length === 0){ showToast('No hay hojas que coincidan'); return; }

  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = `⚠️ Toca de nuevo para borrar ${objetivo.length} hoja(s) — ${desc}`;
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑️ Borrar la selección'; }, 6000);
    return;
  }

  btn.textContent = 'Borrando...';
  let ok=0;
  for(const s of objetivo){
    try{
      await sbFetch('hojas?clave=eq.'+encodeURIComponent(s.key), { method:'DELETE', prefer:'return=minimal' });
      ok++;
    }catch(e){ console.warn(e); }
  }
  colaImpresion = [];
  btn.dataset.confirm='';
  showToast(`✓ ${ok} hoja(s) borradas — ${desc}`);
  render();
}

/* Primera letra en mayúscula automáticamente */
document.addEventListener('input', e => {
  const t = e.target;
  if(!(t instanceof HTMLInputElement) && !(t instanceof HTMLTextAreaElement)) return;
  if(t.type === 'password' || t.type === 'number' || t.type === 'date' || t.type === 'time') return;
  if(t.dataset.noCap === '1') return;
  const v = t.value;
  if(v.length > 0 && v[0] !== v[0].toUpperCase()){
    const pos = t.selectionStart;
    t.value = v[0].toUpperCase() + v.slice(1);
    try{ t.setSelectionRange(pos, pos); }catch(e){}
  }
});

function avisoEntradaAnticipada(){

  const t = T[STATE.usuario.turno];

  if(dentroDeRango(m, t.inicio, t.fin)) return '';

  /* ¿Coincide con algún horario de tiempo extra? */
  const extraCoincide = (t.extras||[]).find(e => dentroDeRango(m, e.inicio, e.fin));

/* ---------- Validación de tiempos ---------- */
function validarTiempos(){
  const fEl=document.getElementById('f_fecha'), hiEl=document.getElementById('f_hi'), hfEl=document.getElementById('f_hf');
  const aviso=document.getElementById('aviso_tiempo');
  if(!fEl||!hiEl||!hfEl||!aviso) return true;

  const hoy = todayISO();
  const ahora = new Date();
  const horaAhora = String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0');

  const mostrar=(txt,tipo)=>{
    aviso.style.display='block';
    aviso.innerHTML=txt;
    aviso.style.background = tipo==='error' ? '#fde8e8' : '#fff7e6';
    aviso.style.color = tipo==='error' ? '#a13636' : '#8a6d1f';
    aviso.style.borderLeft = '4px solid ' + (tipo==='error' ? '#a13636' : '#e0b400');
  };

  if(fEl.value > hoy){ fEl.value = hoy; mostrar('⚠️ No se pueden registrar fechas futuras. Se ajustó a hoy.','error'); return false; }

  /* Si es hoy, avisar (sin modificar) cuando la hora es futura */
  let hayFutura = false;
  if(fEl.value === hoy){
    if(hiEl.value && hiEl.value > horaAhora) hayFutura = true;
    if(hfEl.value && hfEl.value > horaAhora) hayFutura = true;
  }
  if(hayFutura) mostrar('⚠️ Estás registrando una hora futura. Verifica que sea correcta.','warn');

  const tEl = document.getElementById('f_turno');
  if(tEl && hiEl.value && !tEl.dataset.manual) tEl.value = turnoDeHora(hiEl.value);

  if(hiEl.value && hfEl.value){
    const min = minutosEntre(hiEl.value, hfEl.value);
    if(min === 0){ mostrar('⚠️ La hora final debe ser distinta a la de inicio.','error'); return false; }
    if(min > 480){ mostrar(`⏱️ Duración registrada: <b>${formatoDuracion(min)}</b>. Es bastante larga — verifica que sea correcta.`,'warn'); return true; }
    mostrar(`⏱️ Tiempo muerto: <b>${formatoDuracion(min)}</b>`,'warn');
    return true;
  }
  aviso.style.display='none';
  return true;
}

/* ---------- Fallas similares (detección de recurrencia) ---------- */
let cacheHojasFallas = null;
let tempFallas = null;
/* Espera a que el técnico deje de escribir (medio segundo) antes de buscar */
function buscarFallasSimilaresPronto(){
  clearTimeout(tempFallas);
  tempFallas = setTimeout(buscarFallasSimilares, 500);
}
async function buscarFallasSimilares(){
  const txtEl = document.getElementById('f_sintomas');
  const cont = document.getElementById('fallas_similares');
  if(!txtEl || !cont) return;
  const txt = txtEl.value.trim().toLowerCase();
  if(txt.length < 5){ cont.style.display='none'; return; }

  if(!cacheHojasFallas) cacheHojasFallas = await listSheets();
  /* Se usan los datos de la hoja abierta: no hace falta pedirla otra vez al servidor */
  const p = sheetActivaParams;
  if(!p) return;

  const palabras = txt.split(/\s+/).filter(w=>w.length>3);
  if(palabras.length === 0){ cont.style.display='none'; return; }
  const coincidencias = [];
  cacheHojasFallas
    .filter(h => h.planta===p.planta && h.ubtNo===p.ubt && h.maquina===p.maquina)
    .forEach(h => (h.filas||[]).forEach(f=>{
      const sint = (f.sintomas||'').toLowerCase();
      const aciertos = palabras.filter(w=>sint.includes(w)).length;
      if(aciertos >= 1 && aciertos/palabras.length >= 0.4) coincidencias.push({...f, mes:h.mes, anio:h.anio, aciertos});
    }));

  if(coincidencias.length === 0){ cont.style.display='none'; return; }
  coincidencias.sort((a,b)=>b.aciertos-a.aciertos);
  const top = coincidencias.slice(0,4);
  cont.style.display='block';
  cont.innerHTML = `<b>🔁 Falla recurrente detectada</b> — esta máquina ya tuvo ${coincidencias.length} falla(s) parecida(s):<br>` +
    top.map(f=>`• <b>${f.fecha||''}</b>: ${escapeHtml((f.sintomas||'').slice(0,90))}${(f.sintomas||'').length>90?'…':''}<br><span style="color:#6b7280;">→ ${escapeHtml((f.acciones||'—').slice(0,90))}</span>`).join('<br>') +
    `<br><span style="color:#8a6d1f;">Considera revisar la causa raíz, no solo el síntoma.</span>`;
}

function iniciarCanvasFirma(){
  firmaCanvas = document.getElementById('firma_canvas');
  if(!firmaCanvas) return;
  firmaCtx = firmaCanvas.getContext('2d');
  firmaCtx.lineWidth = 2.5; firmaCtx.lineCap = 'round'; firmaCtx.strokeStyle = '#111';

  const pos = e => {
    const r = firmaCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(firmaCanvas.width/r.width), y:(p.clientY-r.top)*(firmaCanvas.height/r.height) };
  };
  const empezar = e => { e.preventDefault(); dibujando=true; const {x,y}=pos(e); firmaCtx.beginPath(); firmaCtx.moveTo(x,y); };
  const mover = e => { if(!dibujando) return; e.preventDefault(); const {x,y}=pos(e); firmaCtx.lineTo(x,y); firmaCtx.stroke(); };
  const parar = () => { dibujando=false; };

  ['mousedown','touchstart'].forEach(ev=>firmaCanvas.addEventListener(ev, empezar));
  ['mousemove','touchmove'].forEach(ev=>firmaCanvas.addEventListener(ev, mover));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>firmaCanvas.addEventListener(ev, parar));
}

function limpiarFirma(){ if(firmaCtx && firmaCanvas) firmaCtx.clearRect(0,0,firmaCanvas.width,firmaCanvas.height); }

async function guardarFirma(){
  if(!firmaCanvas){ showToast('⚠️ No se encontró el área de firma'); return; }
  const vacio = document.createElement('canvas');

  if(firmaCanvas.toDataURL() === vacio.toDataURL()){ showToast('⚠️ Dibuja tu firma primero'); return; }
  STATE.usuario.firma = firmaCanvas.toDataURL('image/png');
  try{ await saveUsuario(STATE.usuario); showToast('✍️ Firma guardada ✓'); render(); }
  catch(err){ showToast('⚠️ '+(err.message||err)); }
}

function todasLasFilas(){
  const out = [];
  (cacheAnalisis||[]).forEach(h => (h.filas||[]).forEach(f => {
    const min = (typeof f.minutosParo === 'number' && f.minutosParo > 0)
      ? f.minutosParo
      : minutosEntre(f.horaInicio, f.horaFinal);
    out.push({...f, minutosParo: min, planta:h.planta, ubtNo:h.ubtNo, maquina:h.maquina, mes:h.mes, anio:h.anio});
  }));
  return out;
}

function ejecutarBusqueda(){
  const q = (document.getElementById('an_busqueda').value||'').trim().toLowerCase();
  const cont = document.getElementById('an_resultados');
  if(q.length < 2){ cont.innerHTML = '<div class="empty">Escribe al menos 2 caracteres.</div>'; return; }
  const res = todasLasFilas().filter(f =>
    (f.sintomas||'').toLowerCase().includes(q) ||
    (f.acciones||'').toLowerCase().includes(q) ||
    (f.material||'').toLowerCase().includes(q) ||
    (f.tecnico||'').toLowerCase().includes(q) ||
    (f.numeroParte||'').toLowerCase().includes(q) ||
    (f.maquina||'').toLowerCase().includes(q) ||
    (f.ubtNo||'').toLowerCase().includes(q)
  );

    res.slice(0,60).map(f=>`

        <div style="font-size:11.5px;color:var(--muted);margin-bottom:5px;">${f.fecha||''} · ${escapeHtml(f.tecnico||'')} · ${formatoDuracion(f.minutosParo)}</div>
        <div><b>Falla:</b> ${escapeHtml(f.sintomas||'')}</div>
        <div><b>Acción:</b> ${escapeHtml(f.acciones||'—')}</div>
        ${f.numeroParte?`<div><b>No. Parte:</b> ${escapeHtml(f.numeroParte)}</div>`:''}

function calcularTiempoMuerto(){
  const selPl = document.getElementById('an_planta');
  if(!selPl) return;
  let planta = selPl.value;
  if(STATE.rol === 'tecnico') planta = STATE.plantaHoy || planta;
  const mes = document.getElementById('an_mes').value;
  const cont = document.getElementById('an_tiempo');
  let filas = todasLasFilas();
  if(planta) filas = filas.filter(f=>f.planta===planta);
  if(mes) filas = filas.filter(f=>f.mes===mes);

  if(filas.length === 0){ cont.innerHTML = '<div class="empty">Sin datos para este filtro.</div>'; return; }

  /* Agrupar: Planta > UBT > Máquina */
  const arbol = {};
  filas.forEach(f=>{
    const min = f.minutosParo||0;
    arbol[f.planta] ??= { minutos:0, paros:0, ubts:{} };
    arbol[f.planta].minutos += min; arbol[f.planta].paros++;
    arbol[f.planta].ubts[f.ubtNo] ??= { minutos:0, paros:0, maquinas:{} };
    arbol[f.planta].ubts[f.ubtNo].minutos += min; arbol[f.planta].ubts[f.ubtNo].paros++;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina] ??= { minutos:0, paros:0 };
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].minutos += min;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].paros++;
  });

  const totalMin = filas.reduce((a,f)=>a+(f.minutosParo||0),0);
  const plantasOrd = Object.entries(arbol).sort((a,b)=>b[1].minutos-a[1].minutos);
  const maxPlanta = plantasOrd[0][1].minutos || 1;

  const barra = (min, max, color) => `<div style="background:#e8eaed;border-radius:20px;height:8px;overflow:hidden;margin-top:3px;">
      <div style="background:${color};height:100%;width:${(min/max*100).toFixed(1)}%;"></div></div>`;

  cont.innerHTML = `
    <div style="background:#f3f6f9;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13.5px;">
      Total de paro: <b>${formatoDuracion(totalMin)}</b> (${totalMin} min) en <b>${filas.length}</b> intervención(es)
    </div>
    ${plantasOrd.map(([pl, dPl])=>{
      const ubtsOrd = Object.entries(dPl.ubts).sort((a,b)=>b[1].minutos-a[1].minutos);

function calcularFallasFrecuentes(){
  const cont = document.getElementById('an_frecuentes');
  if(!cont) return;
  let filas = todasLasFilas();
  /* El técnico solo ve las fallas de su planta */
  if(STATE.rol === 'tecnico' && STATE.plantaHoy) filas = filas.filter(f=>f.planta===STATE.plantaHoy);
  const porMaquina = {};
  filas.forEach(f=>{
    const clave = `${f.maquina} · UBT ${f.ubtNo}`;
    porMaquina[clave] ??= [];
    porMaquina[clave].push(f);
  });

  const recurrentes = [];
  Object.entries(porMaquina).forEach(([maq, fs])=>{
    const grupos = {};
    fs.forEach(f=>{
      const palabras = (f.sintomas||'').toLowerCase().split(/\s+/).filter(w=>w.length>4);
      palabras.forEach(w=>{ grupos[w] ??= new Set(); grupos[w].add(f.id); });
    });
    Object.entries(grupos).forEach(([palabra, ids])=>{
      if(ids.size >= 2) recurrentes.push({ maquina:maq, palabra, veces:ids.size });
    });
  });

  recurrentes.sort((a,b)=>b.veces-a.veces);
  const top = recurrentes.slice(0,15);
  cont.innerHTML = top.length === 0
    ? '<div class="empty">Aún no hay suficientes datos para detectar patrones.</div>'
    : `<p style="font-size:12.5px;color:var(--muted);">Palabras que se repiten en fallas de la misma máquina — posible causa raíz.</p>` +
      top.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f2;font-size:13px;">
          <span>${escapeHtml(r.maquina)} → "<b>${escapeHtml(r.palabra)}</b>"</span>
          <span style="font-weight:700;color:${r.veces>=4?'#a13636':'#c77700'};">${r.veces}×</span>
        </div>`).join('');
}

function descargarCSV(nombre, filas){
  const csv = filas.map(f => f.map(c => {
    const v = (c===null||c===undefined) ? '' : String(c);
    return /[",\n;]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  showToast('Archivo descargado ✓');
}

/* ---------- Utilidades de tiempo ---------- */
function minutosEntre(hi, hf){
  if(!hi || !hf) return 0;
  const [h1,m1] = hi.split(':').map(Number);
  const [h2,m2] = hf.split(':').map(Number);
  let min = (h2*60+m2) - (h1*60+m1);
  if(min < 0) min += 24*60; /* cruzó medianoche */
  return min;
}
function formatoDuracion(min){
  if(min === 0) return 'menos de 1 min';
  if(min === null || min === undefined || isNaN(min)) return '—';
  const h = Math.floor(min/60), m = min%60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

/* ---------- Compresión de fotos ---------- */
function comprimirImagen(file, maxLado=1000, calidad=0.7){
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        if(w > h && w > maxLado){ h = h*maxLado/w; w = maxLado; }
        else if(h > maxLado){ w = w*maxLado/h; h = maxLado; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(file);
  });
}

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

function pushDisponible(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function activarNotificaciones(silencioso){
  if(!pushDisponible()){
    if(!silencioso) showToast('⚠️ Este dispositivo no soporta notificaciones push');
    return false;
  }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){
      if(!silencioso) showToast('⚠️ No diste permiso para notificaciones');
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sbFetch('suscripciones?on_conflict=endpoint', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify({
        usuario_slug: slug(STATE.nombre),
        rol: STATE.rol,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth
      })
    });
    if(!silencioso) showToast('🔔 Notificaciones activadas ✓');
    return true;
  }catch(err){
    console.warn('Error activando notificaciones:', err);
    if(!silencioso) showToast('⚠️ No se pudo activar: ' + (err.message||err));
    return false;
  }
}

/* Busca qué auditores/APQP tienen asignado este UBT en esta planta */
async function destinatariosPara(rolBuscado, planta, ubt){
  const usuarios = await listUsuarios();
  return usuarios
    .filter(u => u.rol===rolBuscado && ((u.ubtsPorPlanta||{})[planta]||[]).includes(ubt))
    .map(u => slug(u.nombre));
}

/* ---------- Registro del Service Worker (necesario para instalación y push) ---------- */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js')
      .then(reg => { console.log('Service Worker registrado:', reg.scope); reg.update(); })
      .catch(err => console.warn('No se pudo registrar el Service Worker:', err));
  });
}

/* ---------- Aviso de conexión ---------- */
function pintarConexion(){
  const b = document.getElementById('barra_conexion');
  if(!b) return;
  b.style.display = navigator.onLine ? 'none' : 'block';
}
window.addEventListener('online',  ()=>{ pintarConexion(); showToast('✅ Conexión restablecida'); });
window.addEventListener('offline', ()=>{ pintarConexion(); guardarBorradorRegistro(); showToast('📴 Te quedaste sin conexión'); });

/* ---------- Borrador del correctivo guardado en el dispositivo ---------- */
const CLAVE_BORRADOR = 'correctivo_borrador_local';
let intervaloBorrador = null;

function iniciarAutoBorrador(){
  if(intervaloBorrador) clearInterval(intervaloBorrador);
  intervaloBorrador = setInterval(()=>{
    if(document.getElementById('f_sintomas')) guardarBorradorRegistro();
    else { clearInterval(intervaloBorrador); intervaloBorrador = null; }
  }, 8000);
}
function guardarBorradorLocal(datos){
  try{
    localStorage.setItem(CLAVE_BORRADOR, JSON.stringify({ hoja: sheetActivaKey, datos, ts: Date.now() }));
  }catch(e){ /* si no hay espacio (fotos grandes), simplemente no se guarda */ }
}
function leerBorradorLocal(){
  try{
    const g = JSON.parse(localStorage.getItem(CLAVE_BORRADOR) || 'null');
    if(!g) return null;
    if(g.hoja !== sheetActivaKey) return null;
    if(Date.now() - g.ts > 12*60*60*1000){ borrarBorradorLocal(); return null; }  /* más de 12 h: se descarta */
    return g.datos;
  }catch(e){ return null; }
}
function borrarBorradorLocal(){ try{ localStorage.removeItem(CLAVE_BORRADOR); }catch(e){} }

/* ---------- Init ---------- */
(function init(){
  pintarConexion();
  const p = getParams();
  if(p.ver === 'ubt' && p.planta && p.ubt){
    STATE.modoVerUbt = { planta: p.planta, ubt: p.ubt };
  } else if(p.rol && ROLES[p.rol]){
    if(p.nombre){
      STATE.rol = p.rol; STATE.nombre = p.nombre;
    } else {
      STATE.rolPrefijado = p.rol;
    }
  }
  pintarVersion();
  render();
  setTimeout(()=>revisarVersionNueva(false), 4000);
})();
</script>
