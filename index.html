    ${activas.length===0 ? '<div class="empty">Sin solicitudes activas.</div>' :
      activas.map(s=>tarjetaSolicitud(s,false)).join('')}`;
}

/* Tarjeta con la linea de estado, para que el solicitante sepa si ya la recibieron */
function tarjetaMiSolicitud(s){
  const min = minutosDesde(s.creado_en);
  const espera = minutosEntreISO(s.creado_en, s.atendido_en);
  const reparacion = minutosEntreISO(s.atendido_en, s.terminado_en);
  const recibida = s.estado==='atendida' || s.estado==='terminada';
  const terminada = s.estado==='terminada';
  const tarde = !recibida && min >= 10;
  const color = terminada ? '#0f3d5c' : (recibida ? '#1a7a3c' : (tarde ? '#a13636' : '#a16d07'));
  const fondo = terminada ? '#eef4f8' : (recibida ? '#f4faf5' : (tarde ? '#fdf1f1' : '#fffdf5'));
  const borde = terminada ? '#bcd4e4' : (recibida ? '#cfe3d4' : (tarde ? '#e9b7b7' : '#f0c674'));
  const paso = (ok,txt)=>`<div class="paso ${ok?'ok':'no'}"><span class="bolita">${ok?'✓':'•'}</span><span>${txt}</span></div>`;
  return `
  <div style="border:1px solid ${borde};border-left:5px solid ${color};background:${fondo};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;align-items:center;">
      <b style="font-size:14.5px;">${terminada?'🏁':(recibida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b>
      <span class="badge-est ${terminada?'fin':(recibida?'act':'esp')}">${terminada?'Terminada':(recibida?'Recibida':'Esperando técnico')}</span>
    </div>
    ${s.nota?`<div style="font-size:12.5px;color:var(--muted);margin-top:5px;">${escapeHtml(s.nota)}</div>`:''}
    <div style="margin-top:10px;border-top:1px dashed ${borde};padding-top:6px;">
      ${paso(true, `Enviada · ${soloHora(s.creado_en)}`)}
      ${paso(recibida, recibida
          ? `Recibida por <b>${escapeHtml(s.atendido_por||'un técnico')}</b> · ${soloHora(s.atendido_en)}${espera!==null?` <span style="color:#a16d07;">(esperó ${formatoDuracion(espera)})</span>`:''}`
          : (tarde ? `<b style="color:#a13636;">Todavía nadie la recibe (${min} min)</b> — se les está recordando` : 'Aún no la recibe ningún técnico'))}
      ${paso(terminada, terminada
          ? `Trabajo terminado por <b>${escapeHtml(s.terminado_por||s.atendido_por||'')}</b> · ${soloHora(s.terminado_en)}${reparacion!==null?` <span style="color:#0f3d5c;">(reparación ${formatoDuracion(reparacion)})</span>`:''}`
          : 'Trabajo sin terminar')}
    </div>
    ${!recibida ? `<button class="btn ghost small" style="margin-top:10px;" onclick="cancelarMiFoco('${s.id}')">✖ Ya no la necesito</button>` : ''}
  </div>`;
}

/* Auto refresco del estado mientras el operador está en la pantalla del foco */
let intervaloFoco = null;
function iniciarAutoRefrescoFoco(){
  pararAutoRefrescoFoco();
  intervaloFoco = setInterval(refrescarFoco, 20000);
}
function pararAutoRefrescoFoco(){
  if(intervaloFoco){ clearInterval(intervaloFoco); intervaloFoco = null; }
}
async function refrescarFoco(){
  const z1 = document.getElementById('zona_mis_solicitudes');
  const z2 = document.getElementById('zona_activas');
  if(!z1 && !z2){ pararAutoRefrescoFoco(); return; }
  if(STATE.vista !== 'foco'){ pararAutoRefrescoFoco(); return; }
  const todas = await listSolicitudesRecientes(STATE.plantaHoy);
  if(z1) z1.innerHTML = renderMisSolicitudes(todas.filter(x=>slug(x.solicitante)===slug(STATE.nombre)));
  if(z2) z2.innerHTML = renderActivasPlanta(todas.filter(x=>x.estado!=='terminada'));
}

async function cancelarMiFoco(id){
  if(!confirm('¿Cancelar esta solicitud de mantenimiento?')) return;
  try{
    await sbFetch('solicitudes?id=eq.'+encodeURIComponent(id), { method:'DELETE', prefer:'return=minimal' });
    showToast('Solicitud cancelada');
  }catch(e){ showToast('⚠️ No se pudo cancelar'); }
  refrescarFoco();
}

function minutosDesde(iso){
  return Math.max(0, Math.floor((ahoraMs() - new Date(iso).getTime())/60000));
}
/* Si dos equipos tienen la hora un poco distinta puede salir negativo:
   en ese caso se toma como 0, no como "sin dato". */
function minutosEntreISO(a, b){
  if(!a || !b) return null;
  const d = Math.round((new Date(b).getTime() - new Date(a).getTime())/60000);
  if(d < 0) return (d > -180) ? 0 : null;   /* diferencias chicas = reloj desfasado */
  return d;
}
function horaCorta(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('es-MX', {day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function soloHora(iso){
  if(!iso) return '—';
  return new Date(iso).toLocaleTimeString('es-MX', {hour:'2-digit', minute:'2-digit'});
}
function puedeVerHistorialFocos(){
  return ['tecnico','supervisor','admin','produccion'].includes(STATE.rol);
}

function tarjetaSolicitud(s, esTecnico){
  const min = minutosDesde(s.creado_en);
  const terminada = s.estado === 'terminada';
  const atendida = s.estado === 'atendida';
  const color = terminada ? '#0f3d5c' : (atendida ? '#1a7a3c' : '#e0b400');
  const fondo = terminada ? '#eef4f8' : (atendida ? '#f4faf5' : '#fffdf5');
  const borde = terminada ? '#bcd4e4' : (atendida ? '#cfe3d4' : '#f0c674');
  const etiqueta = terminada ? ('Terminada por '+escapeHtml(s.terminado_por||s.atendido_por||''))
                 : (atendida ? ('Recibida por '+escapeHtml(s.atendido_por||'')) : ('Sin recibir · hace '+min+' min'));
  return `
  <div style="border:1px solid ${borde};background:${fondo};border-left:5px solid ${color};border-radius:10px;padding:14px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <b style="font-size:14px;">${terminada?'🏁':(atendida?'🔧':'💡')} UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}
        <span style="font-weight:600;font-size:11.5px;color:var(--muted);">· Bahía ${escapeHtml(bahiaDeUbt(s.ubt_no))}</span></b>
      <span class="badge-est ${terminada?'fin':(atendida?'act':'esp')}">${etiqueta}</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">
      Solicitó: <b>${escapeHtml(s.solicitante)}</b>${s.rol_solicitante?(' ('+escapeHtml(SUBROLES_PROD[s.rol_solicitante]?.label||s.rol_solicitante)+')'):''} · ${escapeHtml(s.planta)} · Turno ${escapeHtml(s.turno||'')}
    </div>
    ${s.nota?`<div style="font-size:13px;margin-top:8px;">${escapeHtml(s.nota)}</div>`:''}
    ${esTecnico && !atendida && !terminada ? `<button class="btn small" style="margin-top:10px;background:#e0b400;color:#1a1a1a;" onclick="atenderFoco('${s.id}')">💡 Recibir esta solicitud</button>` : ''}
    ${esTecnico && atendida ? `<button class="btn small secondary" style="margin-top:10px;" onclick="terminarFoco('${s.id}')">🏁 Marcar trabajo terminado</button>` : ''}
    ${terminada && STATE.rol==='tecnico' ? `
      <div style="margin-top:10px;border-top:1px dashed ${borde};padding-top:9px;">
        <div style="font-size:11.5px;color:var(--muted);margin-bottom:6px;">
          ⏱️ Solicitado ${soloHora(s.creado_en)} · terminado ${soloHora(s.terminado_en)}
        </div>
        <button class="btn small" onclick="llenarCorrectivoDeSolicitud('${s.id}')">📝 Llenar correctivo de esta falla</button>
      </div>` : ''}
  </div>`;
}

/* ---------- Del foco al correctivo, con las horas ya puestas ---------- */
async function llenarCorrectivoDeSolicitud(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s){ showToast('⚠️ No se encontró la solicitud'); return; }
  if(!s.terminado_en){ showToast('⚠️ Primero marca el trabajo como terminado'); return; }

  /* Estos datos se vacían en el formulario en cuanto se abre la hoja */
  STATE.desdeSolicitud = {
    id: s.id,
    horaInicio: soloHoraInput(s.creado_en),
    horaFinal:  soloHoraInput(s.terminado_en),
    fecha: (s.terminado_en || s.creado_en).slice(0,10),
    nota: s.nota || '',
    solicitante: s.solicitante || ''
  };

  /* Hay que dejar listo el camino completo: planta, UBT y hoja, y luego redibujar */
  STATE.plantaHoy = s.planta;
  STATE.ubtElegida = s.ubt_no;
  STATE.vista = null;
  STATE.viendoTodo = false;
  pararAutoRefrescoFoco();
  showToast('Abriendo el correctivo de la UBT ' + s.ubt_no + '...');
  try{
    await abrirPaginaAutomatica(s.planta, s.ubt_no, s.maquina, mesActual(), anioActual());
  }catch(err){
    showToast('⚠️ No se pudo abrir la hoja: ' + (err.message||err));
    return;
  }
  if(!sheetActivaKey){ showToast('⚠️ No se pudo abrir la hoja de esa máquina'); return; }
  await render();
  /* Sube hasta el formulario para que no tenga que buscarlo */
  setTimeout(()=>{
    const el = document.getElementById('aviso_solicitud') || document.getElementById('f_sintomas');
    if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
  }, 250);
}

/* Hora en formato HH:MM, que es lo que pide el campo del formulario */
function soloHoraInput(iso){
  if(!iso) return '';
  const d = new Date(iso);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

/* Vacía los datos del foco en el formulario del correctivo */
function aplicarDatosDeSolicitud(){
  const d = STATE.desdeSolicitud;
  if(!d) return;
  const set = (id,val)=>{ const el=document.getElementById(id); if(el && val) el.value = val; };
  set('f_fecha', d.fecha);
  set('f_hi', d.horaInicio);
  set('f_hf', d.horaFinal);
  const aviso = document.getElementById('aviso_solicitud');
  if(aviso){
    aviso.innerHTML = `💡 Correctivo de la solicitud de <b>${escapeHtml(d.solicitante)}</b>.
      Las horas ya vienen puestas: <b>${escapeHtml(d.horaInicio)}</b> (cuando pidió ayuda) a <b>${escapeHtml(d.horaFinal)}</b> (cuando terminaste).
      Puedes cambiarlas si hace falta.
      ${d.nota?`<div style="margin-top:6px;padding-top:6px;border-top:1px dashed #f0c674;color:var(--muted);">
        Lo que anotó el operador, solo como referencia: "${escapeHtml(d.nota)}"</div>`:''}`;
    aviso.style.display = 'block';
  }
  validarTiempos();
  STATE.desdeSolicitud = null;
}

async function encenderFoco(){
  const ubt = document.getElementById('fo_ubt').value;
  const maquina = document.getElementById('fo_maquina').value;
  const nota = document.getElementById('fo_nota').value.trim();

  const sol = {
    id: uid(),
    planta: STATE.plantaHoy,
    ubt_no: ubt,
    maquina,
    solicitante: STATE.nombre,
    rol_solicitante: STATE.usuario?.subrol || '',
    gafete: STATE.usuario?.gafete || '',
    turno: STATE.usuario?.turno || '',
    nota,
    estado: 'pendiente',
    creado_en: ahoraISO(),
    ultimo_recordatorio: ahoraISO()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(
    tecnicos,
    '💡 Solicitud de mantenimiento',
    `Se solicitó mantenimiento en la UBT ${ubt} en la máquina ${maquina}, por ${STATE.nombre}.`
  );

  showToast('💡 Foco encendido — técnicos notificados');
  render();
}

async function atenderFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'atendida'){ showToast('Esta solicitud ya fue atendida'); render(); return; }

  s.estado = 'atendida';
  s.atendido_por = STATE.nombre;
  s.atendido_en = ahoraISO();
  await saveSolicitud(s);

  /* Avisar a quien solicitó */
  enviarNotificacion([slug(s.solicitante)], '🔧 Tu solicitud fue recibida',
    `El Técnico ${STATE.nombre} recibió tu solicitud de la UBT ${s.ubt_no} (${s.maquina}) y va en camino.`);

  /* Avisar a los demás técnicos */
  const usuarios = await listUsuarios();
  const otros = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado && slug(u.nombre)!==slug(STATE.nombre)).map(u=>slug(u.nombre));
  enviarNotificacion(otros, '💡 Solicitud tomada',
    `Tu compañero ${STATE.nombre} atenderá la solicitud de la UBT ${s.ubt_no}.`);

  showToast('✓ Solicitud recibida — se avisó al solicitante');
  render();
}

async function terminarFoco(id){
  const todas = await listSolicitudes(false);
  const s = todas.find(x=>x.id===id);
  if(!s) return;
  if(s.estado === 'terminada'){ showToast('Ya estaba marcada como terminada'); render(); return; }

  s.estado = 'terminada';
  /* Solo se mandan estas columnas si existen en la tabla */
  if('terminado_por' in s) s.terminado_por = STATE.nombre;
  if('terminado_en' in s) s.terminado_en = ahoraISO();
  try{ await saveSolicitud(s); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  enviarNotificacion([slug(s.solicitante)], '🏁 Trabajo terminado',
    `${STATE.nombre} terminó el trabajo en la UBT ${s.ubt_no} (${s.maquina}). El foco se apagó.`);

  showToast('🏁 Solicitud terminada');
  render();
}

/* ---------- Registro / historial de solicitudes de mantenimiento ---------- */
function cambiarRangoHist(d){ STATE.histDias = d; render(); }

async function renderHistorialFocos(){
  const dias = STATE.histDias || 7;
  const todasLasPlantas = ['supervisor','admin'].includes(STATE.rol);
  let filas = await listSolicitudesRango(dias, todasLasPlantas ? '' : (STATE.plantaHoy||''));

  /* Alcance segun el rol */
  let alcance = todasLasPlantas ? 'Todas las plantas' : ('Planta: ' + (STATE.plantaHoy||'—'));
  if(STATE.rol === 'produccion'){
    const sub = STATE.usuario?.subrol || 'operador';
    if(sub === 'operador'){
      filas = filas.filter(f => f.ubt_no === STATE.ubtElegida);
      alcance = `UBT ${STATE.ubtElegida||'—'} · ${STATE.plantaHoy||''}`;
    } else {
      const ubts = misUbtsProd();
      if(ubts.length) filas = filas.filter(f => ubts.includes(f.ubt_no));
      alcance = `Mis UBTs: ${ubts.join(', ')||'—'}`;
    }
  }

  const conRespuesta = filas.filter(f=>f.atendido_en);
  const conCierre = filas.filter(f=>f.terminado_en && f.atendido_en);
  const promEspera = conRespuesta.length
    ? Math.round(conRespuesta.reduce((a,f)=>a+(minutosEntreISO(f.creado_en,f.atendido_en)||0),0)/conRespuesta.length) : null;
  const promRep = conCierre.length
    ? Math.round(conCierre.reduce((a,f)=>a+(minutosEntreISO(f.atendido_en,f.terminado_en)||0),0)/conCierre.length) : null;
  const sinRecibir = filas.filter(f=>f.estado==='pendiente').length;
  const faltaColumna = filas.length>0 && !('terminado_en' in filas[0]);

  /* Veces que se pidió técnico, por máquina */
  const porMaquina = {};
  filas.forEach(f=>{
    const k = `${f.ubt_no} · ${f.maquina}`;
    porMaquina[k] ??= { veces:0, minutos:0 };
    porMaquina[k].veces++;
    const t = minutosEntreISO(f.atendido_en, f.terminado_en);
    if(t) porMaquina[k].minutos += t;
  });
  const maquinasOrd = Object.entries(porMaquina).sort((a,b)=>b[1].veces-a[1].veces);

  const btnRango = (d,txt)=>`<button class="btn ${dias===d?'':'ghost'} small" style="${dias===d?'background:var(--accent2);':''}" onclick="cambiarRangoHist(${d})">${txt}</button>`;

  return `
  <div class="card">
    <h2>📑 Registros de solicitudes de mantenimiento</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">${escapeHtml(alcance)} · últimos ${dias} día(s)</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;">
      ${btnRango(1,'Hoy')} ${btnRango(7,'7 días')} ${btnRango(30,'30 días')} ${btnRango(90,'90 días')}
    </div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;">
      <div style="background:#f3f6f9;border-radius:9px;padding:11px;">
        <div style="font-size:11px;color:var(--muted);font-weight:700;">SE PIDIÓ TÉCNICO</div>
        <div style="font-size:20px;font-weight:800;">${filas.length} <span style="font-size:12px;font-weight:600;color:var(--muted);">vez/veces</span></div>
      </div>
      <div style="background:#fff7e6;border-radius:9px;padding:11px;">
        <div style="font-size:11px;color:#a16d07;font-weight:700;">ESPERA PROMEDIO</div>
        <div style="font-size:20px;font-weight:800;">${promEspera===null?'—':formatoDuracion(promEspera)}</div>
        <div style="font-size:10.5px;color:var(--muted);">de solicitar a que llegue</div>
      </div>
      <div style="background:#f0f7f2;border-radius:9px;padding:11px;">
        <div style="font-size:11px;color:#1a7a3c;font-weight:700;">REPARACIÓN PROMEDIO</div>
        <div style="font-size:20px;font-weight:800;">${promRep===null?'—':formatoDuracion(promRep)}</div>
        <div style="font-size:10.5px;color:var(--muted);">de aceptar a terminar</div>
      </div>
      <div style="background:#fdecec;border-radius:9px;padding:11px;">
        <div style="font-size:11px;color:#a13636;font-weight:700;">SIN RECIBIR</div>
        <div style="font-size:20px;font-weight:800;">${sinRecibir}</div>
      </div>
    </div>
    ${faltaColumna?`<div style="margin-top:12px;background:#fff7e6;border:1px solid #f0c674;border-radius:8px;padding:10px;font-size:12px;">⚠️ La hora final no se está guardando. Falta agregar las columnas <b>terminado_por</b> y <b>terminado_en</b> en la base de datos.</div>`:''}
    ${['tecnico','supervisor','admin'].includes(STATE.rol)?`<button class="btn secondary" style="margin-top:12px;" onclick="exportarHistorialFocos()">📊 Exportar a CSV</button>`:''}
  </div>

  <div class="card">
    <h2>🔁 Veces que se pidió técnico por máquina</h2>
    ${maquinasOrd.length===0 ? '<div class="empty">Sin datos en este periodo.</div>' :

        const espera = minutosEntreISO(f.creado_en, f.atendido_en);

          </div>
          <div style="display:flex;gap:10px;flex-wrap:wrap;border-top:1px dashed #e2e5e8;padding-top:9px;">
            ${celda('Se solicitó', soloHora(f.creado_en), '')}
            ${celda('Aceptó', soloHora(f.atendido_en), espera!==null?('esperó '+formatoDuracion(espera)):'sin recibir')}

/* ---------- Recordatorios automáticos ---------- */
let intervaloRecordatorios = null;

function iniciarRecordatorios(){
  if(intervaloRecordatorios) clearInterval(intervaloRecordatorios);
  /* Solo el técnico vigila los recordatorios: si lo hacen todos los roles,
     cada dispositivo abierto manda su propia notificación y se duplican. */
  if(STATE.rol !== 'tecnico') return;
  revisarRecordatorios();
  intervaloRecordatorios = setInterval(revisarRecordatorios, 60000);
}

/* Intenta "apartar" el recordatorio: solo actualiza si nadie más lo hizo ya.
   Si otro dispositivo se adelantó, la respuesta viene vacía y no se notifica. */
async function reclamarRecordatorio(id, corteISO){
  try{
    const r = await sbFetch(`solicitudes?id=eq.${encodeURIComponent(id)}&ultimo_recordatorio=lt.${encodeURIComponent(corteISO)}`, {
      method:'PATCH', prefer:'return=representation',
      body: JSON.stringify({ ultimo_recordatorio: ahoraISO() })
    });
    return Array.isArray(r) && r.length > 0;
  }catch(e){ console.warn(e); return false; }
}

async function revisarRecordatorios(){
  try{
    const pendientes = await listSolicitudes(true);
    if(pendientes.length === 0) return;
    const corteISO = new Date(Date.now() - 5*60*1000).toISOString();
    const vencidas = pendientes.filter(s => new Date(s.ultimo_recordatorio || s.creado_en).getTime() <= Date.parse(corteISO));
    if(vencidas.length === 0) return;

    const usuarios = await listUsuarios();          /* una sola vez, no dentro del ciclo */
    const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
    if(tecnicos.length === 0) return;

    for(const s of vencidas){
      const apartado = await reclamarRecordatorio(s.id, corteISO);
      if(!apartado) continue;
      const min = minutosDesde(s.creado_en);
      enviarNotificacion(tecnicos, '💡 Solicitud SIN ATENDER',
        `Se solicitó mantenimiento en la UBT ${s.ubt_no} en la máquina ${s.maquina}, por ${s.solicitante}. Se solicitó hace ${min} minutos.`);
    }
  }catch(e){ console.warn(e); }
}

/* ---------- Pendientes de firma ---------- */
async function renderPendientesFirma(){
  const rol = STATE.rol;
  const misUbts = (STATE.usuario?.ubtsPorPlanta || {});
  const esTecnico = rol==='tecnico' || rol==='supervisor';

  /* Auditor y APQP: solo sus líneas. Mantenimiento: su planta del día. */
  let hojas;
  if(esTecnico){
    hojas = await listSheets({ planta: STATE.plantaHoy });
    hojas = hojas.filter(h => h.planta === STATE.plantaHoy);
  } else {
    const plantas = Object.keys(misUbts);
    hojas = await listSheets();
    hojas = hojas.filter(h => (misUbts[h.planta]||[]).includes(h.ubtNo));
    if(plantas.length === 0) hojas = [];
  }

  const pend = [];
  hojas.forEach(h => (h.filas||[]).forEach(f => {
    const faltaAuditor = f.estadoAuditor === 'pendiente';
    const faltaApqp    = f.estadoAPQP === 'pendiente';
    if(rol === 'auditor' && !faltaAuditor) return;
    if(rol === 'apqp'    && !faltaApqp)    return;
    if(esTecnico){
      if(!faltaAuditor && !faltaApqp) return;
      if(rol === 'tecnico' && slug(f.tecnico||'') !== slug(STATE.nombre)) return;  /* solo lo suyo */
    }
    pend.push({ hoja:h, fila:f, faltaAuditor, faltaApqp });
  }));

  pend.sort((a,b) => String(b.fila.creadoEn||'').localeCompare(String(a.fila.creadoEn||'')));

  const titulo = esTecnico
    ? '✍️ Pendientes de firma de Calidad y APQP'
    : '✍️ Pendientes de tu firma';
  const explica = esTecnico
    ? (rol==='tecnico'
        ? 'Registros tuyos que todavía no firma el Auditor de Calidad o APQP.'
        : 'Registros de tu planta que siguen sin la firma de Calidad o de APQP.')
    : `Registros de tus líneas que esperan tu firma${rol==='apqp'?' de APQP':''}.`;

  return `
  <div class="card no-print"><button class="btn ghost small" onclick="irInicio()">← Volver</button></div>
  <div class="card">
    <h2>${titulo} (${pend.length})</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">${explica}</p>
    ${pend.length === 0
      ? '<div class="empty">No hay nada pendiente. ✓</div>'
      : pend.map(p => tarjetaPendienteFirma(p, rol)).join('')}
  </div>`;
}

function tarjetaPendienteFirma(p, rol){
  const f = p.fila, h = p.hoja;
  const faltantes = [];
  if(p.faltaAuditor) faltantes.push('Auditor de Calidad');
  if(p.faltaApqp)    faltantes.push('APQP');
  const puedeFirmarAqui = (rol==='auditor' && p.faltaAuditor) || (rol==='apqp' && p.faltaApqp);
  return `
  <div style="border:1px solid #f0c674;border-left:5px solid #e0b400;background:#fffdf5;border-radius:10px;padding:13px;margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;">
      <b style="font-size:13.5px;">📍 UBT ${escapeHtml(h.ubtNo)} · ${escapeHtml(h.maquina)}</b>
      <span class="badge-est esp">Falta: ${faltantes.join(' y ')}</span>
    </div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">
      ${escapeHtml(h.planta)} · ${escapeHtml(f.fecha||'')} · Técnico ${escapeHtml(f.tecnico||'')}
    </div>
    <div style="font-size:13px;margin-top:7px;"><b>Falla:</b> ${escapeHtml(f.sintomas||'')}</div>
    ${f.acciones?`<div style="font-size:12.5px;margin-top:3px;"><b>Acción:</b> ${escapeHtml(f.acciones)}</div>`:''}
    ${puedeFirmarAqui ? `<button class="btn small" style="margin-top:10px;" onclick="${rol==='auditor'
        ? `firmarAuditor('${escArg(h.key)}','${escArg(f.id)}')`
        : `firmarApqp('${escArg(h.key)}','${escArg(f.id)}')`}">✍️ Firmar este registro</button>` : ''}
  </div>`;
}

async function guardarLineasTecnico(){
  const sel = [...document.querySelectorAll('.lt-chk:checked')].map(c=>c.value);
  if(sel.length === 0){ showToast('⚠️ Selecciona al menos una línea'); return; }
  const planta = STATE.plantaHoy;

  /* Se vuelve a revisar por si otro técnico la tomó mientras tanto */
  const tomadas = await ubtsTomadasPorOtros(planta);
  const choque = sel.filter(u => tomadas[u]);
  if(choque.length){
    showToast(`⚠️ ${choque[0]} la acaba de tomar ${tomadas[choque[0]]}`);
    render();
    return;
  }

  if(!STATE.usuario.ubtsPorPlanta) STATE.usuario.ubtsPorPlanta = {};
  STATE.usuario.ubtsPorPlanta[planta] = sel;
  try{ await saveUsuario(STATE.usuario); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }
  STATE.editandoLineasTec = false;
  showToast('Líneas guardadas ✓');
  render();
}

/* ---------- Actividades del técnico ---------- */
/* Se guardan en la tabla config, una por renglón, con clave acttec:planta:ubt:id */
function claveActividad(planta, ubt, id){
  return `acttec:${slug(planta)}:${slug(ubt)}:${id}`;
}
async function saveActividadTecnico(act){
  await sbFetch('config?on_conflict=clave', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave: claveActividad(act.planta, act.ubt, act.id), valor: act, actualizado_en: ahoraISO() })
  });
}
async function listActividadesTecnico(filtro){
  filtro = filtro || {};
  let patron = 'acttec:';
  if(filtro.planta) patron += slug(filtro.planta) + ':';
  if(filtro.planta && filtro.ubt) patron += slug(filtro.ubt) + ':';
  try{
    const r = await sbFetch('config?clave=like.' + encodeURIComponent(patron + '*') + '&select=valor&order=clave.desc');
    let lista = (r||[]).map(x=>x.valor).filter(Boolean);
    if(filtro.tecnico) lista = lista.filter(a => slug(a.tecnico||'') === slug(filtro.tecnico));
    return lista.sort((a,b)=>String(b.creado_en||'').localeCompare(String(a.creado_en||'')));
  }catch(e){ console.warn(e); return []; }
}
async function borrarActividadTecnico(act){
  await sbFetch('config?clave=eq.'+encodeURIComponent(claveActividad(act.planta, act.ubt, act.id)), { method:'DELETE', prefer:'return=minimal' });
}

function confirmarBorrarActividad(btn, planta, ubt, id){
  if(btn.dataset.c === '1'){ borrarActividadYRefrescar(planta, ubt, id); return; }
  btn.dataset.c = '1';
  btn.textContent = '¿Seguro? Toca otra vez';
  setTimeout(()=>{ btn.dataset.c=''; btn.textContent='🗑 Borrar'; }, 3000);
}
async function borrarActividadYRefrescar(planta, ubt, id){

function abrirLineasTecnicos(){
  STATE.ltPlanta = null; STATE.ltTecnico = null; STATE.ltUbt = null;
  STATE.vista = 'lineas_tecnicos';
  render();
}
function ltElegirPlanta(p){ STATE.ltPlanta = p; STATE.ltTecnico = null; STATE.ltUbt = null; render(); }
function ltElegirTecnico(n){ STATE.ltTecnico = n; STATE.ltUbt = null; render(); }
function ltElegirUbt(u){ STATE.ltUbt = u; render(); }
function ltVolver(){
  if(STATE.ltUbt){ STATE.ltUbt = null; }
  else if(STATE.ltTecnico){ STATE.ltTecnico = null; }
  else if(STATE.ltPlanta){ STATE.ltPlanta = null; }
  else { STATE.vista = 'menu'; }
  render();
}

async function renderLineasTecnicos(){
  const volver = `<div class="card no-print"><button class="btn ghost small" onclick="ltVolver()">← Volver</button></div>`;

  /* Paso 1: elegir planta */
  if(!STATE.ltPlanta){
    return `${volver}<div class="card">
      <h2>👷 Líneas asignadas de técnicos</h2>
      <p style="font-size:13px;color:var(--muted);margin-top:-8px;">Elige la planta que quieres revisar.</p>
      <div class="planta-grid">${PLANTA_NOMBRES.map(p=>`<div class="planta-card" onclick="ltElegirPlanta('${escArg(p)}')">${escapeHtml(p)}</div>`).join('')}</div>
    </div>`;
  }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u => u.rol === 'tecnico' && !u.bloqueado);

  /* Paso 2: elegir técnico */
  if(!STATE.ltTecnico){
    return `${volver}<div class="card">
      <h2>👷 Técnicos — ${escapeHtml(STATE.ltPlanta)}</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">Toca un técnico para ver las líneas que lleva asignadas.</p>
      ${tecnicos.length===0 ? '<div class="empty">No hay técnicos registrados.</div>' : `
      <div class="menu-grid">
        ${tecnicos.map(t=>{
          const n = ((t.ubtsPorPlanta||{})[STATE.ltPlanta]||[]).length;
          return `<button class="menu-tile" onclick="ltElegirTecnico('${escArg(t.nombre)}')">
            <span class="ico">🔧</span>
            <span class="txt">${escapeHtml(t.nombre)}</span>
            <span class="sub">${n} línea(s)${t.turno?(' · Turno '+escapeHtml(t.turno)):''}</span>
          </button>`;
        }).join('')}
      </div>`}
    </div>`;
  }

  const tec = tecnicos.find(t => slug(t.nombre) === slug(STATE.ltTecnico));
  const susUbts = (tec?.ubtsPorPlanta||{})[STATE.ltPlanta] || [];

  /* Paso 3: ver sus líneas */
  if(!STATE.ltUbt){
    const actos = await listActividadesTecnico({ planta: STATE.ltPlanta, tecnico: STATE.ltTecnico });
    const conteo = {};
    actos.forEach(a => { conteo[a.ubt] = (conteo[a.ubt]||0)+1; });
    return `${volver}<div class="card">
      <h2>🔧 ${escapeHtml(STATE.ltTecnico)}</h2>
      <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">
        ${escapeHtml(STATE.ltPlanta)} · ${susUbts.length} línea(s) asignada(s) · ${actos.length} actividad(es) registrada(s)
      </p>
      ${susUbts.length===0 ? '<div class="empty">Este técnico todavía no elige sus líneas.</div>' : `
      <div class="menu-grid">
        ${susUbts.map(u=>`<button class="menu-tile azul" onclick="ltElegirUbt('${escArg(u)}')">
          <span class="ico">📍</span>
          <span class="txt">UBT ${escapeHtml(u)}</span>
          <span class="sub">${conteo[u]||0} actividad(es)</span>
        </button>`).join('')}
      </div>`}
    </div>`;
  }

  /* Paso 4: actividades de esa UBT */
  const actos = await listActividadesTecnico({ planta: STATE.ltPlanta, ubt: STATE.ltUbt, tecnico: STATE.ltTecnico });
  return `${volver}<div class="card">
    <h2>📍 UBT ${escapeHtml(STATE.ltUbt)} — ${escapeHtml(STATE.ltTecnico)}</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">${actos.length} actividad(es) registrada(s) en esta línea.</p>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px;">
      ${MAQ_TPM.map(m=>`<button class="btn small ghost" onclick="abrirTpmDe('${escArg(STATE.ltPlanta)}','${escArg(STATE.ltUbt)}','${escArg(m)}')">🗓️ TPM ${escapeHtml(m)}</button>`).join('')}
    </div>
    ${actos.length===0 ? '<div class="empty">Sin actividades registradas en esta línea.</div>'
      : actos.map(a=>tarjetaActividad(a, false)).join('')}
  </div>`;
}

        </select>

    <button class="btn ghost" style="margin-top:8px;" onclick="generarPaquetePdf('correctivos')">📝 Solo correctivos</button>

    <div id="pdf_estado" style="font-size:12.5px;color:var(--muted);margin-top:10px;"></div>
  </div>`;

function actualizarUbtsPdf(){
  const planta = document.getElementById('pdf_planta').value;
  const sel = document.getElementById('pdf_ubt');
  if(!sel) return;
  const ubts = planta ? ubtsDeLaPlanta(STATE.plantasCfg, planta) : [];
  sel.innerHTML = '<option value="">Todas las UBT</option>' + ubts.map(u=>`<option>${escapeHtml(u)}</option>`).join('');
}

async function generarPaquetePdf(que){
  const planta = document.getElementById('pdf_planta').value;
  const ubtSel = document.getElementById('pdf_ubt').value;
  const mes = Number(document.getElementById('pdf_mes').value);
  const anio = Number(document.getElementById('pdf_anio').value) || ahora().getFullYear();
  const est = document.getElementById('pdf_estado');
  if(est) est.textContent = 'Preparando documento, puede tardar un poco...';

  const hojas = await listSheets(planta ? { planta } : undefined);
  const filtradas = hojas.filter(h => (!planta || h.planta===planta) && (!ubtSel || h.ubtNo===ubtSel));

  /* Se ordena por planta, luego UBT, luego máquina y página */
  filtradas.sort((a,b)=>
    String(a.planta).localeCompare(String(b.planta)) ||
    String(a.ubtNo).localeCompare(String(b.ubtNo), 'es', {numeric:true}) ||
    String(a.maquina).localeCompare(String(b.maquina)) ||
    (a.pagina||1)-(b.pagina||1));

  let htmlCorr = '', nCorr = 0;
  if(que !== 'tpm'){
    filtradas.forEach(h=>{ htmlCorr += renderSheetVisual(h,{role:'lectura', publico:true}); nCorr++; });
  }

  let htmlTpm = '', nTpm = 0;
  if(que !== 'correctivos'){
    const plantasTpm = planta ? [planta] : PLANTA_NOMBRES;
    for(const pl of plantasTpm){
      const lista = ubtSel ? [ubtSel] : ubtsDeLaPlanta(STATE.plantasCfg, pl);
      for(const ubt of lista){
        for(const maq of MAQ_TPM){
          const regs = await getTpmMes(pl, ubt, maq, anio, mes);
          if(regs.length === 0) continue;
          const marcas = {};
          regs.forEach(r => { marcas[`${r.fecha}|${letraTurno(r.turno)}`] = r; });
          const claveF = claveFirmasTpm(pl, ubt, maq, anio, mes);
          const guardado = await getFirmasTpm(claveF);
          const imgs = await getImagenesTpm(maq);
          tpmCtx = { planta:pl, ubt, maquina:maq, anio, mes, marcas, firmas:guardado,
                     comentarios: guardado.comentarios||'', imgs, claveF };
          htmlTpm += renderHojaTpm();
          nTpm++;
        }
      }
    }
    tpmCtx = null;
  }

  if(nCorr === 0 && nTpm === 0){
    if(est) est.textContent = '⚠️ No se encontraron hojas con ese filtro.';
    showToast('⚠️ No hay nada que exportar con ese filtro');
    return;
  }

  const base = `${planta||'Todas'}${ubtSel?('-'+ubtSel):''}`;
  /* Cada tipo va en su propia ventana: así cada uno sale en su orientación correcta */
  if(nCorr > 0) abrirImpresionCorrectivos(`Correctivos-${base}`, htmlCorr);
  if(nTpm > 0){
    const abrir = () => abrirImpresionTpm(`TPM-${base}-${MESES[mes]}-${anio}`, htmlTpm);
    if(nCorr > 0) setTimeout(abrir, 1200); else abrir();
  }

  if(est){
    est.innerHTML = `✓ ${nCorr} hoja(s) de correctivo (horizontal) y ${nTpm} de TPM (vertical).` +
      ((nCorr>0 && nTpm>0) ? ' <b>Se abren dos ventanas</b>, una por cada orientación.' : '');
  }
}

/* ================= ARCHIVO: los meses que ya cerraron ================= */
/* Devuelve los últimos N meses hacia atrás, empezando por el anterior al actual */
function mesesAtras(n){
  const out = [];
  const hoy = ahora();
  for(let i=1; i<=n; i++){
    const d = new Date(hoy.getFullYear(), hoy.getMonth()-i, 1);
    out.push({ mes:d.getMonth(), anio:d.getFullYear(), etiqueta: MESES[d.getMonth()] + ' ' + d.getFullYear() });
  }
  return out;
}

function abrirArchivo(){
  const prev = mesesAtras(1)[0];
  STATE.arch = STATE.arch || { planta: STATE.plantaHoy || '', ubt:'', mes: prev.mes, anio: prev.anio };
  STATE.vista = 'archivo';
  render();
}
function cambiarArchivo(){
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const [mes, anio] = g('arch_mes').split('-');
  STATE.arch = { planta: g('arch_planta'), ubt: g('arch_ubt'), mes: Number(mes), anio: Number(anio) };
  render();
}
function elegirPlantaArchivo(p){
  STATE.arch = { ...(STATE.arch||{}), planta:p, ubt:'' };
  render();
}

async function renderArchivo(){
  const volver = `<div class="card no-print"><button class="btn ghost small" onclick="irInicio()">← Volver</button></div>`;
  const a = STATE.arch || {};
  const rol = STATE.rol;

  /* Qué plantas puede ver cada rol */
  const vePlantas = ['supervisor','admin'].includes(rol);
  if(!a.planta){
    if(!vePlantas && STATE.plantaHoy){ STATE.arch = { ...a, planta: STATE.plantaHoy }; }
    else {
      return `${volver}<div class="card">
        <h2>🗄️ Archivo de meses anteriores</h2>
        <p style="font-size:13.5px;">Elige la planta.</p>
        <div class="planta-grid">${PLANTA_NOMBRES.map(p=>`<div class="planta-card" onclick="elegirPlantaArchivo('${escArg(p)}')">${escapeHtml(p)}</div>`).join('')}</div>
      </div>`;
    }
  }
  const planta = STATE.arch.planta;

  /* Qué líneas puede ver */
  let ubtsDisp;
  if(rol === 'auditor' || rol === 'apqp'){
    ubtsDisp = (STATE.usuario?.ubtsPorPlanta||{})[planta] || [];
  } else {
    ubtsDisp = ubtsDeLaPlanta(STATE.plantasCfg, planta);
  }

  const meses = mesesAtras(12);
  const sel = STATE.arch;
  if(sel.mes === undefined) { sel.mes = meses[0].mes; sel.anio = meses[0].anio; }
  const nombreMes = MESES[sel.mes];

  /* Correctivos de ese mes */
  let hojas = await listSheets({ planta });
  hojas = hojas.filter(h => h.planta===planta && h.mes===nombreMes && String(h.anio)===String(sel.anio));
  if(sel.ubt) hojas = hojas.filter(h => h.ubtNo===sel.ubt);
  if(rol==='auditor' || rol==='apqp') hojas = hojas.filter(h => ubtsDisp.includes(h.ubtNo));

  const porUbt = {};
  hojas.forEach(h => (porUbt[h.ubtNo] ??= []).push(h));

  /* TPM de ese mes: solo si se eligió una línea, para no hacer decenas de consultas */
  let tpmHtml = '';
  if(sel.ubt){
    for(const maq of MAQ_TPM){
      const regs = await getTpmMes(planta, sel.ubt, maq, sel.anio, sel.mes);
      if(regs.length === 0) continue;
      const marcas = {};
      regs.forEach(r => { marcas[`${r.fecha}|${letraTurno(r.turno)}`] = r; });
      const claveF = claveFirmasTpm(planta, sel.ubt, maq, sel.anio, sel.mes);
      const guardado = await getFirmasTpm(claveF);
      const imgs = await getImagenesTpm(maq);
      tpmCtx = { planta, ubt:sel.ubt, maquina:maq, anio:sel.anio, mes:sel.mes, marcas,
                 firmas:guardado, comentarios:guardado.comentarios||'', imgs, claveF };
      tpmHtml += `<div class="card"><h2>🗓️ TPM ${escapeHtml(maq)}</h2>
        <div class="tpm-scroll">${renderHojaTpm()}</div></div>`;
    }
    tpmCtx = null;
  }

  const totalReg = hojas.reduce((n,h)=>n+((h.filas||[]).length),0);

  return `
  ${volver}
  <div class="card no-print">
    <h2>🗄️ Archivo — ${escapeHtml(nombreMes)} ${sel.anio}</h2>
    <p style="font-size:12.5px;color:var(--muted);margin-top:-8px;">
      Aquí quedan guardados los correctivos y el TPM de los meses que ya cerraron. Nada se borra al cambiar de mes.
    </p>
    <div class="filters" style="margin-bottom:0;">
      ${vePlantas ? `<select id="arch_planta" onchange="cambiarArchivo()">
        ${PLANTA_NOMBRES.map(p=>`<option ${p===planta?'selected':''}>${escapeHtml(p)}</option>`).join('')}</select>`
        : `<input type="hidden" id="arch_planta" value="${escapeHtml(planta)}">
           <span style="font-size:13px;font-weight:700;align-self:center;">${escapeHtml(planta)}</span>`}
      <select id="arch_ubt" onchange="cambiarArchivo()">
        <option value="">Todas las UBT</option>
        ${ubtsDisp.map(u=>`<option ${u===sel.ubt?'selected':''}>${escapeHtml(u)}</option>`).join('')}
      </select>
      <select id="arch_mes" onchange="cambiarArchivo()">
        ${meses.map(m=>`<option value="${m.mes}-${m.anio}" ${(m.mes===sel.mes && m.anio===sel.anio)?'selected':''}>${m.etiqueta}</option>`).join('')}
      </select>
    </div>
    <div style="font-size:12.5px;color:var(--muted);margin-top:10px;">
      ${hojas.length} hoja(s) de correctivo · ${totalReg} registro(s)${sel.ubt?'':' · elige una UBT para ver también su TPM'}
    </div>
  </div>

  ${hojas.length === 0 ? '<div class="card"><div class="empty">No hay correctivos guardados de ese mes.</div></div>' :
    Object.keys(porUbt).sort().map(ubt=>`
      <div class="card">
        <h2>📍 UBT ${escapeHtml(ubt)} <span style="font-weight:400;font-size:12.5px;color:var(--muted);">(${porUbt[ubt].length} hoja/s)</span></h2>
        ${porUbt[ubt].map(h=>envolverHoja(h,{role:'lectura'})).join('')}
      </div>`).join('')}

  ${tpmHtml}`;
}

/* ================= ANDON: focos físicos por bahía ================= */
/* Cada bahía tiene una PC con una caja de relés. Aquí se le dice a esa caja
   qué relé enciende el foco y qué UBT corresponde a cada interruptor. */

function claveAndon(planta, bahia){ return `andon:${slug(planta)}:${bahia}`; }
function claveAndonEstado(planta, bahia){ return `andonestado:${slug(planta)}:${bahia}`; }

async function getConfigAndon(planta){
  try{
    const r = await sbFetch('config?clave=like.' + encodeURIComponent('andon:'+slug(planta)+':*') + '&select=clave,valor');
    const mapa = {};
    (r||[]).forEach(x => { const b = x.clave.split(':')[2]; mapa[b] = x.valor || {}; });
    return mapa;
  }catch(e){ console.warn(e); return {}; }
}
async function getEstadoAndon(planta){
  try{
    const r = await sbFetch('config?clave=like.' + encodeURIComponent('andonestado:'+slug(planta)+':*') + '&select=clave,valor');
    const mapa = {};
    (r||[]).forEach(x => { const b = x.clave.split(':')[2]; mapa[b] = x.valor || {}; });
    return mapa;
  }catch(e){ return {}; }
}
async function saveConfigAndon(planta, bahia, valor){
  await sbFetch('config?on_conflict=clave', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave: claveAndon(planta, bahia), valor, actualizado_en: ahoraISO() })
  });
}

/* Todas las bahías de una planta, sacadas de sus UBT */
function bahiasDePlanta(planta){
  const ubts = ubtsDeLaPlanta(STATE.plantasCfg, planta);
  const mapa = {};
  ubts.forEach(u => (mapa[bahiaDeUbt(u)] ??= []).push(u));
  return Object.keys(mapa).sort((a,b)=>Number(a)-Number(b)).map(b => ({ bahia:b, ubts:mapa[b] }));
}

function abrirAndon(){
  STATE.andonPlanta = STATE.andonPlanta || PLANTA_NOMBRES[0];
  STATE.vista = 'andon';
  render();
}
function cambiarPlantaAndon(){
  STATE.andonPlanta = document.getElementById('andon_planta').value;
  render();
}

async function renderAndon(){
  const planta = STATE.andonPlanta || PLANTA_NOMBRES[0];
  const bahias = bahiasDePlanta(planta);
  const conf = await getConfigAndon(planta);
  const estado = await getEstadoAndon(planta);

  const enLinea = b => {
    const e = estado[b];
    if(!e || !e.visto_en) return null;
    const min = Math.floor((ahoraMs() - new Date(e.visto_en).getTime())/60000);
    return { min, ...e };

        <div>

async function guardarAndon(planta, bahia){
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const entradas = {};
  [1,2,3,4].forEach(n => { entradas[String(n)] = g(`an_ent_${bahia}_${n}`); });
  const valor = {
    planta, bahia,
    rele_foco: Number(g(`an_rele_${bahia}`)) || 1,
    maquina: g(`an_maq_${bahia}`) || 'Línea',
    entradas,
    activo: document.getElementById(`an_act_${bahia}`).checked
  };
  try{ await saveConfigAndon(planta, bahia, valor); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }
  const ok = document.getElementById(`an_ok_${bahia}`);
  if(ok) ok.textContent = '✓ Guardado — la PC lo toma en menos de 1 minuto';
  showToast(`Bahía ${bahia} guardada ✓`);
}

/* ---------- Imprimir una hoja individual ---------- */
function imprimirHoja(elId, sheetKey){
  const target = document.getElementById(elId);
  if(!target){ showToast('⚠️ No se encontró la hoja'); return; }
  const contenido = target.querySelector('.sheet-page');
  if(!contenido){ showToast('⚠️ No se encontró el formato'); return; }

  const s = colaImpresion.find(x=>x.key===sheetKey) || target.__sheet;
  let titulo = 'Correctivo';
  if(target.dataset.maquina){
    titulo = `Correctivo-${target.dataset.maquina}-${target.dataset.ubt}-${target.dataset.mes}-${target.dataset.anio}`;
  }

  /* Se imprime una copia limpia: sin botones y sin la columna Editar */
  const copia = contenido.cloneNode(true);
  copia.style.transform = ''; copia.style.transformOrigin = '';   /* el encogido es solo de pantalla */
  copia.querySelectorAll('.no-print').forEach(el=>el.remove());
  const colEdit = copia.querySelector('col.col-edit');
  if(colEdit) colEdit.remove();
  const tabla = copia.querySelector('table.sheet-table');
  if(tabla) tabla.classList.remove('con-editar');

  const estilos = [...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${titulo}</title>${estilos}
    <style>
      body{background:#fff;margin:0;padding:10px;}
      .no-print{display:none !important;}
      @page{size:letter landscape;margin:6mm;}
      html,body{width:100%;margin:0;padding:0;}
      .sheet-page{border:none;box-shadow:none;width:100%;min-height:0;margin:0;padding:0;transform:none;}
      .lear-logo{width:150px;}
      table.sheet-table tbody tr{height:58px;}
    </style></head><body>${copia.outerHTML}</body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>{ ventana.print(); }, 400);
}
function renderSheetPrintWrap(sheet, opts){
  const wrapId = 'sw_' + sheet.key.replace(/[^a-z0-9]/gi,'');
  const yaEsta = enCola(sheet.key);
  return `<div class="sheet-print-wrap" id="${wrapId}"
      data-maquina="${escapeHtml(sheet.maquina)}" data-ubt="${escapeHtml(sheet.ubtNo)}"

      <button class="btn ghost small" onclick="imprimirHoja('${wrapId}','${sheet.key}')">🖨️ Imprimir esta hoja</button>
      <button class="btn ${yaEsta?'ghost':'secondary'} small" onclick="toggleCola('${sheet.key}')">${yaEsta?'✓ En cola (quitar)':'➕ Agregar a cola'}</button>

/* La hoja mide lo mismo que el papel; si no cabe, se encoge para verla entera */
function envolverHoja(sheet, opts){
  return `<div class="sheet-print-wrap">
    <div class="no-print" style="margin-bottom:6px;">
      <button class="btn ghost small" onclick="alternarAjusteHoja(this)">🔎 Ver tamaño real</button>
    </div>
    <div class="sheet-scroll">${renderSheetVisual(sheet, opts)}</div>
  </div>`;

function ajustarHoja(cont){
  const hoja = cont.querySelector('.sheet-page');
  if(!hoja) return;
  hoja.style.transform = ''; hoja.style.transformOrigin = ''; cont.style.height = '';
  const disponible = cont.clientWidth;
  const ancho = hoja.offsetWidth;
  if(!disponible || !ancho || ancho <= disponible){ cont.dataset.fit = ''; return; }
  const esc = disponible / ancho;
  hoja.style.transform = `scale(${esc})`;
  hoja.style.transformOrigin = 'top left';
  cont.style.height = (hoja.offsetHeight * esc + 8) + 'px';
  cont.dataset.fit = '1';
}

/* Muestra el detalle de la causa solo si se marcó la casilla */
function alternarCausaExterna(){
  const chk = document.getElementById('f_externa');
  const caja = document.getElementById('causa_detalle');
  const otro = document.getElementById('causa_otro_wrap');
  const sel = document.getElementById('f_causa');
  if(!chk || !caja) return;
  caja.style.display = chk.checked ? 'block' : 'none';
  if(otro && sel) otro.style.display = (chk.checked && sel.value === 'otro') ? 'flex' : 'none';
}

function alternarAjusteHoja(btn){
  const wrap = btn.closest('.sheet-print-wrap');
  const cont = wrap && wrap.querySelector('.sheet-scroll');
  if(!cont) return;
  const hoja = cont.querySelector('.sheet-page');
  if(cont.dataset.fit === '1'){
    hoja.style.transform=''; hoja.style.transformOrigin=''; cont.style.height='';
    cont.dataset.fit = '';
    btn.textContent = '🔍 Ajustar a la pantalla';
  } else {
    ajustarHoja(cont);
    btn.textContent = '🔎 Ver tamaño real';
  }
}

/* Al abrir cualquier pantalla, las hojas se encogen solas para verse completas */
function ajustarTodasLasHojas(){
  document.querySelectorAll('.sheet-print-wrap > .sheet-scroll').forEach(ajustarHoja);
}
window.addEventListener('resize', ()=>{
  clearTimeout(window.__tAjuste);

});

/* ---------- Render visual de la hoja ---------- */
function renderSheetVisual(sheet, opts){
  if(!sheet) return '<div class="empty">Hoja no encontrada.</div>';
  opts = opts || {};
  /* Editar solo lo ven Mantenimiento, Supervisor de Mantenimiento y Administrador,
     y nunca en la vista pública del QR */
  const permiteEditar = !opts.publico && ['tecnico','supervisor','admin'].includes(STATE.rol);
  const filas = sheet.filas || [];

  /* Casillas de máquina, en el mismo acomodo que el papel: 4 columnas de 3 renglones */
  const gruposMaquinas = checklistGroups.filter(g => g[0] !== 'Otros');
  const chkHtml = [0,1,2].map(r => {
    let tds = '';
    gruposMaquinas.forEach((col, ci) => {
      const item = col[r] || null;
      const on = item && item === sheet.maquina;
      if(ci === 0){
        /* Primera columna: el texto va a la izquierda y la casilla a la derecha */
        tds += `<td class="chk-txt">${item?escapeHtml(item):''}</td><td class="chk-cas">${item?`<span class="chk-box ${on?'on':''}"></span>`:''}</td>`;
      } else {
        tds += `<td class="chk-cas">${item?`<span class="chk-box ${on?'on':''}"></span>`:''}</td><td class="chk-txt">${item?escapeHtml(item):''}</td>`;
      }
    });
    tds += r===0
      ? `<td class="chk-cas"><span class="chk-box"></span></td><td class="chk-txt">Otros <span class="chk-linea"></span></td>`
      : `<td class="chk-cas"></td><td class="chk-txt"></td>`;
    return `<tr>${tds}</tr>`;
  }).join('');

  const filaVacia = `<tr>${'<td></td>'.repeat(permiteEditar?13:12)}</tr>`;

  const filasHtml = filas.map(f=>{
    const auditorCell = f.estadoAuditor==='firmado'
      ? (f.firmaAuditorImg ? `<img src="${f.firmaAuditorImg}" style="max-width:70px;max-height:26px;"><br><span style="font-size:7px;">${escapeHtml(f.firmaAuditorNombre)}</span>` : `<span class="firma-ok">${escapeHtml(f.firmaAuditorNombre)}</span>`)

function renderAdminLogin(){
  return `<div class="wrap"><div class="card">

function loginAdmin(){
  const pass = document.getElementById('admin_pass').value;
  if(pass !== STATE.codes.admin){ document.getElementById('admin_error').style.display='block'; return; }
  STATE.adminOk = true; render();
}

}

async function toggleBloqueoUsuario(nombre, estaBloqueado){
  const u = await getUsuario(nombre);
  if(!u) return;
  u.bloqueado = !estaBloqueado;
  await saveUsuario(u);
  showToast(u.bloqueado ? '🔒 Usuario bloqueado' : '🔓 Usuario desbloqueado');
  render();
}

async function toggleEditUsuario(uid, nombre){
  const btn = document.getElementById('au_editbtn_'+uid);
  const nombreEl = document.getElementById('au_nombre_'+uid);
  const rolEl = document.getElementById('au_rol_'+uid);
  const gafeteEl = document.getElementById('au_gafete_'+uid);
  const editing = btn.textContent.includes('Guardar');
  if(!editing){
    nombreEl.disabled = false; rolEl.disabled = false; gafeteEl.disabled = false;
    rolEl.style.display = 'inline-block';
    btn.textContent = '💾 Guardar';
  } else {
    const nuevoNombre = nombreEl.value.trim();
    const nuevoRol = rolEl.value;
    const nuevoGafete = gafeteEl.value.trim();
    const usuarioViejo = await getUsuario(nombre);
    const actualizado = { ...usuarioViejo, nombre: nuevoNombre, rol: nuevoRol, gafete: nuevoGafete };
    if(slug(nuevoNombre) !== slug(nombre)){
      await deleteUsuario(nombre);
    }
    await saveUsuario(actualizado);
    showToast('Usuario actualizado ✓');
    render();
  }
}
function confirmarBorrarUsuario(btn, nombre){
  if(btn.dataset.confirm==='1'){ eliminarUsuario(nombre); return; }
  btn.dataset.confirm = '1';
  btn.textContent = '¿Seguro? Toca de nuevo';
  setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑 Borrar'; }, 3000);
}
async function eliminarUsuario(nombre){
  await deleteUsuario(nombre);
  showToast('Usuario eliminado ✓');
  render();
}

async function encenderFocoPrueba(){
  const sol = {
    id: uid(),
    planta: document.getElementById('tf_planta').value,
    ubt_no: document.getElementById('tf_ubt').value,
    maquina: document.getElementById('tf_maquina').value,
    solicitante: document.getElementById('tf_nombre').value.trim() || 'Prueba Admin',
    rol_solicitante: 'operador',
    gafete: '000000',
    turno: 'TA',
    nota: '(Solicitud de prueba generada desde Administrador)',
    estado: 'pendiente',
    creado_en: ahoraISO(),
    ultimo_recordatorio: ahoraISO()
  };
  try{ await saveSolicitud(sol); }
  catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  const usuarios = await listUsuarios();
  const tecnicos = usuarios.filter(u=>u.rol==='tecnico' && !u.bloqueado).map(u=>slug(u.nombre));
  enviarNotificacion(tecnicos, '💡 Solicitud de mantenimiento (PRUEBA)',
    `Se solicitó mantenimiento en la UBT ${sol.ubt_no} en la máquina ${sol.maquina}, por ${sol.solicitante}.`);

  showToast(`💡 Foco de prueba encendido — ${tecnicos.length} técnico(s) notificados`);
  cargarFocosAdmin();
}

        <b>💡 UBT ${escapeHtml(s.ubt_no)} · ${escapeHtml(s.maquina)}</b> — ${escapeHtml(s.planta)}<br>
        <span style="color:var(--muted);">Por ${escapeHtml(s.solicitante)} · hace ${minutosDesde(s.creado_en)} min</span>
        <button class="btn ghost small" style="margin-left:8px;color:#a13636;" onclick="borrarSolicitud('${s.id}')">✖ Borrar</button>

async function cargarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  const info = document.getElementById('cat_info');
  if(!ta) return;
  const refs = await listRefacciones();
  ta.value = refs.map(r=>r.descripcion ? `${r.numero_parte}, ${r.descripcion}` : r.numero_parte).join('\n');
  if(info) info.textContent = `${refs.length} número(s) de parte en el catálogo.`;
}

async function guardarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  if(!ta) return;
  const lineas = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lineas.length === 0){ showToast('⚠️ El catálogo está vacío'); return; }
  showToast(`Guardando ${lineas.length} número(s)...`);
  let ok = 0;
  for(const linea of lineas){
    const partes = linea.split(',');
    const numero = partes[0].trim();
    const desc = partes.slice(1).join(',').trim();
    if(!numero) continue;
    try{
      await sbFetch('refacciones?on_conflict=numero_parte', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body: JSON.stringify({ numero_parte:numero, descripcion:desc, ultima_vez:ahoraISO() })
      });
      ok++;
    }catch(e){ console.warn(e); }
  }
  showToast(`✓ ${ok} número(s) de parte guardados`);
  cargarCatalogoPartes();
}

async function exportarCatalogoPartes(){
  const refs = await listRefacciones();
  const filas = [['No. de Parte','Descripcion','Veces usada','Ultima vez']];
  refs.forEach(r=>filas.push([r.numero_parte, r.descripcion||'', r.veces_usada||0, r.ultima_vez?new Date(r.ultima_vez).toLocaleDateString('es-MX'):'']));
  descargarCSV('catalogo-refacciones-'+todayISO()+'.csv', filas);
}

  const nuevo = JSON.parse(JSON.stringify(STATE.turnosCfg || DEFAULT_TURNOS));
  Object.keys(nuevo).forEach(k=>{

    if(i) nuevo[k].inicio = i.value;
    if(f) nuevo[k].fin = f.value;
  });
  STATE.turnosCfg = nuevo;
  await saveTurnosConfig(nuevo);
  showToast('Horarios actualizados ✓');
}

async function guardarCodigos(){
  const nuevos = {};
  let vacios = [];
  Object.keys(ROLES).forEach(k=>{
    const el = document.getElementById('code_'+k);
    if(el){
      const val = el.value.trim();
      if(!val){ vacios.push(ROLES[k].label); nuevos[k] = DEFAULT_CODES[k] || ''; }
      else nuevos[k] = val;
    }
  });
  if(vacios.length){ showToast('⚠️ Se usó el código por defecto para: ' + vacios.join(', ')); }
  STATE.codes = nuevos;
  await saveConfig(nuevos);
  showToast('Códigos actualizados ✓');
}
function renderPlantaListEditor(planta){
  const arr = STATE.plantasCfgDraft[planta] || [];
  const key = slug(planta);
  return arr.map((u,i)=>`
    <div class="ubt-row" data-idx="${i}">
      <input class="ubt-row-input" data-planta="${escapeHtml(planta)}" data-idx="${i}" value="${escapeHtml(u)}">
      <button type="button" onclick="moverUbtPlanta('${planta.replace(/'/g,"\\'")}',${i},-1)">↑</button>
      <button type="button" onclick="moverUbtPlanta('${planta.replace(/'/g,"\\'")}',${i},1)">↓</button>
      <button type="button" onclick="quitarUbtPlanta('${planta.replace(/'/g,"\\'")}',${i})">✕</button>
    </div>`).join('') || '<div style="font-size:12px;color:var(--muted);">Sin UBTs todavía.</div>';
}
function syncPlantaFromDOM(planta){
  const key = slug(planta);
  const inputs = document.querySelectorAll(`#plantalist_${key} .ubt-row-input`);
  STATE.plantasCfgDraft[planta] = [...inputs].map(i=>i.value.trim());
}
function refrescarPlantaEditor(planta){
  document.getElementById('plantalist_'+slug(planta)).innerHTML = renderPlantaListEditor(planta);
}
function agregarUbtPlanta(planta){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].push('');
  refrescarPlantaEditor(planta);
}
function quitarUbtPlanta(planta, idx){
  syncPlantaFromDOM(planta);
  STATE.plantasCfgDraft[planta].splice(idx,1);
  refrescarPlantaEditor(planta);
}
function moverUbtPlanta(planta, idx, dir){
  syncPlantaFromDOM(planta);
  const arr = STATE.plantasCfgDraft[planta];
  const j = idx+dir;
  if(j<0 || j>=arr.length) return;
  [arr[idx],arr[j]] = [arr[j],arr[idx]];
  refrescarPlantaEditor(planta);
}
/* Agrega las bahías principales que falten, respetando lo que ya está cargado */
async function completarBahias(){
  const rangos = { "Planta 1":[501,520], "Planta 2":[601,612], "Planta 3":[701,712] };
  const cfg = JSON.parse(JSON.stringify(STATE.plantasCfg));
  const agregadas = [];
  Object.entries(rangos).forEach(([planta,[ini,fin]])=>{
    cfg[planta] = cfg[planta] || [];
    for(let n=ini; n<=fin; n++){
      /* Si esa bahía no tiene ninguna línea todavía, se crea la principal */
      const existe = cfg[planta].some(u => bahiaDeUbt(u) === String(n));
      if(!existe){ cfg[planta].push(n + '-1'); agregadas.push(planta + ' ' + n + '-1'); }
    }
    cfg[planta].sort((a,b)=> a.localeCompare(b, 'es', {numeric:true}));
  });
  if(agregadas.length === 0){ showToast('Ya están todas las bahías ✓'); return; }
  if(!confirm(`Se van a agregar ${agregadas.length} línea(s):\n\n${agregadas.join('\n')}\n\n¿Continuar?`)) return;
  STATE.plantasCfg = cfg;
  STATE.plantasCfgDraft = JSON.parse(JSON.stringify(cfg));
  await savePlantasConfig(cfg);
  showToast(`✓ ${agregadas.length} línea(s) agregadas`);
  render();
}

function cajaQR(contenedor, url, titulo, subtitulo, color){
  const box = document.createElement('div');
  box.className = 'qr-box';
  if(color) box.style.borderTop = '4px solid ' + color;
  const qrDiv = document.createElement('div');
  box.appendChild(qrDiv);
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `${titulo}${subtitulo?`<br><span style="font-weight:400;font-size:10.5px;color:#6b7280;">${subtitulo}</span>`:''}`;
  box.appendChild(label);
  const btn = document.createElement('button');
  btn.className = 'btn ghost small';
  btn.style.marginTop = '6px';
  btn.textContent = '🖨️ Imprimir';
  btn.onclick = () => imprimirQR(qrDiv, titulo, subtitulo);
  box.appendChild(btn);
  contenedor.appendChild(box);
  new QRCode(qrDiv, { text: url, width: 150, height: 150 });
}

function imprimirQR(qrDiv, titulo, subtitulo){
  const img = qrDiv.querySelector('img') || qrDiv.querySelector('canvas');
  let src = '';
  if(img && img.tagName === 'IMG') src = img.src;
  else if(img) src = img.toDataURL();
  const v = window.open('', '_blank', 'width=500,height=650');
  if(!v){ showToast('⚠️ Permite ventanas emergentes'); return; }
  v.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>
    <style>
      @page{margin:10mm;}
      body{font-family:Arial,sans-serif;margin:0;padding:0;}
      .etiqueta{width:1.6in;text-align:center;padding:2mm;box-sizing:border-box;}
      .etiqueta .t{font-size:8pt;font-weight:bold;line-height:1.1;margin-bottom:1mm;}
      .etiqueta .s{font-size:6.5pt;color:#555;margin-bottom:1mm;}
      .etiqueta img{width:1in;height:1in;display:block;margin:0 auto;}
      .etiqueta .p{font-size:5.5pt;color:#666;margin-top:1mm;}
    </style></head><body>
    <div class="etiqueta">
      <div class="t">${titulo}</div>
      <div class="s">${subtitulo||''}</div>
      <img src="${src}">
      <div class="p">Escanea con la cámara</div>
    </div></body></html>`);
  v.document.close(); v.focus();
  setTimeout(()=>v.print(), 500);
}

/* Imprime en hoja todos los QR generados, en etiquetas de 1x1 pulgada separadas 5mm */
function imprimirTodosQR(contenedorId, tituloDoc){
  const cont = document.getElementById(contenedorId);
  if(!cont){ return; }
  const cajas = [...cont.querySelectorAll('.qr-box')];
  if(cajas.length === 0){ showToast('⚠️ Genera los QR primero'); return; }

  const etiquetas = cajas.map(box=>{
    const img = box.querySelector('img') || box.querySelector('canvas');
    let src = '';
    if(img && img.tagName === 'IMG') src = img.src;
    else if(img) src = img.toDataURL();
    const label = box.querySelector('.label');
    const titulo = label ? (label.childNodes[0]?.textContent || '').trim() : '';
    const sub = label ? (label.querySelector('span')?.textContent || '') : '';
    return `<div class="etiqueta">
      <div class="t">${titulo}</div>
      <div class="s">${sub}</div>
      <img src="${src}">
    </div>`;
  }).join('');

  const v = window.open('', '_blank', 'width=900,height=800');
  if(!v){ showToast('⚠️ Permite ventanas emergentes'); return; }
  v.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${tituloDoc}</title>
    <style>
      @page{size:letter portrait;margin:10mm;}
      body{font-family:Arial,sans-serif;margin:0;padding:0;
        display:flex;flex-wrap:wrap;gap:5mm;align-content:flex-start;}
      .etiqueta{width:1.25in;text-align:center;box-sizing:border-box;
        page-break-inside:avoid;break-inside:avoid;}
      .etiqueta .t{font-size:7.5pt;font-weight:bold;line-height:1.1;}
      .etiqueta .s{font-size:6pt;color:#555;margin-bottom:1mm;}
      .etiqueta img{width:1in;height:1in;display:block;margin:0 auto;}
    </style></head><body>${etiquetas}</body></html>`);
  v.document.close(); v.focus();
  setTimeout(()=>v.print(), 600);
}

async function importarRespaldo(input){
  const archivo = input.files && input.files[0];
  if(!archivo) return;
  if(!confirm('¿Importar este respaldo?\n\nLas hojas y usuarios del archivo se agregarán o sobrescribirán los actuales con la misma clave.')){
    input.value=''; return;
  }
  showToast('Leyendo respaldo...');
  try{
    const texto = await archivo.text();
    const data = JSON.parse(texto);
    let hojasOk=0, usuariosOk=0;

    for(const h of (data.hojas||[])){
      try{ await saveSheet(h.key, h); hojasOk++; }catch(e){ console.warn(e); }
    }
    for(const u of (data.usuarios||[])){
      try{ await saveUsuario(u); usuariosOk++; }catch(e){ console.warn(e); }
    }
    if(data.plantas){
      try{ await savePlantasConfig(data.plantas); STATE.plantasCfg = data.plantas; }catch(e){}
    }
    showToast(`✓ Importado: ${hojasOk} hoja(s), ${usuariosOk} usuario(s)`);
    render();
  }catch(err){
    showToast('⚠️ Archivo inválido: ' + (err.message||err));
  }
  input.value='';
}

/* ---------- Borrado selectivo de correctivos ---------- */
async function borrarSeleccionCorrectivos(){
  const alcance = document.getElementById('bs_alcance').value;
  const planta = document.getElementById('bs_planta').value;
  const ubt = document.getElementById('bs_ubt').value;
  const maquina = document.getElementById('bs_maquina').value;
  const btn = document.getElementById('bs_btn');

  const todas = await listSheets();
  let objetivo = [];
  let desc = '';
  if(alcance === 'planta'){
    objetivo = todas.filter(s=>s.planta===planta);
    desc = `todos los correctivos de ${planta}`;
  } else if(alcance === 'ubt'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
    desc = `los correctivos de UBT ${ubt} (${planta})`;
  } else if(alcance === 'maquina'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt && s.maquina===maquina);
    desc = `los correctivos de ${maquina} en UBT ${ubt} (${planta})`;
  }

  if(objetivo.length === 0){ showToast('No hay hojas que coincidan'); return; }

  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = `⚠️ Toca de nuevo para borrar ${objetivo.length} hoja(s) — ${desc}`;
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑️ Borrar la selección'; }, 6000);
    return;
  }

  btn.textContent = 'Borrando...';
  let ok=0;
  for(const s of objetivo){
    try{
      await sbFetch('hojas?clave=eq.'+encodeURIComponent(s.key), { method:'DELETE', prefer:'return=minimal' });
      ok++;
    }catch(e){ console.warn(e); }
  }
  colaImpresion = [];
  btn.dataset.confirm='';
  showToast(`✓ ${ok} hoja(s) borradas — ${desc}`);
  render();
}

/* ---------- Limpieza de datos de prueba ---------- */
async function limpiarDatosPrueba(){
  const conf = document.getElementById('lp_confirmar').value.trim().toUpperCase();
  if(conf !== 'BORRAR'){ showToast('⚠️ Escribe BORRAR para confirmar'); return; }

  const tareas = [];
  if(document.getElementById('lp_hojas').checked)       tareas.push(['hojas',        'Hojas de correctivo']);
  if(document.getElementById('lp_tpm').checked)         tareas.push(['tpm_registros','Registros de TPM']);
  if(document.getElementById('lp_solicitudes').checked) tareas.push(['solicitudes',  'Solicitudes']);
  if(document.getElementById('lp_reportes').checked)    tareas.push(['reportes',     'Reportes al supervisor']);
  if(document.getElementById('lp_usuarios').checked)    tareas.push(['usuarios',     'Usuarios']);
  const borrarFirmasTpm = document.getElementById('lp_tpm').checked;

  if(tareas.length === 0 && !borrarFirmasTpm){ showToast('⚠️ No elegiste nada'); return; }
  if(!confirm('Se va a borrar:\n\n' + tareas.map(t=>'• '+t[1]).join('\n') + '\n\n¿Seguro? No se puede deshacer.')) return;

  const salida = document.getElementById('lp_resultado');
  if(salida) salida.innerHTML = 'Borrando...';
  const hechos = [];

  for(const [tabla, etiqueta] of tareas){
    try{
      /* El filtro "distinto de imposible" hace que aplique a todos los renglones */
      await sbFetch(tabla + '?id=not.is.null', { method:'DELETE', prefer:'return=minimal' });
      hechos.push('✅ ' + etiqueta);
    }catch(err){
      /* Algunas tablas usan otra llave primaria */
      try{
        const alterno = (tabla==='usuarios') ? 'nombre' : (tabla==='hojas' ? 'clave' : (tabla==='refacciones' ? 'numero_parte' : 'id'));
        await sbFetch(tabla + '?' + alterno + '=not.is.null', { method:'DELETE', prefer:'return=minimal' });
        hechos.push('✅ ' + etiqueta);
      }catch(e2){
        hechos.push('⚠️ ' + etiqueta + ': ' + (e2.message||e2));
      }
    }
  }

  /* Las firmas y comentarios del TPM viven en la tabla config */
  if(borrarFirmasTpm){
    try{
      await sbFetch('config?clave=like.tpmfirma:*', { method:'DELETE', prefer:'return=minimal' });
      hechos.push('✅ Firmas y comentarios de TPM');
    }catch(err){ hechos.push('⚠️ Firmas de TPM: ' + (err.message||err)); }
  }

  document.getElementById('lp_confirmar').value = '';
  if(salida) salida.innerHTML = hechos.join('<br>');
  cacheAnalisis = null; cacheHojasFallas = null;
  showToast('Limpieza terminada');
}

/* Primera letra en mayúscula automáticamente */
document.addEventListener('input', e => {
  const t = e.target;
  if(!(t instanceof HTMLInputElement) && !(t instanceof HTMLTextAreaElement)) return;
  if(t.type === 'password' || t.type === 'number' || t.type === 'date' || t.type === 'time') return;
  if(t.dataset.noCap === '1') return;
  const v = t.value;
  if(v.length > 0 && v[0] !== v[0].toUpperCase()){
    const pos = t.selectionStart;
    t.value = v[0].toUpperCase() + v.slice(1);
    try{ t.setSelectionRange(pos, pos); }catch(e){}
  }
});

function limpiarAutorelleno(ids, permitidos){
  ids.forEach((id,i)=>{
    const el = document.getElementById(id);
    if(!el) return;
    const esperado = permitidos ? (permitidos[i]||'') : '';
    if(el.value !== esperado && /^\d{5,}$/.test(el.value)) el.value = esperado;
  });

function iniciarVigilanciaJornada(){
  if(intervaloJornada) clearInterval(intervaloJornada);
  if(STATE.modoPruebas) return;
  if(!STATE.usuario?.turno || STATE.rol==='supervisor' || STATE.rol==='admin') return;
  revisarJornada();
  intervaloJornada = setInterval(revisarJornada, 60000);
}

function revisarJornada(){
  if(!STATE.usuario?.turno) return;
  const restan = minutosParaFinJornada(STATE.usuario);
  const banner = document.getElementById('banner_jornada');
  if(!banner) return;

  if(restan === null){ banner.style.display='none'; return; }

  if(restan <= 0){
    banner.style.display = 'block';
    banner.style.background = '#fde8e8';
    banner.style.borderLeft = '5px solid #a13636';
    banner.innerHTML = `<b style="color:#a13636;">🔴 Tu turno finalizó</b>
      <div style="font-size:12.5px;margin:6px 0 8px;">Dejarás de recibir notificaciones. Si vas a quedarte en tiempo extra, selecciónalo:</div>
      ${botonesExtra()}`;
  } else if(restan <= 20){
    banner.style.display = 'block';
    banner.style.background = '#fff7e6';

/* ---------- Validación de tiempos ---------- */
function validarTiempos(){
  const fEl=document.getElementById('f_fecha'), hiEl=document.getElementById('f_hi'), hfEl=document.getElementById('f_hf');
  const aviso=document.getElementById('aviso_tiempo');
  if(!fEl||!hiEl||!hfEl||!aviso) return true;

  const hoy = todayISO();
  const ahora = new Date();
  const horaAhora = String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0');

  const mostrar=(txt,tipo)=>{
    aviso.style.display='block';
    aviso.innerHTML=txt;
    aviso.style.background = tipo==='error' ? '#fde8e8' : '#fff7e6';
    aviso.style.color = tipo==='error' ? '#a13636' : '#8a6d1f';
    aviso.style.borderLeft = '4px solid ' + (tipo==='error' ? '#a13636' : '#e0b400');
  };

  if(fEl.value > hoy){ fEl.value = hoy; mostrar('⚠️ No se pueden registrar fechas futuras. Se ajustó a hoy.','error'); return false; }

  /* Si es hoy, avisar (sin modificar) cuando la hora es futura */
  let hayFutura = false;
  if(fEl.value === hoy){
    if(hiEl.value && hiEl.value > horaAhora) hayFutura = true;
    if(hfEl.value && hfEl.value > horaAhora) hayFutura = true;
  }
  if(hayFutura) mostrar('⚠️ Estás registrando una hora futura. Verifica que sea correcta.','warn');

  const tEl = document.getElementById('f_turno');
  if(tEl && hiEl.value && !tEl.dataset.manual) tEl.value = turnoDeHora(hiEl.value);

  if(hiEl.value && hfEl.value){
    const min = minutosEntre(hiEl.value, hfEl.value);
    if(min === 0){ mostrar('⚠️ La hora final debe ser distinta a la de inicio.','error'); return false; }
    if(min > 480){ mostrar(`⏱️ Duración registrada: <b>${formatoDuracion(min)}</b>. Es bastante larga — verifica que sea correcta.`,'warn'); return true; }
    mostrar(`⏱️ Tiempo muerto: <b>${formatoDuracion(min)}</b>`,'warn');
    return true;
  }
  aviso.style.display='none';
  return true;
}

/* ---------- Fallas similares (detección de recurrencia) ---------- */
let cacheHojasFallas = null;
let tempFallas = null;
/* Espera a que el técnico deje de escribir (medio segundo) antes de buscar */
function buscarFallasSimilaresPronto(){
  clearTimeout(tempFallas);
  tempFallas = setTimeout(buscarFallasSimilares, 500);
}
async function buscarFallasSimilares(){
  const txtEl = document.getElementById('f_sintomas');
  const cont = document.getElementById('fallas_similares');
  if(!txtEl || !cont) return;
  const txt = txtEl.value.trim().toLowerCase();
  if(txt.length < 5){ cont.style.display='none'; return; }

  if(!cacheHojasFallas) cacheHojasFallas = await listSheets();
  /* Se usan los datos de la hoja abierta: no hace falta pedirla otra vez al servidor */
  const p = sheetActivaParams;
  if(!p) return;

  const palabras = txt.split(/\s+/).filter(w=>w.length>3);
  if(palabras.length === 0){ cont.style.display='none'; return; }
  const coincidencias = [];
  cacheHojasFallas
    .filter(h => h.planta===p.planta && h.ubtNo===p.ubt && h.maquina===p.maquina)
    .forEach(h => (h.filas||[]).forEach(f=>{
      const sint = (f.sintomas||'').toLowerCase();
      const aciertos = palabras.filter(w=>sint.includes(w)).length;
      if(aciertos >= 1 && aciertos/palabras.length >= 0.4) coincidencias.push({...f, mes:h.mes, anio:h.anio, aciertos});
    }));

  if(coincidencias.length === 0){ cont.style.display='none'; return; }
  coincidencias.sort((a,b)=>b.aciertos-a.aciertos);
  const top = coincidencias.slice(0,4);
  cont.style.display='block';
  cont.innerHTML = `<b>🔁 Falla recurrente detectada</b> — esta máquina ya tuvo ${coincidencias.length} falla(s) parecida(s):<br>` +
    top.map(f=>`• <b>${f.fecha||''}</b>: ${escapeHtml((f.sintomas||'').slice(0,90))}${(f.sintomas||'').length>90?'…':''}<br><span style="color:#6b7280;">→ ${escapeHtml((f.acciones||'—').slice(0,90))}</span>`).join('<br>') +
    `<br><span style="color:#8a6d1f;">Considera revisar la causa raíz, no solo el síntoma.</span>`;
}

function iniciarCanvasFirma(){
  firmaCanvas = document.getElementById('firma_canvas');
  if(!firmaCanvas) return;
  firmaCtx = firmaCanvas.getContext('2d');
  firmaCtx.lineWidth = 2.5; firmaCtx.lineCap = 'round'; firmaCtx.strokeStyle = '#111';

  const pos = e => {
    const r = firmaCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(firmaCanvas.width/r.width), y:(p.clientY-r.top)*(firmaCanvas.height/r.height) };
  };
  const empezar = e => { e.preventDefault(); dibujando=true; const {x,y}=pos(e); firmaCtx.beginPath(); firmaCtx.moveTo(x,y); };
  const mover = e => { if(!dibujando) return; e.preventDefault(); const {x,y}=pos(e); firmaCtx.lineTo(x,y); firmaCtx.stroke(); };
  const parar = () => { dibujando=false; };

  ['mousedown','touchstart'].forEach(ev=>firmaCanvas.addEventListener(ev, empezar));
  ['mousemove','touchmove'].forEach(ev=>firmaCanvas.addEventListener(ev, mover));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>firmaCanvas.addEventListener(ev, parar));
}

function limpiarFirma(){ if(firmaCtx && firmaCanvas) firmaCtx.clearRect(0,0,firmaCanvas.width,firmaCanvas.height); }

async function guardarFirma(){
  if(!firmaCanvas){ showToast('⚠️ No se encontró el área de firma'); return; }
  const vacio = document.createElement('canvas');

  STATE.usuario.firma = firmaCanvas.toDataURL('image/png');
  try{ await saveUsuario(STATE.usuario); showToast('✍️ Firma guardada ✓'); render(); }

    <button class="btn secondary" style="margin-top:8px;" onclick="exportarCSV('reportes')">📢 Reportes al supervisor</button>
  </div>`;
}

function todasLasFilas(){
  const out = [];
  (cacheAnalisis||[]).forEach(h => (h.filas||[]).forEach(f => {
    const min = (typeof f.minutosParo === 'number' && f.minutosParo > 0)
      ? f.minutosParo
      : minutosEntre(f.horaInicio, f.horaFinal);
    out.push({...f, minutosParo: min, planta:h.planta, ubtNo:h.ubtNo, maquina:h.maquina, mes:h.mes, anio:h.anio});
  }));
  return out;
}
