<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* ---------- Configuración fija ---------- */
const MAQ_COR = ["Prueba Eléctrica","Pre-Eléctrica","Dimensiones","Sistema de Navegación","Encintadoras","Rotary","Impresoras","Tableros de Clip","Canaleta","Torques","Mesa de Amarre","Expansor de Grommet"];
const checklistGroups = [
  ["Prueba Eléctrica","Pre-Eléctrica","Sistema de Navegación"],
  ["Encintadoras","Rotary","Impresoras"],
  ["Dimensiones","Tableros de Clip","Canaleta"],
  ["Torques","Mesa de Amarre","Expansor de Grommet"],
  ["Otros"]
];
const MESES = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];
const MAX_FILAS_POR_HOJA = 7;

const PLANTA_NOMBRES = ["Planta 1","Planta 2","Planta 3","Partes de Servicio"];
const DEFAULT_PLANTAS = {
  "Planta 1": ["501-1","501-2","502-1","502-2","503-1","503-2","504-1","505-1","506-1","507-1","508-1"],
  "Planta 2": ["601-1","601-2","602-1","602-2","602-3","603-1","603-2","604-1","604-2","604-3","605-1","605-1.0","605-1.1","605-1.2","606-1","606-1B","606-2","606-3","606-4","607-1","607-2","607-3","608-1","608-2","608-3","609-1","609-2","609-4","609-5","611-1","611-2","611-3","612-1","612-2","612-3"],
  "Planta 3": ["701-1","701-2","702-1","702-2","702-3","703-1"],
  "Partes de Servicio": ["520"]
};

const ROLES = {
  tecnico:   {label:"Técnico de Mantenimiento", emoji:"🔧"},
  auditor:   {label:"Auditor de Calidad", emoji:"🧾"},
  apqp:      {label:"APQP", emoji:"✅"},
  supervisor:{label:"Supervisor de Mantenimiento", emoji:"👁️"},
  admin:     {label:"Administrador", emoji:"⚙️"},
};
const DEFAULT_TURNOS = {
  TA: { nombre:'Turno A', inicio:'06:00', fin:'14:50',
        extras:[ {etiqueta:'14:50 a 17:00', inicio:'14:50', fin:'17:00'},
                 {etiqueta:'14:50 a 18:00', inicio:'14:50', fin:'18:00'} ] },
  TB: { nombre:'Turno B', inicio:'14:50', fin:'23:15',
        extras:[ {etiqueta:'11:15 a 23:15 (entrada anticipada)', inicio:'11:15', fin:'23:15'},
                 {etiqueta:'16:00 a 23:15', inicio:'16:00', fin:'23:15'},
                 {etiqueta:'18:00 a 06:00', inicio:'18:00', fin:'06:00'} ] },
  TC: { nombre:'Turno C', inicio:'23:15', fin:'06:00',
        extras:[ {etiqueta:'18:00 a 06:00', inicio:'18:00', fin:'06:00'} ] }
};

function minDelDia(hhmm){ const [h,m]=(hhmm||'00:00').split(':').map(Number); return h*60+m; }
function ahoraMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }

/* ¿La hora está dentro del rango? Soporta rangos que cruzan medianoche */
function dentroDeRango(minAhora, inicio, fin){
  const i = minDelDia(inicio), f = minDelDia(fin);
  return (i <= f) ? (minAhora >= i && minAhora < f) : (minAhora >= i || minAhora < f);
}

/* Detecta el turno según una hora dada */
function turnoDeHora(hhmm){
  const m = minDelDia(hhmm);
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  for(const [k,t] of Object.entries(T)){
    if(dentroDeRango(m, t.inicio, t.fin)) return k;
  }
  return 'TA';
}

/* ¿El usuario está dentro de su jornada ahora mismo? */
function enJornada(usuario){
  if(!usuario || !usuario.turno) return true;
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario.turno];
  if(!t) return true;
  const m = ahoraMin();
  if(dentroDeRango(m, t.inicio, t.fin)) return true;
  /* Jornada extendida vigente */
  if(usuario.extraInicio && usuario.extraFin && dentroDeRango(m, usuario.extraInicio, usuario.extraFin)) return true;
  return false;
}

/* Minutos que faltan para que termine la jornada */
function minutosParaFinJornada(usuario){
  const T = STATE.turnosCfg || DEFAULT_TURNOS;
  const t = T[usuario?.turno];
  if(!t) return null;
  let fin = minDelDia(t.fin);
  if(usuario.extraFin && dentroDeRango(ahoraMin(), usuario.extraInicio||t.inicio, usuario.extraFin)) fin = minDelDia(usuario.extraFin);
  let dif = fin - ahoraMin();
  if(dif < -720) dif += 1440;
  return dif;
}

const DEFAULT_CODES = { tecnico:"Mantto", auditor:"Calidad", apqp:"APQP", supervisor:"SupMantto", admin:"8102vgreal" };

function slug(s){ return (s||'').toString().toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,''); }
function uid(){ return 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowLabel(){ return new Date().toLocaleString('es-MX'); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function sheetKey(planta,ubt,maquina,mes,anio,pagina){ return `sheet:${slug(planta)}--${slug(ubt)}--${slug(maquina)}--${slug(mes)}--${slug(anio)}--p${pagina}`; }

/* ---------- Conexión a Supabase ---------- */
const SUPABASE_URL = 'https://pddugjlydcggotamstav.supabase.co';
const SUPABASE_KEY = 'sb_publishable_n0METrGffoJXnnbBPBJ1AA_pjIz69I9';

async function sbFetch(path, options={}){
  const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
    ...options,
    headers: {
      'apikey': SUPABASE_KEY,
      'Authorization': 'Bearer ' + SUPABASE_KEY,
      'Content-Type': 'application/json',
      'Prefer': options.prefer || 'return=representation',
      ...(options.headers||{})
    }
  });
  if(!res.ok){
    const txt = await res.text();
    throw new Error('Supabase ' + res.status + ': ' + txt);
  }
  const txt = await res.text();
  return txt ? JSON.parse(txt) : null;
}

async function getConfig(){
  try{
    const r = await sbFetch('config?clave=eq.accesscodes&select=valor');
    return (r && r[0]) ? r[0].valor : { ...DEFAULT_CODES };
  }catch(e){ console.warn(e); return { ...DEFAULT_CODES }; }
}
async function saveConfig(cfg){
  await sbFetch('config?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'accesscodes', valor: cfg, actualizado_en: new Date().toISOString() })
  });
}
async function getModoPruebas(){
  try{
    const r = await sbFetch('config?clave=eq.modo_pruebas&select=valor');
    return (r && r[0]) ? !!r[0].valor.activo : false;
  }catch(e){ return false; }
}
async function saveModoPruebas(activo){
  await sbFetch('config?on_conflict=clave', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'modo_pruebas', valor:{activo:!!activo}, actualizado_en:new Date().toISOString() })
  });
}
async function getTurnosConfig(){
  try{
    const r = await sbFetch('config?clave=eq.turnos&select=valor');
    return (r && r[0]) ? r[0].valor : JSON.parse(JSON.stringify(DEFAULT_TURNOS));
  }catch(e){ return JSON.parse(JSON.stringify(DEFAULT_TURNOS)); }
}
async function saveTurnosConfig(cfg){
  await sbFetch('config?on_conflict=clave', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'turnos', valor: cfg, actualizado_en:new Date().toISOString() })
  });
}
async function getPlantasConfig(){
  try{
    const r = await sbFetch('config?clave=eq.plantas&select=valor');
    return (r && r[0]) ? r[0].valor : JSON.parse(JSON.stringify(DEFAULT_PLANTAS));
  }catch(e){ console.warn(e); return JSON.parse(JSON.stringify(DEFAULT_PLANTAS)); }
}
async function savePlantasConfig(cfg){
  await sbFetch('config?on_conflict=clave', {
    method: 'POST',
    prefer: 'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify({ clave:'plantas', valor: cfg, actualizado_en: new Date().toISOString() })
  });
}
function ubtsDeLaPlanta(plantasCfg, planta){
  if(planta==='Partes de Servicio'){
    const union = [...(plantasCfg["Planta 1"]||[]), ...(plantasCfg["Planta 2"]||[]), ...(plantasCfg["Planta 3"]||[]), ...(plantasCfg["Partes de Servicio"]||[])];
    return [...new Set(union)];
  }
  return plantasCfg[planta] || [];
}
function origenDeUbt(plantasCfg, ubt){
  if((plantasCfg["Planta 1"]||[]).includes(ubt)) return "Planta 1";
  if((plantasCfg["Planta 2"]||[]).includes(ubt)) return "Planta 2";
  if((plantasCfg["Planta 3"]||[]).includes(ubt)) return "Planta 3";
  return "Partes de Servicio";
}
function renderUbtColumnas(ubts){
  if(STATE.plantaHoy !== 'Partes de Servicio'){
    const clase = claseOrigen(STATE.plantaHoy);
    return `<div class="ubt-cols"><div class="ubt-col">
      ${ubts.map(u=>`<button class="ubt-btn ${clase}" onclick="elegirUbt('${u.replace(/'/g,"\\'")}')">${u}</button>`).join('')}
    </div></div>`;
  }
  const grupos = { 'Planta 1':[], 'Planta 2':[], 'Planta 3':[], 'Partes de Servicio':[] };
  ubts.forEach(u => grupos[origenDeUbt(STATE.plantasCfg,u)].push(u));
  return `<div class="ubt-cols">
    ${Object.entries(grupos).filter(([,arr])=>arr.length).map(([nombre,arr])=>`
      <div class="ubt-col">
        <div class="ubt-col-title">${nombre}</div>
        ${arr.map(u=>`<button class="ubt-btn ${claseOrigen(nombre)}" onclick="elegirUbt('${u.replace(/'/g,"\\'")}')">${u}</button>`).join('')}
      </div>`).join('')}
  </div>`;
}
function claseOrigen(nombre){
  return nombre==='Planta 1'?'p1':nombre==='Planta 2'?'p2':nombre==='Planta 3'?'p3':'p4';
}
function todasLasUbts(plantasCfg){
  const union = [];
  PLANTA_NOMBRES.forEach(p => union.push(...(plantasCfg[p]||[])));
  return [...new Set(union)];
}


/* Lee el campo ubts_por_planta soportando el formato viejo (plano) y el nuevo (con __ubts) */
function desempacarExtra(extra){
  const e = extra || {};
  if(Object.prototype.hasOwnProperty.call(e, '__ubts')){
    return { ubtsPorPlanta: e.__ubts || {}, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '' };
  }
  const limpio = { ...e };
  delete limpio.__bloqueado; delete limpio.__firma; delete limpio.__modoFirma; delete limpio.__turno; delete limpio.__extraInicio; delete limpio.__extraFin;
  return { ubtsPorPlanta: limpio, bloqueado: !!e.__bloqueado, firma: e.__firma || '', modoFirma: e.__modoFirma || 'nombre', turno: e.__turno || '', extraInicio: e.__extraInicio || '', extraFin: e.__extraFin || '' };
}

async function getUsuario(nombre){
  try{
    const r = await sbFetch('usuarios?nombre_slug=eq.'+encodeURIComponent(slug(nombre))+'&select=*');

    const u = r[0];
    return { nombre: u.nombre, rol: u.rol, gafete: u.gafete, ...desempacarExtra(u.ubts_por_planta) };
  }catch(e){ console.warn(e); return null; }
}
async function saveUsuario(u){

      gafete: u.gafete, ubts_por_planta: { __ubts: u.ubtsPorPlanta || {}, __bloqueado: !!u.bloqueado, __firma: u.firma || '', __modoFirma: u.modoFirma || 'nombre', __turno: u.turno || '', __extraInicio: u.extraInicio || '', __extraFin: u.extraFin || '' }

}
async function deleteUsuario(nombre){

}
function getParams(){

async function render(){
  const app = document.getElementById('app');

    return;
  }

  if(!STATE.rol){
    document.body.classList.add('login-bg');

    if(STATE.vista === 'analisis'){

    }
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderAdmin()}</div>`;
    setTimeout(()=>{ cargarInfoHistorial(); actualizarUbtsQR(); actualizarUbtsBorrado(); cambiarAlcanceBorrado(); cargarCatalogoPartes(); }, 50);
    return;
  }

  if(STATE.nombre && !STATE.usuario){
    STATE.usuario = await getUsuario(STATE.nombre);
    if(STATE.usuario && STATE.usuario.bloqueado){
      app.innerHTML = `<div class="wrap"><div class="card" style="text-align:center;">
        <h2 style="justify-content:center;">🚫 Acceso bloqueado</h2>
        <p style="font-size:14px;color:var(--muted);">Tu usuario fue bloqueado por el administrador.<br>Contacta a tu supervisor si crees que es un error.</p>
        <button class="btn ghost" onclick="cambiarRol()">Volver al inicio</button>
      </div></div>`;
      return;
    }

      activarNotificaciones(true);

  if(STATE.nombre && !STATE.usuario){
    app.innerHTML = renderTopbar() + renderGafeteSetup();
    return;
  }

  if(STATE.viendoTodo){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderVerCorrectivos()}</div>`;
    setTimeout(()=>{ limpiarAutorelleno(['vt_filtro_ubt'], [ubtEsperado()]); filtrarVerTodo(); }, 60);
    return;
  }

  if(STATE.vista === 'analisis' && ['tecnico','supervisor','admin'].includes(STATE.rol)){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderAnalisis()}</div>`;
    setTimeout(()=>{ calcularTiempoMuerto(); calcularFallasFrecuentes(); cargarRefaccionesAnalisis(); }, 50);
    return;
  }
  if(STATE.vista === 'reportar' && STATE.rol==='tecnico'){
    if(!STATE.plantaHoy){
      app.innerHTML = renderTopbar() + `<div class="wrap"><div class="card">
        <h2>📢 Reportar al Supervisor</h2>
        <p style="font-size:13.5px;">Primero elige en qué planta estás trabajando.</p>
        <div class="planta-grid">${PLANTA_NOMBRES.map(p=>`<div class="planta-card" onclick="elegirPlantaHoy('${p.replace(/'/g,"\\'")}')">${p}</div>`).join('')}</div>
      </div></div>`;
      return;
    }
    app.innerHTML = renderTopbar() + `<div class="wrap">${renderReportarFalla()}</div>`;
    setTimeout(()=>{ cargarMisReportes(); cargarListaPartesRp(); }, 50);
    return;
  }
  if(STATE.vista === 'firma' && STATE.usuario){
    app.innerHTML = renderTopbar() + `<div class="wrap">${renderRegistroFirma()}</div>`;
    setTimeout(iniciarCanvasFirma, 60);
    return;
  }
  if(STATE.vista === 'buzon' && STATE.rol==='supervisor'){
    app.innerHTML = renderTopbar() + `<div class="wrap">${await renderBuzonSupervisor()}</div>`;
    return;
  }

  const rolesConPlanta = ['tecnico','auditor','apqp'];
  if(rolesConPlanta.includes(STATE.rol) && !STATE.plantaHoy){
    app.innerHTML = renderTopbar() + renderPlantaPicker();
    return;
  }

    if(asignadas.length===0 || STATE.editandoUbts){
      app.innerHTML = renderTopbar() + renderUbtsPlantaSetup();

    }
  }

    if(STATE.rol==='tecnico') body = await renderTecnico();

function guardarBorradorRegistro(){
  const ids = ['f_fecha','f_hi','f_hf','f_gafete','f_sintomas','f_acciones','f_material','f_parte','f_parte_desc','f_turno'];
  const chk = ['f_movio','f_verifico','f_solicitar_apqp','f_extra'];
  const b = {};
  let hayAlgo = false;
  ids.forEach(id=>{ const el=document.getElementById(id); if(el){ b[id]=el.value; if(['f_sintomas','f_acciones','f_material'].includes(id) && el.value.trim()) hayAlgo=true; } });
  chk.forEach(id=>{ const el=document.getElementById(id); if(el) b[id]=el.checked; });
  if(hayAlgo){ b.__foto = fotoTemp || ''; STATE.borradorRegistro = b; }
}
function restaurarBorradorRegistro(){
  const b = STATE.borradorRegistro;
  if(!b) return;
  Object.entries(b).forEach(([id,val])=>{
    if(id.startsWith('__')) return;
    const el = document.getElementById(id);
    if(!el) return;
    if(el.type === 'checkbox') el.checked = !!val; else el.value = val;
  });
  if(b.__foto){
    fotoTemp = b.__foto;
    const c = document.getElementById('prev_foto');
    if(c) c.innerHTML = `<img src="${b.__foto}" style="max-width:200px;border-radius:8px;border:1px solid #ddd;">
      <button class="btn ghost small" style="margin-left:8px;" onclick="quitarFoto('f_foto','prev_foto')">✖ Quitar</button>`;
  }
  validarTiempos();
  showToast('✓ Se recuperó lo que tenías escrito');
  STATE.borradorRegistro = null;
}

function abrirVista(v){
  if(v==='reportar' && document.getElementById('f_sintomas')) guardarBorradorRegistro();
  STATE.vista = (STATE.vista===v) ? null : v;
  STATE.viendoTodo=false;
  render();
}

/* ---------- Cola de impresión por UBT ---------- */
let colaImpresion = [];

function enCola(key){ return colaImpresion.some(s=>s.key===key); }

async function toggleCola(key){
  if(enCola(key)){
    colaImpresion = colaImpresion.filter(s=>s.key!==key);
    showToast('Quitado de la cola');
  } else {
    const sheet = await getSheet(key);
    if(sheet){ sheet.key = key; colaImpresion.push(sheet); showToast('➕ Agregado a la cola ('+colaImpresion.length+')'); }
  }
  render();
}

async function agregarUbtACola(planta, ubt){
  const todas = await listSheets();
  const delUbt = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
  let nuevos = 0;
  delUbt.forEach(s=>{ if(!enCola(s.key)){ colaImpresion.push(s); nuevos++; } });
  showToast(nuevos>0 ? `➕ ${nuevos} hoja(s) de UBT ${ubt} agregadas` : 'Ya estaban todas en la cola');
  render();
}

function limpiarCola(){ colaImpresion = []; showToast('Cola vaciada'); render(); }

function imprimirCola(){
  if(colaImpresion.length===0){ showToast('⚠️ La cola está vacía'); return; }

  /* Nombre según el contenido de la cola */
  const ubts = [...new Set(colaImpresion.map(s=>s.ubtNo))];
  const maqs = [...new Set(colaImpresion.map(s=>s.maquina))];
  const p = colaImpresion[0];
  let titulo;
  if(ubts.length === 1 && maqs.length === 1){
    titulo = `Correctivo-${maqs[0]}-${ubts[0]}-${p.mes}-${p.anio}`;
  } else if(ubts.length === 1){
    titulo = `Correctivo-${ubts[0]}-${p.mes}-${p.anio}`;
  } else {
    titulo = `Correctivo-Varios UBT-${p.mes}-${p.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(s=>s.outerHTML).join('');
  const hojas = colaImpresion.map(s=>renderSheetVisual(s,{role:'lectura'})).join('<div style="page-break-after:always;"></div>');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana emergente'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>${estilos}
    <style>body{background:#fff;margin:0;padding:10px;} .no-print{display:none !important;}
    @page{size:letter landscape;margin:8mm;}
    table.sheet-table{min-width:0 !important;width:100% !important;}
    .sheet-page{border:none;page-break-inside:avoid;}</style></head><body>${hojas}</body></html>`);
  ventana.document.close(); ventana.focus();
  setTimeout(()=>ventana.print(), 500);
}

function renderBarraCola(){
  if(colaImpresion.length===0) return '';
  return `<div class="cola-bar no-print">
    <span>🖨️ <b>${colaImpresion.length}</b> hoja(s) en cola</span>
    <div>
      <button class="btn small secondary" onclick="imprimirCola()">Imprimir cola</button>
      <button class="btn small ghost" onclick="limpiarCola()">Vaciar</button>
    </div>
  </div>`;
}

async function entrarGuardado(){
  const g = JSON.parse(localStorage.getItem('correctivo_usuario_guardado') || 'null');
  if(!g) return;
  STATE.rol = g.rol; STATE.nombre = g.nombre;
  STATE.usuario = await getUsuario(g.nombre);

async function confirmarAcceso(){
  const nombre = document.getElementById('nombre_input').value.trim();
  const gafete = document.getElementById('gafete_login').value.trim();
  const turnoSel = document.getElementById('turno_login').value;
  const codigo = document.getElementById('codigo_input').value;
  const recordar = document.getElementById('recordar_chk').checked;
  const esSupervisor = rolSeleccionadoTemp === 'supervisor';

  if(!nombre){ document.getElementById('nombre_input').style.borderColor='red'; return; }
  if(!esSupervisor && !gafete){ document.getElementById('gafete_login').style.borderColor='red'; showToast('⚠️ Escribe tu No. de Gafete'); return; }
  if(codigo !== STATE.codes[rolSeleccionadoTemp]){ document.getElementById('codigo_error').style.display='block'; return; }

  STATE.rol = rolSeleccionadoTemp; STATE.nombre = nombre;

  const existente = await getUsuario(nombre);
  if(existente && existente.bloqueado){ STATE.usuario = existente; render(); return; }

  if(existente){
    /* Ya estaba registrado: conservamos sus UBTs y solo actualizamos lo básico */
    STATE.usuario = {
      ...existente,
      rol: STATE.rol,
      gafete: esSupervisor ? '—' : (gafete || existente.gafete),
      turno: turnoSel, extraInicio:'', extraFin:''
    };
  } else {
    STATE.usuario = { nombre, gafete: esSupervisor ? '—' : gafete, rol: STATE.rol, ubtsPorPlanta: {}, bloqueado:false, turno: turnoSel, extraInicio:'', extraFin:'' };
  }
  try{ await saveUsuario(STATE.usuario); }catch(err){ showToast('⚠️ '+(err.message||err)); return; }

  if(recordar){
    localStorage.setItem('correctivo_usuario_guardado', JSON.stringify({nombre, rol:STATE.rol, gafete: STATE.usuario.gafete, turno: turnoSel}));
  }
  await activarNotificaciones(true);
  render();
}

async function abrirPaginaAutomatica(planta,ubt,maquina,mes,anio){
  let pagina = 1;
  while(true){
    const key = sheetKey(planta,ubt,maquina,mes,anio,pagina);
    let sheet = await getSheet(key);
    if(!sheet){ sheet = { planta, ubtNo:ubt, maquina, mes, anio, pagina, filas: [] }; await saveSheet(key, sheet); }
    if((sheet.filas||[]).length < MAX_FILAS_POR_HOJA){
      sheetActivaKey = key;
      sheetActivaParams = {planta,ubt,maquina,mes,anio,pagina};
      return;
    }
    pagina++;
  }
}
async function abrirHoja(){
  const maquina = document.getElementById('s_maquina').value;
  const mes = document.getElementById('s_mes').value;
  const anio = document.getElementById('s_anio').value.trim();
  await abrirPaginaAutomatica(STATE.plantaHoy, STATE.ubtElegida, maquina, mes, anio);
  render();
}
async function siguientePagina(){
  const p = sheetActivaParams;
  await abrirPaginaAutomatica(p.planta,p.ubt,p.maquina,p.mes,p.anio);
  render();
}

async function agregarFila(){
  const sintomas = document.getElementById('f_sintomas').value.trim();
  if(!sintomas){ showToast('⚠️ Escribe los Síntomas/Fallas'); return; }
  const sheet = await getSheet(sheetActivaKey);
  if((sheet.filas||[]).length >= MAX_FILAS_POR_HOJA){ showToast('⚠️ Esta hoja ya está llena'); render(); return; }
  if(!validarTiempos()){ showToast('⚠️ Revisa las horas antes de guardar'); return; }
  const solicitarApqp = document.getElementById('f_solicitar_apqp').checked;
  const hi = document.getElementById('f_hi').value;
  const hf = document.getElementById('f_hf').value;
  const numeroParte = document.getElementById('f_parte').value.trim();
  const parteDesc = document.getElementById('f_parte_desc').value.trim();
  const fila = {
    id: uid(),
    fecha: document.getElementById('f_fecha').value,
    horaInicio: hi,
    horaFinal: hf,
    minutosParo: minutosEntre(hi, hf),
    turno: document.getElementById('f_turno').value,
    tiempoExtra: document.getElementById('f_extra').checked,
    registradoEn: new Date().toISOString(),
    numeroParte, parteDesc,
    foto: fotoTemp || '',
    gafete: document.getElementById('f_gafete').value.trim(),
    sintomas, acciones: document.getElementById('f_acciones').value.trim(),
    material: document.getElementById('f_material').value.trim(),
    seMovioModulo: document.getElementById('f_movio').checked,
    seVerificoModulo: document.getElementById('f_verifico').checked,
    tecnico: STATE.nombre,
    firmaTecnicoImg: (STATE.usuario?.modoFirma==='dibujo' && STATE.usuario?.firma) ? STATE.usuario.firma : '',
    firmaAuditorNombre:'', firmaAuditorFecha:'',
    firmaAPQPNombre:'', firmaAPQPFecha:'',
    estadoAuditor: 'pendiente',
    estadoAPQP: solicitarApqp ? 'pendiente' : 'no_aplica',
    creadoEn: new Date().toISOString()
  };
  sheet.filas.push(fila);
  try{ await saveSheet(sheetActivaKey, sheet); }
  catch(err){ showToast('⚠️ No se pudo guardar: ' + (err.message||String(err))); return; }
  if(numeroParte) registrarRefaccion(numeroParte, parteDesc);
  fotoTemp = null; cacheHojasFallas = null;

  /* Notificar al auditor de calidad asignado a este UBT */
  const auditores = await destinatariosPara('auditor', sheet.planta, sheet.ubtNo);
  enviarNotificacion(
    auditores,
    '🔧 Reparación pendiente de tu firma',
    `${STATE.nombre} realizó una reparación en UBT ${sheet.ubtNo} (${sheet.maquina}). Necesita tu firma como Auditor de Calidad.`
  );

  /* Si se solicitó APQP, notificar también al APQP asignado */
  if(solicitarApqp){
    const apqps = await destinatariosPara('apqp', sheet.planta, sheet.ubtNo);
    enviarNotificacion(
      apqps,
      '✅ Firma de APQP solicitada',
      `${STATE.nombre} solicitó tu firma en UBT ${sheet.ubtNo} (${sheet.maquina}).`
    );
  }

  showToast('Registro guardado y notificado ✓');
  /* Regresa a la ventana de todas las UBT de la planta */
  sheetActivaKey = null;
  STATE.ubtElegida = null;
  render();
}

function asignadosResumen(){
  const a = STATE.usuario?.ubtsPorPlanta || {};

function filtrarVerTodo(){

function renderAgrupadoPorPlantaUbtMaquina(sheets, viewerRole){
  const puedeImprimir = viewerRole==='tecnico' || viewerRole==='supervisor';
  const porPlanta = {};
  sheets.forEach(s=>{
    (porPlanta[s.planta||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'] ??= {});
    (porPlanta[s.planta||'—'][s.ubtNo||'—'][s.maquina||'—'] ??= []).push(s);
  });
  return Object.keys(porPlanta).sort().map(planta=>{
    const ubts = porPlanta[planta];
    const totalPlanta = Object.values(ubts).reduce((a,m)=>a+Object.values(m).reduce((b,arr)=>b+arr.length,0),0);
    return `<details style="margin-bottom:8px;">
      <summary style="cursor:pointer;font-weight:700;padding:8px 10px;background:#2f3742;color:#fff;border-radius:6px;">📍 ${escapeHtml(planta)} (${totalPlanta} hoja${totalPlanta!==1?'s':''})</summary>
      <div style="padding:10px 0 0 14px;">
        ${Object.keys(ubts).sort().map(ubt=>{
          const maquinas = ubts[ubt];
          const totalUbt = Object.values(maquinas).reduce((a,arr)=>a+arr.length,0);
          return `<details style="margin-bottom:6px;">
            <summary style="cursor:pointer;font-weight:600;padding:6px 10px;background:#eef1f4;border-radius:6px;">UBT ${escapeHtml(ubt)} (${totalUbt})</summary>
            ${puedeImprimir ? `<div style="padding:8px 0 0 14px;"><button class="btn small secondary no-print" onclick="agregarUbtACola('${planta.replace(/'/g,"\\'")}','${ubt.replace(/'/g,"\\'")}')">🖨️ Agregar todo el UBT ${escapeHtml(ubt)} a la cola</button></div>` : ''}
            <div style="padding:8px 0 0 14px;">
              ${Object.keys(maquinas).sort().map(maq=>`
                <details style="margin-bottom:6px;">
                  <summary style="cursor:pointer;font-size:13px;padding:5px 10px;background:#f7f8f9;border-radius:6px;">⚙️ ${escapeHtml(maq)} (${maquinas[maq].length})</summary>
                  <div style="padding-top:8px;">${maquinas[maq].map(s=> puedeImprimir ? renderSheetPrintWrap(s,{role:'lectura'}) : `<div class="sheet-print-wrap">${renderSheetVisual(s,{role:'lectura'})}</div>`).join('')}</div>
                </details>`).join('')}
            </div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

/* ---------- Imprimir una hoja individual ---------- */
function imprimirHoja(elId, sheetKey){
  const target = document.getElementById(elId);
  if(!target){ showToast('⚠️ No se encontró la hoja'); return; }
  const contenido = target.querySelector('.sheet-page');
  if(!contenido){ showToast('⚠️ No se encontró el formato'); return; }

  const s = colaImpresion.find(x=>x.key===sheetKey) || target.__sheet;
  let titulo = 'Correctivo';
  if(target.dataset.maquina){
    titulo = `Correctivo-${target.dataset.maquina}-${target.dataset.ubt}-${target.dataset.mes}-${target.dataset.anio}`;
  }

  const estilos = [...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');
  const ventana = window.open('', '_blank', 'width=1100,height=800');
  if(!ventana){ showToast('⚠️ El navegador bloqueó la ventana. Permite ventanas emergentes.'); return; }
  ventana.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>${titulo}</title>${estilos}
    <style>
      body{background:#fff;margin:0;padding:10px;}
      .no-print{display:none !important;}
      @page{size:letter landscape;margin:8mm;}
      table.sheet-table{min-width:0 !important;width:100% !important;}
      .sheet-page{border:none;}
    </style></head><body>${contenido.outerHTML}</body></html>`);
  ventana.document.close();
  ventana.focus();
  setTimeout(()=>{ ventana.print(); }, 400);
}
function renderSheetPrintWrap(sheet, opts){
  const wrapId = 'sw_' + sheet.key.replace(/[^a-z0-9]/gi,'');
  const yaEsta = enCola(sheet.key);
  return `<div class="sheet-print-wrap" id="${wrapId}"
      data-maquina="${escapeHtml(sheet.maquina)}" data-ubt="${escapeHtml(sheet.ubtNo)}"
      data-mes="${escapeHtml(sheet.mes)}" data-anio="${escapeHtml(sheet.anio)}">
    ${renderSheetVisual(sheet, opts)}
    <div class="no-print" style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn ghost small" onclick="imprimirHoja('${wrapId}','${sheet.key}')">🖨️ Imprimir esta hoja</button>
      <button class="btn ${yaEsta?'ghost':'secondary'} small" onclick="toggleCola('${sheet.key}')">${yaEsta?'✓ En cola (quitar)':'➕ Agregar a cola'}</button>

}

    filas.map(f=>{

  return `<div class="sheet-page">

async function toggleEditUsuario(uid, nombre){
  const btn = document.getElementById('au_editbtn_'+uid);
  const nombreEl = document.getElementById('au_nombre_'+uid);
  const rolEl = document.getElementById('au_rol_'+uid);
  const gafeteEl = document.getElementById('au_gafete_'+uid);
  const editing = btn.textContent.includes('Guardar');
  if(!editing){
    nombreEl.disabled = false; rolEl.disabled = false; gafeteEl.disabled = false;
    rolEl.style.display = 'inline-block';
    btn.textContent = '💾 Guardar';
  } else {
    const nuevoNombre = nombreEl.value.trim();
    const nuevoRol = rolEl.value;
    const nuevoGafete = gafeteEl.value.trim();
    const usuarioViejo = await getUsuario(nombre);
    const actualizado = { ...usuarioViejo, nombre: nuevoNombre, rol: nuevoRol, gafete: nuevoGafete };
    if(slug(nuevoNombre) !== slug(nombre)){
      await deleteUsuario(nombre);
    }
    await saveUsuario(actualizado);
    showToast('Usuario actualizado ✓');
    render();
  }
}

async function cargarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  const info = document.getElementById('cat_info');
  if(!ta) return;
  const refs = await listRefacciones();
  ta.value = refs.map(r=>r.descripcion ? `${r.numero_parte}, ${r.descripcion}` : r.numero_parte).join('\n');
  if(info) info.textContent = `${refs.length} número(s) de parte en el catálogo.`;
}

async function guardarCatalogoPartes(){
  const ta = document.getElementById('cat_partes');
  if(!ta) return;
  const lineas = ta.value.split('\n').map(l=>l.trim()).filter(Boolean);
  if(lineas.length === 0){ showToast('⚠️ El catálogo está vacío'); return; }
  showToast(`Guardando ${lineas.length} número(s)...`);
  let ok = 0;
  for(const linea of lineas){
    const partes = linea.split(',');
    const numero = partes[0].trim();
    const desc = partes.slice(1).join(',').trim();
    if(!numero) continue;
    try{
      await sbFetch('refacciones?on_conflict=numero_parte', {
        method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
        body: JSON.stringify({ numero_parte:numero, descripcion:desc, ultima_vez:new Date().toISOString() })
      });
      ok++;
    }catch(e){ console.warn(e); }
  }
  showToast(`✓ ${ok} número(s) de parte guardados`);
  cargarCatalogoPartes();
}

async function exportarCatalogoPartes(){
  const refs = await listRefacciones();
  const filas = [['No. de Parte','Descripcion','Veces usada','Ultima vez']];
  refs.forEach(r=>filas.push([r.numero_parte, r.descripcion||'', r.veces_usada||0, r.ultima_vez?new Date(r.ultima_vez).toLocaleDateString('es-MX'):'']));
  descargarCSV('catalogo-refacciones-'+todayISO()+'.csv', filas);
}

function agregarUbtPlanta(planta){

  STATE.plantasCfgDraft[planta].push('');
  refrescarPlantaEditor(planta);

function cajaQR(contenedor, url, titulo, subtitulo, color){
  const box = document.createElement('div');
  box.className = 'qr-box';
  if(color) box.style.borderTop = '4px solid ' + color;
  const qrDiv = document.createElement('div');
  box.appendChild(qrDiv);
  const label = document.createElement('div');
  label.className = 'label';
  label.innerHTML = `${titulo}${subtitulo?`<br><span style="font-weight:400;font-size:10.5px;color:#6b7280;">${subtitulo}</span>`:''}`;
  box.appendChild(label);
  const btn = document.createElement('button');
  btn.className = 'btn ghost small';
  btn.style.marginTop = '6px';
  btn.textContent = '🖨️ Imprimir';
  btn.onclick = () => imprimirQR(qrDiv, titulo, subtitulo);
  box.appendChild(btn);
  contenedor.appendChild(box);
  new QRCode(qrDiv, { text: url, width: 150, height: 150 });
}

function imprimirQR(qrDiv, titulo, subtitulo){
  const img = qrDiv.querySelector('img') || qrDiv.querySelector('canvas');
  let src = '';
  if(img && img.tagName === 'IMG') src = img.src;
  else if(img) src = img.toDataURL();
  const v = window.open('', '_blank', 'width=500,height=650');
  if(!v){ showToast('⚠️ Permite ventanas emergentes'); return; }
  v.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${titulo}</title>
    <style>
      @page{margin:10mm;}
      body{font-family:Arial,sans-serif;margin:0;padding:0;}
      .etiqueta{width:1.6in;text-align:center;padding:2mm;box-sizing:border-box;}
      .etiqueta .t{font-size:8pt;font-weight:bold;line-height:1.1;margin-bottom:1mm;}
      .etiqueta .s{font-size:6.5pt;color:#555;margin-bottom:1mm;}
      .etiqueta img{width:1in;height:1in;display:block;margin:0 auto;}
      .etiqueta .p{font-size:5.5pt;color:#666;margin-top:1mm;}
    </style></head><body>
    <div class="etiqueta">
      <div class="t">${titulo}</div>
      <div class="s">${subtitulo||''}</div>
      <img src="${src}">
      <div class="p">Escanea con la cámara</div>
    </div></body></html>`);
  v.document.close(); v.focus();
  setTimeout(()=>v.print(), 500);
}

function imprimirTodosQR(contenedorId, tituloDoc){
  const cont = document.getElementById(contenedorId);
  if(!cont){ return; }
  const cajas = [...cont.querySelectorAll('.qr-box')];
  if(cajas.length === 0){ showToast('⚠️ Genera los QR primero'); return; }

  const etiquetas = cajas.map(box=>{
    const img = box.querySelector('img') || box.querySelector('canvas');
    let src = '';
    if(img && img.tagName === 'IMG') src = img.src;
    else if(img) src = img.toDataURL();
    const label = box.querySelector('.label');
    const titulo = label ? (label.childNodes[0]?.textContent || '').trim() : '';
    const sub = label ? (label.querySelector('span')?.textContent || '') : '';
    return `<div class="etiqueta">
      <div class="t">${titulo}</div>
      <div class="s">${sub}</div>
      <img src="${src}">
    </div>`;
  }).join('');

  const v = window.open('', '_blank', 'width=900,height=800');
  if(!v){ showToast('⚠️ Permite ventanas emergentes'); return; }
  v.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${tituloDoc}</title>
    <style>
      @page{size:letter portrait;margin:10mm;}
      body{font-family:Arial,sans-serif;margin:0;padding:0;
        display:flex;flex-wrap:wrap;gap:5mm;align-content:flex-start;}
      .etiqueta{width:1.25in;text-align:center;box-sizing:border-box;
        page-break-inside:avoid;break-inside:avoid;}
      .etiqueta .t{font-size:7.5pt;font-weight:bold;line-height:1.1;}
      .etiqueta .s{font-size:6pt;color:#555;margin-bottom:1mm;}
      .etiqueta img{width:1in;height:1in;display:block;margin:0 auto;}
    </style></head><body>${etiquetas}</body></html>`);
  v.document.close(); v.focus();
  setTimeout(()=>v.print(), 600);
}

async function importarRespaldo(input){
  const archivo = input.files && input.files[0];
  if(!archivo) return;
  if(!confirm('¿Importar este respaldo?\n\nLas hojas y usuarios del archivo se agregarán o sobrescribirán los actuales con la misma clave.')){
    input.value=''; return;
  }
  showToast('Leyendo respaldo...');
  try{
    const texto = await archivo.text();
    const data = JSON.parse(texto);
    let hojasOk=0, usuariosOk=0;

    for(const h of (data.hojas||[])){
      try{ await saveSheet(h.key, h); hojasOk++; }catch(e){ console.warn(e); }
    }
    for(const u of (data.usuarios||[])){
      try{ await saveUsuario(u); usuariosOk++; }catch(e){ console.warn(e); }
    }
    if(data.plantas){
      try{ await savePlantasConfig(data.plantas); STATE.plantasCfg = data.plantas; }catch(e){}
    }
    showToast(`✓ Importado: ${hojasOk} hoja(s), ${usuariosOk} usuario(s)`);
    render();
  }catch(err){
    showToast('⚠️ Archivo inválido: ' + (err.message||err));
  }
  input.value='';
}

async function borrarSeleccionCorrectivos(){
  const alcance = document.getElementById('bs_alcance').value;
  const planta = document.getElementById('bs_planta').value;
  const ubt = document.getElementById('bs_ubt').value;
  const maquina = document.getElementById('bs_maquina').value;
  const btn = document.getElementById('bs_btn');

  const todas = await listSheets();
  let objetivo = [];
  let desc = '';
  if(alcance === 'planta'){
    objetivo = todas.filter(s=>s.planta===planta);
    desc = `todos los correctivos de ${planta}`;
  } else if(alcance === 'ubt'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt);
    desc = `los correctivos de UBT ${ubt} (${planta})`;
  } else if(alcance === 'maquina'){
    objetivo = todas.filter(s=>s.planta===planta && s.ubtNo===ubt && s.maquina===maquina);
    desc = `los correctivos de ${maquina} en UBT ${ubt} (${planta})`;
  }

  if(objetivo.length === 0){ showToast('No hay hojas que coincidan'); return; }

  if(btn.dataset.confirm !== '1'){
    btn.dataset.confirm = '1';
    btn.textContent = `⚠️ Toca de nuevo para borrar ${objetivo.length} hoja(s) — ${desc}`;
    setTimeout(()=>{ btn.dataset.confirm=''; btn.textContent='🗑️ Borrar la selección'; }, 6000);
    return;
  }

  btn.textContent = 'Borrando...';
  let ok=0;
  for(const s of objetivo){
    try{
      await sbFetch('hojas?clave=eq.'+encodeURIComponent(s.key), { method:'DELETE', prefer:'return=minimal' });
      ok++;
    }catch(e){ console.warn(e); }
  }
  colaImpresion = [];
  btn.dataset.confirm='';
  showToast(`✓ ${ok} hoja(s) borradas — ${desc}`);
  render();
}

/* Primera letra en mayúscula automáticamente */
document.addEventListener('input', e => {
  const t = e.target;
  if(!(t instanceof HTMLInputElement) && !(t instanceof HTMLTextAreaElement)) return;
  if(t.type === 'password' || t.type === 'number' || t.type === 'date' || t.type === 'time') return;
  if(t.dataset.noCap === '1') return;
  const v = t.value;
  if(v.length > 0 && v[0] !== v[0].toUpperCase()){
    const pos = t.selectionStart;
    t.value = v[0].toUpperCase() + v.slice(1);
    try{ t.setSelectionRange(pos, pos); }catch(e){}
  }
});

/* ---------- Validación de tiempos ---------- */
function validarTiempos(){
  const fEl=document.getElementById('f_fecha'), hiEl=document.getElementById('f_hi'), hfEl=document.getElementById('f_hf');
  const aviso=document.getElementById('aviso_tiempo');
  if(!fEl||!hiEl||!hfEl||!aviso) return true;

  const hoy = todayISO();
  const ahora = new Date();
  const horaAhora = String(ahora.getHours()).padStart(2,'0')+':'+String(ahora.getMinutes()).padStart(2,'0');

  const mostrar=(txt,tipo)=>{
    aviso.style.display='block';
    aviso.innerHTML=txt;
    aviso.style.background = tipo==='error' ? '#fde8e8' : '#fff7e6';
    aviso.style.color = tipo==='error' ? '#a13636' : '#8a6d1f';
    aviso.style.borderLeft = '4px solid ' + (tipo==='error' ? '#a13636' : '#e0b400');
  };

  if(fEl.value > hoy){ fEl.value = hoy; mostrar('⚠️ No se pueden registrar fechas futuras. Se ajustó a hoy.','error'); return false; }

  /* Si es hoy, avisar (sin modificar) cuando la hora es futura */
  let hayFutura = false;
  if(fEl.value === hoy){
    if(hiEl.value && hiEl.value > horaAhora) hayFutura = true;
    if(hfEl.value && hfEl.value > horaAhora) hayFutura = true;
  }
  if(hayFutura) mostrar('⚠️ Estás registrando una hora futura. Verifica que sea correcta.','warn');

  const tEl = document.getElementById('f_turno');
  if(tEl && hiEl.value && !tEl.dataset.manual) tEl.value = turnoDeHora(hiEl.value);

  if(hiEl.value && hfEl.value){
    const min = minutosEntre(hiEl.value, hfEl.value);
    if(min === 0){ mostrar('⚠️ La hora final debe ser distinta a la de inicio.','error'); return false; }
    if(min > 480){ mostrar(`⏱️ Duración registrada: <b>${formatoDuracion(min)}</b>. Es bastante larga — verifica que sea correcta.`,'warn'); return true; }
    mostrar(`⏱️ Tiempo muerto: <b>${formatoDuracion(min)}</b>`,'warn');
    return true;
  }
  aviso.style.display='none';
  return true;
}

/* ---------- Fallas similares (detección de recurrencia) ---------- */
let cacheHojasFallas = null;
async function buscarFallasSimilares(){
  const txtEl = document.getElementById('f_sintomas');
  const cont = document.getElementById('fallas_similares');
  if(!txtEl || !cont) return;
  const txt = txtEl.value.trim().toLowerCase();
  if(txt.length < 5){ cont.style.display='none'; return; }

  if(!cacheHojasFallas) cacheHojasFallas = await listSheets();
  const sheet = await getSheet(sheetActivaKey);
  if(!sheet) return;

  const palabras = txt.split(/\s+/).filter(w=>w.length>3);
  const coincidencias = [];
  cacheHojasFallas
    .filter(h => h.planta===sheet.planta && h.ubtNo===sheet.ubtNo && h.maquina===sheet.maquina)
    .forEach(h => (h.filas||[]).forEach(f=>{
      const sint = (f.sintomas||'').toLowerCase();
      const aciertos = palabras.filter(w=>sint.includes(w)).length;
      if(aciertos >= 1 && aciertos/palabras.length >= 0.4) coincidencias.push({...f, mes:h.mes, anio:h.anio, aciertos});
    }));

  if(coincidencias.length === 0){ cont.style.display='none'; return; }
  coincidencias.sort((a,b)=>b.aciertos-a.aciertos);
  const top = coincidencias.slice(0,4);
  cont.style.display='block';
  cont.innerHTML = `<b>🔁 Falla recurrente detectada</b> — esta máquina ya tuvo ${coincidencias.length} falla(s) parecida(s):<br>` +
    top.map(f=>`• <b>${f.fecha||''}</b>: ${escapeHtml((f.sintomas||'').slice(0,90))}${(f.sintomas||'').length>90?'…':''}<br><span style="color:#6b7280;">→ ${escapeHtml((f.acciones||'—').slice(0,90))}</span>`).join('<br>') +
    `<br><span style="color:#8a6d1f;">Considera revisar la causa raíz, no solo el síntoma.</span>`;
}

function iniciarCanvasFirma(){
  firmaCanvas = document.getElementById('firma_canvas');
  if(!firmaCanvas) return;
  firmaCtx = firmaCanvas.getContext('2d');
  firmaCtx.lineWidth = 2.5; firmaCtx.lineCap = 'round'; firmaCtx.strokeStyle = '#111';

  const pos = e => {
    const r = firmaCanvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x:(p.clientX-r.left)*(firmaCanvas.width/r.width), y:(p.clientY-r.top)*(firmaCanvas.height/r.height) };
  };
  const empezar = e => { e.preventDefault(); dibujando=true; const {x,y}=pos(e); firmaCtx.beginPath(); firmaCtx.moveTo(x,y); };
  const mover = e => { if(!dibujando) return; e.preventDefault(); const {x,y}=pos(e); firmaCtx.lineTo(x,y); firmaCtx.stroke(); };
  const parar = () => { dibujando=false; };

  ['mousedown','touchstart'].forEach(ev=>firmaCanvas.addEventListener(ev, empezar));
  ['mousemove','touchmove'].forEach(ev=>firmaCanvas.addEventListener(ev, mover));
  ['mouseup','mouseleave','touchend','touchcancel'].forEach(ev=>firmaCanvas.addEventListener(ev, parar));
}

function limpiarFirma(){ if(firmaCtx && firmaCanvas) firmaCtx.clearRect(0,0,firmaCanvas.width,firmaCanvas.height); }

async function guardarFirma(){
  if(!firmaCanvas){ showToast('⚠️ No se encontró el área de firma'); return; }
  const vacio = document.createElement('canvas');
  vacio.width = firmaCanvas.width; vacio.height = firmaCanvas.height;
  if(firmaCanvas.toDataURL() === vacio.toDataURL()){ showToast('⚠️ Dibuja tu firma primero'); return; }
  STATE.usuario.firma = firmaCanvas.toDataURL('image/png');
  try{ await saveUsuario(STATE.usuario); showToast('✍️ Firma guardada ✓'); render(); }

}

function todasLasFilas(){
  const out = [];
  (cacheAnalisis||[]).forEach(h => (h.filas||[]).forEach(f => {
    const min = (typeof f.minutosParo === 'number' && f.minutosParo > 0)
      ? f.minutosParo
      : minutosEntre(f.horaInicio, f.horaFinal);
    out.push({...f, minutosParo: min, planta:h.planta, ubtNo:h.ubtNo, maquina:h.maquina, mes:h.mes, anio:h.anio});
  }));
  return out;
}

  const q = (document.getElementById('an_busqueda').value||'').trim().toLowerCase();
  const cont = document.getElementById('an_resultados');
  if(q.length < 2){ cont.innerHTML = '<div class="empty">Escribe al menos 2 caracteres.</div>'; return; }
  const res = todasLasFilas().filter(f =>
    (f.sintomas||'').toLowerCase().includes(q) ||
    (f.acciones||'').toLowerCase().includes(q) ||
    (f.material||'').toLowerCase().includes(q) ||
    (f.tecnico||'').toLowerCase().includes(q) ||
    (f.numeroParte||'').toLowerCase().includes(q) ||
    (f.maquina||'').toLowerCase().includes(q) ||
    (f.ubtNo||'').toLowerCase().includes(q)
  );

  cont.innerHTML = `<p style="font-size:12.5px;color:var(--muted);">${res.length} resultado(s)</p>` +

function calcularTiempoMuerto(){
  const planta = document.getElementById('an_planta').value;
  const mes = document.getElementById('an_mes').value;
  const cont = document.getElementById('an_tiempo');
  let filas = todasLasFilas();
  if(planta) filas = filas.filter(f=>f.planta===planta);
  if(mes) filas = filas.filter(f=>f.mes===mes);

  if(filas.length === 0){ cont.innerHTML = '<div class="empty">Sin datos para este filtro.</div>'; return; }

  /* Agrupar: Planta > UBT > Máquina */
  const arbol = {};
  filas.forEach(f=>{
    const min = f.minutosParo||0;
    arbol[f.planta] ??= { minutos:0, paros:0, ubts:{} };
    arbol[f.planta].minutos += min; arbol[f.planta].paros++;
    arbol[f.planta].ubts[f.ubtNo] ??= { minutos:0, paros:0, maquinas:{} };
    arbol[f.planta].ubts[f.ubtNo].minutos += min; arbol[f.planta].ubts[f.ubtNo].paros++;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina] ??= { minutos:0, paros:0 };
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].minutos += min;
    arbol[f.planta].ubts[f.ubtNo].maquinas[f.maquina].paros++;
  });

  const totalMin = filas.reduce((a,f)=>a+(f.minutosParo||0),0);
  const plantasOrd = Object.entries(arbol).sort((a,b)=>b[1].minutos-a[1].minutos);
  const maxPlanta = plantasOrd[0][1].minutos || 1;

  const barra = (min, max, color) => `<div style="background:#e8eaed;border-radius:20px;height:8px;overflow:hidden;margin-top:3px;">
      <div style="background:${color};height:100%;width:${(min/max*100).toFixed(1)}%;"></div></div>`;

  cont.innerHTML = `
    <div style="background:#f3f6f9;border-radius:8px;padding:12px;margin-bottom:14px;font-size:13.5px;">
      Total de paro: <b>${formatoDuracion(totalMin)}</b> (${totalMin} min) en <b>${filas.length}</b> intervención(es)
    </div>
    ${plantasOrd.map(([pl, dPl])=>{
      const ubtsOrd = Object.entries(dPl.ubts).sort((a,b)=>b[1].minutos-a[1].minutos);
      const maxUbt = ubtsOrd[0][1].minutos || 1;
      return `<details open style="margin-bottom:10px;">
        <summary style="cursor:pointer;padding:10px 12px;background:#2f3742;color:#fff;border-radius:8px;font-weight:700;font-size:13.5px;">
          🏭 ${escapeHtml(pl)} — ${formatoDuracion(dPl.minutos)} (${dPl.minutos} min) · ${dPl.paros} paro/s
        </summary>
        ${barra(dPl.minutos, maxPlanta, '#a13636')}
        <div style="padding:10px 0 0 12px;">
          ${ubtsOrd.map(([ub, dUb])=>{
            const maqOrd = Object.entries(dUb.maquinas).sort((a,b)=>b[1].minutos-a[1].minutos);
            const maxMaq = maqOrd[0][1].minutos || 1;
            return `<details open style="margin-bottom:8px;">
              <summary style="cursor:pointer;padding:7px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:13px;">
                📍 UBT ${escapeHtml(ub)} — ${formatoDuracion(dUb.minutos)} (${dUb.minutos} min) · ${dUb.paros} paro/s
              </summary>
              ${barra(dUb.minutos, maxUbt, '#c77700')}
              <div style="padding:8px 0 0 12px;">
                ${maqOrd.map(([mq, dMq], i)=>`
                  <div style="margin-bottom:8px;">
                    <div style="display:flex;justify-content:space-between;font-size:12.5px;">
                      <span>⚙️ ${escapeHtml(mq)}</span>
                      <span style="font-weight:700;">${formatoDuracion(dMq.minutos)} <span style="font-weight:400;color:var(--muted);">(${dMq.minutos} min · ${dMq.paros} paro/s)</span></span>
                    </div>
                    ${barra(dMq.minutos, maxMaq, i===0?'#a13636':'#0f3d5c')}
                  </div>`).join('')}
              </div>
            </details>`;
          }).join('')}
        </div>
      </details>`;
    }).join('')}`;
}

function calcularFallasFrecuentes(){
  const cont = document.getElementById('an_frecuentes');
  if(!cont) return;
  const filas = todasLasFilas();
  const porMaquina = {};
  filas.forEach(f=>{
    const clave = `${f.maquina} · UBT ${f.ubtNo}`;
    porMaquina[clave] ??= [];
    porMaquina[clave].push(f);
  });

  const recurrentes = [];
  Object.entries(porMaquina).forEach(([maq, fs])=>{
    const grupos = {};
    fs.forEach(f=>{
      const palabras = (f.sintomas||'').toLowerCase().split(/\s+/).filter(w=>w.length>4);
      palabras.forEach(w=>{ grupos[w] ??= new Set(); grupos[w].add(f.id); });
    });
    Object.entries(grupos).forEach(([palabra, ids])=>{
      if(ids.size >= 2) recurrentes.push({ maquina:maq, palabra, veces:ids.size });
    });
  });

  recurrentes.sort((a,b)=>b.veces-a.veces);
  const top = recurrentes.slice(0,15);
  cont.innerHTML = top.length === 0
    ? '<div class="empty">Aún no hay suficientes datos para detectar patrones.</div>'
    : `<p style="font-size:12.5px;color:var(--muted);">Palabras que se repiten en fallas de la misma máquina — posible causa raíz.</p>` +
      top.map(r=>`
        <div style="display:flex;justify-content:space-between;padding:8px 10px;border-bottom:1px solid #eef0f2;font-size:13px;">
          <span>${escapeHtml(r.maquina)} → "<b>${escapeHtml(r.palabra)}</b>"</span>
          <span style="font-weight:700;color:${r.veces>=4?'#a13636':'#c77700'};">${r.veces}×</span>
        </div>`).join('');
}

function descargarCSV(nombre, filas){
  const csv = filas.map(f => f.map(c => {
    const v = (c===null||c===undefined) ? '' : String(c);
    return /[",\n;]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v;
  }).join(';')).join('\n');
  const blob = new Blob(['\uFEFF' + csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = nombre;
  a.click();
  showToast('Archivo descargado ✓');
}

async function exportarCSV(tipo){
  if(tipo === 'registros'){
    const filas = [['Fecha','Planta','UBT','Maquina','Mes','Anio','Gafete','Tecnico','Hora Inicio','Hora Final','Minutos Paro','Sintomas','Acciones','Material','No. Parte','Firma Auditor','Firma APQP']];
    todasLasFilas().forEach(f=>filas.push([
      f.fecha||'', f.planta||'', f.ubtNo||'', f.maquina||'', f.mes||'', f.anio||'',
      f.gafete||'', f.tecnico||'', f.horaInicio||'', f.horaFinal||'', f.minutosParo||0,
      f.sintomas||'', f.acciones||'', f.material||'', f.numeroParte||'',
      f.firmaAuditorNombre||'', f.firmaAPQPNombre||''
    ]));
    descargarCSV('correctivos-registros-'+todayISO()+'.csv', filas);
  }
  else if(tipo === 'tiempo'){
    const porMaquina = {};
    todasLasFilas().forEach(f=>{
      const clave = `${f.planta}|${f.ubtNo}|${f.maquina}`;
      porMaquina[clave] ??= { minutos:0, paros:0 };
      porMaquina[clave].minutos += (f.minutosParo||0);
      porMaquina[clave].paros++;
    });
    const filas = [['Planta','UBT','Maquina','Total Minutos','Total Horas','Num. Paros','Promedio Minutos']];
    Object.entries(porMaquina).sort((a,b)=>b[1].minutos-a[1].minutos).forEach(([k,v])=>{
      const [pl,ub,mq] = k.split('|');
      filas.push([pl,ub,mq,v.minutos,(v.minutos/60).toFixed(2),v.paros,(v.minutos/v.paros).toFixed(1)]);
    });
    descargarCSV('tiempo-muerto-'+todayISO()+'.csv', filas);
  }
  else if(tipo === 'reportes'){
    const reps = await listReportes();
    const filas = [['Fecha','Tipo','Urgencia','Estado','Planta','UBT','Maquina','Tecnico','Descripcion','No. Parte','Respuesta','Atendido por']];
    reps.forEach(r=>filas.push([
      new Date(r.creado_en).toLocaleString('es-MX'), r.tipo, r.urgencia, r.estado,
      r.planta, r.ubt_no, r.maquina||'', r.tecnico, r.descripcion, r.numero_parte||'',
      r.respuesta||'', r.atendido_por||''
    ]));
    descargarCSV('reportes-supervisor-'+todayISO()+'.csv', filas);
  }
}

function agruparReportesPorUbt(reportes, esSupervisor){
  const porPlanta = {};
  reportes.forEach(r=>{
    porPlanta[r.planta] ??= {};
    (porPlanta[r.planta][r.ubt_no] ??= []).push(r);
  });
  return Object.keys(porPlanta).sort().map(pl=>{
    const ubts = porPlanta[pl];
    const totalPl = Object.values(ubts).reduce((a,v)=>a+v.length,0);
    return `<details open style="margin-bottom:10px;">
      <summary style="cursor:pointer;padding:9px 12px;background:#2f3742;color:#fff;border-radius:8px;font-weight:700;font-size:13px;">🏭 ${escapeHtml(pl)} (${totalPl})</summary>
      <div style="padding:10px 0 0 12px;">
        ${Object.keys(ubts).sort().map(ub=>{
          const abiertos = ubts[ub].filter(r=>r.estado!=='cerrado').length;
          return `<details open style="margin-bottom:8px;">
            <summary style="cursor:pointer;padding:7px 10px;background:#eef1f4;border-radius:7px;font-weight:600;font-size:12.5px;">
              📍 UBT ${escapeHtml(ub)} (${ubts[ub].length})${abiertos?` · <span style="color:#c77700;">${abiertos} abierto(s)</span>`:''}
            </summary>
            <div style="padding-top:8px;">${ubts[ub].map(r=>tarjetaReporte(r,esSupervisor)).join('')}</div>
          </details>`;
        }).join('')}
      </div>
    </details>`;
  }).join('');
}

async function enviarReporte(){
  const desc = document.getElementById('rp_desc').value.trim();
  if(!desc){ showToast('⚠️ Describe la situación'); return; }
  const r = {
    id: uid(),
    tipo: document.getElementById('rp_tipo').value,
    planta: STATE.plantaHoy,
    ubt_no: document.getElementById('rp_ubt').value,
    maquina: document.getElementById('rp_maquina').value,
    tecnico: STATE.nombre,
    gafete: STATE.usuario?.gafete || '',
    descripcion: desc,
    numero_parte: document.getElementById('rp_parte').value.trim(),
    foto: fotoTemp || '',
    urgencia: document.getElementById('rp_urgencia').value,
    estado: 'abierto',
    creado_en: new Date().toISOString(),
    actualizado_en: new Date().toISOString()
  };
  try{ await saveReporte(r); }
  catch(err){ showToast('⚠️ No se pudo enviar: '+(err.message||err)); return; }

  if(r.numero_parte) registrarRefaccion(r.numero_parte, '');

  /* Notificar a todos los supervisores */
  const usuarios = await listUsuarios();
  const supervisores = usuarios.filter(u=>u.rol==='supervisor' && !u.bloqueado).map(u=>slug(u.nombre));
  const etiquetaUrg = r.urgencia==='critica' ? '🔴 CRÍTICO — ' : (r.urgencia==='alta' ? '🟠 ' : '');
  enviarNotificacion(
    supervisores,
    `${etiquetaUrg}${ICONO_TIPO[r.tipo]} Reporte de ${STATE.nombre}`,
    `${STATE.nombre} reportó ${r.tipo==='refaccion'?'una refacción crítica':'una falla'} en UBT ${r.ubt_no} (${r.maquina}) de ${r.planta}: ${desc.slice(0,90)}`
  );

  fotoTemp = null;
  document.getElementById('rp_desc').value = '';
  document.getElementById('rp_parte').value = '';
  const pf = document.getElementById('prev_foto_rp'); if(pf) pf.innerHTML='';
  const ff = document.getElementById('rp_foto'); if(ff) ff.value='';
  showToast('📤 Reporte enviado al Supervisor ✓');
  cargarMisReportes();
}

async function cerrarReporte(id){
  const resp = document.getElementById('resp_'+id).value.trim();
  const todos = await listReportes();
  const r = todos.find(x=>x.id===id);
  if(!r) return;
  r.estado = 'cerrado';
  r.respuesta = resp || 'Atendido.';
  r.atendido_por = STATE.nombre;
  r.actualizado_en = new Date().toISOString();
  await saveReporte(r);
  enviarNotificacion([slug(r.tecnico)], '✓ Tu reporte fue atendido', `${STATE.nombre} respondió a tu reporte de UBT ${r.ubt_no}: ${(resp||'Atendido.').slice(0,90)}`);
  showToast('Reporte cerrado ✓');
  render();
}

/* ---------- Reportes de falla al supervisor ---------- */
async function listReportes(filtro){
  try{
    let q = 'reportes?select=*&order=creado_en.desc';
    if(filtro==='abierto') q = 'reportes?estado=eq.abierto&select=*&order=creado_en.desc';
    return await sbFetch(q) || [];
  }catch(e){ console.warn(e); return []; }
}
async function saveReporte(r){
  await sbFetch('reportes?on_conflict=id', {
    method:'POST', prefer:'resolution=merge-duplicates,return=minimal',
    body: JSON.stringify(r)
  });
}

/* ---------- Utilidades de tiempo ---------- */
function minutosEntre(hi, hf){
  if(!hi || !hf) return 0;
  const [h1,m1] = hi.split(':').map(Number);
  const [h2,m2] = hf.split(':').map(Number);
  let min = (h2*60+m2) - (h1*60+m1);
  if(min < 0) min += 24*60; /* cruzó medianoche */
  return min;
}
function formatoDuracion(min){
  if(!min) return '—';
  const h = Math.floor(min/60), m = min%60;
  return h > 0 ? `${h}h ${m}m` : `${m}m`;
}

/* ---------- Compresión de fotos ---------- */
function comprimirImagen(file, maxLado=1000, calidad=0.7){
  return new Promise((resolve, reject)=>{
    const lector = new FileReader();
    lector.onload = e => {
      const img = new Image();
      img.onload = () => {
        let {width:w, height:h} = img;
        if(w > h && w > maxLado){ h = h*maxLado/w; w = maxLado; }
        else if(h > maxLado){ w = w*maxLado/h; h = maxLado; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', calidad));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    lector.onerror = reject;
    lector.readAsDataURL(file);
  });
}

/* ---------- Notificaciones Push ---------- */
const VAPID_PUBLIC_KEY = 'BHO00CHONm3Uf0MIaOVAI9SxsAyMd_0hctC7TqKTl5Vpn4Jh1IHBZbHX4PM1fAV2uPr9ZdsmsIW_MaeDBkxmsSg';

function urlBase64ToUint8Array(base64String){
  const padding = '='.repeat((4 - base64String.length % 4) % 4);
  const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
  const rawData = atob(base64);
  return Uint8Array.from([...rawData].map(c => c.charCodeAt(0)));
}

function pushDisponible(){
  return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
}

async function activarNotificaciones(silencioso){
  if(!pushDisponible()){
    if(!silencioso) showToast('⚠️ Este dispositivo no soporta notificaciones push');
    return false;
  }
  try{
    const permiso = await Notification.requestPermission();
    if(permiso !== 'granted'){
      if(!silencioso) showToast('⚠️ No diste permiso para notificaciones');
      return false;
    }
    const reg = await navigator.serviceWorker.ready;
    let sub = await reg.pushManager.getSubscription();
    if(!sub){
      sub = await reg.pushManager.subscribe({
        userVisibleOnly: true,
        applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json = sub.toJSON();
    await sbFetch('suscripciones?on_conflict=endpoint', {
      method: 'POST',
      prefer: 'resolution=merge-duplicates,return=minimal',
      body: JSON.stringify({
        usuario_slug: slug(STATE.nombre),
        rol: STATE.rol,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth: json.keys.auth
      })
    });
    if(!silencioso) showToast('🔔 Notificaciones activadas ✓');
    return true;
  }catch(err){
    console.warn('Error activando notificaciones:', err);
    if(!silencioso) showToast('⚠️ No se pudo activar: ' + (err.message||err));
    return false;
  }
}

async function enviarNotificacion(destinatarios, titulo, cuerpo){
  if(!destinatarios || destinatarios.length===0) return;
  try{
    await fetch(SUPABASE_URL + '/functions/v1/enviar-notificacion', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'apikey': SUPABASE_KEY
      },
      body: JSON.stringify({ destinatarios, titulo, cuerpo, ignorarJornada: !!STATE.modoPruebas })
    });
  }catch(err){ console.warn('No se pudo enviar la notificación:', err); }
}

/* Busca qué auditores/APQP tienen asignado este UBT en esta planta */
async function destinatariosPara(rolBuscado, planta, ubt){
  const usuarios = await listUsuarios();
  return usuarios
    .filter(u => u.rol===rolBuscado && ((u.ubtsPorPlanta||{})[planta]||[]).includes(ubt))
    .map(u => slug(u.nombre));
}
